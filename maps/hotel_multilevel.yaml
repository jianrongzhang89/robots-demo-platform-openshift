# Nav2 map configuration for hotel multilevel world
# This is a 2.5D representation where three "floors" are arranged horizontally
# L1: X=[0, 50]   - Lobby
# L2: X=[60, 110] - Rooms
# L3: X=[120, 170] - Suites

image: hotel_multilevel.pgm
mode: trinary
resolution: 0.05  # meters/pixel
origin: [-5.0, -30.0, 0.0]  # Bottom-left corner in world coordinates
negate: 0
occupied_thresh: 0.65
free_thresh: 0.25
