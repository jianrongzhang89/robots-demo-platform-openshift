{{- if not .Values.hotel.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: zenoh-bridge-config
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: ros2-multi-robot-demo
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  zenoh-router.json5: |-
{{ .Files.Get "files/zenoh-router.json5" | indent 4 }}
  gazebo-bridge.json5: |-
{{ .Files.Get "files/gazebo-bridge.json5" | indent 4 }}
  fleet-adapter-zenoh.json5: |-
{{ .Files.Get "files/fleet-adapter-zenoh.json5" | indent 4 }}
  clock-bridge.json5: |-
{{ .Files.Get "files/clock-bridge.json5" | indent 4 }}
  rmf-clock-bridge.json5: |-
    {
      // RMF clock bridge: subscribes to Zenoh "clock" (published by Gazebo pod)
      // and delivers to local DDS /clock on Domain 55 (where RMF nodes live).
      // This allows RMF nodes with use_sim_time:=true to receive clock messages.
      // The regex matches the DDS topic name "/clock" (with leading slash).
      plugins: {
        ros2dds: {
          allow: {
            subscribers: ["^/clock$"]
          }
        }
      },
      mode: "client",
      connect: {
        endpoints: ["tcp/zenoh-router:7447"],
        retry: {
          period_init_ms: 1000,
          period_max_ms: 16000,
          period_increase_factor: 2
        },
        exit_on_failure: false
      },
      scouting: {
        multicast: {
          enabled: false
        }
      }
    }
  cmd-vel-keepalive.json5: |-
    {
      plugins: {
        ros2dds: {
          allow: {
            subscribers: [{{ range .Values.robots }}"{{ .name }}/cmd_vel", {{ end }}]
          }
        }
      },
      mode: "client",
      connect: {
        endpoints: ["tcp/zenoh-router:7447"],
        retry: {
          period_init_ms: 1000,
          period_max_ms: 16000,
          period_increase_factor: 2
        },
        exit_on_failure: false
      },
      scouting: { multicast: { enabled: false } }
    }
  # Per-robot Nav2 bridge configs — each adds a namespace prefix so the bridge
  # routes bare /tf as robot_N/tf (what free_fleet_adapter subscribes to).
  # publishers:  local DDS topics that go OUT to Zenoh (Nav2 → router)
  # subscribers: Zenoh topics that come IN from Zenoh (Gazebo → Nav2)
{{- range .Values.robots }}
  nav2-bridge-{{ .name }}.json5: |-
    {
      plugins: {
        ros2dds: {
          namespace: "/{{ .name }}",
          // Prevent the bridge from blocking indefinitely when the DDS service
          // writer can't immediately find a matching reader (e.g. QoS negotiation
          // during action server initialization). Without this, action send_goal
          // calls block the bridge's Tokio runtime and never return a Zenoh reply.
          reliable_routes_blocking: false,
          allow: {
            publishers: [
              // tf_static omitted: static TF originates from Gazebo's robot_state_publisher,
              // not from nav2 pods. Including it creates a feedback loop (nav bridge receives
              // robot_1/tf_static from Zenoh, delivers to DDS /tf_static, then re-publishes
              // it back to Zenoh as robot_1/tf_static, confusing the TRANSIENT_LOCAL cache).
              ".*/(tf|battery_state|cmd_vel|amcl_pose|rmf_navigate_result|local_costmap/costmap|local_costmap/costmap_updates)"
            ],
            subscribers: [
              ".*/tf",
              ".*/tf_static",
              ".*/scan",
              ".*/odom",
              ".*/imu",
              ".*/joint_states",
              // clock omitted — handled by the dedicated clock-bridge sidecar
              // which subscribes to bare Zenoh "clock" without namespace prefix
              ".*/robot_description",
              ".*/rmf_navigate_cmd",
              // initialpose: allows the demo script to re-anchor AMCL after
              // multi-leg navigation causes drift, by publishing the correct
              // pose from the rmf-core pod directly to each nav2 pod's AMCL.
              ".*/initialpose",
              // clear_costmaps: triggers the nav2 pod's costmap clearing service
              // so the demo script can flush stale obstacle cells before Phase 3.
              ".*/clear_costmaps"
            ],
            action_servers: [
              ".*/navigate_to_pose"
            ]
          }
        }
      },
      mode: "client",
      connect: {
        endpoints: ["tcp/zenoh-router:7447"],
        retry: {
          period_init_ms: 1000,
          period_max_ms: 16000,
          period_increase_factor: 2
        },
        exit_on_failure: false
      },
      scouting: { multicast: { enabled: false } }
    }
{{- end }}
{{- end }}
