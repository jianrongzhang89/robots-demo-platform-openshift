{{- if .Values.hotel.enabled }}
# Services + Routes for the Hotel World pod: noVNC (Gazebo GUI) and the
# optional rmf-web dashboard.
apiVersion: v1
kind: Service
metadata:
  name: hotel-sim-novnc
  namespace: {{ .Values.namespace }}
  labels:
    app: hotel-sim
    app.kubernetes.io/part-of: ros2-multi-robot-demo
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  selector:
    app: hotel-sim
  ports:
    - name: novnc
      port: 6080
      targetPort: 6080
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: hotel-sim-dashboard
  namespace: {{ .Values.namespace }}
  labels:
    app: hotel-sim
    app.kubernetes.io/part-of: ros2-multi-robot-demo
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  selector:
    app: hotel-sim
  ports:
    - name: dashboard
      port: 3000
      targetPort: 3000
      protocol: TCP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: hotel-novnc
  namespace: {{ .Values.namespace }}
  labels:
    app: hotel-sim
    app.kubernetes.io/part-of: ros2-multi-robot-demo
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    haproxy.router.openshift.io/timeout: 10m
spec:
  {{- if .Values.routes.novncHost }}
  host: {{ .Values.routes.novncHost }}
  {{- end }}
  to:
    kind: Service
    name: hotel-sim-novnc
    weight: 100
  port:
    targetPort: novnc
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: hotel-dashboard
  namespace: {{ .Values.namespace }}
  labels:
    app: hotel-sim
    app.kubernetes.io/part-of: ros2-multi-robot-demo
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  {{- if .Values.rmf.routes.dashboardHost }}
  host: {{ .Values.rmf.routes.dashboardHost }}
  {{- end }}
  to:
    kind: Service
    name: hotel-sim-dashboard
    weight: 100
  port:
    targetPort: dashboard
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
{{- end }}
