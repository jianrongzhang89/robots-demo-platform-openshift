{{- if not .Values.hotel.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rmf-core
  namespace: {{ .Values.namespace }}
  labels:
    app: rmf-core
    app.kubernetes.io/part-of: ros2-multi-robot-demo
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rmf-core
  template:
    metadata:
      labels:
        app: rmf-core
        app.kubernetes.io/part-of: ros2-multi-robot-demo
    spec:
      serviceAccountName: ros2-demo
      containers:
        - name: rmf-core
          image: {{ .Values.rmf.image }}
          imagePullPolicy: Always
          command: ["/entrypoint-rmf.sh"]
          ports:
            - name: api
              containerPort: 8000
              protocol: TCP
            - name: dashboard
              containerPort: 3000
              protocol: TCP
          env:
            # Separate DDS domain — RMF core never sees robot DDS traffic
            - name: ROS_DOMAIN_ID
              value: "55"
            - name: ROS_DISTRO
              value: jazzy
            - name: RMW_IMPLEMENTATION
              value: rmw_cyclonedds_cpp
            - name: FLEET_CONFIG
              value: /opt/ros2-demo/rmf/fleet_config.yaml
            - name: NAV_GRAPH
              value: /opt/ros2-demo/rmf/nav_graph.yaml
            - name: SERVER_URI
              value: {{ .Values.rmf.serverUri | default "ws://localhost:8000/_internal" | quote }}
            # Space-separated robot names — used by entrypoint-rmf.sh for clock
            # relay and cmd_vel keepalive key generation. Derived from values.yaml.
            - name: ROBOT_NAMES
              value: "{{ range .Values.robots }}{{ .name }} {{ end }}"
            # Per-robot spawn positions — used by patch_adapter.py as initial
            # position cache so the fleet adapter never blocks waiting for
            # amcl_pose at startup. Generated from values.yaml robots list.
            {{- range .Values.robots }}
            - name: {{ .name | upper | replace "-" "_" }}_INITIAL_X
              value: "{{ .initialPose.xPos }}"
            - name: {{ .name | upper | replace "-" "_" }}_INITIAL_Y
              value: "{{ .initialPose.yPos }}"
            - name: {{ .name | upper | replace "-" "_" }}_INITIAL_YAW
              value: "{{ .initialPose.yaw }}"
            {{- end }}
          volumeMounts:
            - name: rmf-config
              mountPath: /opt/ros2-demo/rmf
              readOnly: true
            - name: zenoh-config
              mountPath: /opt/ros2-demo/zenoh
              readOnly: true
          resources:
            requests:
              cpu: {{ .Values.rmf.resources.requests.cpu | quote }}
              memory: {{ .Values.rmf.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.rmf.resources.limits.cpu | quote }}
              memory: {{ .Values.rmf.resources.limits.memory | quote }}
          {{- if ne (.Values.rmf.readinessProbe.enabled | toString) "false" }}
          readinessProbe:
            httpGet:
              path: /user
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 10
          {{- end }}
          {{- if ne (.Values.rmf.livenessProbe.enabled | toString) "false" }}
          livenessProbe:
            httpGet:
              path: /user
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          {{- end }}
      volumes:
        - name: rmf-config
          configMap:
            name: rmf-config
        - name: zenoh-config
          configMap:
            name: zenoh-bridge-config
{{- end }}
