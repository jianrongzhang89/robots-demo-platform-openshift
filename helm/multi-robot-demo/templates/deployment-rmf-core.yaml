{{- if or (not .Values.hotel.enabled) .Values.hybridNav2.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rmf-core
  namespace: {{ .Values.namespace }}
  labels:
    app: rmf-core
    app.kubernetes.io/part-of: ros2-multi-robot-demo
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rmf-core
  template:
    metadata:
      labels:
        app: rmf-core
        app.kubernetes.io/part-of: ros2-multi-robot-demo
    spec:
      serviceAccountName: ros2-demo
      containers:
        - name: rmf-core
          image: {{ .Values.rmf.image }}
          imagePullPolicy: Always
          command: ["/entrypoint-rmf.sh"]
          ports:
            - name: api
              containerPort: 8000
              protocol: TCP
            - name: dashboard
              containerPort: 3000
              protocol: TCP
          env:
            # Separate DDS domain — RMF core never sees robot DDS traffic
            - name: ROS_DOMAIN_ID
              value: "55"
            - name: ROS_DISTRO
              value: jazzy
            - name: RMW_IMPLEMENTATION
              value: rmw_cyclonedds_cpp
            - name: FLEET_CONFIG
              value: {{ .Values.rmf.fleetConfig | default "/opt/ros2-demo/rmf/fleet_config.yaml" }}
            - name: NAV_GRAPH
              value: {{ .Values.rmf.navGraphPath | default "/opt/ros2-demo/rmf/nav_graph.yaml" }}
            - name: SERVER_URI
              value: {{ if .Values.rmf.serverUri }}{{ .Values.rmf.serverUri | quote }}{{ else }}""{{ end }}
            # Space-separated robot names — used by entrypoint-rmf.sh for clock
            # relay and cmd_vel keepalive key generation. Derived from values.yaml.
            - name: ROBOT_NAMES
              value: "{{ range .Values.robots }}{{ .name }} {{ end }}"
            # Per-robot spawn positions — used by patch_adapter.py as initial
            # position cache so the fleet adapter never blocks waiting for
            # amcl_pose at startup. Generated from values.yaml robots list.
            {{- range .Values.robots }}
            - name: {{ .name | upper | replace "-" "_" }}_INITIAL_X
              value: "{{ .initialPose.xPos }}"
            - name: {{ .name | upper | replace "-" "_" }}_INITIAL_Y
              value: "{{ .initialPose.yPos }}"
            - name: {{ .name | upper | replace "-" "_" }}_INITIAL_YAW
              value: "{{ .initialPose.yaw }}"
            {{- end }}
          volumeMounts:
            - name: rmf-config
              mountPath: /opt/ros2-demo/rmf
              readOnly: true
            - name: zenoh-config
              mountPath: /opt/ros2-demo/zenoh
              readOnly: true
          resources:
            requests:
              cpu: {{ .Values.rmf.resources.requests.cpu | quote }}
              memory: {{ .Values.rmf.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.rmf.resources.limits.cpu | quote }}
              memory: {{ .Values.rmf.resources.limits.memory | quote }}
          {{- if ne ((.Values.rmf.readinessProbe).enabled | default true | toString) "false" }}
          readinessProbe:
            httpGet:
              path: /user
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 10
          {{- end }}
          {{- if ne ((.Values.rmf.livenessProbe).enabled | default true | toString) "false" }}
          livenessProbe:
            httpGet:
              path: /user
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          {{- end }}

        # --- Sidecar: Zenoh clock bridge ---
        # Bridges /clock from Zenoh (published by Gazebo) to DDS Domain 55 (RMF).
        # Without this, RMF nodes with use_sim_time:=true never receive clock messages
        # and block on time-dependent operations (like publishing bid responses).
        - name: zenoh-clock-bridge
          image: {{ .Values.zenohBridge.image }}
          args: ["-c", "/zenoh-config/rmf-clock-bridge.json5"]
          env:
            - name: ROS_DOMAIN_ID
              value: "55"
            - name: ROS_DISTRO
              value: jazzy
          volumeMounts:
            - name: zenoh-config
              mountPath: /zenoh-config/rmf-clock-bridge.json5
              subPath: rmf-clock-bridge.json5
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

        # --- Sidecar: Zenoh robot state bridge ---
        # Bridges robot topics (amcl_pose, odom, etc.) from Zenoh to DDS Domain 55.
        # This allows Free Fleet to receive robot state published by Nav2 pods.
        - name: zenoh-robot-bridge
          image: {{ .Values.zenohBridge.image }}
          args: ["-c", "/zenoh-config/rmf-robot-bridge.json5"]
          env:
            - name: ROS_DOMAIN_ID
              value: "55"
            - name: ROS_DISTRO
              value: jazzy
          volumeMounts:
            - name: zenoh-config
              mountPath: /zenoh-config/rmf-robot-bridge.json5
              subPath: rmf-robot-bridge.json5
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

        # --- Sidecar: TF Relay ---
        # Republishes /robot_N/tf to /tf with namespaced frame IDs.
        # Free Fleet adapter's tf2_ros.Buffer subscribes to /tf, but Zenoh bridge
        # forwards robot TF to /robot_N/tf. This relay merges them with proper namespacing.
        - name: tf-relay
          image: {{ .Values.rmf.image }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              export HOME=/tmp
              source /opt/ros/jazzy/setup.bash
              exec python3 -u - <<'PYEOF'
              import rclpy
              from rclpy.node import Node
              from rclpy.qos import QoSProfile, ReliabilityPolicy, HistoryPolicy, DurabilityPolicy
              from tf2_msgs.msg import TFMessage
              import os

              class TFRelay(Node):
                  def __init__(self):
                      super().__init__('tf_relay')
                      robot_names = os.environ.get('ROBOT_NAMES', 'robot_1 robot_2').split()

                      # TF QoS profile
                      tf_qos = QoSProfile(
                          depth=100,
                          reliability=ReliabilityPolicy.RELIABLE,
                          history=HistoryPolicy.KEEP_LAST,
                          durability=DurabilityPolicy.VOLATILE,
                      )

                      # Publishers to /tf and /tf_static (what Free Fleet adapter subscribes to)
                      self.tf_pub = self.create_publisher(TFMessage, '/tf', tf_qos)

                      tf_static_qos = QoSProfile(
                          depth=100,
                          reliability=ReliabilityPolicy.RELIABLE,
                          history=HistoryPolicy.KEEP_LAST,
                          durability=DurabilityPolicy.TRANSIENT_LOCAL,
                      )
                      self.tf_static_pub = self.create_publisher(TFMessage, '/tf_static', tf_static_qos)

                      # Subscribe to each robot's namespaced TF topics (both /tf and /tf_static)
                      self.subs = []
                      for robot_name in robot_names:
                          # Subscribe to dynamic TF
                          sub_tf = self.create_subscription(
                              TFMessage,
                              f'/{robot_name}/tf',
                              lambda msg, rname=robot_name: self.tf_callback(msg, rname),
                              tf_qos
                          )
                          self.subs.append(sub_tf)
                          self.get_logger().info(f'Subscribed to /{robot_name}/tf')

                          # Subscribe to static TF
                          sub_tf_static = self.create_subscription(
                              TFMessage,
                              f'/{robot_name}/tf_static',
                              lambda msg, rname=robot_name: self.tf_static_callback(msg, rname),
                              tf_static_qos
                          )
                          self.subs.append(sub_tf_static)
                          self.get_logger().info(f'Subscribed to /{robot_name}/tf_static')

                      self.get_logger().info(f'TF relay active for {len(robot_names)} robots')

                  def tf_callback(self, msg, robot_name):
                      # Add robot namespace to all frame IDs
                      relayed_msg = TFMessage()
                      for transform in msg.transforms:
                          import copy
                          t = copy.deepcopy(transform)
                          # Always namespace both parent and child frames
                          # Input from Nav2: map, odom, base_footprint, base_link, etc.
                          # Output for Free Fleet: robot_N/map, robot_N/odom, robot_N/base_footprint, etc.
                          t.header.frame_id = f'{robot_name}/{transform.header.frame_id}'
                          t.child_frame_id = f'{robot_name}/{transform.child_frame_id}'
                          relayed_msg.transforms.append(t)

                      # Publish to global /tf
                      self.tf_pub.publish(relayed_msg)

                  def tf_static_callback(self, msg, robot_name):
                      # Add robot namespace to all static frame IDs
                      relayed_msg = TFMessage()
                      for transform in msg.transforms:
                          import copy
                          t = copy.deepcopy(transform)
                          t.header.frame_id = f'{robot_name}/{transform.header.frame_id}'
                          t.child_frame_id = f'{robot_name}/{transform.child_frame_id}'
                          relayed_msg.transforms.append(t)

                      # Publish to global /tf_static
                      self.tf_static_pub.publish(relayed_msg)

              def main():
                  rclpy.init()
                  node = TFRelay()
                  try:
                      rclpy.spin(node)
                  except KeyboardInterrupt:
                      pass
                  finally:
                      node.destroy_node()
                      rclpy.shutdown()

              if __name__ == '__main__':
                  main()
              PYEOF
          env:
            - name: ROS_DOMAIN_ID
              value: "55"
            - name: ROS_DISTRO
              value: jazzy
            - name: ROBOT_NAMES
              value: "{{ range .Values.robots }}{{ .name }} {{ end }}"
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: rmf-config
          configMap:
            name: rmf-config
        - name: zenoh-config
          configMap:
            name: zenoh-bridge-config
{{- end }}
