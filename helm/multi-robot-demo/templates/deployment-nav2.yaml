{{- if or (not .Values.hotel.enabled) .Values.hybridNav2.enabled }}
{{- range .Values.robots }}
{{- $safeRobotName := .name | replace "_" "-" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: robot-nav-{{ $safeRobotName }}
  namespace: {{ $.Values.namespace }}
  labels:
    app: robot-nav-{{ $safeRobotName }}
    app.kubernetes.io/part-of: ros2-multi-robot-demo
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: robot-nav-{{ $safeRobotName }}
  template:
    metadata:
      labels:
        app: robot-nav-{{ $safeRobotName }}
        app.kubernetes.io/part-of: ros2-multi-robot-demo
    spec:
      serviceAccountName: ros2-demo
      containers:
        # --- Main container: Nav2 autonomy stack for {{ .name }} ---
        - name: nav2
          image: {{ $.Values.image.repository }}:{{ $.Values.image.tag }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["/entrypoint-nav2.sh"]
          env:
            - name: ROBOT_NAME
              value: {{ .name | quote }}
            - name: INITIAL_X
              value: {{ $.Values.nav2.mapOffsetX | default .initialPose.xPos | quote }}
            - name: INITIAL_Y
              value: {{ $.Values.nav2.mapOffsetY | default .initialPose.yPos | quote }}
            - name: INITIAL_YAW
              value: {{ .initialPose.yaw | quote }}
            - name: TURTLEBOT3_MODEL
              value: waffle
            - name: ROS_DISTRO
              value: jazzy
            - name: ROS_DOMAIN_ID
              value: "0"
            - name: LOCALIZATION_MODE
              value: {{ $.Values.nav2.localizationMode | default "slam_toolbox" | quote }}
            - name: LOCALIZATION_MAP
              value: {{ $.Values.nav2.localizationMap | default "" | quote }}
            - name: SLAM_MAP_DIR
              value: {{ $.Values.nav2.slamMapDir | default "/opt/ros2-demo/slam_maps" | quote }}
            - name: ENABLE_FOOTPRINT_APPROACH
              value: {{ $.Values.nav2.enableFootprintApproach | default "true" | quote }}
            # Robot's true world-frame spawn position — always xPos/yPos from
            # values.yaml, never overridden by mapOffsetX/Y. Used by AMCL mode
            # to publish the initial pose in map frame (= world frame for AMCL).
            - name: SPAWN_X
              value: {{ .initialPose.xPos | quote }}
            - name: SPAWN_Y
              value: {{ .initialPose.yPos | quote }}
          resources:
            requests:
              cpu: {{ $.Values.nav2.resources.requests.cpu | quote }}
              memory: {{ $.Values.nav2.resources.requests.memory | quote }}
            limits:
              cpu: {{ $.Values.nav2.resources.limits.cpu | quote }}
              memory: {{ $.Values.nav2.resources.limits.memory | quote }}

        # --- Sidecar: zenoh-bridge-ros2dds with per-robot namespace ---
        # The namespace prefix makes bare /tf appear as robot_N/tf over Zenoh,
        # which is what free_fleet_adapter subscribes to for robot pose.
        - name: zenoh-bridge
          image: {{ $.Values.zenohBridge.image }}
          args: ["-c", "/zenoh-config/nav2-bridge.json5"]
          env:
            - name: ROS_DOMAIN_ID
              value: "0"
            - name: ROS_DISTRO
              value: jazzy
          volumeMounts:
            - name: zenoh-config
              mountPath: /zenoh-config/nav2-bridge.json5
              subPath: nav2-bridge-{{ .name }}.json5
              readOnly: true
          resources:
            requests:
              cpu: {{ $.Values.zenohResources.requests.cpu | quote }}
              memory: {{ $.Values.zenohResources.requests.memory | quote }}
            limits:
              cpu: {{ $.Values.zenohResources.limits.cpu | quote }}
              memory: {{ $.Values.zenohResources.limits.memory | quote }}

        # --- Sidecar: clock-only bridge (no namespace) ---
        # Subscribes to Zenoh bare "clock" -> delivers to local /clock.
        # The main bridge uses namespace /robot_N so it maps robot_N/X -> /X,
        # meaning it can only subscribe to robot_N/clock. But Gazebo publishes
        # to bare Zenoh key "clock". This sidecar bridges that gap.
        - name: zenoh-clock-bridge
          image: {{ $.Values.zenohBridge.image }}
          args: ["-c", "/zenoh-config/clock-bridge.json5"]
          env:
            - name: ROS_DOMAIN_ID
              value: "0"
            - name: ROS_DISTRO
              value: jazzy
          volumeMounts:
            - name: zenoh-config
              mountPath: /zenoh-config/clock-bridge.json5
              subPath: clock-bridge.json5
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

        # --- Sidecar: cmd_vel Zenoh keepalive (no namespace) ---
        # Subscribes to exact Zenoh keys robot_1/cmd_vel and robot_2/cmd_vel,
        # keeping the Gazebo bridge's Route Subscriber alive during idle periods.
        # Exact keys only — no wildcard — prevents the nav bridge from creating
        # cascading routes (robot_N/robot_N/cmd_vel, robot_N/robot_M/cmd_vel).
        # The DDS side publishes to /robot_N/cmd_vel which the nav bridge may
        # route to robot_N/robot_N/cmd_vel (harmless — nobody subscribes).
        - name: zenoh-cmdvel-keepalive
          image: {{ $.Values.zenohBridge.image }}
          args: ["-c", "/zenoh-config/cmd-vel-keepalive.json5"]
          env:
            - name: ROS_DOMAIN_ID
              value: "0"
            - name: ROS_DISTRO
              value: jazzy
          volumeMounts:
            - name: zenoh-config
              mountPath: /zenoh-config/cmd-vel-keepalive.json5
              subPath: cmd-vel-keepalive.json5
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

        # --- Sidecar: Scan Frame ID Rewriter ---
        # Gazebo gpu_lidar auto-generates frame_id as model/link/sensor (robot_1/base_scan/lidar)
        # but TF tree only has robot_1/base_scan. This rewrites scan frame_id to base_scan.
        - name: scan-frame-rewriter
          image: {{ $.Values.image.repository }}:{{ $.Values.image.tag }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              source /usr/lib64/ros-jazzy/setup.bash
              echo "[scan-rewriter] Starting scan frame_id rewriter"
              python3 -u - <<'PYEOF'
              import rclpy
              import rclpy.parameter
              from rclpy.node import Node
              from rclpy.qos import QoSProfile, ReliabilityPolicy, HistoryPolicy, DurabilityPolicy
              from sensor_msgs.msg import LaserScan

              class ScanFrameRewriter(Node):
                  def __init__(self):
                      super().__init__('scan_frame_rewriter',
                                       parameter_overrides=[rclpy.parameter.Parameter('use_sim_time', rclpy.Parameter.Type.BOOL, True)])
                      scan_qos = QoSProfile(depth=10, reliability=ReliabilityPolicy.BEST_EFFORT,
                                            history=HistoryPolicy.KEEP_LAST, durability=DurabilityPolicy.VOLATILE)
                      self.scan_sub = self.create_subscription(LaserScan, '/scan', self.scan_callback, scan_qos)
                      self.scan_pub = self.create_publisher(LaserScan, '/scan_fixed', scan_qos)
                      self.counter = 0
                      self.get_logger().info('Rewriting scan frame_id: /scan → /scan_fixed (robot_1/base_scan/lidar → base_scan)')

                  def scan_callback(self, msg):
                      self.counter += 1
                      original_frame = msg.header.frame_id
                      if 'lidar' in msg.header.frame_id:
                          msg.header.frame_id = 'base_scan'
                      self.scan_pub.publish(msg)
                      if self.counter % 20 == 0:
                          self.get_logger().info(f'Processed {self.counter} scans: {original_frame} → {msg.header.frame_id}')

              def main():
                  rclpy.init()
                  node = ScanFrameRewriter()
                  try:
                      rclpy.spin(node)
                  except KeyboardInterrupt:
                      pass
                  finally:
                      node.destroy_node()
                      rclpy.shutdown()

              if __name__ == '__main__':
                  main()
              PYEOF
          env:
            - name: ROS_DOMAIN_ID
              value: "0"
            - name: ROS_DISTRO
              value: jazzy
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi

        # --- Sidecar: Odom TF Publisher ---
        # Publishes odom->base_footprint to /tf (not /tf_static) so it gets bridged to Zenoh
        # Static publisher uses /tf_static which nav2-bridge doesn't forward
        - name: odom-tf-publisher
          image: {{ $.Values.image.repository }}:{{ $.Values.image.tag }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              source /usr/lib64/ros-jazzy/setup.bash
              echo "[odom-tf] Starting TF broadcaster on /tf topic"
              python3 -u - <<'PYEOF'
              import rclpy
              import rclpy.parameter
              from rclpy.node import Node
              from tf2_ros import TransformBroadcaster
              from geometry_msgs.msg import TransformStamped

              class TFPublisher(Node):
                  def __init__(self):
                      super().__init__('odom_tf_publisher',
                                       parameter_overrides=[rclpy.parameter.Parameter('use_sim_time', rclpy.Parameter.Type.BOOL, True)])
                      self.broadcaster = TransformBroadcaster(self)
                      self.timer = self.create_timer(0.1, self.publish_tf)
                      self.get_logger().info('Publishing odom->base_footprint on /tf at 10Hz with sim time')

                  def publish_tf(self):
                      t = TransformStamped()
                      t.header.stamp = self.get_clock().now().to_msg()
                      t.header.frame_id = 'odom'
                      t.child_frame_id = 'base_footprint'
                      t.transform.translation.x = 0.0
                      t.transform.translation.y = 0.0
                      t.transform.translation.z = 0.0
                      t.transform.rotation.x = 0.0
                      t.transform.rotation.y = 0.0
                      t.transform.rotation.z = 0.0
                      t.transform.rotation.w = 1.0
                      self.broadcaster.sendTransform(t)

              def main():
                  rclpy.init()
                  node = TFPublisher()
                  try:
                      rclpy.spin(node)
                  except KeyboardInterrupt:
                      pass
                  finally:
                      node.destroy_node()
                      rclpy.shutdown()

              if __name__ == '__main__':
                  main()
              PYEOF
          env:
            - name: ROS_DOMAIN_ID
              value: "0"
            - name: ROS_DISTRO
              value: jazzy
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi

      volumes:
        - name: zenoh-config
          configMap:
            name: zenoh-bridge-config
{{- end }}
{{- end }}
