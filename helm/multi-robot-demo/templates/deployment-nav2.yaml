{{- if or (not .Values.hotel.enabled) .Values.hybridNav2.enabled }}
{{- range .Values.robots }}
{{- $safeRobotName := .name | replace "_" "-" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: robot-nav-{{ $safeRobotName }}
  namespace: {{ $.Values.namespace }}
  labels:
    app: robot-nav-{{ $safeRobotName }}
    app.kubernetes.io/part-of: ros2-multi-robot-demo
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: robot-nav-{{ $safeRobotName }}
  template:
    metadata:
      labels:
        app: robot-nav-{{ $safeRobotName }}
        app.kubernetes.io/part-of: ros2-multi-robot-demo
    spec:
      serviceAccountName: ros2-demo
      containers:
        # --- Main container: Nav2 autonomy stack for {{ .name }} ---
        - name: nav2
          image: {{ $.Values.image.repository }}:{{ $.Values.image.tag }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["/entrypoint-nav2.sh"]
          env:
            - name: ROBOT_NAME
              value: {{ .name | quote }}
            - name: INITIAL_X
              value: {{ $.Values.nav2.mapOffsetX | default .initialPose.xPos | quote }}
            - name: INITIAL_Y
              value: {{ $.Values.nav2.mapOffsetY | default .initialPose.yPos | quote }}
            - name: INITIAL_YAW
              value: {{ .initialPose.yaw | quote }}
            - name: TURTLEBOT3_MODEL
              value: waffle
            - name: ROS_DISTRO
              value: jazzy
            - name: ROS_DOMAIN_ID
              value: "0"
            - name: LOCALIZATION_MODE
              value: {{ $.Values.nav2.localizationMode | default "slam_toolbox" | quote }}
            - name: LOCALIZATION_MAP
              value: {{ $.Values.nav2.localizationMap | default "" | quote }}
            - name: SLAM_MAP_DIR
              value: {{ $.Values.nav2.slamMapDir | default "/opt/ros2-demo/slam_maps" | quote }}
            - name: ENABLE_FOOTPRINT_APPROACH
              value: {{ $.Values.nav2.enableFootprintApproach | default "true" | quote }}
            # Robot's true world-frame spawn position — always xPos/yPos from
            # values.yaml, never overridden by mapOffsetX/Y. Used by AMCL mode
            # to publish the initial pose in map frame (= world frame for AMCL).
            - name: SPAWN_X
              value: {{ .initialPose.xPos | quote }}
            - name: SPAWN_Y
              value: {{ .initialPose.yPos | quote }}
          resources:
            requests:
              cpu: {{ $.Values.nav2.resources.requests.cpu | quote }}
              memory: {{ $.Values.nav2.resources.requests.memory | quote }}
            limits:
              cpu: {{ $.Values.nav2.resources.limits.cpu | quote }}
              memory: {{ $.Values.nav2.resources.limits.memory | quote }}

        # --- Sidecar: zenoh-bridge-ros2dds with per-robot namespace ---
        # The namespace prefix makes bare /tf appear as robot_N/tf over Zenoh,
        # which is what free_fleet_adapter subscribes to for robot pose.
        - name: zenoh-bridge
          image: {{ $.Values.zenohBridge.image }}
          args: ["-c", "/zenoh-config/nav2-bridge.json5"]
          env:
            - name: ROS_DOMAIN_ID
              value: "0"
            - name: ROS_DISTRO
              value: jazzy
          volumeMounts:
            - name: zenoh-config
              mountPath: /zenoh-config/nav2-bridge.json5
              subPath: nav2-bridge-{{ .name }}.json5
              readOnly: true
          resources:
            requests:
              cpu: {{ $.Values.zenohResources.requests.cpu | quote }}
              memory: {{ $.Values.zenohResources.requests.memory | quote }}
            limits:
              cpu: {{ $.Values.zenohResources.limits.cpu | quote }}
              memory: {{ $.Values.zenohResources.limits.memory | quote }}

        # --- Sidecar: clock-only bridge (no namespace) ---
        # Subscribes to Zenoh bare "clock" -> delivers to local /clock.
        # The main bridge uses namespace /robot_N so it maps robot_N/X -> /X,
        # meaning it can only subscribe to robot_N/clock. But Gazebo publishes
        # to bare Zenoh key "clock". This sidecar bridges that gap.
        - name: zenoh-clock-bridge
          image: {{ $.Values.zenohBridge.image }}
          args: ["-c", "/zenoh-config/clock-bridge.json5"]
          env:
            - name: ROS_DOMAIN_ID
              value: "0"
            - name: ROS_DISTRO
              value: jazzy
          volumeMounts:
            - name: zenoh-config
              mountPath: /zenoh-config/clock-bridge.json5
              subPath: clock-bridge.json5
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

        # --- Sidecar: cmd_vel Zenoh keepalive (no namespace) ---
        # Subscribes to exact Zenoh keys robot_1/cmd_vel and robot_2/cmd_vel,
        # keeping the Gazebo bridge's Route Subscriber alive during idle periods.
        # Exact keys only — no wildcard — prevents the nav bridge from creating
        # cascading routes (robot_N/robot_N/cmd_vel, robot_N/robot_M/cmd_vel).
        # The DDS side publishes to /robot_N/cmd_vel which the nav bridge may
        # route to robot_N/robot_N/cmd_vel (harmless — nobody subscribes).
        - name: zenoh-cmdvel-keepalive
          image: {{ $.Values.zenohBridge.image }}
          args: ["-c", "/zenoh-config/cmd-vel-keepalive.json5"]
          env:
            - name: ROS_DOMAIN_ID
              value: "0"
            - name: ROS_DISTRO
              value: jazzy
          volumeMounts:
            - name: zenoh-config
              mountPath: /zenoh-config/cmd-vel-keepalive.json5
              subPath: cmd-vel-keepalive.json5
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

      volumes:
        - name: zenoh-config
          configMap:
            name: zenoh-bridge-config
{{- end }}
{{- end }}
