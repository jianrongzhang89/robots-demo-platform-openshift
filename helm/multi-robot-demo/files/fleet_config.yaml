# Free Fleet configuration for Hotel Multi-Level Demo (2.5D layout)
# All three "floors" share the same map (horizontally arranged)

rmf_fleet:
  name: "turtlebot3"
  limits:
    linear: [0.5, 0.75]
    angular: [0.6, 2.0]
  profile:
    footprint: 0.3
    vicinity: 2.0
  reversible: True
  battery_system:
    voltage: 12.0
    capacity: 1000000.0
    charging_current: 5.0
  mechanical_system:
    mass: 20.0
    moment_of_inertia: 10.0
    friction_coefficient: 0.22
  ambient_system:
    power: 20.0
  tool_system:
    power: 0.0
  recharge_threshold: 0.05
  recharge_soc: 1.0
  publish_fleet_state: 10.0
  account_for_battery_drain: False
  task_capabilities:
    loop: True
    delivery: True
    patrol: True
  finishing_request: "nothing"
  responsive_wait: True

  robots:
    robot_1:
      charger: "charger_1"
      responsive_wait: False
      navigation_stack: 2
      init_timeout_sec: 60
      service_call_timeout_sec: 10.0
      initial_map: "L1"
      map_frame: "map"
      robot_frame: "base_footprint"
      maps:
        L1:
          map_url: "/opt/maps/hotel_L1.yaml"
          # Where robot exits each lift on this level [x, y, yaw]
          lift_exit_poses:
            Lift1: [52.5, 27.5, 0.0]
          # Where each lift cabin is on this level [x, y]
          lift_cabin_poses:
            Lift1: [52.5, 27.5]
        L2:
          map_url: "/opt/maps/hotel_L2.yaml"
          lift_exit_poses:
            Lift1: [57.5, 27.5, 3.14159]  # Exit facing opposite direction
            Lift2: [112.5, 27.5, 0.0]
          lift_cabin_poses:
            Lift1: [57.5, 27.5]
            Lift2: [112.5, 27.5]
        L3:
          map_url: "/opt/maps/hotel_L3.yaml"
          lift_exit_poses:
            Lift2: [117.5, 27.5, 3.14159]
          lift_cabin_poses:
            Lift2: [117.5, 27.5]

    robot_2:
      charger: "charger_2"
      responsive_wait: False
      navigation_stack: 2
      init_timeout_sec: 60
      service_call_timeout_sec: 10.0
      initial_map: "L1"
      map_frame: "map"
      robot_frame: "base_footprint"
      maps:
        L1:
          map_url: "/opt/maps/hotel_L1.yaml"
          lift_exit_poses:
            Lift1: [52.5, 27.5, 0.0]
          lift_cabin_poses:
            Lift1: [52.5, 27.5]
        L2:
          map_url: "/opt/maps/hotel_L2.yaml"
          lift_exit_poses:
            Lift1: [57.5, 27.5, 3.14159]
            Lift2: [112.5, 27.5, 0.0]
          lift_cabin_poses:
            Lift1: [57.5, 27.5]
            Lift2: [112.5, 27.5]
        L3:
          map_url: "/opt/maps/hotel_L3.yaml"
          lift_exit_poses:
            Lift2: [117.5, 27.5, 3.14159]
          lift_cabin_poses:
            Lift2: [117.5, 27.5]

  robot_state_update_frequency: 10.0

# Identity transform: RMF frame == Nav2 world frame
# True multi-level structure: L1, L2, L3 at elevation 0 (2.5D horizontal layout)
# Reference coordinates per level using actual waypoint positions from nav graph
reference_coordinates:
  L1:
    rmf:   [[10.0, 15.0], [20.0, 15.0], [10.0, 30.0], [20.0, 30.0]]
    robot: [[10.0, 15.0], [20.0, 15.0], [10.0, 30.0], [20.0, 30.0]]
  L2:
    rmf:   [[70.0, 20.0], [85.0, 20.0], [70.0, 30.0], [85.0, 30.0]]
    robot: [[70.0, 20.0], [85.0, 20.0], [70.0, 30.0], [85.0, 30.0]]
  L3:
    rmf:   [[130.0, 20.0], [145.0, 20.0], [130.0, 30.0], [145.0, 30.0]]
    robot: [[130.0, 20.0], [145.0, 20.0], [130.0, 30.0], [145.0, 30.0]]

fleet_manager:
  zenoh:
    router: "tcp/zenoh-router:7447"
