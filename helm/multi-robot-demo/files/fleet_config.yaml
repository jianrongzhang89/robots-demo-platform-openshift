# free_fleet fleet configuration for the tb3_sandbox multi-robot demo.
# Modelled after the official free_fleet nav2_unique_multi_tb3 example config.
# All coordinates are in Nav2 world frame (meters) with identity transform.

rmf_fleet:
  name: "turtlebot3"
  limits:
    # Very conservative planning speed so the traffic manager gives enough time
    # for Nav2 to complete navigation. Nav2 still moves at its own speed; this
    # only affects RMF ETA calculation. At 0.5 RTF and 0.26 m/s actual nav speed,
    # the traffic planner needs > 2s ETA per segment so 0.02 m/s gives ~2s/0.04m.
    linear: [0.02, 0.5]
    angular: [0.1, 1.0]
  profile:
    # footprint: robot's physical radius for collision planning (m).
    # Also used for "arrived at waypoint" detection — keep it near actual robot size.
    footprint: 0.3
    # vicinity: radius within which a robot is snapped onto the traffic graph (m).
    # 1.0 m tolerates typical AMCL drift (~0.2 m) plus slight off-lane deviations.
    # Must be less than half the distance between adjacent waypoints (~2.5 m apart).
    vicinity: 1.0
  reversible: True
  battery_system:
    voltage: 12.0
    capacity: 24.0        # Ahr — standard TurtleBot3 Waffle spec
    charging_current: 5.0
  mechanical_system:
    mass: 20.0            # kg
    moment_of_inertia: 10.0
    friction_coefficient: 0.22
  ambient_system:
    power: 20.0           # W
  tool_system:
    power: 0.0
  recharge_threshold: 0.05  # 5% — never triggers (robots start at 100%)
  recharge_soc: 1.0
  # At real_time_factor=0.5, navigation takes 2x longer in wall time.
  # Increase from 10.0 to 300.0 so the traffic manager doesn't replan
  # before the robot has time to complete each navigation segment.
  publish_fleet_state: 300.0
  account_for_battery_drain: True  # True avoids the low_capacity planner error
  task_capabilities:
    loop: True
    delivery: True
  finishing_request: "nothing"
  responsive_wait: True

  robots:
    robot_1:
      charger: "charger_1"
      responsive_wait: False
      navigation_stack: 2
      init_timeout_sec: 180
      service_call_timeout_sec: 60.0
      initial_map: "L1"
      map_frame: "map"
      robot_frame: "base_footprint"
      maps:
        L1:
          map_url: "/opt/ros/jazzy/share/nav2_bringup/maps/tb3_sandbox.yaml"
    robot_2:
      charger: "charger_2"
      responsive_wait: False
      navigation_stack: 2
      init_timeout_sec: 180
      service_call_timeout_sec: 60.0
      initial_map: "L1"
      map_frame: "map"
      robot_frame: "base_footprint"
      maps:
        L1:
          map_url: "/opt/ros/jazzy/share/nav2_bringup/maps/tb3_sandbox.yaml"

  # At real_time_factor=0.5, navigation takes 2x longer in wall time.
  # Increase from 10.0 to 60.0 to give each nav segment time to complete
  # before the adapter re-evaluates the plan (which would cancel the goal).
  robot_state_update_frequency: 60.0

# Identity transform: RMF frame == Nav2 world frame (both in meters)
reference_coordinates:
  L1:
    rmf:   [[ 0.0, 0.0], [5.0, 0.0], [0.0, 5.0], [5.0, 5.0]]
    robot: [[ 0.0, 0.0], [5.0, 0.0], [0.0, 5.0], [5.0, 5.0]]

fleet_manager:
  zenoh:
    router: "tcp/zenoh-router:7447"
