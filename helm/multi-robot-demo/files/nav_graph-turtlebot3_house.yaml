#   2  = left_north    (-2.0, +0.5)
#   3  = right_north   (+2.0, +0.5)
#   4  = center_south  ( 0.0, -0.5)
#   5  = sw_open       (-1.5, -1.5)
#   6  = se_open       (+1.5, -1.5)
#   7  = south_center  ( 0.0, -2.0)
#   8  = charger_1     (-2.5, -0.5)
#   9  = charger_2     (+2.5, -0.5)
#  10  = cafe_w        ( 5.0, -2.73) west entrance to kitchen cafe area
#  11  = cafe_nw       ( 5.4, -1.6)  northwest of cafe tables
#  12  = cafe_ne       ( 7.2, -1.6)  northeast of cafe tables
#  13  = cafe_se       ( 7.2, -3.7)  southeast of cafe tables

