#   robot_2 patrols a circuit around these two cafe tables (waypoints 10-13).
#
# Robot spawns:
#   robot_1: (-1.5, -0.5)  left corridor
#   robot_2: (+1.5, -0.5)  right corridor
#
# Vertex index map:
#   0  = robot_1_home  (-1.5, -0.5)  left corridor — robot_1 spawn
