# Open-RMF Hotel World — Federated multi-pod architecture with Zenoh
#
# Usage:
#   helm upgrade ... -f values.yaml -f values-hotel-federated.yaml
#
# This variant runs the hotel world in a distributed architecture:
#   - Gazebo pod: hotel world with slotcar robots, building, doors, lifts
#   - RMF-core pod: fleet management (separate from Gazebo), traffic scheduling, task dispatch
#   - Zenoh-router pod: federation hub for cross-pod ROS2 communication
#   - Zenoh bridges in each pod for DDS-Zenoh communication
#   - Monotonic clock relay to fix timing issues across pods
#
# This demonstrates Zenoh federation while preserving the full hotel demo
# experience (slotcar robots, lifts, doors, multiple levels).

namespace: ros2-rmf-hotel-federated

# Hotel demo enabled in federated multi-pod mode
hotel:
  enabled: true
  # Separate RMF components into rmf-core pod (federated architecture)
  separateRmfPod: true
  image: quay.io/jianrzha/ros2-rmf-hotel:latest
  resolution: "1600x900x24"
  launchArgs: ""
  resources:
    requests:
      cpu: "4"
      memory: "4Gi"
    limits:
      cpu: "8"
      memory: "8Gi"

# Container images (renamed to ros2-hotel-demo)
image:
  repository: quay.io/jianrzha/ros2-hotel-demo
  tag: latest
  pullPolicy: Always

# Dedicated Zenoh router pod
zenohRouter:
  image: eclipse/zenoh:1.5.0

# Zenoh bridge sidecar image
zenohBridge:
  image: eclipse/zenoh-bridge-ros2dds:1.5.0

# No separate robot pods - slotcar robots are embedded in hotel world
robots: []

# Gazebo simulation pod settings - hotel world
gazebo:
  world: hotel
  gpu: false
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "4"
      memory: 8Gi

# Nav2 pod resource settings
nav2:
  # Use AMCL localization with pre-built map
  localizationMode: amcl
  # Use tb3_sandbox map (simple world without obstacles)
  localizationMap: /usr/lib64/ros-jazzy/share/nav2_bringup/maps/tb3_sandbox.yaml
  # SLAM map dir not used in AMCL mode
  slamMapDir: /opt/ros2-demo/slam_maps
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi

# zenoh-bridge sidecar resources
zenohResources:
  requests:
    cpu: 500m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

# OpenShift Route hostnames
routes:
  novncHost: ""
  webHost: ""

# Open-RMF fleet management
rmf:
  image: quay.io/jianrzha/ros2-rmf:latest
  # Map path (required by fleet config but unused in slam_toolbox mode)
  mapUrl: /usr/lib64/ros-jazzy/share/nav2_bringup/maps/tb3_sandbox.yaml
  # Use 4-robot fleet config
  fleetConfig: fleet_config_hotel.yaml
  navGraph: nav_graph.yaml
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
  routes:
    dashboardHost: ""
    apiHost: ""
