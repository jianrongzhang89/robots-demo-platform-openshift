# Override values for the turtlebot3_world demo.
# Usage:
#   helm upgrade multi-robot-demo helm/multi-robot-demo \
#     -f helm/multi-robot-demo/values.yaml \
#     -f helm/multi-robot-demo/values-turtlebot3-world.yaml \
#     --namespace ros2-multi-robot
#
# This world uses AMCL localization (no posegraph needed) against the
# turtlebot3_world.pgm map that ships with nav2_bringup.
# The nav_graph.yaml and fleet_config.yaml in the rmf-config ConfigMap
# must be swapped for ones authored for the turtlebot3_world geometry.

gazebo:
  world: turtlebot3_world

nav2:
  localizationMode: amcl
  localizationMap: /opt/ros/jazzy/share/nav2_bringup/maps/turtlebot3_world.yaml

rmf:
  mapUrl: /opt/ros/jazzy/share/nav2_bringup/maps/turtlebot3_world.yaml

robots:
  - name: robot_1
    color: "0,0,1"
    initialPose:
      xPos: -2.0
      yPos: 0.0
      yaw: 0.0
  - name: robot_2
    color: "1,0,0"
    initialPose:
      xPos: 2.0
      yPos: 0.0
      yaw: 3.14159
