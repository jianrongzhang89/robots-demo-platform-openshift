# Override values for an AMCL-based demo using the warehouse map.
# Usage:
#   helm upgrade ... -f values.yaml -f values-turtlebot3-world.yaml
#
# NOTE: turtlebot3_world.yaml is NOT shipped by nav2_bringup in ROS2 Jazzy
# (it comes from the turtlebot3 packages which are not in the Fedora 43 Copr
# repo). This file uses the warehouse map as a stand-in to verify that AMCL
# localization mode works end-to-end.
#
# To add turtlebot3_world support fully:
#   1. Add turtlebot3_world.pgm + .yaml to config/maps/ and mount as ConfigMap
#   2. Add turtlebot3_world.sdf.xacro world file (already in config/worlds/)
#   3. Rebuild the image with a maps ConfigMap mount
#
# For now this validates the infrastructure: AMCL mode, per-world nav_graph,
# per-world map URL — all working from Helm values alone.

gazebo:
  world: tb3_sandbox   # world SDF to run in Gazebo

nav2:
  # Map origin offset for nav2_relay.py coordinate transform.
  # In slam_toolbox mode: map origin = robot spawn (use xPos/yPos, default).
  # In AMCL mode: map origin = YAML origin field from the map file.
  # tb3_sandbox.yaml origin: [-10, -10] → mapOffsetX/Y = -10.0
  # For AMCL with tb3_sandbox, the map frame IS the world frame — no offset.
  # Relay sends goals in world coordinates directly as map-frame coordinates.
  mapOffsetX: "0.0"
  mapOffsetY: "0.0"
  # AMCL localization against tb3_sandbox map.
  # The Gazebo world IS tb3_sandbox (turtlebot3_world.sdf is a future addition).
  # Using tb3_sandbox.yaml gives AMCL a map that matches the running world so
  # the robot can localize and navigate — demonstrating AMCL as an alternative
  # to slam_toolbox with the same images but different Helm configuration.
  localizationMode: amcl
  localizationMap: /usr/lib64/ros-jazzy/share/nav2_bringup/maps/tb3_sandbox.yaml

rmf:
  mapUrl: /usr/lib64/ros-jazzy/share/nav2_bringup/maps/tb3_sandbox.yaml
  navGraph: nav_graph-turtlebot3_world.yaml
  navGraph: nav_graph-turtlebot3_world.yaml

robots:
  - name: robot_1
    color: "0,0,1"
    initialPose:
      xPos: -2.0
      yPos: 0.0
      yaw: 0.0
  - name: robot_2
    color: "1,0,0"
    initialPose:
      xPos: 2.0
      yPos: 0.0
      yaw: 3.14159
