apiVersion: v1
kind: Service
metadata:
  name: phase8-multilevel-novnc
  namespace: {{ .Values.namespace }}
  labels: {app: phase8-multilevel-hotel}
spec:
  # noVNC must remain reachable for operator review while the served-SAM3
  # freshness probe reports transient inference gaps. Navigation dispatch
  # remains a separate, explicit action after that review.
  publishNotReadyAddresses: true
  selector: {app: phase8-multilevel-hotel}
  ports:
    - {name: novnc, port: 6080, targetPort: novnc, protocol: TCP}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: phase8-multilevel-novnc
  namespace: {{ .Values.namespace }}
  annotations:
    haproxy.router.openshift.io/timeout: 10m
spec:
  to: {kind: Service, name: phase8-multilevel-novnc, weight: 100}
  port: {targetPort: novnc}
  tls: {termination: edge, insecureEdgeTerminationPolicy: Redirect}
  wildcardPolicy: None
