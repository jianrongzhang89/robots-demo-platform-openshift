apiVersion: batch/v1
kind: Job
metadata:
  name: semantic-phase7-managed-credentials-test
  namespace: semantic-navigation
  labels:
    semantic-navigation.robots-demo/phase: phase7-validation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 360
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        semantic-navigation.robots-demo/phase: phase7-validation
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: managed-credential-integration
        image: image-registry.openshift-image-registry.svc:5000/semantic-navigation/semantic-safety@sha256:1c4175d7d3b8a59f685387fa3aff64ac1d20965b6d0a7df34ac704cd267fe080
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "-lc"]
        args:
        - >-
          export HOME=/tmp/phase7-managed-home
          ROS_LOG_DIR=/tmp/phase7-managed-ros-logs
          GZ_PARTITION="phase5-watchdog-phase7-${POD_UID}"
          GZ_IP=127.0.0.1;
          mkdir -p "$HOME" "$ROS_LOG_DIR";
          source /opt/ros/jazzy/setup.bash;
          exec python3 /opt/phase7-runtime/verify_phase7_native_operator.py
        env:
        - {name: ROS_DOMAIN_ID, value: "196"}
        - {name: PHASE7_TEST_CREDENTIALS_DIR, value: /phase7-credentials}
        - name: POD_UID
          valueFrom: {fieldRef: {fieldPath: metadata.uid}}
        volumeMounts:
        - {name: credentials, mountPath: /phase7-credentials, readOnly: true}
        - {name: tmp, mountPath: /tmp}
        resources:
          requests: {cpu: "1", memory: 2Gi}
          limits: {cpu: "3", memory: 4Gi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
          seccompProfile: {type: RuntimeDefault}
      volumes:
      - name: credentials
        secret:
          secretName: semantic-phase7-fixture-credentials
          defaultMode: 292
      - name: tmp
        emptyDir: {sizeLimit: 512Mi}
