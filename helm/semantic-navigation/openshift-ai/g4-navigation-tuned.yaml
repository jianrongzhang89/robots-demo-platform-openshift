apiVersion: tuned.openshift.io/v1
kind: Tuned
metadata:
  name: semantic-g4-navigation
  namespace: openshift-cluster-node-tuning-operator
spec:
  profile:
  - name: semantic-g4-navigation
    data: |
      [main]
      summary=Bounded DDS receive buffers for the G4 private navigation consumers
      include=openshift-node
      [sysctl]
      net.core.rmem_max=8388608
  recommend:
  - profile: semantic-g4-navigation
    priority: 19
    match:
    - label: kubernetes.io/hostname
      value: ip-10-0-44-146.ec2.internal
      type: node
