apiVersion: batch/v1
kind: Job
metadata:
  name: semantic-phase7-operator-control-test
  namespace: semantic-navigation
  labels:
    semantic-navigation.robots-demo/phase: phase7-validation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        semantic-navigation.robots-demo/phase: phase7-validation
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
      - name: operator-control-tests
        image: image-registry.openshift-image-registry.svc:5000/semantic-navigation/semantic-safety:phase7-control-candidate
        imagePullPolicy: Always
        command: ["/bin/bash", "-ec"]
        args:
        - PYTHONPATH=/opt/phase7-safety python3 -m unittest discover -s /opt/phase7-safety -p 'test_phase7_*.py' -v
        env:
        - {name: ROS_DOMAIN_ID, value: "199"}
        resources:
          requests: {cpu: 500m, memory: 1Gi}
          limits: {cpu: '2', memory: 3Gi}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: semantic-phase7-operator-runtime-test
  namespace: semantic-navigation
  labels:
    semantic-navigation.robots-demo/phase: phase7-validation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        semantic-navigation.robots-demo/phase: phase7-validation
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
      - name: operator-runtime-tests
        image: image-registry.openshift-image-registry.svc:5000/semantic-navigation/semantic-safety:phase7-runtime-candidate
        imagePullPolicy: Always
        command: ["/bin/bash", "-lc"]
        args:
