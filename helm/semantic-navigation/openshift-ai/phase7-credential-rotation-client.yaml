apiVersion: v1
kind: Pod
metadata:
  name: sam3-g5-client
  namespace: semantic-navigation
  labels:
    app: sam3-g5-client
    semantic-serving-client: sam3-mat-v1
    semantic-navigation.robots-demo/phase: credential-rotation
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 5
  serviceAccountName: sam3-replay
  automountServiceAccountToken: false
  nodeSelector:
    kubernetes.io/hostname: ip-10-0-53-69.ec2.internal
  securityContext:
    seccompProfile: {type: RuntimeDefault}
  containers:
  - name: rotation-client
    image: image-registry.openshift-image-registry.svc:5000/semantic-navigation/semantic-cpu-adapter@sha256:20ea4f5e6bc30646f48b29895eb071d40403f8c20b0c1526aeacf06dce716d4b
    imagePullPolicy: IfNotPresent
    command: ["/bin/bash", "-ec"]
    args:
    - exec python3 -c 'import time; time.sleep(86400)'
    volumeMounts:
    - {name: tls, mountPath: /cert, readOnly: true}
    - {name: tmp, mountPath: /tmp}
    resources:
      requests: {cpu: 25m, memory: 128Mi}
      limits: {cpu: 100m, memory: 512Mi}
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities: {drop: [ALL]}
      seccompProfile: {type: RuntimeDefault}
  volumes:
  - name: tls
    secret: {secretName: sam3-replay-tls, defaultMode: 288}
  - name: tmp
    emptyDir: {sizeLimit: 32Mi}
