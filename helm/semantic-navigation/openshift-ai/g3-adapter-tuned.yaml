apiVersion: tuned.openshift.io/v1
kind: Tuned
metadata:
  name: semantic-g3-adapter
  namespace: openshift-cluster-node-tuning-operator
spec:
  profile:
  - name: semantic-g3-adapter
    data: |
      [main]
      summary=Bounded DDS receive buffers for the qualified semantic CPU adapter
      include=openshift-node
      [sysctl]
      net.core.rmem_max=8388608
  recommend:
  - profile: semantic-g3-adapter
    priority: 19
    match:
    - label: kubernetes.io/hostname
      value: ip-10-0-53-174.ec2.internal
      type: node
