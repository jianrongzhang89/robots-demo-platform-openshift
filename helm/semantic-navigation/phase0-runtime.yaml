apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: sam3-smoke
  namespace: semantic-navigation
spec:
  lookupPolicy:
    local: true
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: sam3-smoke
  namespace: semantic-navigation
spec:
  runPolicy: Serial
  source:
    binary: {}
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Containerfile
  output:
    to:
      kind: ImageStreamTag
      name: sam3-smoke:phase0
  resources:
    requests:
      cpu: 1
      memory: 2Gi
    limits:
      cpu: 4
      memory: 8Gi
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: sam3-smoke-overlay
  namespace: semantic-navigation
spec:
  runPolicy: Serial
  source:
    binary: {}
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Containerfile.overlay
  output:
    to:
      kind: ImageStreamTag
      name: sam3-smoke:phase0
  resources:
    requests:
      cpu: 1
      memory: 1Gi
    limits:
      cpu: 2
      memory: 4Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sam3-checkpoint
  namespace: semantic-navigation
  annotations:
    semantic-navigation.robots-demo/model-revision: 3c879f39826c281e95690f02c7821c4de09afae7
    semantic-navigation.robots-demo/model-sha256: 9999e2341ceef5e136daa386eecb55cb414446a00ac2b55eb2dfd2f7c3cf8c9e
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3-csi
  resources:
    requests:
      storage: 10Gi
