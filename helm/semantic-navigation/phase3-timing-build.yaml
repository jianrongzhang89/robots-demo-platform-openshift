apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: sam3-runtime-phase3-timing
  namespace: semantic-navigation
spec:
  runPolicy: Serial
  source: { binary: {} }
  strategy:
    type: Docker
    dockerStrategy: { dockerfilePath: Containerfile.phase3-timing }
  output:
    to: { kind: ImageStreamTag, name: 'sam3-runtime:phase3-timing' }
  resources:
    requests: { cpu: '1', memory: 2Gi }
    limits: { cpu: '4', memory: 8Gi }
