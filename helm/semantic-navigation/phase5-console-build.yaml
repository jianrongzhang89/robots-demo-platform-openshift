apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: semantic-safety-console-phase5
  namespace: semantic-navigation
spec:
  runPolicy: Serial
  source: {binary: {}}
  strategy:
    type: Docker
    dockerStrategy: {dockerfilePath: Containerfile.console}
  output:
    to: {kind: ImageStreamTag, name: 'semantic-safety:phase5-console-candidate'}
  resources:
    requests: {cpu: '1', memory: 2Gi}
    limits: {cpu: '2', memory: 4Gi}
