apiVersion: batch/v1
kind: Job
metadata:
  name: sam3-phase0-smoke
  namespace: semantic-navigation
  labels:
    app.kubernetes.io/name: sam3-phase0-smoke
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sam3-phase0-smoke
    spec:
      restartPolicy: Never
      securityContext:
        fsGroup: 1001340000
        fsGroupChangePolicy: OnRootMismatch
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-L40S
      tolerations:
        - key: g6e-gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: sam3-smoke
          image: image-registry.openshift-image-registry.svc:5000/semantic-navigation/sam3-smoke:phase0
          imagePullPolicy: Always
          args:
            - --checkpoint
            - /models/sam3.pt
            - --image
            - /opt/sam3/test_image.jpg
            - --prompt
            - person
            - --device
            - cuda
          env:
            - name: HF_HUB_OFFLINE
              value: "1"
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 32Gi
              nvidia.com/gpu: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: model
              mountPath: /models
              readOnly: true
      volumes:
        - name: model
          persistentVolumeClaim:
            claimName: sam3-checkpoint
