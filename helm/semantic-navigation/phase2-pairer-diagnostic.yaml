apiVersion: v1
kind: ConfigMap
metadata:
  name: semantic-phase2-pairer-diagnostic-config
  namespace: semantic-navigation
data:
  cyclonedds.xml: |
    <?xml version="1.0" encoding="UTF-8" ?>
    <CycloneDDS xmlns="https://cdds.io/config">
      <Domain id="any">
        <General><Interfaces><NetworkInterface name="lo" /></Interfaces><AllowMulticast>false</AllowMulticast></General>
        <Discovery><ParticipantIndex>auto</ParticipantIndex></Discovery>
      </Domain>
    </CycloneDDS>
  router.json5: |
    { mode: "router", listen: { endpoints: ["tcp/0.0.0.0:17447"] }, scouting: { multicast: { enabled: false } } }
  sim-bridge.json5: |
    {
      plugins: { ros2dds: { allow: { publishers: [".*"], subscribers: [] } } },
      mode: "client",
      connect: { endpoints: ["tcp/127.0.0.1:17447"], exit_on_failure: false },
      scouting: { multicast: { enabled: false } }
    }
  receiver-bridge.json5: |
    {
      plugins: { ros2dds: { allow: { publishers: [], subscribers: [".*/camera/color/image_compressed", ".*/camera/depth/image_compressed", ".*/camera/color/camera_info", ".*/tf", ".*/tf_static"] } } },
      mode: "client",
      connect: { endpoints: ["tcp/127.0.0.1:17447"], exit_on_failure: false },
      scouting: { multicast: { enabled: false } }
    }
---
apiVersion: v1
kind: Pod
metadata:
  name: semantic-phase2-pairer-diagnostic
  namespace: semantic-navigation
  labels:
    app: semantic-phase2-pairer-diagnostic
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 10
  # Safety pin: keep this high-CPU simulator off the canonical demo worker.
  # Recheck node capacity before reuse; on 2026-10-15 this worker lacked
  # schedulable CPU requests, so the diagnostic pod remained pending.
  nodeSelector:
    kubernetes.io/hostname: ip-10-0-15-146.ec2.internal
  containers:
    - name: local-zenoh-router
      image: eclipse/zenoh:1.5.0
      args: ["-c", "/diag-config/router.json5"]
      volumeMounts:
        - { name: config, mountPath: /diag-config, readOnly: true }
      resources:
        requests: { cpu: 100m, memory: 128Mi }
        limits: { cpu: 500m, memory: 512Mi }
    - name: simulator
      image: image-registry.openshift-image-registry.svc:5000/semantic-navigation/semantic-hotel-sim:phase2-pairer-diag
      imagePullPolicy: Always
      command: ["/bin/bash", "/entrypoint-semantic-navigation-phase1.sh"]
      env:
        - { name: ROS_DISTRO, value: jazzy }
        - { name: ROS_DOMAIN_ID, value: "79" }
        - { name: RMW_IMPLEMENTATION, value: rmw_cyclonedds_cpp }
        - { name: CYCLONEDDS_URI, value: file:///diag-config/cyclonedds.xml }
        - { name: GZ_PARTITION, value: semantic_phase2_pairer_diagnostic }
        - { name: GZ_IP, value: 127.0.0.1 }
        - { name: RESOLUTION, value: 1600x900x24 }
        - { name: SEMANTIC_PHASE2_SCENE, value: "1" }
      volumeMounts:
        - { name: config, mountPath: /diag-config, readOnly: true }
      resources:
        requests: { cpu: "1", memory: 3Gi }
        limits: { cpu: "12", memory: 8Gi }
    - name: camera-compressor
      image: image-registry.openshift-image-registry.svc:5000/semantic-navigation/semantic-hotel-sim:phase2-pairer-diag
      imagePullPolicy: Always
      command: ["/bin/bash", "-lc"]
      args:
        - >-
          export HOME=/tmp/ros-home ROS_LOG_DIR=/tmp/ros-home/.ros/log;
          mkdir -p "$ROS_LOG_DIR";
          source /opt/ros/jazzy/setup.bash;
          source /opt/rmf_demos_ws/install/setup.bash;
          for attempt in {1..90}; do
            color_info=$(ros2 topic info /robot_1/camera/color/image_raw 2>/dev/null || true);
            depth_info=$(ros2 topic info /robot_1/camera/depth/image_raw 2>/dev/null || true);
            if printf '%s' "$color_info" | grep -q 'Publisher count: 1' && printf '%s' "$depth_info" | grep -q 'Publisher count: 1'; then break; fi;
            sleep 1;
          done;
          exec python3 /opt/semantic-navigation/camera_compressor.py
      env:
        - { name: ROS_DISTRO, value: jazzy }
        - { name: ROS_DOMAIN_ID, value: "79" }
        - { name: RMW_IMPLEMENTATION, value: rmw_cyclonedds_cpp }
        - { name: CYCLONEDDS_URI, value: file:///diag-config/cyclonedds.xml }
      volumeMounts:
        - { name: config, mountPath: /diag-config, readOnly: true }
      resources:
        requests: { cpu: 250m, memory: 512Mi }
        limits: { cpu: "2", memory: 2Gi }
    - name: sim-zenoh-bridge
      image: eclipse/zenoh-bridge-ros2dds:1.5.0
      args: ["-c", "/diag-config/sim-bridge.json5"]
      env:
        - { name: ROS_DOMAIN_ID, value: "79" }
        - { name: ROS_DISTRO, value: jazzy }
        - { name: RMW_IMPLEMENTATION, value: rmw_cyclonedds_cpp }
        - { name: CYCLONEDDS_URI, value: file:///diag-config/cyclonedds.xml }
      volumeMounts:
        - { name: config, mountPath: /diag-config, readOnly: true }
      resources:
        requests: { cpu: 100m, memory: 128Mi }
        limits: { cpu: "1", memory: 1Gi }
    - name: receiver-zenoh-bridge
      image: eclipse/zenoh-bridge-ros2dds:1.5.0
      command: ["/bin/sh", "-c"]
      args: ["sleep 15; exec /zenoh-bridge-ros2dds -c /diag-config/receiver-bridge.json5"]
      env:
        - { name: ROS_DOMAIN_ID, value: "80" }
        - { name: ROS_DISTRO, value: jazzy }
        - { name: RMW_IMPLEMENTATION, value: rmw_cyclonedds_cpp }
        - { name: CYCLONEDDS_URI, value: file:///diag-config/cyclonedds.xml }
      volumeMounts:
        - { name: config, mountPath: /diag-config, readOnly: true }
      resources:
        requests: { cpu: 100m, memory: 128Mi }
        limits: { cpu: "1", memory: 1Gi }
    - name: receiver-probe
      image: image-registry.openshift-image-registry.svc:5000/semantic-navigation/semantic-hotel-sim:phase2-pairer-diag
      imagePullPolicy: Always
      command: ["/bin/bash", "-lc"]
      args: ["export HOME=/tmp/ros-home ROS_LOG_DIR=/tmp/ros-home/.ros/log; mkdir -p \"$ROS_LOG_DIR\"; source /opt/ros/jazzy/setup.bash; exec python3 /opt/semantic-navigation/camera_stream_probe.py --duration 600"]
      env:
        - { name: ROS_DISTRO, value: jazzy }
        - { name: ROS_DOMAIN_ID, value: "80" }
        - { name: RMW_IMPLEMENTATION, value: rmw_cyclonedds_cpp }
        - { name: CYCLONEDDS_URI, value: file:///diag-config/cyclonedds.xml }
      volumeMounts:
        - { name: config, mountPath: /diag-config, readOnly: true }
      resources:
        requests: { cpu: 100m, memory: 512Mi }
        limits: { cpu: "1", memory: 2Gi }
  volumes:
    - name: config
      configMap:
        name: semantic-phase2-pairer-diagnostic-config
