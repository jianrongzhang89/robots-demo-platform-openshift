apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: semantic-hotel-sim
  namespace: semantic-navigation
spec:
  lookupPolicy:
    local: true
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: semantic-hotel-sim-phase1
  namespace: semantic-navigation
spec:
  runPolicy: Serial
  source:
    binary: {}
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Containerfile.semantic-navigation-phase1
  output:
    to:
      kind: ImageStreamTag
      name: semantic-hotel-sim:phase1
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 3Gi
