apiVersion: v1
kind: ConfigMap
metadata:
  name: semantic-phase4-inference-config
  namespace: semantic-navigation
data:
  cyclonedds-consumer.xml: "<?xml version=\"1.0\" encoding=\"UTF-8\" ?>\n<CycloneDDS\
    \ xmlns=\"https://cdds.io/config\">\n  <Domain id=\"any\">\n    <General><Interfaces><NetworkInterface\
    \ name=\"lo\" /></Interfaces><AllowMulticast>false</AllowMulticast></General>\n\
    \    <Discovery><ParticipantIndex>auto</ParticipantIndex></Discovery>\n    <Internal><NackDelay>1\
    \ ms</NackDelay></Internal>\n  </Domain>\n</CycloneDDS>\n"
  cyclonedds.xml: "<?xml version=\"1.0\" encoding=\"UTF-8\" ?>\n<CycloneDDS xmlns=\"\
    https://cdds.io/config\">\n  <Domain id=\"any\">\n    <General><Interfaces><NetworkInterface\
    \ name=\"lo\" /></Interfaces><AllowMulticast>false</AllowMulticast></General>\n\
    \    <Discovery><ParticipantIndex>auto</ParticipantIndex></Discovery>\n  </Domain>\n\
    </CycloneDDS>\n"
  router.json5: '{ mode: "router", listen: { endpoints: ["tcp/0.0.0.0:17448"] }, scouting:
    { multicast: { enabled: false } } }

    '
  sim-bridge.json5: "{\n  plugins: { ros2dds: { allow: { publishers: [\".*/camera/color/image_compressed\"\
    , \".*/camera/depth/image_compressed\", \".*/camera/color/camera_info\", \".*/tf\"\
    , \".*/tf_static\", \".*/camera/capture_trace\", \".*/camera/compression_trace\"\
    , \".*clock\"], subscribers: [] } } },\n  mode: \"client\",\n  connect: { endpoints:\
    \ [\"tcp/semantic-phase4-router:17448\"], exit_on_failure: false },\n  scouting:\
    \ { multicast: { enabled: false } }\n}\n"
  inference-bridge.json5: "{\n  plugins: { ros2dds: { allow: { publishers: [], subscribers:\
    \ [\".*/camera/color/image_compressed\", \".*/camera/depth/image_compressed\"\
    , \".*/camera/color/camera_info\", \".*/tf\", \".*/tf_static\", \".*/camera/capture_trace\"\
    , \".*/camera/compression_trace\", \".*clock\"] } } },\n  mode: \"client\",\n\
    \  connect: { endpoints: [\"tcp/semantic-phase4-router:17448\"], exit_on_failure:\
    \ false },\n  scouting: { multicast: { enabled: false } }\n}\n"
---
apiVersion: v1
kind: Service
metadata:
  name: semantic-phase4-router
  namespace: semantic-navigation
spec:
  selector:
    app: semantic-phase4-router
  ports:
  - name: zenoh
    port: 17448
    targetPort: 17448
---
apiVersion: v1
kind: Pod
metadata:
  name: semantic-phase4-router
  namespace: semantic-navigation
  labels:
    app: semantic-phase4-router
spec:
  restartPolicy: Always
  containers:
  - name: router
    image: eclipse/zenoh:1.5.0
    args:
    - -c
    - /phase4-config/router.json5
    volumeMounts:
    - name: config
      mountPath: /phase4-config
      readOnly: true
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  volumes:
  - name: config
    configMap:
      name: semantic-phase4-inference-config
---
apiVersion: v1
kind: Pod
metadata:
  name: semantic-phase4-simulator
  namespace: semantic-navigation
  labels:
    app: semantic-phase4-simulator
spec:
  restartPolicy: Always
  nodeSelector:
    kubernetes.io/hostname: ip-10-0-38-113.ec2.internal
  tolerations:
  - key: cpu-taint
    operator: Equal
    value: 'true'
    effect: NoSchedule
  containers:
  - name: simulator
    image: image-registry.openshift-image-registry.svc:5000/semantic-navigation/semantic-hotel-sim@sha256:d417c9f252d1f89dd859290a4bca1f634bcfd7d3cde6d1702c409d432bd48894
    imagePullPolicy: Always
    command:
    - /bin/bash
    - /entrypoint-semantic-navigation-phase1.sh
    env:
    - name: ROS_DISTRO
      value: jazzy
    - name: ROS_DOMAIN_ID
      value: '81'
    - name: RMW_IMPLEMENTATION
      value: rmw_cyclonedds_cpp
    - name: CYCLONEDDS_URI
      value: file:///phase4-config/cyclonedds.xml
    - name: GZ_PARTITION
      value: semantic_phase4_inference
    - name: GZ_IP
      value: 127.0.0.1
    - name: RESOLUTION
      value: 1600x900x24
    - name: SEMANTIC_PHASE2_SCENE
      value: '1'
    - name: SEMANTIC_CAPTURE_TRACE
      value: '1'
    volumeMounts:
    - name: config
      mountPath: /phase4-config
      readOnly: true
    resources:
      requests:
        cpu: '1'
        memory: 3Gi
      limits:
        cpu: '12'
        memory: 8Gi
  - name: camera-compressor
    image: image-registry.openshift-image-registry.svc:5000/semantic-navigation/semantic-hotel-sim@sha256:c3ba94bbcbbe2283f1c46ea0f2baba398da313ffe83d2b59a63272ef91d95ebf
    imagePullPolicy: Always
    command:
    - /bin/bash
    - -lc
    args:
    - "export HOME=/tmp/ros-home ROS_LOG_DIR=/tmp/ros-home/.ros/log; mkdir -p \"$ROS_LOG_DIR\"\
      ; source /opt/ros/jazzy/setup.bash; source /opt/rmf_demos_ws/install/setup.bash;\
      \ for attempt in {1..90}; do\n  color_info=$(ros2 topic info /robot_1/camera/color/image_raw\
      \ 2>/dev/null || true);\n  depth_info=$(ros2 topic info /robot_1/camera/depth/image_raw\
      \ 2>/dev/null || true);\n  if printf '%s' \"$color_info\" | grep -q 'Publisher\
      \ count: 1' && printf '%s' \"$depth_info\" | grep -q 'Publisher count: 1'; then\
      \ break; fi;\n  sleep 1;\ndone; exec python3 /opt/semantic-navigation/camera_compressor.py"
    env:
    - name: ROS_DISTRO
      value: jazzy
    - name: ROS_DOMAIN_ID
      value: '81'
    - name: RMW_IMPLEMENTATION
      value: rmw_cyclonedds_cpp
    - name: CYCLONEDDS_URI
      value: file:///phase4-config/cyclonedds.xml
    - name: SEMANTIC_CAMERA_SUBSCRIPTION_DEPTH
      value: '20'
    - name: SEMANTIC_COMPRESSION_TRACE
      value: '1'
    - name: SEMANTIC_RAW_INPUT
      value: gz
    - name: PHASE3_CAMERA_FAULT_FILE
      value: /tmp/phase3-camera-fault.json
    - name: GZ_PARTITION
      value: semantic_phase4_inference
    - name: GZ_IP
      value: 127.0.0.1
    volumeMounts:
    - name: config
      mountPath: /phase4-config
      readOnly: true
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: '2'
        memory: 2Gi
  - name: sim-zenoh-bridge
    image: eclipse/zenoh-bridge-ros2dds:1.5.0
    args:
    - -c
    - /phase4-config/sim-bridge.json5
    env:
    - name: ROS_DOMAIN_ID
      value: '81'
    - name: ROS_DISTRO
      value: jazzy
    - name: RMW_IMPLEMENTATION
      value: rmw_cyclonedds_cpp
    - name: CYCLONEDDS_URI
      value: file:///phase4-config/cyclonedds.xml
    volumeMounts:
    - name: config
      mountPath: /phase4-config
      readOnly: true
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: '1'
        memory: 1Gi
  volumes:
  - name: config
    configMap:
      name: semantic-phase4-inference-config
---
apiVersion: v1
kind: Pod
metadata:
  name: semantic-phase4-inference
  namespace: semantic-navigation
  labels:
    app: semantic-phase4-inference
spec:
  restartPolicy: Always
  securityContext:
    fsGroup: 1001340000
    fsGroupChangePolicy: OnRootMismatch
  nodeSelector:
    kubernetes.io/hostname: ip-10-0-18-251.ec2.internal
  tolerations:
  - key: g6e-gpu
    operator: Equal
    value: 'true'
    effect: NoSchedule
  containers:
  - name: inference-zenoh-bridge
    image: eclipse/zenoh-bridge-ros2dds:1.5.0
    args:
    - -c
    - /phase4-config/inference-bridge.json5
    env:
    - name: ROS_DOMAIN_ID
      value: '82'
    - name: ROS_DISTRO
      value: jazzy
    - name: HOME
      value: /tmp/sam3-home
    - name: ROS_LOG_DIR
      value: /tmp/ros-log
    - name: RMW_IMPLEMENTATION
      value: rmw_cyclonedds_cpp
    - name: CYCLONEDDS_URI
      value: file:///phase4-config/cyclonedds.xml
    volumeMounts:
    - name: config
      mountPath: /phase4-config
      readOnly: true
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  - name: sam3-inference
    image: image-registry.openshift-image-registry.svc:5000/semantic-navigation/sam3-runtime@sha256:478ec01a7a47fbb0c862fbbef495c71b4a512ff59ed8d6ed5b7234422cc35686
    imagePullPolicy: Always
    env:
    - name: ROS_DOMAIN_ID
      value: '82'
    - name: ROS_DISTRO
      value: jazzy
    - name: HOME
      value: /tmp/sam3-home
    - name: ROS_LOG_DIR
      value: /tmp/ros-log
    - name: RMW_IMPLEMENTATION
      value: rmw_cyclonedds_cpp
    - name: CYCLONEDDS_URI
      value: file:///phase4-config/cyclonedds.xml
    - name: SAM3_PROMPT
      value: red mat
    - name: SEMANTIC_REQUIRE_CAPTURE_TRACE
      value: '1'
    - name: SEMANTIC_MAX_WORK_WAIT_MS
      value: '40'
    - name: SEMANTIC_CLOCK_UNCERTAINTY_MS
      value: '2'
    - name: PHASE3_DIAGNOSTIC_FAULT_FILE
      value: /tmp/phase3-inference-fault.json
    volumeMounts:
    - name: config
      mountPath: /phase4-config
      readOnly: true
    - name: model
      mountPath: /models
      readOnly: true
    resources:
      requests:
        cpu: '3'
        memory: 12Gi
        nvidia.com/gpu: '1'
      limits:
        cpu: '6'
        memory: 24Gi
        nvidia.com/gpu: '1'
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
  - name: costmap-observer
    image: image-registry.openshift-image-registry.svc:5000/semantic-navigation/semantic-costmap@sha256:447c6ee36d2eff0707a69133881c4131e0033dab5c38099750844173d416c92f
    command:
    - /bin/bash
    - -lc
    args:
    - source /opt/semantic-costmap-ws/install/setup.bash; exec ros2 run demo_semantic_costmap
      phase4_observer --ros-args -p use_sim_time:=true -r /tf:=/robot_1/tf -r /tf_static:=/robot_1/tf_static
    env:
    - name: ROS_DOMAIN_ID
      value: '82'
    - name: ROS_LOG_DIR
      value: /tmp/phase4-ros-logs
    - name: RMW_IMPLEMENTATION
      value: rmw_cyclonedds_cpp
    - name: CYCLONEDDS_URI
      value: file:///phase4-config/cyclonedds-consumer.xml
    volumeMounts:
    - name: config
      mountPath: /phase4-config
      readOnly: true
    resources:
      requests:
        cpu: '1'
        memory: 1Gi
      limits:
        cpu: '3'
        memory: 3Gi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
  volumes:
  - name: config
    configMap:
      name: semantic-phase4-inference-config
  - name: model
    persistentVolumeClaim:
      claimName: sam3-checkpoint
