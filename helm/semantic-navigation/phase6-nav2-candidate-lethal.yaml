# GENERATED Phase 6 semantic-on candidate; differs from the Phase 5
# candidate ONLY by the additive semantic_layer in the GLOBAL costmap
# (user-approved October 28, 2026: the local map's semantic subscription
# loaded ~26 MB/s of observation clouds into the controller's own process,
# whose reader lag then tripped the layer's 500 ms isCurrent window and
# blocked the controller's cycle past the 100 ms command authority — see
# pilot-1 pair-1-on-tfdiag/-qosfix. The paired route contrast comes from
# the global planner avoiding the mat; the local costmap keeps the exact
# Phase 5 geometry-only configuration). The off arm uses
# helm/semantic-navigation/phase5-nav2-candidate.yaml.
# LETHAL-COST EXCLUSION EXPERIMENT (implementation plan: 'Evaluate
# lethal cost 254 as a separate exclusion experiment. A model-only
# restriction is not a production safety boundary.') — target cost 254
# instead of the qualified soft cost 200. Experiment only.
amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.1
    alpha2: 0.1
    alpha3: 0.1
    alpha4: 0.1
    alpha5: 0.1
    base_frame_id: base_footprint
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: scan_fixed
    set_initial_pose: false
    first_map_only: false
    tf_broadcast: true
    transform_tolerance: 0.2
    min_particles: 2000
    max_particles: 8000
    laser_model_type: likelihood_field
    laser_min_range: 0.12
    laser_max_range: 12.0
    max_beams: 60
    update_min_d: 0.05
    update_min_a: 0.1
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: odom
    bt_loop_duration: 10
    default_server_timeout: 5000
    wait_for_service_timeout: 1000
    navigators:
    - navigate_to_pose
    - navigate_through_poses
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
    default_cancel_timeout: 2000
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 40.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins:
    - progress_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.05
      movement_time_allowance: 90.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 0.35
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.15
      lookahead_dist: 0.5
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.9
      transform_tolerance: 0.2
      use_collision_detection: true
      allow_reversing: false
      rotate_to_heading_angular_vel: 0.5
      max_angular_accel: 1.0
      stateful: false
      use_rotate_to_heading: false
    enable_stamped_cmd_vel: true
planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.25
      use_astar: true
      allow_unknown: false
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      plugins:
      - voxel_layer
      - inflation_layer
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /robot_1/scan_fixed
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_max_range: 3.5
          raytrace_max_range: 3.5
          expected_update_rate: 0.5
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.45
        cost_scaling_factor: 3.0
        enabled: true
      footprint: '[[-0.172, -0.155], [0.108, -0.155], [0.108, 0.155], [-0.172, 0.155]]'
      footprint_padding: 0.01
      update_frequency: 10.0
      publish_frequency: 5.0
      transform_tolerance: 0.2
      always_send_full_costmap: true
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      track_unknown_space: true
      plugins:
      - static_layer
      - obstacle_layer
      - semantic_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /robot_1/scan_fixed
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_max_range: 3.5
          raytrace_max_range: 3.5
          expected_update_rate: 0.5
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        inflation_radius: 0.45
        cost_scaling_factor: 3.0
      footprint: '[[-0.172, -0.155], [0.108, -0.155], [0.108, 0.155], [-0.172, 0.155]]'
      footprint_padding: 0.01
      update_frequency: 10.0
      publish_frequency: 5.0
      transform_tolerance: 0.2
      always_send_full_costmap: true
      semantic_layer:
        plugin: demo_semantic_costmap::SemanticLayer
        enabled: true
        topic_prefix: /robot_1/semantic
        observation_lifetime: 1.0
        max_capture_age: 0.5
        target_cost: 254
        optical_frame: camera_color_optical_frame
behavior_server:
  ros__parameters:
    use_sim_time: true
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - wait
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait
    enable_stamped_cmd_vel: true
    cycle_frequency: 40.0
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    max_rotational_vel: 0.5
    min_rotational_vel: 0.1
    rotational_acc_lim: 1.0
smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins:
    - simple_smoother
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
waypoint_follower:
  ros__parameters:
    use_sim_time: true
    stop_on_failure: true
velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 100.0
    feedback: OPEN_LOOP
    max_velocity:
    - 0.15
    - 0.0
    - 0.5
    min_velocity:
    - -0.1
    - 0.0
    - -0.5
    max_accel:
    - 0.5
    - 0.0
    - 1.0
    max_decel:
    - -0.8
    - 0.0
    - -1.5
    odom_topic: odom
    velocity_timeout: 0.1
    enable_stamped_cmd_vel: true
    stamp_smoothed_velocity_with_smoothing_time: false
collision_monitor:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: phase5/collision_checked
    state_topic: collision_monitor_state
    transform_tolerance: 0.1
    source_timeout: 0.5
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons:
    - StopEnvelope
    - FootprintApproach
    FootprintApproach:
      type: polygon
      action_type: approach
      footprint_topic: local_costmap/published_footprint
      time_before_collision: 1.0
      simulation_time_step: 0.02
      min_points: 1
      visualize: false
      enabled: true
    observation_sources:
    - scan
    scan:
      type: scan
      topic: scan_fixed
      min_height: 0.15
      max_height: 2.0
      enabled: true
    use_sim_time: true
    enable_stamped_cmd_vel: true
    StopEnvelope:
      type: polygon
      action_type: stop
      points: '[[-0.332, -0.315], [0.268, -0.315], [0.268, 0.315], [-0.332, 0.315]]'
      min_points: 1
      visualize: true
      polygon_pub_topic: phase5/stop_polygon
      enabled: true
