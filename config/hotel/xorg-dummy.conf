Section "Device"
    Identifier  "Dummy"
    Driver      "dummy"
    VideoRam    262144
EndSection
Section "Monitor"
    Identifier  "Monitor0"
    HorizSync   15.0-100.0
    VertRefresh 15.0-200.0
EndSection
Section "Screen"
    Identifier  "Screen0"
    Device      "Dummy"
    Monitor     "Monitor0"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1600x900" "1280x720"
    EndSubSection
EndSection
Section "ServerFlags"
    Option "DontVTSwitch" "true"
    Option "AllowMouseOpenFail" "true"
    Option "PciForceNone" "true"
    Option "AutoEnableDevices" "false"
    Option "AutoAddDevices" "false"
EndSection
