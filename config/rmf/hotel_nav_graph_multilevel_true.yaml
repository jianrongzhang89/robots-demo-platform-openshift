# RMF Navigation Graph - True Multi-Level Structure (2.5D)
# Three separate levels at elevation 0 (horizontal layout on single map)
# - L1 (Lobby):  X=[5, 45],   Y=[10, 50]
# - L2 (Rooms):  X=[65, 105], Y=[10, 50]
# - L3 (Suites): X=[125, 165], Y=[10, 50]
#
# IMPORTANT: Using true multi-level structure with dictionary lift_lanes.
# Each level has its own vertex list (local indices 0-N).
# lift_lanes use dictionary format: {from: [level, idx], to: [level, idx]}

building_name: hotel

doors: {}
lifts: {}

levels:
  # ========== Level 1 - Lobby ==========
  L1:
    elevation: 0.0
    vertices:
      # Main lobby waypoints
      - [20.0, 30.0, {name: lobby_east, is_holding_point: true}]            # 0
      - [10.0, 30.0, {name: lobby_west, is_holding_point: true}]            # 1
      - [10.0, 15.0, {name: lobby_southwest, is_holding_point: true}]       # 2
      - [35.0, 15.0, {name: lobby_southeast, is_holding_point: true}]       # 3
      - [20.0, 25.0, {name: lobby_center, is_holding_point: true}]          # 4

      # Charger waypoints
      - [8.0, 35.0, {name: charger_1, is_charger: true, is_parking_spot: true}]  # 5
      - [8.0, 32.0, {name: charger_2, is_charger: true, is_parking_spot: true}]  # 6

      # Lift approach and cabin waypoints
      - [48.0, 27.5, {name: lift1_approach_L1, is_holding_point: true}]     # 7
      - [52.5, 27.5, {name: lift1_cabin_L1, lift_cabin: Lift1, is_holding_point: true}]  # 8

    lanes:
      # Lobby internal navigation
      - [0, 4, {}]  # lobby_east <-> lobby_center
      - [4, 0, {}]
      - [1, 4, {}]  # lobby_west <-> lobby_center
      - [4, 1, {}]
      - [2, 4, {}]  # lobby_southwest <-> lobby_center
      - [4, 2, {}]
      - [3, 4, {}]  # lobby_southeast <-> lobby_center
      - [4, 3, {}]

      # Charger connections
      - [1, 5, {}]  # lobby_west <-> charger_1
      - [5, 1, {}]
      - [1, 6, {}]  # lobby_west <-> charger_2
      - [6, 1, {}]

      # Lift access
      - [4, 7, {}]  # lobby_center <-> lift_approach
      - [7, 4, {}]
      - [7, 8, {dock_name: lift1_L1_enter}]  # approach -> cabin
      - [8, 7, {dock_name: lift1_L1_exit}]   # cabin -> approach

  # ========== Level 2 - Rooms ==========
  L2:
    elevation: 0.0
    vertices:
      # L2 waypoints
      - [70.0, 30.0, {name: L2_room1, is_holding_point: true}]              # 0
      - [85.0, 30.0, {name: L2_room2, is_holding_point: true}]              # 1
      - [70.0, 20.0, {name: L2_room3, is_holding_point: true}]              # 2
      - [85.0, 20.0, {name: L2_room4, is_holding_point: true}]              # 3
      - [78.0, 25.0, {name: L2_center, is_holding_point: true}]             # 4

      # Lift 1 (from L1)
      - [62.0, 27.5, {name: lift1_approach_L2, is_holding_point: true}]     # 5
      - [57.5, 27.5, {name: lift1_cabin_L2, lift_cabin: Lift1, is_holding_point: true}]  # 6

      # Lift 2 (to L3)
      - [108.0, 27.5, {name: lift2_approach_L2, is_holding_point: true}]    # 7
      - [112.5, 27.5, {name: lift2_cabin_L2, lift_cabin: Lift2, is_holding_point: true}]  # 8

    lanes:
      # L2 internal navigation
      - [0, 4, {}]  # room1 <-> center
      - [4, 0, {}]
      - [1, 4, {}]  # room2 <-> center
      - [4, 1, {}]
      - [2, 4, {}]  # room3 <-> center
      - [4, 2, {}]
      - [3, 4, {}]  # room4 <-> center
      - [4, 3, {}]

      # Lift 1 access
      - [4, 5, {}]  # center <-> lift1_approach
      - [5, 4, {}]
      - [5, 6, {dock_name: lift1_L2_enter}]  # approach -> cabin
      - [6, 5, {dock_name: lift1_L2_exit}]   # cabin -> approach

      # Lift 2 access
      - [4, 7, {}]  # center <-> lift2_approach
      - [7, 4, {}]
      - [7, 8, {dock_name: lift2_L2_enter}]  # approach -> cabin
      - [8, 7, {dock_name: lift2_L2_exit}]   # cabin -> approach

  # ========== Level 3 - Suites ==========
  L3:
    elevation: 0.0
    vertices:
      # L3 waypoints
      - [130.0, 30.0, {name: L3_suite1, is_holding_point: true}]            # 0
      - [145.0, 30.0, {name: L3_suite2, is_holding_point: true}]            # 1
      - [130.0, 20.0, {name: L3_suite3, is_holding_point: true}]            # 2
      - [145.0, 20.0, {name: L3_suite4, is_holding_point: true}]            # 3
      - [138.0, 25.0, {name: L3_center, is_holding_point: true}]            # 4

      # Lift 2 (from L2)
      - [122.0, 27.5, {name: lift2_approach_L3, is_holding_point: true}]    # 5
      - [117.5, 27.5, {name: lift2_cabin_L3, lift_cabin: Lift2, is_holding_point: true}]  # 6

    lanes:
      # L3 internal navigation
      - [0, 4, {}]  # suite1 <-> center
      - [4, 0, {}]
      - [1, 4, {}]  # suite2 <-> center
      - [4, 1, {}]
      - [2, 4, {}]  # suite3 <-> center
      - [4, 2, {}]
      - [3, 4, {}]  # suite4 <-> center
      - [4, 3, {}]

      # Lift 2 access
      - [4, 5, {}]  # center <-> lift_approach
      - [5, 4, {}]
      - [5, 6, {dock_name: lift2_L3_enter}]  # approach -> cabin
      - [6, 5, {dock_name: lift2_L3_exit}]   # cabin -> approach

# Cross-level lift connections using DICTIONARY format
# Format: {from: [level_name, vertex_index], to: [level_name, vertex_index]}
lift_lanes:
  # Lift 1: Connects L1 cabin (index 8) and L2 cabin (index 6)
  - {from: [L1, 8], to: [L2, 6], orientation: forward, lift_name: Lift1}
  - {from: [L2, 6], to: [L1, 8], orientation: forward, lift_name: Lift1}

  # Lift 2: Connects L2 cabin (index 8) and L3 cabin (index 6)
  - {from: [L2, 8], to: [L3, 6], orientation: forward, lift_name: Lift2}
  - {from: [L3, 6], to: [L2, 8], orientation: forward, lift_name: Lift2}
