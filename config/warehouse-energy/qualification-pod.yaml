apiVersion: v1
kind: Pod
metadata:
  name: warehouse-qualification
  namespace: warehouse-energy
  labels:
    app: warehouse-energy-qualification
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 15
  containers:
    - name: runtime
      image: image-registry.openshift-image-registry.svc:5000/semantic-navigation/phase8-multilevel-fix@sha256:46042806035753067de14010aff4eb5d2c63e929f7c5a93e1c139311ee06c99e
      command: ["sleep", "infinity"]
      env:
        - {name: ROS_DOMAIN_ID, value: "84"}
        - {name: GZ_PARTITION, value: warehouse_energy_qualification}
        - {name: GZ_IP, value: "127.0.0.1"}
        - {name: RMW_IMPLEMENTATION, value: rmw_cyclonedds_cpp}
        - {name: ROS_LOG_DIR, value: /work/ros-log}
      resources:
        requests: {cpu: "2", memory: 4Gi}
        limits: {cpu: "4", memory: 8Gi}
      volumeMounts:
        - {name: work, mountPath: /work}
  volumes:
    - name: work
      emptyDir: {sizeLimit: 4Gi}
