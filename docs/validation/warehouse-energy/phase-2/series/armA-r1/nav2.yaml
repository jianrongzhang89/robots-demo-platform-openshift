map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: /work/stage2-series/armA-r1/map.yaml
planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.1
      use_astar: true
      allow_unknown: false
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    enable_stamped_cmd_vel: false
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins:
    - progress_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.04
      movement_time_allowance: 60.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.06
      yaw_goal_tolerance: 0.12
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.1
      min_approach_linear_velocity: 0.02
      regulated_linear_scaling_min_speed: 0.03
      lookahead_dist: 0.35
      min_lookahead_dist: 0.2
      max_lookahead_dist: 0.5
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.3
      rotate_to_heading_min_angle: 0.2
      max_angular_accel: 0.5
      allow_reversing: false
      use_collision_detection: true
      transform_tolerance: 0.5
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: odom
    bt_loop_duration: 10
    default_server_timeout: 20000
    default_nav_to_pose_bt_xml: /work/scripts/warehouse-energy/navigation.xml
    navigators:
    - navigate_to_pose
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      robot_radius: 0.246
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.5
      plugins:
      - static_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.35
        cost_scaling_factor: 5.0
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      robot_radius: 0.246
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.5
      plugins:
      - static_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.35
        cost_scaling_factor: 5.0
