          exec python3 -u - <<'PYEOF'
          import rclpy
          from rclpy.node import Node
          from rclpy.qos import QoSProfile, ReliabilityPolicy, HistoryPolicy, DurabilityPolicy
          from rosgraph_msgs.msg import Clock

          class ClockRelay(Node):
              def __init__(self):
                  super().__init__('clock_relay_node')
                  clock_qos = QoSProfile(depth=1, reliability=ReliabilityPolicy.RELIABLE,
                                         history=HistoryPolicy.KEEP_LAST, durability=DurabilityPolicy.VOLATILE)
                  self.sub = self.create_subscription(Clock, '/clock', self.clock_callback, clock_qos)
                  self.pub = self.create_publisher(Clock, '/clock_relay/clock_bridge', clock_qos)
                  self.count = 0
                  self.get_logger().info('Clock relay: /clock → /clock_relay/clock_bridge')

              def clock_callback(self, msg):
                  self.pub.publish(msg)
                  self.count += 1
                  if self.count % 100 == 0:
                      sec = msg.clock.sec
                      self.get_logger().info(f'Relayed {self.count} messages (sim time: {sec}s)')

          def main():
              rclpy.init()
              node = ClockRelay()
              try:
                  rclpy.spin(node)
              except KeyboardInterrupt:
                  pass
              finally:
                  node.destroy_node()
                  rclpy.shutdown()

          if __name__ == '__main__':
              main()
          PYEOF
