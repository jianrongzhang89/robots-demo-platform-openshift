    support_geometry.py: |
      """Opt-in rear ball supports for the private simplified robot, not canonical assets.

      Like upstream Waffle, use two freely rotating ball-joint casters. Locations are
      adapted to this demo's smaller box hull; all existing collisions/inertias remain.
      URDF represents spherical centres as fixed transforms (orientation is immaterial
      to a sphere); dynamics are defined only by the Gazebo SDF ball joints.
      """
      import xml.etree.ElementTree as ET


      CASTERS = (("rear_left_caster", -.14, .064), ("rear_right_caster", -.14, -.064))


      def add_rear_casters(world_text, urdf_text):
          world,urdf=ET.fromstring(world_text),ET.fromstring(urdf_text)
          robot=world.find(".//model[@name='robot_1']")
          if robot is None or len(robot.findall("link/collision"))!=4:
              raise ValueError("expected original four-collision robot")
          base=robot.find("link[@name='base_link']/collision[@name='base_collision']")
          if (base is None or [float(x) for x in base.findtext("pose", "").split()]!=[-.032,0,.07,0,0,0]
                  or [float(x) for x in base.findtext("geometry/box/size", "").split()]!=[.28,.31,.14]):
              raise ValueError("unqualified chassis geometry")
          for side in ("left","right"):
              wheel=robot.find(f"link[@name='wheel_{side}_link']")
              y=.144 if side=="left" else -.144
              if (wheel is None or [float(x) for x in wheel.findtext("pose", "").split()]!=[0,y,.023,-1.57,0,0]
                      or float(wheel.findtext("collision/geometry/cylinder/radius", "nan"))!=.033):
                  raise ValueError("unqualified wheel geometry")
          for name,x,y in CASTERS:
              if robot.find(f"link[@name='{name}']") is not None or urdf.find(f"link[@name='{name}']") is not None:
                  raise ValueError("refusing duplicate caster")
              robot.append(ET.fromstring(f'''<link name="{name}"><pose>{x} {y} -0.005 0 0 0</pose>
                <inertial><mass>0.001</mass><inertia><ixx>1e-8</ixx><iyy>1e-8</iyy><izz>1e-8</izz></inertia></inertial>
                <collision name="support"><geometry><sphere><radius>0.005</radius></sphere></geometry>
                  <surface><friction><ode><mu>1</mu><mu2>1</mu2></ode>
                    <bullet><friction>1</friction><friction2>1</friction2></bullet></friction></surface></collision>
                <visual name="support"><geometry><sphere><radius>0.005</radius></sphere></geometry></visual></link>'''))
              robot.append(ET.fromstring(f'''<joint name="{name}_joint" type="ball">
                <parent>base_link</parent><child>{name}</child></joint>'''))
              urdf.append(ET.fromstring(f'''<link name="{name}">
                <collision><geometry><sphere radius="0.005"/></geometry></collision>
                <visual><geometry><sphere radius="0.005"/></geometry></visual></link>'''))
              urdf.append(ET.fromstring(f'''<joint name="{name}_centre" type="fixed">
                <parent link="base_link"/><child link="{name}"/><origin xyz="{x} {y} -0.005" rpy="0 0 0"/></joint>'''))
          return ET.tostring(world,encoding="unicode"),ET.tostring(urdf,encoding="unicode")
  kind: ConfigMap
  metadata:
    annotations:
      kubectl.kubernetes.io/last-applied-configuration: |
        {"apiVersion":"v1","data":{"cyclonedds.xml":"\u003c?xml version=\"1.0\" encoding=\"UTF-8\" ?\u003e\n\u003cCycloneDDS xmlns=\"https://cdds.io/config\"\u003e\n  \u003cDomain id=\"any\"\u003e\n    \u003cGeneral\u003e\u003cInterfaces\u003e\u003cNetworkInterface name=\"lo\" /\u003e\u003c/Interfaces\u003e\u003cAllowMulticast\u003efalse\u003c/AllowMulticast\u003e\u003c/General\u003e\n    \u003cDiscovery\u003e\u003cParticipantIndex\u003eauto\u003c/ParticipantIndex\u003e\u003c/Discovery\u003e\n  \u003c/Domain\u003e\n\u003c/CycloneDDS\u003e","demo_ground_truth.py":"#!/usr/bin/env python3\n\"\"\"Publish independent Gazebo model-pose telemetry for the private D2 demo.\n\nThis is an observation path, never a velocity publisher or a TF authority.\nWheel-integrated odometry is deliberately not used to construct this pose.\n\"\"\"\nimport math\n\nimport rclpy\nfrom gz.msgs10.pose_v_pb2 import Pose_V\nfrom gz.transport13 import Node as GazeboNode\nfrom nav_msgs.msg import Odometry\n\n\ndef planar_velocity(previous, current):\n    \"\"\"Return body-frame vx/vy and yaw rate from consecutive truth samples.\"\"\"\n    dt = (current[0] - previous[0]) / 1e9\n    if dt \u003c= 0 or dt \u003e 0.5:\n        return None\n    vx = (current[1] - previous[1]) / dt\n    vy = (current[2] - previous[2]) / dt\n    yaw = current[3]\n    dyaw = math.atan2(math.sin(yaw - previous[3]), math.cos(yaw - previous[3]))\n    return (math.cos(yaw) * vx + math.sin(yaw) * vy,\n            -math.sin(yaw) * vx + math.cos(yaw) * vy, dyaw / dt)\n\n\nclass GroundTruth:\n    def __init__(self):\n        self.node = rclpy.create_node(\"phase6_demo_ground_truth\")\n        self.publisher = self.node.create_publisher(\n            Odometry, \"/robot_1/demo/ground_truth\", 10)\n        self.previous = None\n        self.gz = GazeboNode()\n        if not self.gz.subscribe(Pose_V, \"/world/sim_world/dynamic_pose/info\",\n                                 self.on_pose):\n            raise RuntimeError(\"could not subscribe to Gazebo model poses\")\n\n    def on_pose(self, message):\n        stamp = message.header.stamp\n        ns = stamp.sec * 1_000_000_000 + stamp.nsec\n        if self.previous is not None and ns \u003c self.previous[0]:\n            self.previous = None  # New simulator epoch, not a velocity impulse.\n        if self.previous is not None and ns - self.previous[0] \u003c 50_000_000:\n            return\n        pose = next((p for p in message.pose if p.name == \"robot_1\"), None)\n        if pose is None:\n            return  # No heartbeat without an actual model-pose observation.\n        q = pose.orientation\n        yaw = math.atan2(2 * (q.w * q.z + q.x * q.y),\n                         1 - 2 * (q.y * q.y + q.z * q.z))\n        current = (ns, pose.position.x, pose.position.y, yaw)\n        velocity = planar_velocity(self.previous, current) if self.previous else None\n        self.previous = current\n        if velocity is None:\n            return  # Need two fresh samples to assert a measured velocity.\n        result = Odometry()\n        result.header.frame_id = \"map\"\n        result.header.stamp.sec = stamp.sec\n        result.header.stamp.nanosec = stamp.nsec\n        result.child_frame_id = \"base_footprint\"\n        result.pose.pose.position.x = pose.position.x\n        result.pose.pose.position.y = pose.position.y\n        result.pose.pose.position.z = pose.position.z\n        result.pose.pose.orientation.x = q.x\n        result.pose.pose.orientation.y = q.y\n        result.pose.pose.orientation.z = q.z\n        result.pose.pose.orientation.w = q.w\n        result.twist.twist.linear.x, result.twist.twist.linear.y = velocity[:2]\n        result.twist.twist.angular.z = velocity[2]\n        self.publisher.publish(result)\n\n\ndef main():\n    rclpy.init()\n    telemetry = GroundTruth()\n    try:\n        rclpy.spin(telemetry.node)\n    finally:\n        telemetry.node.destroy_node()\n        rclpy.shutdown()\n\n\nif __name__ == \"__main__\":\n    main()\n","entrypoint-phase1.sh":"#!/usr/bin/env bash\nset -Eeo pipefail\n\nexport HOME=/tmp/ros-home\nmkdir -p \"${HOME}/.ros\" \"${HOME}/.config\" /tmp/semantic-navigation\nexport ROS_HOME=\"${HOME}/.ros\"\nexport ROS_LOG_DIR=\"${HOME}/.ros/log\"\nexport ROS_DOMAIN_ID=\"${ROS_DOMAIN_ID:-0}\"\nexport RMW_IMPLEMENTATION=rmw_cyclonedds_cpp\nexport GZ_IP=\"${GZ_IP:-127.0.0.1}\"\nexport GZ_PARTITION=\"${GZ_PARTITION:-hotel_nav2_rmf}\"\n\nsource /opt/ros/jazzy/setup.bash\nsource /opt/rmf_demos_ws/install/setup.bash\nif [[ \"${SEMANTIC_CAPTURE_TRACE:-0}\" == \"1\" ]]; then\n  export LD_LIBRARY_PATH=\"/opt/semantic-navigation/capture-lib:${LD_LIBRARY_PATH:-}\"\nfi\nset -u\n\nASSET_DIR=/opt/ros2-demo/hotel-assets\nWORLD=/tmp/semantic-navigation/hotel.world\ncp \"${ASSET_DIR}/hotel.world\" \"${WORLD}\"\nif [[ \"${SEMANTIC_PHASE2_SCENE:-0}\" == \"1\" ]]; then\n  python3 /opt/semantic-navigation/install_phase1_camera.py \"${WORLD}\" --phase2-targets\nelse\n  python3 /opt/semantic-navigation/install_phase1_camera.py \"${WORLD}\"\nfi\nexport GZ_SIM_RESOURCE_PATH=\"${ASSET_DIR}/models:${ASSET_DIR}:/opt/rmf_demos_ws/install/share/rmf_demos_assets/models:${GZ_SIM_RESOURCE_PATH:-}\"\nexport GZ_SIM_SYSTEM_PLUGIN_PATH=\"/opt/ros/jazzy/opt/gz_sim_vendor/lib/gz-sim-8/plugins:${GZ_SIM_SYSTEM_PLUGIN_PATH:-}\"\nexport QT_QPA_PLATFORM=xcb\nexport QT_X11_NO_MITSHM=1\nexport DISPLAY=\"${DISPLAY:-:99}\"\nVNC_PORT=\"${VNC_PORT:-5900}\"\nNOVNC_PORT=\"${NOVNC_PORT:-6080}\"\n\npids=()\ncleanup() {\n  trap - TERM INT EXIT\n  for pid in \"${pids[@]:-}\"; do kill \"${pid}\" 2\u003e/dev/null || true; done\n  wait || true\n}\ntrap cleanup TERM INT EXIT\n\nXorg \"${DISPLAY}\" -config /etc/X11/xorg-dummy.conf -nolisten tcp \\\n  -logfile /tmp/Xorg.semantic-navigation.log \u0026 pids+=(\"$!\")\nsleep 2\nopenbox \u003e/tmp/openbox.semantic-navigation.log 2\u003e\u00261 \u0026 pids+=(\"$!\")\nx11vnc -display \"${DISPLAY}\" -rfbport \"${VNC_PORT}\" -shared -forever -nopw -noxdamage -noscr \\\n  \u003e/tmp/x11vnc.semantic-navigation.log 2\u003e\u00261 \u0026 pids+=(\"$!\")\nwebsockify --web /usr/share/novnc \"${NOVNC_PORT}\" \"localhost:${VNC_PORT}\" \\\n  \u003e/tmp/novnc.semantic-navigation.log 2\u003e\u00261 \u0026 pids+=(\"$!\")\n\ngz sim --force-version 8 -r -s -v 2 \"${WORLD}\" \u003e/tmp/gz-server.semantic-navigation.log 2\u003e\u00261 \u0026\npids+=(\"$!\")\nsleep 3\ngz sim --force-version 8 -g -v 2 \"${WORLD}\" \u003e/tmp/gz-gui.semantic-navigation.log 2\u003e\u00261 \u0026\npids+=(\"$!\")\n# Match rmf-hotel-world-openshift-ai's smoothed overhead GUI follow mode.\n# The supervisor below handles recovery, but does not attach at startup.\n# Wait for both the service and tracking subscriber: publishing earlier races\n# the GUI scene. Bounded startup retries leave later manual pan/zoom alone.\ninitialize_camera_follow() {\n  for _attempt in $(seq 1 90); do\n    if timeout 3 gz service -i -s /gui/follow 2\u003e/dev/null |\n        grep -q 'gz.msgs.StringMsg, gz.msgs.Boolean' \u0026\u0026\n        timeout 4 gz service -s /gui/follow \\\n          --reqtype gz.msgs.StringMsg --reptype gz.msgs.Boolean \\\n          --timeout 3000 --req 'data: \"robot_1\"' 2\u003e/dev/null |\n        grep -q 'data: true' \u0026\u0026\n        timeout 4 gz service -s /gui/follow/offset \\\n          --reqtype gz.msgs.Vector3d --reptype gz.msgs.Boolean \\\n          --timeout 3000 --req 'x: 0 y: 0 z: 5' 2\u003e/dev/null |\n        grep -q 'data: true' \u0026\u0026\n        timeout 3 gz topic -i -t /gui/track 2\u003e/dev/null |\n        grep -q 'Subscribers'; then\n      for _publish in $(seq 1 3); do\n        timeout 2 gz topic -t /gui/track -m gz.msgs.CameraTrack \\\n          -p 'track_mode: FOLLOW_LOOK_AT follow_target: {name: \"robot_1\"} track_target: {name: \"robot_1\"} follow_offset: {x: 0 y: 0 z: 5} track_offset: {x: 0 y: 0 z: 0} follow_pgain: 0.02 track_pgain: 0.02' \\\n          \u003e/dev/null 2\u003e\u00261 || true\n        sleep 0.5\n      done\n      echo \"[semantic-navigation] Gazebo camera following robot_1 (overhead)\"\n      return 0\n    fi\n    sleep 1\n  done\n  echo \"[semantic-navigation] camera follow initialization timed out\" \u003e\u00262\n  return 1\n}\ninitialize_camera_follow \u003e/tmp/camera-follow-startup.semantic-navigation.log 2\u003e\u00261 \u0026\npids+=(\"$!\")\npython3 /opt/ros2-demo/scripts/camera_follow_supervisor.py \u003e/tmp/camera-follow.semantic-navigation.log 2\u003e\u00261 \u0026\npids+=(\"$!\")\nros2 run robot_state_publisher robot_state_publisher \\\n  --ros-args -p use_sim_time:=true \\\n  -p robot_description:=\"$(\u003c /opt/ros2-demo/robot/turtlebot3_waffle.urdf)\" \\\n  -r /tf:=/robot_1/tf -r /tf_static:=/robot_1/tf_static \\\n  \u003e/tmp/robot-state-publisher.semantic-navigation.log 2\u003e\u00261 \u0026\npids+=(\"$!\")\n\nros2 run ros_gz_bridge parameter_bridge \\\n  /clock@rosgraph_msgs/msg/Clock[gz.msgs.Clock \\\n  /robot_1/cmd_vel@geometry_msgs/msg/Twist]gz.msgs.Twist \\\n  /robot_1/odom@nav_msgs/msg/Odometry[gz.msgs.Odometry \\\n  /scan@sensor_msgs/msg/LaserScan[gz.msgs.LaserScan \\\n  --ros-args -r /scan:=/robot_1/scan \u003e/tmp/gz-bridge.semantic-navigation.log 2\u003e\u00261 \u0026\npids+=(\"$!\")\nros2 launch ros_gz_bridge ros_gz_bridge.launch.py \\\n  bridge_name:=semantic_camera_bridge \\\n  config_file:=/opt/ros2-demo/config/semantic-camera-bridge.yaml \\\n  \u003e/tmp/rgbd-bridge.semantic-navigation.log 2\u003e\u00261 \u0026\npids+=(\"$!\")\n\necho \"[semantic-navigation] isolated hotel simulator with RGB-D camera ready\"\nwait \"${pids[4]}\"\n","entrypoint_phase6_nav2.sh":"#!/usr/bin/env bash\nset -Ee -o pipefail\nexport HOME=\"${HOME:-/tmp/phase6-nav2-home}\"\nexport ROS_HOME=\"${ROS_HOME:-${HOME}/.ros}\"\nexport ROS_LOG_DIR=\"${ROS_LOG_DIR:-${ROS_HOME}/log}\"\nmkdir -p \"${ROS_LOG_DIR}\"\nsource /opt/ros/jazzy/setup.bash\nsource /opt/semantic-costmap-ws/install/setup.bash\nwait_for_topic() {\n  local topic=\"$1\"\n  for attempt in {1..30}; do\n    if timeout 3 ros2 topic echo \"$topic\" --once \u003e/dev/null 2\u003e\u00261; then\n      return 0\n    fi\n    sleep 1\n  done\n  echo \"required D2 input did not become live: $topic\" \u003e\u00262\n  return 1\n}\n# The simulator and its bridge start independently. Give the adapter sidecars\n# time to establish live inputs before Nav2's lifecycle manager activates its\n# costmaps (which require odom-\u003ebase TF immediately).\nwait_for_topic /clock\nwait_for_topic /odom\nwait_for_topic /scan_fixed\nwait_for_topic /tf\nsleep 2\n\nexec ros2 launch /opt/ros2-demo/nav2/hotel_nav2_federated_launch.py \\\n  map:=\"${PHASE6_MAP:-/opt/ros2-demo/maps/hotel_L1.yaml}\" \\\n  params_file:=\"${PHASE6_PARAMS:-/phase6-nav2-config/phase6-demo-nav2-candidate.yaml}\"","install_phase1_camera.py":"#!/usr/bin/env python3\n\"\"\"Add the isolated semantic-navigation RGB-D sensor to a hotel world.\"\"\"\n\nfrom __future__ import annotations\n\nimport argparse\nimport math\nimport os\nimport xml.etree.ElementTree as ET\nfrom pathlib import Path\n\n\ndef add_camera(world_path: Path, robot_name: str = \"robot_1\") -\u003e None:\n    tree = ET.parse(world_path)\n    model = tree.getroot().find(f\".//model[@name='{robot_name}']\")\n    if model is None:\n        raise ValueError(f\"robot model {robot_name!r} not found in {world_path}\")\n    if model.find(\"link[@name='camera_link']\") is not None:\n        raise ValueError(\"camera_link already exists; refusing to patch twice\")\n\n    link = ET.SubElement(model, \"link\", {\"name\": \"camera_link\"})\n    ET.SubElement(link, \"pose\", {\"relative_to\": \"base_link\"}).text = \"0.11 0 0.15 0 0 0\"\n    inertial = ET.SubElement(link, \"inertial\")\n    ET.SubElement(inertial, \"mass\").text = \"0.01\"\n    inertia = ET.SubElement(inertial, \"inertia\")\n    for name, value in ((\"ixx\", \"0.00001\"), (\"iyy\", \"0.00001\"), (\"izz\", \"0.00001\"),\n                        (\"ixy\", \"0\"), (\"ixz\", \"0\"), (\"iyz\", \"0\")):\n        ET.SubElement(inertia, name).text = value\n\n    sensor = ET.SubElement(link, \"sensor\", {\"name\": \"rgbd_camera\", \"type\": \"rgbd_camera\"})\n    ET.SubElement(sensor, \"always_on\").text = \"true\"\n    ET.SubElement(sensor, \"update_rate\").text = \"10\"\n    ET.SubElement(sensor, \"topic\").text = f\"/{robot_name}/camera\"\n    ET.SubElement(sensor, \"gz_frame_id\").text = \"camera_color_optical_frame\"\n    camera = ET.SubElement(sensor, \"camera\")\n    ET.SubElement(camera, \"horizontal_fov\").text = \"1.04719755\"\n    image = ET.SubElement(camera, \"image\")\n    ET.SubElement(image, \"width\").text = \"640\"\n    ET.SubElement(image, \"height\").text = \"480\"\n    ET.SubElement(image, \"format\").text = \"R8G8B8\"\n    clip = ET.SubElement(camera, \"clip\")\n    ET.SubElement(clip, \"near\").text = \"0.15\"\n    ET.SubElement(clip, \"far\").text = \"5.0\"\n    ET.SubElement(sensor, \"visualize\").text = \"false\"\n\n    joint = ET.SubElement(model, \"joint\", {\"name\": \"camera_joint\", \"type\": \"fixed\"})\n    ET.SubElement(joint, \"parent\").text = \"base_link\"\n    ET.SubElement(joint, \"child\").text = \"camera_link\"\n\n    tree.write(world_path, encoding=\"utf-8\", xml_declaration=True)\n\n\ndef add_bridge_to_entrypoint(entrypoint_path: Path, bridge_config: str) -\u003e None:\n    script = entrypoint_path.read_text()\n    marker = 'echo \"[hotel-sim] Canonical federated Gazebo simulation ready\"'\n    if \"semantic_camera_bridge\" in script:\n        raise ValueError(\"semantic camera bridge is already installed in entrypoint\")\n    if marker not in script:\n        raise ValueError(f\"expected startup marker not found in {entrypoint_path}\")\n    command = (\n        'echo \"[semantic-camera] Starting RGB-D Gazebo-to-ROS bridge\"\\n'\n        f'ros2 launch ros_gz_bridge ros_gz_bridge.launch.py '\n        f'bridge_name:=semantic_camera_bridge config_file:={bridge_config} \u0026\\n'\n        'pids+=(\"$!\")\\n\\n'\n    )\n    entrypoint_path.write_text(script.replace(marker, command + marker))\n\n\ndef add_phase2_targets(world_path: Path, *, phase6_demo: bool = False) -\u003e None:\n    \"\"\"Add a recognizable mat and a visual distractor to the isolated world.\n\n    ``phase6_demo`` is an explicit D2-only geometry variant: 1.2 m along\n    the route and 1.95 m across it (three times the previous 0.65 m width).\n    The Phase 2/fixture geometry remains unchanged for default callers.\n    \"\"\"\n    tree = ET.parse(world_path)\n    world = tree.getroot().find(\"world\")\n    if world is None:\n        raise ValueError(f\"world element not found in {world_path}\")\n    if world.find(\"model[@name='semantic_target_mat']\") is not None:\n        raise ValueError(\"Phase 2 target already exists; refusing to patch twice\")\n\n    def slab(name: str, x: float, y: float, sx: float, sy: float,\n             color: tuple[float, float, float]) -\u003e ET.Element:\n        model = ET.Element(\"model\", {\"name\": name})\n        ET.SubElement(model, \"static\").text = \"true\"\n        ET.SubElement(model, \"pose\").text = f\"{x} {y} 0.005 0 0 0\"\n        link = ET.SubElement(model, \"link\", {\"name\": \"surface\"})\n        visual = ET.SubElement(link, \"visual\", {\"name\": \"visual\"})\n        visual_geometry = ET.SubElement(visual, \"geometry\")\n        ET.SubElement(visual_geometry, \"box\")\n        ET.SubElement(visual_geometry.find(\"box\"), \"size\").text = f\"{sx} {sy} 0.012\"\n        material = ET.SubElement(visual, \"material\")\n        ET.SubElement(material, \"ambient\").text = f\"{color[0]} {color[1]} {color[2]} 1\"\n        ET.SubElement(material, \"diffuse\").text = f\"{color[0]} {color[1]} {color[2]} 1\"\n        return model\n\n    # The validated hotel runtime pose is (15.4014, -31.5940, yaw≈0).\n    # Place the target 2 m ahead; do not use the separate TB3 template pose.\n    # 2.7 m (2026-10-30 prepared value) left only 0.30 m of runway between\n    # the start and the hull-clearance envelope's west edge — the \u003e65 deg\n    # escape turn is kinematically infeasible for RPP and the robot cut the\n    # corner into the envelope in every motion trial (notouch-run3/4:\n    # canceled at 0.091 m hull clearance). 1.2 m keeps the direct route\n    # blocked while giving ~1.05 m of runway before the envelope's west edge.\n    mat_length_x = 1.2 if phase6_demo else 0.9\n    # Widen only the standalone demo mat; keep its center, X length,\n    # thickness, and the distractor unchanged.\n    mat_width_y = 1.95 if phase6_demo else 0.65\n    world.append(slab(\"semantic_target_mat\", 17.4014, -31.5940, mat_length_x, mat_width_y,\n                      (0.85, 0.08, 0.06)))\n    # Similar footprint, but a neutral tile-like distractor, offset laterally.\n    world.append(slab(\"semantic_distractor_tile\", 17.4014, -30.0940, 0.9, 0.65,\n                      (0.55, 0.52, 0.45)))\n    tree.write(world_path, encoding=\"utf-8\", xml_declaration=True)\n\n\ndef add_lighting_profile(world_path: Path, profile: str) -\u003e None:\n    \"\"\"Apply a repeatable world lighting profile before Gazebo starts.\"\"\"\n    if profile == \"baseline\":\n        return\n    if profile != \"dim\":\n        raise ValueError(f\"unsupported lighting profile {profile!r}\")\n    tree = ET.parse(world_path)\n    world = tree.getroot().find(\"world\")\n    if world is None:\n        raise ValueError(f\"world element not found in {world_path}\")\n    scene = world.find(\"scene\")\n    light = world.find(\"light[@name='sun']\")\n    if scene is None or light is None:\n        raise ValueError(\"world must contain a scene and the directional light named 'sun'\")\n    scene.find(\"ambient\").text = \"0.08 0.08 0.08\"\n    scene.find(\"background\").text = \"0.12 0.12 0.12\"\n    light.find(\"diffuse\").text = \"0.25 0.25 0.25 1\"\n    light.find(\"specular\").text = \"0.05 0.05 0.05 1\"\n    tree.write(world_path, encoding=\"utf-8\", xml_declaration=True)\n\n\nWARMUP_CAMERA_TEMPLATE = \"\"\"\u003cmodel name=\"phase5_warmup_camera_{index}\"\u003e\n  \u003cstatic\u003etrue\u003c/static\u003e\n  \u003cpose\u003e{x} {y} 0.15 0 0 {yaw}\u003c/pose\u003e\n  \u003clink name=\"link\"\u003e\n    \u003csensor name=\"rgbd_camera\" type=\"rgbd_camera\"\u003e\n      \u003calways_on\u003etrue\u003c/always_on\u003e\n      \u003cupdate_rate\u003e5\u003c/update_rate\u003e\n      \u003ctopic\u003e/phase5/warmup/{index}\u003c/topic\u003e\n      \u003cgz_frame_id\u003ephase5_warmup_{index}_optical\u003c/gz_frame_id\u003e\n      \u003ccamera\u003e\n        \u003chorizontal_fov\u003e1.8\u003c/horizontal_fov\u003e\n        \u003cimage\u003e\u003cwidth\u003e640\u003c/width\u003e\u003cheight\u003e480\u003c/height\u003e\u003cformat\u003eR8G8B8\u003c/format\u003e\u003c/image\u003e\n        \u003cclip\u003e\u003cnear\u003e0.15\u003c/near\u003e\u003cfar\u003e5.0\u003c/far\u003e\u003c/clip\u003e\n      \u003c/camera\u003e\n      \u003cvisualize\u003efalse\u003c/visualize\u003e\n    \u003c/sensor\u003e\n  \u003c/link\u003e\n\u003c/model\u003e\"\"\"\n\n\ndef add_phase6_render_warmup(world_path: Path, goal_xy) -\u003e None:\n    \"\"\"Stage the pre-arm render-warmup cameras around the Phase 6 goal.\n\n    User-approved October 28, 2026: the on-arm's goal-approach orbit sweeps\n    the robot camera through scene content not seen on the detour route,\n    and its FIRST render there costs ~190 ms of render-thread CPU (the root\n    of the remaining endgame failure), delaying the gpu_lidar scan ~450 ms\n    and the controller's TF wait ~76 ms past the 100 ms command authority.\n    Twelve static, collision-less rgbd cameras: four at the goal facing\n    N/E/S/W, and eight on the orbit circle (radius 1.3 m — the observed\n    RPP goal-approach orbit radius) facing OUTWARD, matching the robot\n    camera's actual viewpoints during the orbit (series-15 trial 000-on:\n    the goal-centered set alone missed content visible from the orbit\n    circle through parallax/occlusion — a fresh ~190 ms spike at sim 56.3).\n    Each covers 1.8 rad of azimuth; the union covers every direction the\n    orbit can expose within the main camera's 5 m far clip. The gz Sensors\n    system never renders sensors without subscribers, so they cost nothing\n    during the armed trial; the fixture subscribes each one briefly during\n    the DISARMED startup (a few frames, forcing the lazy scene content to\n    load), then unsubscribes and they deactivate again. Identical in BOTH\n    arms so the paired scene and load stay identical.\n    \"\"\"\n    text = world_path.read_text()\n    if \"phase5_warmup_camera_\" in text:\n        raise ValueError(\"warmup cameras already staged; refusing to patch twice\")\n    poses = []\n    # Four goal-centered cameras facing N/E/S/W.\n    for index in range(4):\n        poses.append((goal_xy[0], goal_xy[1], index * math.pi / 2))\n    # Eight cameras on the orbit circle facing outward, 45 deg apart.\n    radius = 1.3\n    for step in range(8):\n        angle = math.pi / 8 + step * math.pi / 4\n        poses.append((goal_xy[0] + radius * math.cos(angle),\n                      goal_xy[1] + radius * math.sin(angle),\n                      angle))\n    models = \"\".join(WARMUP_CAMERA_TEMPLATE.format(\n        index=index, x=x, y=y, yaw=yaw)\n        for index, (x, y, yaw) in enumerate(poses))\n    world_path.write_text(text.replace(\"\u003c/world\u003e\", models + \"\u003c/world\u003e\"))\n\n\ndef main() -\u003e None:\n    parser = argparse.ArgumentParser()\n    parser.add_argument(\"world\", type=Path)\n    parser.add_argument(\"--robot\", default=\"robot_1\")\n    parser.add_argument(\"--entrypoint\", type=Path)\n    parser.add_argument(\"--phase2-targets\", action=\"store_true\")\n    parser.add_argument(\"--bridge-config\", default=\"/opt/ros2-demo/config/semantic-camera-bridge.yaml\")\n    args = parser.parse_args()\n    add_camera(args.world, args.robot)\n    if args.phase2_targets:\n        phase6_demo = os.environ.get(\"SEMANTIC_PHASE6_DEMO_TARGETS\") == \"1\"\n        if phase6_demo:\n            # The un-supported simplified body pitches onto the floor; wheel\n            # odometry can report a turn while the Gazebo body stays still.\n            # Reuse the private fixture's supports ONLY in the opt-in D2 world.\n            # No canonical SDF/URDF or qualified fixture is modified here.\n            from support_geometry import add_rear_casters\n            supported, _ = add_rear_casters(args.world.read_text(), \"\u003crobot/\u003e\")\n            args.world.write_text(supported)\n        add_phase2_targets(args.world, phase6_demo=phase6_demo)\n    lighting_profile = os.environ.get(\"SEMANTIC_LIGHTING_PROFILE\", \"baseline\")\n    add_lighting_profile(args.world, lighting_profile)\n    if args.entrypoint:\n        add_bridge_to_entrypoint(args.entrypoint, args.bridge_config)\n    print(f\"Installed 640x480 RGB-D camera at 10 Hz on {args.robot}: {args.world}\")\n\n\nif __name__ == \"__main__\":\n    main()\n","phase6-demo-nav2-on.yaml":"amcl:\n  ros__parameters:\n    use_sim_time: true\n    alpha1: 0.2\n    alpha2: 0.2\n    alpha3: 0.2\n    alpha4: 0.2\n    alpha5: 0.2\n    base_frame_id: base_footprint\n    global_frame_id: map\n    odom_frame_id: odom\n    scan_topic: scan_fixed\n    set_initial_pose: false\n    first_map_only: false\n    tf_broadcast: false\n    transform_tolerance: 0.5\n    min_particles: 500\n    max_particles: 2000\n    laser_model_type: likelihood_field\n    laser_min_range: 0.12\n    laser_max_range: 12.0\n    max_beams: 60\n    update_min_d: 0.05\n    update_min_a: 0.1\nbt_navigator:\n  ros__parameters:\n    use_sim_time: true\n    global_frame: map\n    robot_base_frame: base_footprint\n    odom_topic: odom\n    bt_loop_duration: 10\n    default_server_timeout: 5000\n    wait_for_service_timeout: 1000\n    navigators:\n    - navigate_to_pose\n    - navigate_through_poses\n    navigate_to_pose:\n      plugin: nav2_bt_navigator::NavigateToPoseNavigator\n    navigate_through_poses:\n      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator\ncontroller_server:\n  ros__parameters:\n    use_sim_time: true\n    controller_frequency: 20.0\n    min_x_velocity_threshold: 0.001\n    min_y_velocity_threshold: 0.5\n    min_theta_velocity_threshold: 0.001\n    progress_checker_plugins:\n    - progress_checker\n    goal_checker_plugins:\n    - general_goal_checker\n    controller_plugins:\n    - FollowPath\n    progress_checker:\n      plugin: nav2_controller::SimpleProgressChecker\n      required_movement_radius: 0.05\n      movement_time_allowance: 90.0\n    general_goal_checker:\n      plugin: nav2_controller::SimpleGoalChecker\n      stateful: true\n      xy_goal_tolerance: 0.2\n      yaw_goal_tolerance: 0.35\n    FollowPath:\n      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController\n      desired_linear_vel: 0.12\n      lookahead_dist: 0.5\n      min_lookahead_dist: 0.25\n      max_lookahead_dist: 0.9\n      transform_tolerance: 0.2\n      use_collision_detection: true\n      allow_reversing: false\n      regulated_linear_scaling_min_speed: 0.06\n      min_approach_linear_velocity: 0.04\n      stateful: false\n      use_rotate_to_heading: false\nplanner_server:\n  ros__parameters:\n    use_sim_time: true\n    planner_plugins:\n    - GridBased\n    GridBased:\n      plugin: nav2_navfn_planner::NavfnPlanner\n      tolerance: 0.25\n      use_astar: true\n      allow_unknown: true\nlocal_costmap:\n  local_costmap:\n    ros__parameters:\n      use_sim_time: true\n      global_frame: odom\n      robot_base_frame: base_footprint\n      rolling_window: true\n      width: 4\n      height: 4\n      resolution: 0.05\n      robot_radius: 0.246\n      plugins:\n      - voxel_layer\n      - semantic_layer\n      - inflation_layer\n      voxel_layer:\n        plugin: nav2_costmap_2d::VoxelLayer\n        enabled: true\n        observation_sources: scan\n        scan:\n          topic: scan_fixed\n          data_type: LaserScan\n          marking: true\n          clearing: true\n          obstacle_max_range: 3.5\n          raytrace_max_range: 4.0\n      inflation_layer:\n        plugin: nav2_costmap_2d::InflationLayer\n        inflation_radius: 0.6\n        cost_scaling_factor: 3.0\n        enabled: true\n      semantic_layer:\n        plugin: demo_semantic_costmap::SemanticLayer\n        enabled: false\n        topic_prefix: /robot_1/semantic\n        observation_lifetime: 1.0\n        max_capture_age: 0.5\n        target_cost: 254\n        optical_frame: camera_color_optical_frame\nglobal_costmap:\n  global_costmap:\n    ros__parameters:\n      use_sim_time: true\n      global_frame: map\n      robot_base_frame: base_footprint\n      resolution: 0.05\n      track_unknown_space: true\n      robot_radius: 0.246\n      plugins:\n      - static_layer\n      - obstacle_layer\n      - semantic_layer\n      - inflation_layer\n      static_layer:\n        plugin: nav2_costmap_2d::StaticLayer\n        map_subscribe_transient_local: true\n      obstacle_layer:\n        plugin: nav2_costmap_2d::ObstacleLayer\n        enabled: false\n        observation_sources: scan\n        scan:\n          topic: scan_fixed\n          data_type: LaserScan\n          marking: true\n          clearing: true\n          obstacle_max_range: 3.5\n          raytrace_max_range: 4.0\n      inflation_layer:\n        plugin: nav2_costmap_2d::InflationLayer\n        enabled: true\n        inflation_radius: 0.6\n        cost_scaling_factor: 3.0\n      semantic_layer:\n        plugin: demo_semantic_costmap::SemanticLayer\n        enabled: true\n        topic_prefix: /robot_1/semantic\n        observation_lifetime: 1.0\n        max_capture_age: 0.5\n        target_cost: 254\n        optical_frame: camera_color_optical_frame\nbehavior_server:\n  ros__parameters:\n    use_sim_time: true\n    behavior_plugins:\n    - spin\n    - backup\n    - drive_on_heading\n    - wait\n    spin:\n      plugin: nav2_behaviors::Spin\n    backup:\n      plugin: nav2_behaviors::BackUp\n    drive_on_heading:\n      plugin: nav2_behaviors::DriveOnHeading\n    wait:\n      plugin: nav2_behaviors::Wait\nsmoother_server:\n  ros__parameters:\n    use_sim_time: true\n    smoother_plugins:\n    - simple_smoother\n    simple_smoother:\n      plugin: nav2_smoother::SimpleSmoother\nwaypoint_follower:\n  ros__parameters:\n    use_sim_time: true\n    stop_on_failure: true\nvelocity_smoother:\n  ros__parameters:\n    use_sim_time: true\n    smoothing_frequency: 20.0\n    feedback: OPEN_LOOP\n    max_velocity:\n    - 0.12\n    - 0.0\n    - 0.45\n    min_velocity:\n    - -0.12\n    - 0.0\n    - -0.45\n    max_accel:\n    - 0.3\n    - 0.0\n    - 0.4\n    max_decel:\n    - -0.5\n    - 0.0\n    - -0.6\n    odom_topic: odom\n    velocity_timeout: 0.5\ncollision_monitor:\n  ros__parameters:\n    base_frame_id: base_footprint\n    odom_frame_id: odom\n    cmd_vel_in_topic: cmd_vel_smoothed\n    cmd_vel_out_topic: cmd_vel\n    state_topic: collision_monitor_state\n    transform_tolerance: 0.2\n    source_timeout: 1.0\n    base_shift_correction: true\n    stop_pub_timeout: 2.0\n    polygons:\n    - FootprintApproach\n    FootprintApproach:\n      type: polygon\n      action_type: approach\n      footprint_topic: local_costmap/published_footprint\n      time_before_collision: 0.5\n      simulation_time_step: 0.1\n      min_points: 6\n      visualize: false\n      enabled: true\n    observation_sources:\n    - scan\n    scan:\n      type: scan\n      topic: scan_fixed\n      min_height: 0.15\n      max_height: 2.0\n      enabled: true\ndocking_server:\n  ros__parameters:\n    controller_frequency: 50.0\n    initial_perception_timeout: 5.0\n    wait_charge_timeout: 5.0\n    dock_approach_timeout: 30.0\n    undock_linear_tolerance: 0.05\n    undock_angular_tolerance: 0.1\n    max_retries: 3\n    base_frame: base_link\n    fixed_frame: odom\n    dock_backwards: false\n    dock_prestaging_tolerance: 0.5\n    dock_plugins:\n    - simple_charging_dock\n    simple_charging_dock:\n      plugin: opennav_docking::SimpleChargingDock\n      docking_threshold: 0.05\n      staging_x_offset: -0.7\n      use_external_detection_pose: true\n      use_battery_status: false\n      use_stall_detection: false\n      external_detection_timeout: 1.0\n      external_detection_translation_x: -0.18\n      external_detection_translation_y: 0.0\n      external_detection_rotation_roll: -1.57\n      external_detection_rotation_pitch: -1.57\n      external_detection_rotation_yaw: 0.0\n      filter_coef: 0.1\n    controller:\n      k_phi: 3.0\n      k_delta: 2.0\n      v_linear_min: 0.15\n      v_linear_max: 0.15\n      use_collision_detection: true\n      costmap_topic: local_costmap/costmap_raw\n      footprint_topic: local_costmap/published_footprint\n      transform_tolerance: 0.1\n      projection_time: 5.0\n      simulation_step: 0.1\n      dock_collision_threshold: 0.3\n","support_geometry.py":"\"\"\"Opt-in rear ball supports for the private simplified robot, not canonical assets.\n\nLike upstream Waffle, use two freely rotating ball-joint casters. Locations are\nadapted to this demo's smaller box hull; all existing collisions/inertias remain.\nURDF represents spherical centres as fixed transforms (orientation is immaterial\nto a sphere); dynamics are defined only by the Gazebo SDF ball joints.\n\"\"\"\nimport xml.etree.ElementTree as ET\n\n\nCASTERS = ((\"rear_left_caster\", -.14, .064), (\"rear_right_caster\", -.14, -.064))\n\n\ndef add_rear_casters(world_text, urdf_text):\n    world,urdf=ET.fromstring(world_text),ET.fromstring(urdf_text)\n    robot=world.find(\".//model[@name='robot_1']\")\n    if robot is None or len(robot.findall(\"link/collision\"))!=4:\n        raise ValueError(\"expected original four-collision robot\")\n    base=robot.find(\"link[@name='base_link']/collision[@name='base_collision']\")\n    if (base is None or [float(x) for x in base.findtext(\"pose\", \"\").split()]!=[-.032,0,.07,0,0,0]\n            or [float(x) for x in base.findtext(\"geometry/box/size\", \"\").split()]!=[.28,.31,.14]):\n        raise ValueError(\"unqualified chassis geometry\")\n    for side in (\"left\",\"right\"):\n        wheel=robot.find(f\"link[@name='wheel_{side}_link']\")\n        y=.144 if side==\"left\" else -.144\n        if (wheel is None or [float(x) for x in wheel.findtext(\"pose\", \"\").split()]!=[0,y,.023,-1.57,0,0]\n                or float(wheel.findtext(\"collision/geometry/cylinder/radius\", \"nan\"))!=.033):\n            raise ValueError(\"unqualified wheel geometry\")\n    for name,x,y in CASTERS:\n        if robot.find(f\"link[@name='{name}']\") is not None or urdf.find(f\"link[@name='{name}']\") is not None:\n            raise ValueError(\"refusing duplicate caster\")\n        robot.append(ET.fromstring(f'''\u003clink name=\"{name}\"\u003e\u003cpose\u003e{x} {y} -0.005 0 0 0\u003c/pose\u003e\n          \u003cinertial\u003e\u003cmass\u003e0.001\u003c/mass\u003e\u003cinertia\u003e\u003cixx\u003e1e-8\u003c/ixx\u003e\u003ciyy\u003e1e-8\u003c/iyy\u003e\u003cizz\u003e1e-8\u003c/izz\u003e\u003c/inertia\u003e\u003c/inertial\u003e\n          \u003ccollision name=\"support\"\u003e\u003cgeometry\u003e\u003csphere\u003e\u003cradius\u003e0.005\u003c/radius\u003e\u003c/sphere\u003e\u003c/geometry\u003e\n            \u003csurface\u003e\u003cfriction\u003e\u003code\u003e\u003cmu\u003e1\u003c/mu\u003e\u003cmu2\u003e1\u003c/mu2\u003e\u003c/ode\u003e\n              \u003cbullet\u003e\u003cfriction\u003e1\u003c/friction\u003e\u003cfriction2\u003e1\u003c/friction2\u003e\u003c/bullet\u003e\u003c/friction\u003e\u003c/surface\u003e\u003c/collision\u003e\n          \u003cvisual name=\"support\"\u003e\u003cgeometry\u003e\u003csphere\u003e\u003cradius\u003e0.005\u003c/radius\u003e\u003c/sphere\u003e\u003c/geometry\u003e\u003c/visual\u003e\u003c/link\u003e'''))\n        robot.append(ET.fromstring(f'''\u003cjoint name=\"{name}_joint\" type=\"ball\"\u003e\n          \u003cparent\u003ebase_link\u003c/parent\u003e\u003cchild\u003e{name}\u003c/child\u003e\u003c/joint\u003e'''))\n        urdf.append(ET.fromstring(f'''\u003clink name=\"{name}\"\u003e\n          \u003ccollision\u003e\u003cgeometry\u003e\u003csphere radius=\"0.005\"/\u003e\u003c/geometry\u003e\u003c/collision\u003e\n          \u003cvisual\u003e\u003cgeometry\u003e\u003csphere radius=\"0.005\"/\u003e\u003c/geometry\u003e\u003c/visual\u003e\u003c/link\u003e'''))\n        urdf.append(ET.fromstring(f'''\u003cjoint name=\"{name}_centre\" type=\"fixed\"\u003e\n          \u003cparent link=\"base_link\"/\u003e\u003cchild link=\"{name}\"/\u003e\u003corigin xyz=\"{x} {y} -0.005\" rpy=\"0 0 0\"/\u003e\u003c/joint\u003e'''))\n    return ET.tostring(world,encoding=\"unicode\"),ET.tostring(urdf,encoding=\"unicode\")\n"},"kind":"ConfigMap","metadata":{"labels":{"semantic-navigation.robots-demo/phase":"phase7-topology"},"name":"semantic-phase7-live-nav2-config","namespace":"semantic-navigation"}}
