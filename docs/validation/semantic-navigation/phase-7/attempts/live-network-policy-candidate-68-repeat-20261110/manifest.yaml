    \ /opt/semantic-navigation/install_phase1_camera.py \"${WORLD}\" --phase2-targets\n\
    else\n  python3 /opt/semantic-navigation/install_phase1_camera.py \"${WORLD}\"\
    \nfi\nexport GZ_SIM_RESOURCE_PATH=\"${ASSET_DIR}/models:${ASSET_DIR}:/opt/rmf_demos_ws/install/share/rmf_demos_assets/models:${GZ_SIM_RESOURCE_PATH:-}\"\
    \nexport GZ_SIM_SYSTEM_PLUGIN_PATH=\"/opt/ros/jazzy/opt/gz_sim_vendor/lib/gz-sim-8/plugins:${GZ_SIM_SYSTEM_PLUGIN_PATH:-}\"\
    \nexport QT_QPA_PLATFORM=xcb\nexport QT_X11_NO_MITSHM=1\nexport DISPLAY=\"${DISPLAY:-:99}\"\
    \nVNC_PORT=\"${VNC_PORT:-5900}\"\nNOVNC_PORT=\"${NOVNC_PORT:-6080}\"\n\npids=()\n\
    cleanup() {\n  trap - TERM INT EXIT\n  for pid in \"${pids[@]:-}\"; do kill \"\
    ${pid}\" 2>/dev/null || true; done\n  wait || true\n}\ntrap cleanup TERM INT EXIT\n\
    \nXorg \"${DISPLAY}\" -config /etc/X11/xorg-dummy.conf -nolisten tcp \\\n  -logfile\
    \ /tmp/Xorg.semantic-navigation.log & pids+=(\"$!\")\nsleep 2\nopenbox >/tmp/openbox.semantic-navigation.log\
    \ 2>&1 & pids+=(\"$!\")\nx11vnc -display \"${DISPLAY}\" -rfbport \"${VNC_PORT}\"\
    \ -shared -forever -nopw -noxdamage -noscr \\\n  >/tmp/x11vnc.semantic-navigation.log\
    \ 2>&1 & pids+=(\"$!\")\nwebsockify --web /usr/share/novnc \"${NOVNC_PORT}\" \"\
    localhost:${VNC_PORT}\" \\\n  >/tmp/novnc.semantic-navigation.log 2>&1 & pids+=(\"\
    $!\")\n\ngz sim --force-version 8 -r -s -v 2 \"${WORLD}\" >/tmp/gz-server.semantic-navigation.log\
    \ 2>&1 &\npids+=(\"$!\")\nsleep 3\ngz sim --force-version 8 -g -v 2 \"${WORLD}\"\
    \ >/tmp/gz-gui.semantic-navigation.log 2>&1 &\npids+=(\"$!\")\n# Match rmf-hotel-world-openshift-ai's\
    \ smoothed overhead GUI follow mode.\n# The supervisor below handles recovery,\
    \ but does not attach at startup.\n# Wait for both the service and tracking subscriber:\
    \ publishing earlier races\n# the GUI scene. Bounded startup retries leave later\
    \ manual pan/zoom alone.\ninitialize_camera_follow() {\n  for _attempt in $(seq\
    \ 1 90); do\n    if timeout 3 gz service -i -s /gui/follow 2>/dev/null |\n   \
    \     grep -q 'gz.msgs.StringMsg, gz.msgs.Boolean' &&\n        timeout 4 gz service\
    \ -s /gui/follow \\\n          --reqtype gz.msgs.StringMsg --reptype gz.msgs.Boolean\
    \ \\\n          --timeout 3000 --req 'data: \"robot_1\"' 2>/dev/null |\n     \
    \   grep -q 'data: true' &&\n        timeout 4 gz service -s /gui/follow/offset\
    \ \\\n          --reqtype gz.msgs.Vector3d --reptype gz.msgs.Boolean \\\n    \
    \      --timeout 3000 --req 'x: 0 y: 0 z: 5' 2>/dev/null |\n        grep -q 'data:\
    \ true' &&\n        timeout 3 gz topic -i -t /gui/track 2>/dev/null |\n      \
    \  grep -q 'Subscribers'; then\n      for _publish in $(seq 1 3); do\n       \
    \ timeout 2 gz topic -t /gui/track -m gz.msgs.CameraTrack \\\n          -p 'track_mode:\
    \ FOLLOW_LOOK_AT follow_target: {name: \"robot_1\"} track_target: {name: \"robot_1\"\
    } follow_offset: {x: 0 y: 0 z: 5} track_offset: {x: 0 y: 0 z: 0} follow_pgain:\
    \ 0.02 track_pgain: 0.02' \\\n          >/dev/null 2>&1 || true\n        sleep\
    \ 0.5\n      done\n      echo \"[semantic-navigation] Gazebo camera following\
    \ robot_1 (overhead)\"\n      return 0\n    fi\n    sleep 1\n  done\n  echo \"\
    [semantic-navigation] camera follow initialization timed out\" >&2\n  return 1\n\
    }\ninitialize_camera_follow >/tmp/camera-follow-startup.semantic-navigation.log\
    \ 2>&1 &\npids+=(\"$!\")\npython3 /opt/ros2-demo/scripts/camera_follow_supervisor.py\
    \ >/tmp/camera-follow.semantic-navigation.log 2>&1 &\npids+=(\"$!\")\nros2 run\
    \ robot_state_publisher robot_state_publisher \\\n  --ros-args -p use_sim_time:=true\
    \ \\\n  -p robot_description:=\"$(< /opt/ros2-demo/robot/turtlebot3_waffle.urdf)\"\
    \ \\\n  -r /tf:=/robot_1/tf -r /tf_static:=/robot_1/tf_static \\\n  >/tmp/robot-state-publisher.semantic-navigation.log\
    \ 2>&1 &\npids+=(\"$!\")\n\nros2 run ros_gz_bridge parameter_bridge \\\n  /clock@rosgraph_msgs/msg/Clock[gz.msgs.Clock\
    \ \\\n  /robot_1/cmd_vel@geometry_msgs/msg/Twist]gz.msgs.Twist \\\n  /robot_1/odom@nav_msgs/msg/Odometry[gz.msgs.Odometry\
    \ \\\n  /scan@sensor_msgs/msg/LaserScan[gz.msgs.LaserScan \\\n  --ros-args -r\
    \ /scan:=/robot_1/scan >/tmp/gz-bridge.semantic-navigation.log 2>&1 &\npids+=(\"\
    $!\")\nros2 launch ros_gz_bridge ros_gz_bridge.launch.py \\\n  bridge_name:=semantic_camera_bridge\
    \ \\\n  config_file:=/opt/ros2-demo/config/semantic-camera-bridge.yaml \\\n  >/tmp/rgbd-bridge.semantic-navigation.log\
    \ 2>&1 &\npids+=(\"$!\")\n\necho \"[semantic-navigation] isolated hotel simulator\
    \ with RGB-D camera ready\"\nwait \"${pids[4]}\"\n"
