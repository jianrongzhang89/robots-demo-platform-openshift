robot_1:
  amcl:
    ros__parameters:
      alpha1: 0.1
      alpha2: 0.1
      alpha3: 0.1
      alpha4: 0.1
      alpha5: 0.1
      base_frame_id: base_footprint
      first_map_only: false
      global_frame_id: map
      laser_max_range: 12.0
      laser_min_range: 0.12
      laser_model_type: likelihood_field
      max_beams: 60
      max_particles: 8000
      min_particles: 2000
      odom_frame_id: odom
      scan_topic: scan_fixed
      set_initial_pose: false
      tf_broadcast: true
      transform_tolerance: 0.2
      update_min_a: 0.1
      update_min_d: 0.05
      use_sim_time: true
  behavior_server:
    ros__parameters:
      backup:
        plugin: nav2_behaviors::BackUp
      behavior_plugins:
      - spin
      - backup
      - drive_on_heading
      - wait
      cycle_frequency: 40.0
      drive_on_heading:
        plugin: nav2_behaviors::DriveOnHeading
      enable_stamped_cmd_vel: true
      global_frame: map
      local_frame: odom
      max_rotational_vel: 0.5
      min_rotational_vel: 0.1
      robot_base_frame: base_footprint
      rotational_acc_lim: 1.0
      spin:
        plugin: nav2_behaviors::Spin
      use_sim_time: true
      wait:
        plugin: nav2_behaviors::Wait
  bt_navigator:
    ros__parameters:
      bt_loop_duration: 10
      default_cancel_timeout: 2000
      default_nav_to_pose_bt_xml: /phase5-native/..2026_11_03_16_15_39.1207971290/phase5-baseline.xml
      default_server_timeout: 5000
      global_frame: map
      navigate_through_poses:
        plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
      navigate_to_pose:
        plugin: nav2_bt_navigator::NavigateToPoseNavigator
      navigators:
      - navigate_to_pose
      - navigate_through_poses
      odom_topic: odom
      robot_base_frame: base_footprint
      use_sim_time: true
      wait_for_service_timeout: 1000
  collision_monitor:
    ros__parameters:
      FootprintApproach:
        action_type: approach
        enabled: true
        footprint_topic: local_costmap/published_footprint
        min_points: 1
        simulation_time_step: 0.02
        time_before_collision: 1.0
        type: polygon
        visualize: false
      StopEnvelope:
        action_type: stop
        enabled: true
        min_points: 1
        points: '[[-0.332, -0.315], [0.268, -0.315], [0.268, 0.315], [-0.332, 0.315]]'
        polygon_pub_topic: phase5/stop_polygon
        type: polygon
        visualize: true
      base_frame_id: base_footprint
      base_shift_correction: true
      cmd_vel_in_topic: cmd_vel_smoothed
      cmd_vel_out_topic: phase5/collision_checked
      enable_stamped_cmd_vel: true
      observation_sources:
      - scan
      odom_frame_id: odom
      polygons:
      - StopEnvelope
      - FootprintApproach
      scan:
        enabled: true
        max_height: 2.0
        min_height: 0.15
        topic: scan_fixed
        type: scan
      source_timeout: 0.5
      state_topic: collision_monitor_state
      stop_pub_timeout: 2.0
      transform_tolerance: 0.1
      use_sim_time: true
  controller_server:
    ros__parameters:
      FollowPath:
        allow_reversing: false
        desired_linear_vel: 0.15
        lookahead_dist: 0.5
        max_angular_accel: 1.0
        max_lookahead_dist: 0.9
        min_lookahead_dist: 0.25
        plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
        rotate_to_heading_angular_vel: 0.5
        stateful: false
        transform_tolerance: 0.2
        use_collision_detection: true
        use_rotate_to_heading: false
      controller_frequency: 40.0
      controller_plugins:
      - FollowPath
      enable_stamped_cmd_vel: true
      general_goal_checker:
        plugin: nav2_controller::SimpleGoalChecker
        stateful: true
        xy_goal_tolerance: 0.2
        yaw_goal_tolerance: 0.35
      goal_checker_plugins:
      - general_goal_checker
      min_theta_velocity_threshold: 0.001
      min_x_velocity_threshold: 0.001
      min_y_velocity_threshold: 0.5
      progress_checker:
        movement_time_allowance: 90.0
        plugin: nav2_controller::SimpleProgressChecker
        required_movement_radius: 0.05
      progress_checker_plugins:
      - progress_checker
      use_sim_time: true
  global_costmap:
    global_costmap:
      ros__parameters:
        always_send_full_costmap: true
        footprint: '[[-0.172, -0.155], [0.108, -0.155], [0.108, 0.155], [-0.172, 0.155]]'
        footprint_padding: 0.01
        global_frame: map
        inflation_layer:
          cost_scaling_factor: 3.0
          enabled: true
          inflation_radius: 0.45
          plugin: nav2_costmap_2d::InflationLayer
        obstacle_layer:
          enabled: true
          observation_sources: scan
          plugin: nav2_costmap_2d::ObstacleLayer
          scan:
            clearing: true
            data_type: LaserScan
            expected_update_rate: 0.5
            marking: true
            obstacle_max_range: 3.5
            raytrace_max_range: 3.5
            topic: /robot_1/scan_fixed
        plugins:
        - static_layer
        - obstacle_layer
        - inflation_layer
        publish_frequency: 5.0
        resolution: 0.05
        robot_base_frame: base_footprint
        static_layer:
          map_subscribe_transient_local: true
          plugin: nav2_costmap_2d::StaticLayer
        track_unknown_space: true
        transform_tolerance: 0.2
        update_frequency: 10.0
        use_sim_time: true
  local_costmap:
    local_costmap:
      ros__parameters:
        always_send_full_costmap: true
        footprint: '[[-0.172, -0.155], [0.108, -0.155], [0.108, 0.155], [-0.172, 0.155]]'
        footprint_padding: 0.01
        global_frame: odom
        height: 4
        inflation_layer:
          cost_scaling_factor: 3.0
          enabled: true
          inflation_radius: 0.45
          plugin: nav2_costmap_2d::InflationLayer
        plugins:
        - voxel_layer
        - inflation_layer
        publish_frequency: 5.0
        resolution: 0.05
        robot_base_frame: base_footprint
        rolling_window: true
        transform_tolerance: 0.2
        update_frequency: 10.0
        use_sim_time: true
        voxel_layer:
          enabled: true
          observation_sources: scan
          plugin: nav2_costmap_2d::VoxelLayer
          scan:
            clearing: true
            data_type: LaserScan
            expected_update_rate: 0.5
            marking: true
            obstacle_max_range: 3.5
            raytrace_max_range: 3.5
            topic: /robot_1/scan_fixed
        width: 4
  map_server:
    ros__parameters:
      use_sim_time: true
      yaml_filename: /tmp/phase5-native-results/assets/hotel_L1.yaml
  planner_server:
    ros__parameters:
      GridBased:
        allow_unknown: false
        plugin: nav2_navfn_planner::NavfnPlanner
        tolerance: 0.25
        use_astar: true
      planner_plugins:
      - GridBased
      use_sim_time: true
  smoother_server:
    ros__parameters:
      simple_smoother:
        plugin: nav2_smoother::SimpleSmoother
      smoother_plugins:
      - simple_smoother
      use_sim_time: true
  velocity_smoother:
    ros__parameters:
      enable_stamped_cmd_vel: true
      feedback: OPEN_LOOP
      max_accel:
      - 0.5
      - 0.0
      - 1.0
      max_decel:
      - -0.8
      - 0.0
      - -1.5
      max_velocity:
      - 0.15
      - 0.0
      - 0.5
      min_velocity:
      - -0.1
      - 0.0
      - -0.5
      odom_topic: odom
      smoothing_frequency: 100.0
      stamp_smoothed_velocity_with_smoothing_time: false
      use_sim_time: true
      velocity_timeout: 0.1
  waypoint_follower:
    ros__parameters:
      stop_on_failure: true
      use_sim_time: true
