    \ separately, not as a\n                # fabricated physical safety limit. The\
    \ final native trace\n                # records independent physics velocity/pose,\
    \ not wheel odometry.\n                previous_nonzero = [t for t in snapshot()\
    \ if t[\"steady_ns\"]<zero[\"steady_ns\"] and t[\"applied_vx\"]!=0 and t[\"physical\"\
    ]]\n                assert previous_nonzero, \"no pre-stop physical reference\"\
    \n                anchor = previous_nonzero[-1][\"physical\"]\n              \
    \  bracket_ms = (points[0][\"steady_ns\"]-anchor[\"steady_ns\"])/1e6\n       \
    \         checks.append({\"case\": case, \"passed\": True, \"fault_steady_ns\"\
    : fault_at,\n                    \"trigger_to_zero_ms\": (zero[\"applied_steady_ns\"\
    ]-zero[\"trigger_steady_ns\"])/1e6,\n                    \"zero_observed_in_status_ms\"\
    : (zero[\"steady_ns\"]-zero[\"trigger_steady_ns\"])/1e6,\n                   \
    \ \"fault_to_zero_ms\": (zero[\"steady_ns\"]-fault_at)/1e6,\n                \
    \    \"reason\": zero[\"reason\"], \"post_zero_sampled_distance_m\": distance,\n\
    \                    \"zero_sample_bracket_ms\": bracket_ms,\n               \
    \     \"bracketed_stop_distance_m\": math.hypot(points[0][\"x\"]-anchor[\"x\"\
    ], points[0][\"y\"]-anchor[\"y\"])+distance,\n                    \"final_physical_speed\"\
    : points[-1][\"speed\"]})\n                before = time.monotonic_ns()\n    \
    \            for sequence in range(10000, 10010):\n                    replay.publish(packet(token,\
    \ sequence))\n                    time.sleep(.02)\n                assert all(not\
    \ t[\"armed\"] and t[\"vx\"]==0 for t in snapshot() if t[\"steady_ns\"]>=before),\
    \ \"late packet resumed motion\"\n                assert not request(node, \"\
    /phase5/drive/arm\", StringMsg(data=token)), \"old session rearmed\"\n       \
    \         checks.append({\"case\": case+\"_late_success_and_session_reuse_rejected\"\
    , \"passed\": True})\n            info = subprocess.run([\"gz\", \"topic\", \"\
    -i\", \"-t\", \"/phase5/internal_drive\"], capture_output=True, text=True, timeout=10)\n\
    \            (args.output / \"drive-endpoints.txt\").write_text(info.stdout+info.stderr)\n\
    \            succeeded = True\n        finally:\n            if child and child.poll()\
    \ is None:\n                child.kill(); child.wait(timeout=3)\n            if\
    \ child:\n                out, error = child.communicate(timeout=3)\n        \
    \        (args.output / \"producer.log\").write_text(out+error)\n            try:\n\
    \                request(node, \"/phase5/drive/stop\", StringMsg(data=\"fixture_cleanup\"\
    ))\n            except Exception:\n                pass\n            if process\
    \ and process.poll() is None:\n                process.send_signal(signal.SIGINT)\n\
    \                try: process.wait(timeout=10)\n                except subprocess.TimeoutExpired:\
    \ process.kill(); process.wait(timeout=5)\n            result = {\"event\": \"\
    phase5_native_watchdog_fixture\", \"passed\": succeeded,\n                   \
    \   \"checks\": checks, \"assets\": assets, \"trace_count\": len(traces)}\n  \
    \          (args.output / \"summary.json\").write_text(json.dumps(result, indent=2))\n\
    \            with (args.output / \"trace.jsonl\").open(\"w\") as handle:\n   \
    \             for entry in snapshot(): handle.write(json.dumps(entry)+\"\\n\"\
    )\n            print(json.dumps(result), flush=True)\n            log.seek(0)\n\
    \            print(log.read(), flush=True)\n\n\nif __name__ == \"__main__\":\n\
    \    main()\n"
  cyclonedds-phase5.xml: <CycloneDDS><Domain id="any"><General><Interfaces><NetworkInterface
    name="lo"/></Interfaces><AllowMulticast>false</AllowMulticast></General><Discovery><ParticipantIndex>auto</ParticipantIndex></Discovery></Domain></CycloneDDS>
---
apiVersion: v1
kind: Pod
metadata:
  name: semantic-phase5-native
  namespace: semantic-navigation
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 300
  automountServiceAccountToken: false
  containers:
  - name: fixture
    image: image-registry.openshift-image-registry.svc:5000/semantic-navigation/semantic-safety@sha256:66a39ab5df09bf129b73d2e49a219903f21c0cb3984eb43cee4982923c480236
    command:
    - /bin/bash
    - -ec
    args:
    - source /opt/ros/jazzy/setup.bash; exec python3 /phase5-native/run_native_suite.py
    env:
    - name: ROS_DOMAIN_ID
      value: '85'
    - name: RMW_IMPLEMENTATION
      value: rmw_cyclonedds_cpp
    - name: CYCLONEDDS_URI
      value: file:///phase5-native/cyclonedds-phase5.xml
    - name: ROS_LOG_DIR
      value: /tmp/phase5-ros-logs
    - name: PYTHONDONTWRITEBYTECODE
      value: '1'
    - name: GZ_IP
      value: 127.0.0.1
    - name: GZ_PARTITION
      value: phase5-watchdog-native-qualification
    - name: GZ_SIM_SYSTEM_PLUGIN_PATH
      value: /opt/semantic-safety/lib:/usr/lib/x86_64-linux-gnu/gz-sim-8/plugins:/opt/ros/jazzy/opt/gz_sim_vendor/lib/gz-sim-8/plugins
    volumeMounts:
    - name: source
      mountPath: /phase5-native
      readOnly: true
    resources:
      requests:
        cpu: '1'
        memory: 1Gi
      limits:
        cpu: '4'
        memory: 3Gi
    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      seccompProfile:
        type: RuntimeDefault
  volumes:
  - name: source
    configMap:
      name: semantic-phase5-native
