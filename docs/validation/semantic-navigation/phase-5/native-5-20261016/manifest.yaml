    ]: t[\"physical\"] for t in current if t[\"physical\"] and t[\"physical\"][\"\
    steady_ns\"]>=zero[\"applied_steady_ns\"]}\n                points = [physical[k]\
    \ for k in sorted(physical)]\n                assert len(points)>2\n         \
    \       distance = sum(math.hypot(b[\"x\"]-a[\"x\"], b[\"y\"]-a[\"y\"]) for a,b\
