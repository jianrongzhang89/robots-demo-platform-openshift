  verify_collision_monitor.py: "#!/usr/bin/env python3\n\"\"\"Non-actuating Jazzy\
    \ smoke test with synthetic scan/TF/footprint/commands.\n\nRun only in the isolated\
    \ test pod (domain 85, loopback DDS, no bridge). This is\nnot a physical stop,\
    \ geometric localization or live SAM3 fault qualification.\n\"\"\"\nimport json\n\
    import math\nimport os\nfrom pathlib import Path\nimport signal\nimport subprocess\n\
    import tempfile\nimport time\n\nimport rclpy\nfrom geometry_msgs.msg import Point32,\
    \ PolygonStamped, TransformStamped, Twist\nfrom lifecycle_msgs.srv import ChangeState\n\
    from nav2_msgs.msg import CollisionMonitorState\nfrom rclpy.node import Node\n\
    from sensor_msgs.msg import LaserScan\nfrom tf2_ros import StaticTransformBroadcaster\n\
    import yaml\n\n\ndef main():\n    if os.getenv(\"ROS_DOMAIN_ID\") != \"85\" or\
    \ \"phase5\" not in os.getenv(\"CYCLONEDDS_URI\", \"\"):\n        raise RuntimeError(\"\
    refusing to run outside isolated Phase 5 fixture\")\n    params = yaml.safe_load(Path(\"\
    /phase5/phase5-nav2-candidate.yaml\").read_text())[\"collision_monitor\"][\"ros__parameters\"\
    ]\n    params[\"use_sim_time\"] = False  # synthetic fixture uses wall stamps,\
    \ no simulator\n    with tempfile.TemporaryDirectory(prefix=\"phase5-collision-\"\
    ) as directory:\n        config = Path(directory) / \"params.yaml\"\n        config.write_text(yaml.safe_dump({\"\
    collision_monitor\": {\"ros__parameters\": params}}))\n        with (Path(directory)\
    \ / \"monitor.log\").open(\"w+\") as log:\n            process = subprocess.Popen([\"\
    /opt/ros/jazzy/lib/nav2_collision_monitor/collision_monitor\",\n             \
    \                           \"--ros-args\", \"--params-file\", str(config)], stdout=log,\
    \ stderr=subprocess.STDOUT)\n            rclpy.init()\n            node = Node(\"\
    phase5_non_actuating_fixture\")\n            records, states, checks = [], [],\
    \ []\n            node.create_subscription(Twist, \"/phase5/collision_checked\"\
    ,\n                                     lambda m: records.append({\"wall_ns\"\
    : time.time_ns(), \"steady_ns\": time.monotonic_ns(),\n                      \
    \                                         \"x\": m.linear.x, \"yaw\": m.angular.z}),\
    \ 10)\n            node.create_subscription(CollisionMonitorState, \"/collision_monitor_state\"\
    ,\n                                     lambda m: states.append({\"steady_ns\"\
    : time.monotonic_ns(), \"state\": str(m)}), 10)\n            commands = node.create_publisher(Twist,\
    \ \"/cmd_vel_smoothed\", 10)\n            scans = node.create_publisher(LaserScan,\
    \ \"/scan_fixed\", 10)\n            footprints = node.create_publisher(PolygonStamped,\
    \ \"/local_costmap/published_footprint\", 10)\n            transforms = StaticTransformBroadcaster(node)\n\
    \            tfs = []\n            for parent, child, z in ((\"odom\", \"base_footprint\"\
    , 0.0), (\"base_footprint\", \"base_scan\", .25)):\n                tf = TransformStamped()\n\
    \                tf.header.stamp = node.get_clock().now().to_msg()\n         \
    \       tf.header.frame_id, tf.child_frame_id = parent, child\n              \
    \  tf.transform.translation.z, tf.transform.rotation.w = z, 1.0\n            \
    \    tfs.append(tf)\n            transforms.sendTransform(tfs)\n            client\
    \ = node.create_client(ChangeState, \"/collision_monitor/change_state\")\n\n \
    \           def drive(duration, obstacle=False, publish_scan=True, speed=.1):\n\
    \                started = time.monotonic_ns()\n                while time.monotonic_ns()\
    \ - started < int(duration * 1e9):\n                    stamp = node.get_clock().now().to_msg()\n\
    \                    footprint = PolygonStamped()\n                    footprint.header.stamp,\
    \ footprint.header.frame_id = stamp, \"base_footprint\"\n                    footprint.polygon.points\
    \ = [Point32(x=x, y=y, z=0.0) for x, y in\n                                  \
    \              ((-.182, -.165), (.118, -.165), (.118, .165), (-.182, .165))]\n\
    \                    footprints.publish(footprint)\n                    if publish_scan:\n\
    \                        scan = LaserScan()\n                        scan.header.stamp,\
    \ scan.header.frame_id = stamp, \"base_scan\"\n                        scan.angle_min,\
    \ scan.angle_max, scan.angle_increment = 0.0, 2*math.pi, 2*math.pi/359\n     \
    \                   scan.range_min, scan.range_max = .12, 3.5\n              \
    \          scan.ranges = [float(\"inf\")] * 360\n                        scan.ranges[0]\
    \ = .22 if obstacle else 2.0\n                        scans.publish(scan)\n  \
    \                  message = Twist()\n                    message.linear.x = speed\n\
    \                    commands.publish(message)\n                    rclpy.spin_once(node,\
    \ timeout_sec=.01)\n                    time.sleep(.01)\n                return\
    \ started, [r for r in records if r[\"steady_ns\"] >= started]\n\n           \
    \ try:\n                if not client.wait_for_service(timeout_sec=20):\n    \
    \                raise RuntimeError(\"collision monitor lifecycle service missing\"\
    )\n                for transition in (1, 3):\n                    req = ChangeState.Request()\n\
    \                    req.transition.id = transition\n                    future\
    \ = client.call_async(req)\n                    rclpy.spin_until_future_complete(node,\
    \ future, timeout_sec=10)\n                    if not future.done() or not future.result().success:\n\
    \                        raise RuntimeError(f\"lifecycle transition {transition}\
    \ failed\")\n                start, output = drive(2.0)\n                assert\
    \ any(r[\"x\"] > .09 for r in output), \"nominal command blocked\"\n         \
    \       checks.append({\"case\": \"clear_scan_passes_command\", \"passed\": True})\n\
    \                start, output = drive(1.0, obstacle=True)\n                zeros\
    \ = [r for r in output if r[\"x\"] == 0 and r[\"yaw\"] == 0]\n               \
    \ assert zeros, \"stop polygon failed\"\n                latency_ms = (zeros[0][\"\
    steady_ns\"] - start)/1e6\n                assert latency_ms <= 100, f\"fixture\
    \ intervention took {latency_ms} ms\"\n                assert all(r[\"x\"] ==\
    \ 0 for r in output if r[\"steady_ns\"] >= start + 200_000_000)\n            \
    \    checks.append({\"case\": \"stop_polygon_intervenes\", \"passed\": True, \"\
    fixture_first_zero_ms\": latency_ms})\n                _, output = drive(1.0)\n\
    \                assert any(r[\"x\"] > .09 for r in output), \"clear scan did\
    \ not restore native monitor output\"\n                checks.append({\"case\"\
    : \"native_monitor_can_resume_requires_external_latch\", \"passed\": True})\n\
    \                start, output = drive(1.5, publish_scan=False)\n            \
    \    late = [r for r in output if r[\"steady_ns\"] >= start + 650_000_000]\n \
    \               assert late and all(r[\"x\"] == 0 for r in late), \"expired scan\
    \ did not stop\"\n                checks.append({\"case\": \"source_timeout_stops_with_continuing_commands\"\
    , \"passed\": True})\n                graph = dict(node.get_topic_names_and_types())\n\
    \                assert \"/robot_1/cmd_vel\" not in graph and \"/cmd_vel\" not\
    \ in graph\n                checks.append({\"case\": \"no_actuator_topic\", \"\
    passed\": True})\n                print(json.dumps({\"event\": \"phase5_native_collision_fixture\"\
    , \"passed\": True,\n                                  \"checks\": checks, \"\
    outputs\": records, \"states\": states,\n                                  \"\
    topics\": graph, \"params\": params}, sort_keys=True), flush=True)\n         \
    \   finally:\n                node.destroy_node()\n                rclpy.shutdown()\n\
    \                process.send_signal(signal.SIGINT)\n                try:\n  \
    \                  process.wait(timeout=10)\n                except subprocess.TimeoutExpired:\n\
    \                    process.kill()\n                    process.wait(timeout=5)\n\
    \                log.seek(0)\n                print(\"NATIVE_MONITOR_LOG_BEGIN\\\
    n\" + log.read() + \"NATIVE_MONITOR_LOG_END\", flush=True)\n\n\nif __name__ ==\
    \ \"__main__\":\n    main()\n"
  verify_frame_bridge.py: "\"\"\"Real ROS message/node callback tests; not moving\
    \ TF qualification.\"\"\"\nimport time\nimport unittest\nfrom unittest.mock import\
    \ Mock\nimport rclpy\nfrom nav_msgs.msg import Odometry\nfrom rosgraph_msgs.msg\
    \ import Clock\nfrom sensor_msgs.msg import LaserScan\nfrom frame_bridge import\
    \ FrameBridge\n\n\nclass FrameTests(unittest.TestCase):\n    @classmethod\n  \
    \  def setUpClass(cls):\n        rclpy.init()\n\n    @classmethod\n    def tearDownClass(cls):\n\
    \        rclpy.shutdown()\n\n    def setUp(self):\n        self.node = FrameBridge()\n\
    \        self.node.tf.sendTransform = Mock()\n        self.node.scan_pub.publish\
    \ = Mock()\n        self.node.status.publish = Mock()\n        clock = Clock()\n\
    \        clock.clock.sec = 20\n        self.node.on_clock(clock)\n\n    def tearDown(self):\n\
    \        self.node.destroy_node()\n\n    def odom(self):\n        msg = Odometry()\n\
    \        msg.header.stamp.sec = 20\n        msg.header.frame_id = \"odom\"\n \
    \       msg.child_frame_id = \"base_footprint\"\n        msg.pose.pose.position.x\
    \ = 1.23\n        msg.pose.pose.orientation.w = 1.0\n        return msg\n\n  \
    \  def test_pose_and_stamp_preserved_no_map_edge(self):\n        msg = self.odom()\n\
    \        self.node.on_odom(msg)\n        tf = self.node.tf.sendTransform.call_args.args[0]\n\
    \        self.assertEqual(tf.header, msg.header)\n        self.assertEqual(tf.child_frame_id,\
    \ \"base_footprint\")\n        self.assertEqual(tf.transform.translation.x, 1.23)\n\
    \        self.node.report()\n        self.node.on_odom(msg)  # repeated receipt\
    \ cannot produce fresh TF\n        self.assertEqual(self.node.tf.sendTransform.call_count,\
    \ 1)\n\n    def test_stale_and_missing_clock_rejected(self):\n        msg = self.odom()\n\
    \        msg.header.stamp.sec = 19\n        self.node.on_odom(msg)\n        self.node.tf.sendTransform.assert_not_called()\n\
    \        self.node.clock_progress = time.monotonic()-.6\n        self.node.on_odom(self.odom())\n\
    \        self.node.tf.sendTransform.assert_not_called()\n\n    def test_delayed_capture_does_not_restart_deadline(self):\n\
    \        msg = self.odom()\n        msg.header.stamp.sec = 19\n        msg.header.stamp.nanosec\
    \ = 600000000\n        before = time.monotonic()\n        self.node.on_odom(msg)\n\
    \        self.assertLessEqual(self.node.deadlines[\"odom\"]-before, .11)\n\n \
    \   def test_scan_stamp_preserved_and_sensor_offset_frame_used(self):\n      \
    \  msg = LaserScan()\n        msg.header.stamp.sec = 20\n        msg.header.frame_id\
    \ = \"robot_1/base_scan/lidar\"\n        self.node.on_scan(msg)\n        fixed\
    \ = self.node.scan_pub.publish.call_args.args[0]\n        self.assertEqual(fixed.header.stamp,\
    \ msg.header.stamp)\n        self.assertEqual(fixed.header.frame_id, \"lidar_frame\"\
    )\n        self.assertEqual(msg.header.frame_id, \"robot_1/base_scan/lidar\")\n\
    \n    def test_rollback_latches(self):\n        clock = Clock()\n        clock.clock.sec\
    \ = 19\n        self.node.on_clock(clock)\n        clock.clock.sec = 20\n    \
    \    self.node.on_clock(clock)\n        self.node.on_odom(self.odom())\n     \
    \   self.node.tf.sendTransform.assert_not_called()\n        self.assertEqual(self.node.fault,\
    \ \"simulation_clock_rollback_restart_required\")\n\n    def test_unknown_frames_and_invalid_pose_fail_closed(self):\n\
    \        msg = self.odom()\n        msg.header.frame_id = \"map\"\n        self.node.on_odom(msg)\n\
    \        self.assertEqual(self.node.fault, \"unexpected_odometry_frames\")\n \
    \       self.node.tf.sendTransform.assert_not_called()\n\n\nif __name__ == \"\
    __main__\":\n    unittest.main(verbosity=2)\n"
  verify_native_watchdog.py: "#!/usr/bin/env python3\n\"\"\"Private physics fixture:\
    \ native watchdog, actual hotel robot, no Nav2/SAM3.\n\nNever attach to an existing\
    \ Gazebo world. This script starts and stops its own\nserver, only in a phase5-watchdog-*\
    \ partition, and retains full native traces.\n\"\"\"\nimport argparse\nimport\
    \ json\nimport math\nimport os\nfrom pathlib import Path\nimport signal\nimport\
    \ select\nimport subprocess\nimport sys\nimport threading\nimport time\nimport\
    \ uuid\n\nfrom gz.transport13 import Node\nfrom gz.msgs10.stringmsg_pb2 import\
    \ StringMsg\nfrom gz.msgs10.boolean_pb2 import Boolean\nfrom gz.msgs10.world_control_pb2\
    \ import WorldControl\nfrom gz.msgs10.twist_pb2 import Twist\nfrom prepare_assets\
    \ import write_assets\n\n\ndef request(node, service, data):\n    ok, response\
    \ = node.request(service, data, type(data), Boolean, 2000)\n    if not ok:\n \
    \       raise RuntimeError(f\"service unavailable: {service}\")\n    return response.data\n\
    \n\ndef packet(token, sequence):\n    now = time.time_ns()\n    return StringMsg(data=json.dumps({\"\
    schema\": \"phase5-drive/v1\", \"session\": token,\n        \"sequence\": sequence,\
    \ \"issued_wall\": now, \"expires_wall\": now+80_000_000,\n        \"velocity\"\
    : [.1, 0, 0]}))\n\n\ndef producer(token):\n    node = Node()\n    publisher =\
    \ node.advertise(\"/phase5/drive/lease\", StringMsg)\n    end = time.monotonic()+5\n\
    \    while not publisher.has_connections() and time.monotonic()<end:\n       \
    \ time.sleep(.02)\n    if not publisher.has_connections():\n        raise RuntimeError(\"\
    native receiver was not discovered\")\n    # Advertise a live stream before the\
    \ independent coordinator arms it.\n    # Service response latency must not consume\
    \ the 80 ms first-packet window.\n    # No packet can authorize itself while the\
    \ receiver is disarmed.\n    for sequence in range(6000):\n        publisher.publish(packet(token,\
    \ sequence))\n        if sequence == 0:\n            print(\"STREAM_READY\", flush=True)\n\
    \        time.sleep(.02)\n\n\ndef main():\n    parser = argparse.ArgumentParser()\n\
    \    parser.add_argument(\"--producer\")\n    parser.add_argument(\"--output\"\
    , type=Path, default=Path(\"/tmp/phase5-native-results\"))\n    args = parser.parse_args()\n\
    \    if not os.environ.get(\"GZ_PARTITION\", \"\").startswith(\"phase5-watchdog-\"\
    ) or os.getenv(\"GZ_IP\") != \"127.0.0.1\":\n        raise RuntimeError(\"refusing\
