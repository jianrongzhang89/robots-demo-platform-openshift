    /phase5/drive/lease\", StringMsg)\n    bypass = node.advertise(\"/phase5/internal_drive\"\
    , Twist)\n\n    def snapshot():\n        with lock:\n            return list(traces)\n\
    \n    def until(predicate, timeout=10):\n        end = time.monotonic()+timeout\n\
    \        while time.monotonic()<end:\n            current = snapshot()\n     \
    \       if predicate(current):\n                return current\n            time.sleep(.01)\n\
