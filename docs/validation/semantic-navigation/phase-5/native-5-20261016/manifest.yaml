  name: semantic-phase5-native
  namespace: semantic-navigation
data:
  audit_geometry.py: "#!/usr/bin/env python3\n\"\"\"Audit collision XY bounds in the\
    \ installed hotel SDF, without modifying it.\"\"\"\nimport hashlib\nimport json\n\
    import math\nfrom pathlib import Path\nimport xml.etree.ElementTree as ET\n\n\n\
    def rotation(roll, pitch, yaw):\n    cr, sr, cp, sp, cy, sy = math.cos(roll),\
    \ math.sin(roll), math.cos(pitch), math.sin(pitch), math.cos(yaw), math.sin(yaw)\n\
    \    return [[cy*cp, cy*sp*sr-sy*cr, cy*sp*cr+sy*sr],\n            [sy*cp, sy*sp*sr+cy*cr,\
    \ sy*sp*cr-cy*sr], [-sp, cp*sr, cp*cr]]\n\n\ndef pose(element):\n    p = element.find(\"\
    pose\")\n    if p is not None and p.get(\"relative_to\"):\n        raise ValueError(\"\
    explicit relative_to needs frame-graph resolution\")\n    values = [float(v) for\
    \ v in (p.text if p is not None else \"0 0 0 0 0 0\").split()]\n    return values[:3],\
    \ rotation(*values[3:])\n\n\ndef audit(world_path, urdf_path):\n    raw = Path(world_path).read_bytes()\n\
    \    model = ET.fromstring(raw).find(\".//model[@name='robot_1']\")\n    if model\
    \ is None:\n        raise ValueError(\"robot_1 missing\")\n    origin, basis =\
    \ pose(model.find(\"link[@name='base_footprint']\"))\n    if origin != [0, 0,\
    \ 0] or basis != rotation(0, 0, 0):\n        raise ValueError(\"audit requires\
    \ base_footprint coincident with model frame\")\n    boxes = []\n    for link\
    \ in model.findall(\"link\"):\n        if not link.findall(\"collision\"):\n \
    \           continue\n        translation, orient = pose(link)\n        for collision\
    \ in link.findall(\"collision\"):\n            offset, rot = pose(collision)\n\
    \            center = [translation[i] + sum(orient[i][j]*offset[j] for j in range(3))\
    \ for i in range(3)]\n            combined = [[sum(orient[i][k]*rot[k][j] for\
    \ k in range(3)) for j in range(3)] for i in range(3)]\n            geometry =\
    \ collision.find(\"geometry\")\n            if geometry.find(\"box\") is not None:\n\
    \                half = [float(v)/2 for v in geometry.findtext(\"box/size\").split()]\n\
    \                extent = [sum(abs(combined[i][j])*half[j] for j in range(3))\
    \ for i in range(3)]\n            elif geometry.find(\"cylinder\") is not None:\n\
    \                radius, half_length = float(geometry.findtext(\"cylinder/radius\"\
    )), float(geometry.findtext(\"cylinder/length\"))/2\n                extent =\
    \ [radius*math.sqrt(max(0, 1-combined[i][2]**2)) + half_length*abs(combined[i][2])\
    \ for i in range(3)]\n            else:\n                raise ValueError(\"unsupported\
    \ collision geometry; manual review required\")\n            boxes.append({\"\
    link\": link.get(\"name\"), \"collision\": collision.get(\"name\"),\n        \
    \                  \"min\": [center[i]-extent[i] for i in range(3)],\n       \
    \                   \"max\": [center[i]+extent[i] for i in range(3)]})\n    bounds\
    \ = {\"min\": [min(b[\"min\"][i] for b in boxes) for i in range(3)],\n       \
    \       \"max\": [max(b[\"max\"][i] for b in boxes) for i in range(3)]}\n    corner_radius\
    \ = max(math.hypot(x, y) for x in (bounds[\"min\"][0], bounds[\"max\"][0])\n \
    \                       for y in (bounds[\"min\"][1], bounds[\"max\"][1]))\n \
    \   urdf_raw = Path(urdf_path).read_bytes()\n    urdf = ET.fromstring(urdf_raw)\n\
    \    base_joint = next(j for j in urdf.findall(\"joint\") if j.find(\"child\"\
    ).get(\"link\") == \"base_link\")\n    return {\"world_sha256\": hashlib.sha256(raw).hexdigest(),\n\
    \            \"robot_sdf\": ET.tostring(model, encoding=\"unicode\"), \"collisions\"\
    : boxes,\n            \"xy_bounds\": {k: v[:2] for k, v in bounds.items()},\n\
    \            \"bounding_rectangle_radius_m\": corner_radius, \"canonical_radius_m\"\
    : 0.22,\n            \"canonical_radius_covers_rectangle\": 0.22 >= corner_radius,\n\
    \            \"urdf_sha256\": hashlib.sha256(urdf_raw).hexdigest(),\n        \
    \    \"urdf_base_joint_xyz\": base_joint.find(\"origin\").get(\"xyz\"),\n    \
    \        \"sdf_base_link_pose\": model.find(\"link[@name='base_link']\").findtext(\"\
    pose\", \"0 0 0 0 0 0\"),\n            \"diff_drive_plugin\": ET.tostring(next(p\
    \ for p in model.findall(\"plugin\") if \"DiffDrive\" in p.get(\"name\", \"\"\
    )), encoding=\"unicode\"),\n            \"qualification\": \"static SDF audit\
    \ only; moving TF and physical stop tests still required\"}\n\n\nif __name__ ==\
    \ \"__main__\":\n    print(json.dumps(audit(\"/opt/ros2-demo/hotel-assets/hotel.world\"\
    , \"/opt/ros2-demo/robot/turtlebot3_waffle.urdf\"), sort_keys=True))\n"
  frame_bridge.py: "#!/usr/bin/env python3\n\"\"\"Phase 5 sensor-only bridge: preserve\
    \ stamps, one odom TF authority, no map TF.\n\nPublishes neither commands nor\
    \ synthetic fresh poses. Clock rollback latches\nuntil process restart (the coordinator\
    \ must stop and clear consumers first).\n\"\"\"\nimport copy\nimport json\nimport\
    \ math\nimport time\n\nimport rclpy\nfrom rclpy.clock import Clock, ClockType\n\
    from rclpy.node import Node\nfrom rclpy.qos import qos_profile_sensor_data\nfrom\
    \ geometry_msgs.msg import TransformStamped\nfrom nav_msgs.msg import Odometry\n\
    from rosgraph_msgs.msg import Clock as ClockMessage\nfrom sensor_msgs.msg import\
    \ LaserScan\nfrom std_msgs.msg import String\nfrom tf2_ros import TransformBroadcaster\n\
    \n\ndef stamp_ns(stamp):\n    return stamp.sec * 1_000_000_000 + stamp.nanosec\n\
    \n\nclass FrameBridge(Node):\n    def __init__(self):\n        super().__init__(\"\
    phase5_frame_bridge\")\n        if not self.has_parameter(\"use_sim_time\"):\n\
    \            self.declare_parameter(\"use_sim_time\", True)\n        else:\n \
    \           self.set_parameters([rclpy.parameter.Parameter(\"use_sim_time\", rclpy.Parameter.Type.BOOL,\
    \ True)])\n        self.clock_ns = None\n        self.clock_progress = None\n\
    \        self.last = {\"odom\": -1, \"scan\": -1}\n        self.receipts = {\"\
    odom\": None, \"scan\": None}\n        self.deadlines = {\"odom\": None, \"scan\"\
    : None}\n        self.fault = None\n        self.tf = TransformBroadcaster(self)\n\
    \        self.scan_pub = self.create_publisher(LaserScan, \"/robot_1/scan_fixed\"\
    , qos_profile_sensor_data)\n        self.status = self.create_publisher(String,\
    \ \"/robot_1/phase5/frames\", 10)\n        self.create_subscription(ClockMessage,\
    \ \"/clock\", self.on_clock, qos_profile_sensor_data)\n        self.create_subscription(Odometry,\
    \ \"/robot_1/odom\", self.on_odom, qos_profile_sensor_data)\n        self.create_subscription(LaserScan,\
    \ \"/robot_1/scan\", self.on_scan, qos_profile_sensor_data)\n        self.create_timer(.05,\
    \ self.report, clock=Clock(clock_type=ClockType.STEADY_TIME))\n\n    def on_clock(self,\
    \ message):\n        value = stamp_ns(message.clock)\n        if self.clock_ns\
    \ is not None and value < self.clock_ns:\n            self.fault = \"simulation_clock_rollback_restart_required\"\
    \n        if self.clock_ns is None or value > self.clock_ns:\n            self.clock_progress\
    \ = time.monotonic()\n        self.clock_ns = value\n\n    def eligible(self,\
    \ kind, header):\n        value = stamp_ns(header.stamp)\n        if (self.fault\
    \ or self.clock_ns is None or self.clock_progress is None\n                or\
    \ time.monotonic()-self.clock_progress >= .5\n                or not 0 <= self.clock_ns-value\
    \ < 500_000_000 or value <= self.last[kind]):\n            return False\n    \
    \    self.last[kind] = value\n        self.receipts[kind] = time.monotonic()\n\
    \        self.deadlines[kind] = self.receipts[kind] + .5 - (self.clock_ns-value)/1e9\n\
    \        return True\n\n    def on_odom(self, message):\n        if message.header.frame_id\
    \ != \"odom\" or message.child_frame_id != \"base_footprint\":\n            self.fault\
    \ = \"unexpected_odometry_frames\"\n            return\n        p, q = message.pose.pose.position,\
    \ message.pose.pose.orientation\n        if (not all(math.isfinite(x) for x in\
    \ (p.x,p.y,p.z,q.x,q.y,q.z,q.w))\n                or abs(q.x*q.x+q.y*q.y+q.z*q.z+q.w*q.w-1)\
    \ > .01):\n            self.fault = \"invalid_odometry_pose\"\n            return\n\
    \        if not self.eligible(\"odom\", message.header):\n            return\n\
    \        transform = TransformStamped()\n        transform.header = copy.deepcopy(message.header)\n\
    \        transform.child_frame_id = message.child_frame_id\n        transform.transform.translation.x\
    \ = p.x\n        transform.transform.translation.y = p.y\n        transform.transform.translation.z\
    \ = p.z\n        transform.transform.rotation = copy.deepcopy(q)\n        self.tf.sendTransform(transform)\n\
    \n    def on_scan(self, message):\n        if message.header.frame_id not in (\"\
    lidar_frame\", \"robot_1/base_scan/lidar\"):\n            self.fault = \"unexpected_lidar_frame\"\
    \n            return\n        if not self.eligible(\"scan\", message.header):\n\
    \            return\n        result = copy.deepcopy(message)\n        result.header.frame_id\
    \ = \"lidar_frame\"\n        self.scan_pub.publish(result)\n\n    def report(self):\n\
    \        now = time.monotonic()\n        ages = {key: None if value is None else\
    \ (now-value)*1000 for key,value in self.receipts.items()}\n        reason = self.fault\n\
    \        if reason is None:\n            if self.clock_ns is None or self.clock_progress\
    \ is None:\n                reason = \"clock_missing\"\n            elif now-self.clock_progress\
    \ >= .5:\n                reason = \"clock_stale\"\n            else:\n      \
    \          for kind, deadline in self.deadlines.items():\n                   \
    \ if deadline is None:\n                        reason = kind+\"_missing\"\n \
    \                       break\n                    if now >= deadline or not 0\
    \ <= self.clock_ns-self.last[kind] < 500_000_000:\n                        reason\
    \ = kind+\"_stale\"\n                        break\n        self.status.publish(String(data=json.dumps({\"\
    ready\": reason is None, \"reason\": reason,\n            \"receipt_ages_ms\"\
    : ages, \"source_stamp_ns\": self.last, \"wall_ns\": time.time_ns()})))\n\n\n\
    if __name__ == \"__main__\":\n    rclpy.init()\n    node = FrameBridge()\n   \
    \ try:\n        rclpy.spin(node)\n    finally:\n        node.destroy_node()\n\
    \        rclpy.shutdown()\n"
  prepare_assets.py: "\"\"\"Prepare private Phase 5 assets; never edit canonical source\
    \ assets in place.\"\"\"\nimport copy\nimport hashlib\nimport json\nfrom pathlib\
    \ import Path\nimport xml.etree.ElementTree as ET\n\n\ndef values(text):\n   \
    \ return [float(v) for v in text.split()]\n\n\ndef prepare(world_text, urdf_text):\n\
    \    world, urdf = ET.fromstring(world_text), ET.fromstring(urdf_text)\n    model\
    \ = world.find(\".//model[@name='robot_1']\")\n    if model is None:\n       \
    \ raise ValueError(\"robot_1 absent\")\n    for name in (\"base_link\", \"base_footprint\"\
    ):\n        if values(model.find(f\"link[@name='{name}']\").findtext(\"pose\"\
    , \"0 0 0 0 0 0\")) != [0]*6:\n            raise ValueError(\"unqualified base\
    \ pose\")\n    lidar = model.find(\"link[@name='base_scan']\")\n    if values(lidar.findtext(\"\
    pose\")) != [-.032, 0, .172, 0, 0, 0]:\n        raise ValueError(\"unqualified\
    \ lidar pose\")\n    sensor = lidar.find(\"sensor[@name='lidar']\")\n    if values(sensor.findtext(\"\
    pose\")) != [0, 0, .01, 0, 0, 0]:\n        raise ValueError(\"unqualified lidar\
    \ sensor offset\")\n    for child, expected, replacement in ((\"base_link\", [0,\
    \ 0, .10], \"0 0 0\"),\n                                         (\"base_scan\"\
    , [-.064, 0, .172], \"-0.032 0 0.172\")):\n        joint = next(j for j in urdf.findall(\"\
    joint\") if j.find(\"child\").get(\"link\") == child)\n        origin = joint.find(\"\
    origin\")\n        if values(origin.get(\"xyz\")) != expected:\n            raise\
    \ ValueError(\"unexpected input URDF; refusing double/unknown patch\")\n     \
    \   origin.set(\"xyz\", replacement)\n    if urdf.find(\"link[@name='lidar_frame']\"\
    ) is not None:\n        raise ValueError(\"lidar_frame already exists\")\n   \
    \ ET.SubElement(urdf, \"link\", {\"name\": \"lidar_frame\"})\n    joint = ET.SubElement(urdf,\
    \ \"joint\", {\"name\": \"lidar_sensor_joint\", \"type\": \"fixed\"})\n    ET.SubElement(joint,\
    \ \"parent\", {\"link\": \"base_scan\"})\n    ET.SubElement(joint, \"child\",\
    \ {\"link\": \"lidar_frame\"})\n    ET.SubElement(joint, \"origin\", {\"xyz\"\
    : \"0 0 0.01\", \"rpy\": \"0 0 0\"})\n    frame = sensor.find(\"gz_frame_id\"\
    )\n    if frame is None:\n        frame = ET.SubElement(sensor, \"gz_frame_id\"\
    )\n    frame.text = \"lidar_frame\"\n    drive = next(p for p in model.findall(\"\
    plugin\") if \"DiffDrive\" in p.get(\"name\", \"\"))\n    for key, expected in\
    \ ((\"wheel_radius\", \".033\"), (\"wheel_separation\", \".287\")):\n        if\
    \ float(drive.findtext(key, \"nan\")) != float(expected):\n            raise ValueError(\"\
    unqualified wheel geometry\")\n    if drive.findtext(\"topic\") != \"/robot_1/cmd_vel\"\
    :\n        raise ValueError(\"unexpected/double-patched drive topic\")\n    drive.find(\"\
    topic\").text = \"/phase5/internal_drive\"\n    plugin = ET.SubElement(model,\
    \ \"plugin\", {\"filename\": \"libphase5_drive_watchdog.so\", \"name\": \"phase5::DriveWatchdog\"\
    })\n    ET.SubElement(plugin, \"output_topic\").text = \"/phase5/internal_drive\"\
    \n    ET.SubElement(plugin, \"prefix\").text = \"/phase5/drive\"\n    return ET.tostring(world,\
    \ encoding=\"unicode\"), ET.tostring(urdf, encoding=\"unicode\")\n\n\ndef micro_world(patched_world):\n\
    \    \"\"\"Same actual robot physics/drive, no hotel, camera or navigation stack.\"\
    \"\"\n    model = copy.deepcopy(ET.fromstring(patched_world).find(\".//model[@name='robot_1']\"\
    ))\n    model.find(\"pose\").text = \"0 0 0.1 0 0 0\"\n    for link in model.findall(\"\
    link\"):\n        for sensor in link.findall(\"sensor\"):\n            link.remove(sensor)\n\
    \    root = ET.fromstring('''<sdf version=\"1.9\"><world name=\"phase5_watchdog_fixture\"\
    >\n      <physics name=\"physics\" type=\"ignored\"><max_step_size>0.001</max_step_size><real_time_factor>1</real_time_factor></physics>\n\
    \      <gravity>0 0 -9.8</gravity>\n      <plugin filename=\"gz-sim-physics-system\"\
    \ name=\"gz::sim::systems::Physics\"/>\n      <plugin filename=\"gz-sim-user-commands-system\"\
    \ name=\"gz::sim::systems::UserCommands\"/>\n      <model name=\"ground\"><static>true</static><link\
    \ name=\"ground\">\n        <collision name=\"ground\"><geometry><plane><normal>0\
    \ 0 1</normal><size>20 20</size></plane></geometry></collision>\n      </link></model></world></sdf>''')\n\
    \    root.find(\"world\").append(model)\n    return ET.tostring(root, encoding=\"\
    unicode\")\n\n\ndef write_assets(directory):\n    directory = Path(directory)\n\
    \    directory.mkdir(parents=True, exist_ok=False)\n    source_world = Path(\"\
    /opt/ros2-demo/hotel-assets/hotel.world\").read_text()\n    source_urdf = Path(\"\
    /opt/ros2-demo/robot/turtlebot3_waffle.urdf\").read_text()\n    world, urdf =\
    \ prepare(source_world, source_urdf)\n    (directory / \"hotel.world\").write_text(world)\n\
    \    (directory / \"robot.urdf\").write_text(urdf)\n    (directory / \"watchdog.world\"\
    ).write_text(micro_world(world))\n    # Retain the actual installed map pair,\
    \ not the different repository map.\n    import yaml\n    import numpy as np\n\
    \    from PIL import Image\n    map_path = Path(\"/opt/ros2-demo/maps/hotel_L1.yaml\"\
    )\n    map_config = yaml.safe_load(map_path.read_text())\n    image_path = map_path.parent\
    \ / map_config[\"image\"]\n    if image_path.name != \"hotel_L1.pgm\" or map_config.get(\"\
    negate\", 0) != 0:\n        raise ValueError(\"unqualified map encoding\")\n \
    \   raster = np.asarray(Image.open(image_path).convert(\"L\"))\n    origin, resolution\
    \ = map_config[\"origin\"], map_config[\"resolution\"]\n    if origin[2] != 0:\n\
    \        raise ValueError(\"rotated map needs separate audit\")\n    free = (255-raster.astype(float))/255\
    \ < map_config[\"free_thresh\"]\n    initial = values(ET.fromstring(world).find(\"\
    .//model[@name='robot_1']/pose\").text)\n    def hull_free(x, y):\n        # Conservative\
    \ grid AABB for the qualified yaw-zero padded hull.\n        c0, c1 = [int(np.floor((x+offset-origin[0])/resolution))\
    \ for offset in (-.182,.118)]\n        r0, r1 = [int(np.floor((y+offset-origin[1])/resolution))\
    \ for offset in (-.165,.165)]\n        if not (0<=c0<=c1<raster.shape[1] and 0<=r0<=r1<raster.shape[0]):\n\
    \            return False\n        return bool(np.all(free[raster.shape[0]-1-r1:raster.shape[0]-r0,\
    \ c0:c1+1]))\n    map_audit = {\"resolution\": resolution, \"origin\": origin,\
    \ \"dimensions\": list(raster.shape[::-1]),\n                 \"initial_model_pose\"\
    : initial, \"initial_padded_hull_free\": hull_free(*initial[:2]),\n          \
    \       \"candidate_straight_segments\": [], \"qualification\": \"static map-only,\
    \ not localization or planning\"}\n    for distance in (1.0, 3.0):\n        samples\
    \ = [(initial[0]+float(d),initial[1]) for d in np.arange(0,distance+.001,.025)]\n\
    \        map_audit[\"candidate_straight_segments\"].append({\"goal\": [initial[0]+distance,initial[1],0],\n\
    \            \"length_m\": distance, \"padded_hull_free_all_samples\": all(hull_free(x,y)\
    \ for x,y in samples)})\n    (directory / \"hotel_L1.yaml\").write_bytes(map_path.read_bytes())\n\
    \    (directory / \"hotel_L1.pgm\").write_bytes(image_path.read_bytes())\n   \
    \ (directory / \"map-audit.json\").write_text(json.dumps(map_audit,indent=2))\n\
    \    report = {\"source_world_sha256\": hashlib.sha256(source_world.encode()).hexdigest(),\n\
    \              \"source_urdf_sha256\": hashlib.sha256(source_urdf.encode()).hexdigest(),\n\
    \              \"outputs\": {p.name: hashlib.sha256(p.read_bytes()).hexdigest()\
    \ for p in directory.iterdir()}}\n    (directory / \"assets.json\").write_text(json.dumps(report,\
    \ indent=2))\n    return report\n"
  run_native_suite.py: "\"\"\"Pod entrypoint, retaining test artifacts until the orchestrator\
    \ retrieves them.\"\"\"\nimport json\nfrom pathlib import Path\nimport subprocess\n\
    import sys\nimport time\n\nroot = Path(__file__).resolve().parent\nresults = []\n\
    for command in ([sys.executable, \"-m\", \"unittest\", \"discover\", \"-s\", str(root),\
    \ \"-p\", \"test_*.py\", \"-v\"],\n                [sys.executable, str(root /\
    \ \"verify_frame_bridge.py\")],\n                [\"/opt/semantic-safety/build/test_native_lease\"\
    ],\n                [sys.executable, str(root / \"verify_native_watchdog.py\"\
    )]):\n    result = subprocess.run(command, timeout=100)\n    results.append({\"\
    command\": command, \"returncode\": result.returncode})\n    if result.returncode:\n\
    \        break\nPath(\"/tmp/phase5-suite.json\").write_text(json.dumps(results,\
    \ indent=2))\nprint(json.dumps({\"event\": \"native_suite_finished\", \"results\"\
    : results}), flush=True)\ntime.sleep(200)  # pod stays available for evidence\
    \ retrieval; activeDeadline=300s\n"
  safety_core.py: "\"\"\"Phase 5 candidate: ROS-independent, fail-latched command\
    \ admission.\n\nThis is not a safety-certified controller or an actuator watchdog.\
    \ Adapters must\nvalidate/bind payloads before submitting Evidence, cancel tasks\
    \ on a trip, and\nindependently establish stationary + idle before explicit rearm.\
    \ A final receiver\nmust run next to the actuator; its own death still requires\
    \ an actuator-side\nwatchdog. No functions in this module publish commands or\
    \ automatically rearm.\nAll times are integer nanoseconds; monotonic clocks never\
    \ cross machines.\n\"\"\"\nfrom dataclasses import dataclass\nimport math\nimport\
    \ uuid\n\nMS = 1_000_000\nSTALE_NS = 500 * MS\nCOMMAND_NS = 100 * MS\nLEASE_NS\
    \ = 80 * MS\nUNCERTAINTY_NS = 2 * MS\nTICK_NS = 20 * MS\nZERO = (0.0, 0.0, 0.0)\
    \  # x, y, yaw; diff-drive only\n\n\n@dataclass(frozen=True)\nclass Now:\n   \
    \ steady: int\n    wall: int\n    ros: int\n\n\n@dataclass(frozen=True)\nclass\
    \ Evidence:\n    epoch: str\n    sequence: int\n    wall: int\n    ros: int\n\n\
    \n@dataclass(frozen=True)\nclass Lease:\n    evidence: Evidence\n    deadline:\
    \ int\n\n\n@dataclass(frozen=True)\nclass Command:\n    session: str\n    sequence:\
    \ int\n    issued_wall: int\n    expires_wall: int\n    velocity: tuple[float,\
    \ float, float]\n\n\ndef integer(value):\n    return type(value) is int and value\
    \ >= 0\n\n\ndef velocity_ok(value):\n    return (isinstance(value, (tuple, list))\
    \ and len(value) == 3\n            and all(type(v) in (int, float) and math.isfinite(v)\
    \ for v in value)\n            and -0.10 <= value[0] <= 0.15 and value[1] == 0.0\n\
    \            and abs(value[2]) <= 0.5)\n\n\nclass SafetyGate:\n    \"\"\"Pure\
    \ state machine. Call tick on a wall/steady timer, never a ROS timer.\"\"\"\n\n\
    \    def __init__(self, *, require_semantics=True):\n        self.required = (\"\
    clock\", \"scan\", \"odom\", \"tf\") + (\n            (\"camera\", \"semantic\"\
    , \"inference_heartbeat\") if require_semantics else ())\n        self.leases\
    \ = {}\n        self.last_time = None\n        self.barrier_wall = -1\n      \
    \  self.armed = False\n        self.reason = \"startup_disarmed\"\n        self.trigger_steady\
    \ = None\n        self.session = None\n        self.sequence = -1\n        self.command_sequence\
    \ = -1\n        self.command_deadline = None\n        self.command_wall = -1\n\
    \        self.velocity = ZERO\n\n    def trip(self, reason, now):\n        # Retain\
    \ the first trigger/reason; subsequent late successes or faults\n        # must\
    \ not move its stopping-latency origin or silently clear it.\n        if self.armed\
    \ or self.trigger_steady is None:\n            self.reason = reason\n        \
    \    self.trigger_steady = now.steady\n        # A second fault during recovery\
    \ invalidates partially refreshed input\n        # too, without rewriting the\
