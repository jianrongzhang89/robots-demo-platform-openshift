    \ None\n    child = None\n    succeeded = False\n    with (args.output / \"gazebo.log\"\
    ).open(\"w+\") as log:\n        try:\n            process = subprocess.Popen([\"\
    gz\", \"sim\", \"--force-version\", \"8\", \"-r\", \"-s\", \"-v\", \"2\",\n  \
