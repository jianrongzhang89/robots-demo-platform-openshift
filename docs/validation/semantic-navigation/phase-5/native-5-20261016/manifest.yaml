    gz-record\"),\n                                        str(args.output / \"assets/watchdog.world\"\
    )], stdout=log, stderr=subprocess.STDOUT)\n            until(lambda t: len(t)>50\
    \ and t[-1][\"physical\"] and t[-1][\"physical\"][\"velocity_valid\"] and t[-1][\"\
    physical\"][\"speed\"]<.005, 30)\n            time.sleep(.5)\n            assert\
    \ all(t[\"vx\"]==0 and not t[\"armed\"] for t in snapshot()), \"startup moved\"\
    \n            checks.append({\"case\": \"startup_disarmed\", \"passed\": True})\n\
    \            # Exercise the physics-thread clamp against a retained/raw Twist\n\
