    \ False\n        self.last_send = now.steady\n        self.event(\"lease_enqueued\"\
    ,sequence=packet.sequence,issued_wall=packet.issued_wall,\n                  \
    \ expires_wall=packet.expires_wall,source_wall=self.gate.command_wall,\n     \
    \              velocity=packet.velocity)\n        return True\n\n    def tick(self):\n\
    \        now = self.now()\n        self.gate.tick(now)\n        if self.state\
    \ != \"stopped\" and not self.gate.armed:\n            self.stop(self.gate.reason)\n\
