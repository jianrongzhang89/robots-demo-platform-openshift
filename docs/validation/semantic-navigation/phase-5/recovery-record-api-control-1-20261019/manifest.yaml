  tf_fault_probe.py: "\"\"\"Fault routing and evidence predicates for the private\
    \ hotel test only.\n\nNo clock, command, or freshness thresholds are changed by\
    \ these helpers.\n\"\"\"\nimport time\n\n\nclass TfDeliveryFilter:\n    \"\"\"\
    Drop only dynamic map->odom updates destined for the probe buffer.\"\"\"\n   \
    \ def __init__(self):\n        self.blocked=False\n        self.dropped=[]\n\n\
    \    def admit(self, transform):\n        if (self.blocked and transform.header.frame_id.lstrip(\"\
    /\")==\"map\"\n                and transform.child_frame_id.lstrip(\"/\")==\"\
    odom\"):\n            stamp=transform.header.stamp\n            self.dropped.append({\"\
    stamp\":stamp.sec*1_000_000_000+stamp.nanosec,\n                             \
    \    \"wall_ns\":time.time_ns(),\"steady_ns\":time.monotonic_ns()})\n        \
    \    return False\n        return True\n\n\ndef map_failure(trace, injected_wall,\
    \ injected_sim):\n    \"\"\"Require a new capture beyond the frozen map edge,\
    \ with live odometry.\"\"\"\n    return next((r for r in trace\n        if r.get(\"\
    first_failure_wall_ns\",0)>=injected_wall and r[\"stamp\"]>injected_sim\n    \
    \    and r.get(\"transform_available\") is False and r.get(\"first_error\")\n\
    \        and r.get(\"map_to_odom_latest\",float(\"inf\"))<r[\"stamp\"]\n     \
    \   and r.get(\"odom_to_lidar_frame_latest\",-1)>=r[\"stamp\"]),None)\n\n\ndef\
    \ stop_reason_qualified(mode, reason):\n    # A publisher outage can interrupt\
    \ Nav2's command production before the\n    # independently configured TF lease\
    \ expires. Retain the first reason.\n    return reason==\"tf_stale\" or mode==\"\
    amcl\" and reason==\"command_expired\"\n"
