    \    if rear_casters:\n        world_text,_=add_rear_casters(world_text,(out/\"\
    assets/robot.urdf\").read_text())\n    tree=ET.fromstring(instrument(world_text,rear_casters=rear_casters))\n\
    \    tree.find(\"world\").append(ET.fromstring('''<model name=\"contact_probe\"\
    ><static>true</static>\n      <pose>0.08 0.10 0.12 0 0 0</pose><link name=\"link\"\
    ><collision name=\"obstacle\">\n      <geometry><box><size>0.08 0.08 0.2</size></box></geometry></collision></link></model>'''))\n\
    \    world.write_text(ET.tostring(tree,encoding=\"unicode\"))\n    rows=[]; native=[];\
    \ lock=threading.Lock(); node=Node()\n    def receive(m,target):\n        with\
    \ lock: target.append(json.loads(m.data))\n    node.subscribe(StringMsg,\"/phase5/contact_audit\"\
    ,lambda m:receive(m,rows))\n    node.subscribe(StringMsg,\"/phase5/drive/status\"\
    ,lambda m:receive(m,native))\n    passed=False\n    with (out/\"gazebo.log\").open(\"\
    w\") as log:\n        server=subprocess.Popen([\"gz\",\"sim\",\"--force-version\"\
    ,\"8\",\"-r\",\"-s\",\n            \"--record-path\",str(out/\"gz-record\"),str(world)],stdout=log,stderr=subprocess.STDOUT)\n\
    \        try:\n            until=time.monotonic()+15\n            while time.monotonic()<until:\n\
