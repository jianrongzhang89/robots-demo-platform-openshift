    \            if not self.gate.armed: self.stop(self.gate.reason)\n           \
    \ return False\n        self.event(\"wait_zero_hold\",task=self.task_token,deadline=self.gate.command_deadline)\n\
    \        return self.send_packet(now)\n\n    def send_packet(self, now):\n   \
    \     if self.state == \"stopped\": return False\n        if self.state == \"\
    active\" and not self.registry_owned(self.task_token):\n            self.stop(\"\
    unowned_or_unavailable_task\"); return False\n        if self.state == \"arming\"\
    \ and not self.registry_idle():\n            self.stop(\"task_appeared_during_arm\"\
    ); return False\n        if self.clock.fault or not self.clock.last or not 0 <=\
    \ now.wall-self.clock.last[\"wall_ns\"] < 100*MS:\n            self.stop(self.clock.fault\
