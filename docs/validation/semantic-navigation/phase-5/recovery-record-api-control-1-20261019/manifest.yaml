  priority_pump.py: "\"\"\"Bounded single-thread callback scheduling; no timing/authority\
    \ decisions.\n\nCommand ingress has its own executor, so sensor/diagnostic wait-set\
    \ ordering\ncannot put it behind a full observer callback batch. All callbacks\
    \ and guard\nticks still run on one thread. Four ingress and four observer polls\
    \ per round\nbound both workloads without starving commands, TF or cancellation.\
    \ A zero-time\nexecutor poll need not execute a callback (including when finishing\
    \ a previous\nready-set iteration). Native queues are ingested between observer\
    \ callbacks.\n\"\"\"\nimport time\n\n\nclass StageTimings:\n    \"\"\"Bounded\
    \ diagnostics only; never supplies time or authority to the guard.\"\"\"\n   \
    \ def __init__(self, *, now=time.monotonic_ns, threshold_ns=10_000_000, capacity=2000):\n\
    \        self.now, self.threshold_ns, self.capacity = now, threshold_ns, capacity\n\
    \        self.stages, self.slow, self.dropped = {}, [], 0\n\n    def call(self,\
    \ stage, callback):\n        start = self.now()\n        try:\n            return\
    \ callback()\n        finally:\n            end = self.now()\n            duration\
    \ = end-start\n            stats = self.stages.setdefault(stage, {\"calls\":0,\
    \ \"maximum_ns\":0})\n            stats[\"calls\"] += 1\n            stats[\"\
    maximum_ns\"] = max(stats[\"maximum_ns\"], duration)\n            if duration\
    \ >= self.threshold_ns:\n                if len(self.slow) < self.capacity:\n\
    \                    self.slow.append({\"stage\":stage, \"start_steady_ns\":start,\n\
    \                                      \"end_steady_ns\":end, \"duration_ns\"\
    :duration})\n                else:\n                    self.dropped += 1\n\n\
    \    def report(self):\n        return {\"stages\":self.stages, \"slow\":self.slow,\
    \ \"dropped\":self.dropped,\n                \"threshold_ns\":self.threshold_ns}\n\
    \n\ndef audit_timing(info, callback_wall):\n    \"\"\"Installed rclpy passes MessageInfo\
    \ as a dictionary; audit hop only.\"\"\"\n    return {\"wall_received\":callback_wall,\n\
    \            \"audit_source_timestamp\":info[\"source_timestamp\"],\n        \
    \    \"audit_received_timestamp\":info[\"received_timestamp\"]}\n\n\ndef pump_round(*,\
    \ ingress, observer, task, native, guard, diagnostics):\n    native()\n    for\
    \ _ in range(4):\n        ingress()\n    for _ in range(4):\n        observer()\n\
    \        native()\n    task()\n    native()\n    guard()\n    diagnostics()\n"
  resource_probe.py: "\"\"\"Read-only private-fixture resource sampling in a separate\
    \ process.\n\nNo ROS/Gazebo imports, control endpoints, or readiness decisions.\
    \ Samples retain\ntheir own steady timestamps; sampling gaps are evidence, never\
    \ interpolated.\nWrite once on shutdown so diagnostic disk traffic is outside\
    \ the moving trial.\n\"\"\"\nimport argparse\nimport json\nfrom pathlib import\
    \ Path\nimport signal\nimport time\n\n\ndef counters(text):\n    return {parts[0]:int(parts[1])\
    \ for line in text.splitlines()\n            if len(parts:=line.split())==2}\n\
    \n\ndef pressure(text):\n    return {parts[0]:{k:float(v) if k!=\"total\" else\
    \ int(v)\n                     for k,v in (item.split(\"=\",1) for item in parts[1:])}\n\
    \            for line in text.splitlines() if (parts:=line.split())}\n\n\ndef\
    \ process_stat(text):\n    # comm may include spaces or parentheses. Fields below\
    \ are kernel stat\n    # field numbers, with field 3 (state) at tail[0]. Tick\
    \ counts stay raw.\n    end=text.rfind(\")\")\n    tail=text[end+2:].split()\n\
    \    return {\"comm\":text[text.index(\"(\")+1:end],\"state\":tail[0],\n     \
    \       \"ppid\":int(tail[1]),\"minflt\":int(tail[7]),\"majflt\":int(tail[9]),\n\
    \            \"utime_ticks\":int(tail[11]),\"stime_ticks\":int(tail[12]),\n  \
    \          \"threads\":int(tail[17]),\"start_ticks\":int(tail[19]),\"rss_pages\"\
    :int(tail[21])}\n\n\ndef snapshot(cgroup=Path(\"/sys/fs/cgroup\"), proc=Path(\"\
    /proc\"), *, processes=False):\n    row={\"steady_ns\":time.monotonic_ns(),\"\
    wall_ns\":time.time_ns(),\"errors\":{}}\n    for name,parse in ((\"cpu.stat\"\
    ,counters),(\"cpu.pressure\",pressure),\n                       (\"io.pressure\"\
    ,pressure),(\"memory.events\",counters),\n                       (\"memory.pressure\"\
    ,pressure)):\n        try: row[name]=parse((cgroup/name).read_text())\n      \
    \  except (OSError,ValueError) as error: row[\"errors\"][name]=str(error)\n  \
    \  if processes:\n        row[\"processes\"]={}\n        try:\n            pids=(cgroup/\"\
    cgroup.procs\").read_text().split()\n            for pid in pids:\n          \
    \      try:\n                    details=process_stat((proc/pid/\"stat\").read_text())\n\
    \                    details[\"io\"]=counters((proc/pid/\"io\").read_text().replace(\"\
    :\", \"\"))\n                    details[\"schedstat\"]=[int(n) for n in (proc/pid/\"\
    schedstat\").read_text().split()]\n                    row[\"processes\"][pid]=details\n\
    \                except (OSError,ValueError,IndexError) as error:\n          \
    \          row[\"errors\"][\"pid:\"+pid]=str(error)\n        except OSError as\
    \ error: row[\"errors\"][\"cgroup.procs\"]=str(error)\n    row[\"end_steady_ns\"\
    ]=time.monotonic_ns()\n    return row\n\n\ndef main():\n    parser=argparse.ArgumentParser(description=__doc__)\n\
