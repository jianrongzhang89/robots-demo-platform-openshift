    \ in (1,2,3):\n                self.fault = \"terminal_action_reactivated\"; return\n\
    \            self.goals[endpoint][token] = status\n            if old!=status:\n\
    \                self.events.append({\"endpoint\":endpoint,\"token\":token,\"\
