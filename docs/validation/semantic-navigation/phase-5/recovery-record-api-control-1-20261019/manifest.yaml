    \        self.graph_ok = False\n        self.fault = None\n        self.events\
    \ = []\n\n    def observe(self, endpoint, rows, *, wall_ns=None, steady_ns=None):\n\
    \        if endpoint not in self.endpoints:\n            self.fault = \"unexpected_action_endpoint\"\
