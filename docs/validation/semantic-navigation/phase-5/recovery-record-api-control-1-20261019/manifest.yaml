    pose\")) != [-.032, 0, .172, 0, 0, 0]:\n        raise ValueError(\"unqualified\
    \ lidar pose\")\n    sensor = lidar.find(\"sensor[@name='lidar']\")\n    if values(sensor.findtext(\"\
    pose\")) != [0, 0, .01, 0, 0, 0]:\n        raise ValueError(\"unqualified lidar\
    \ sensor offset\")\n    if lidar_max_range is not None:\n        maximum=sensor.find(\"\
    lidar/range/max\")\n        if lidar_max_range not in (3.5,12.) or maximum is\
    \ None or float(maximum.text)!=3.5:\n            raise ValueError(\"unqualified\
    \ virtual lidar range\")\n        maximum.text=str(lidar_max_range)\n    if physics_step\
    \ is not None:\n        step=world.find(\"world/physics/max_step_size\")\n   \
    \     if physics_step not in (.001,.002,.01) or step is None or float(step.text)!=.01:\n\
    \            raise ValueError(\"unqualified private physics step\")\n        step.text=str(physics_step)\n\
    \    if lidar_update_rate is not None:\n        if type(lidar_update_rate) not\
