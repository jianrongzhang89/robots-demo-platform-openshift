    <link name=\"base_scan\"><collision name=\"lidar_collision\"/></link>\n<link name=\"\
    wheel_left_link\"><pose>0 .144 .023 -1.57 0 0</pose><collision name=\"left_wheel_collision\"\
    ><geometry><cylinder><radius>.033</radius></cylinder></geometry></collision></link>\n\
    <link name=\"wheel_right_link\"><pose>0 -.144 .023 -1.57 0 0</pose><collision\
    \ name=\"right_wheel_collision\"><geometry><cylinder><radius>.033</radius></cylinder></geometry></collision></link>\n\
    </model></world></sdf>'''\n\n\nclass SupportTests(unittest.TestCase):\n    def\
    \ test_preserves_original_links_and_adds_rolling_supports_within_hull(self):\n\
    \        world,urdf=add_rear_casters(WORLD,'<robot><link name=\"base_link\"/></robot>')\n\
    \        before=ET.fromstring(WORLD).find('.//model'); after=ET.fromstring(world).find('.//model')\n\
    \        for link in before.findall('link'):\n            self.assertEqual(ET.tostring(link),ET.tostring(after.find(f\"\
    link[@name='{link.get('name')}']\")))\n        self.assertEqual(len(after.findall('link/collision')),6)\n\
    \        for name,x,y in CASTERS:\n            self.assertTrue(-.172<x-.005<x+.005<.108\
