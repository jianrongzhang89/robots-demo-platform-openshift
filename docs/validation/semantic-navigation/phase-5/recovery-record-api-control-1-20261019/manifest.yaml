  hotel_guard_adapter.py: "\"\"\"Real-input adapter for the isolated no-recovery hotel\
    \ integration subgate.\n\nSingle executor thread only. Native status is the conservative\
    \ capture clock;\nscan/odom and capture-time TF are independently observed, never\
    \ substituted\nwith physics status. No semantic policy or inference freshness\
    \ is implied.\n\"\"\"\nimport time\nimport math\nfrom action_msgs.msg import GoalStatusArray\n\
    from action_msgs.srv import CancelGoal\nfrom nav2_msgs.msg import CollisionMonitorState\n\
    from rclpy.qos import QoSProfile, DurabilityPolicy, ReliabilityPolicy\nfrom rclpy.time\
    \ import Time\n\nfrom capture_joiner import CaptureJoiner\nfrom command_audit\
