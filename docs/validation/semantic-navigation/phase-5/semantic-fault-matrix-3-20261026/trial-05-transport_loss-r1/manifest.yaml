    : client.events, \"topics\": graph}), flush=True)\n    finally:\n        executor.shutdown();\
    \ backend.server.destroy(); client.client.destroy()\n        backend.destroy_node();\
    \ client.destroy_node(); rclpy.shutdown()\n\n\nif __name__ == \"__main__\":\n\
    \    main()\n"
  wait_metrics.py: "\"\"\"Measure zero-only Wait after the native actuator applies\
    \ normalization.\"\"\"\n\n\ndef wait_zero_metrics(trace, first_hold, end, session):\n\
    \    failed={\"passed\":False,\"reason\":\"missing_wait_native_evidence\",\"native_samples\"\
    :0}\n    if first_hold is None or end is None or not session: return failed\n\
    \    rows=[r for r in trace if first_hold<=r.get(\"steady_ns\",0)<=end]\n    first=next((i\
    \ for i,r in enumerate(rows) if r[\"applied_vx\"]==r[\"applied_wz\"]==0\n    \
    \            and first_hold<=r[\"applied_steady_ns\"]<=r[\"steady_ns\"]),None)\n\
    \    if first is None: return failed\n    latency=(rows[first][\"applied_steady_ns\"\
    ]-first_hold)/1e6\n    held=rows[first:]\n    maximum=max(max(abs(r[\"applied_vx\"\
    ]),abs(r[\"applied_wz\"])) for r in held)\n    gap=max(((b[\"steady_ns\"]-a[\"\
    steady_ns\"])/1e6 for a,b in zip(rows,rows[1:])),default=0.)\n    # A hold enqueued\
    \ in Python is not instant actuation. Only the already\n    # permitted <=0.005\
    \ settling tail may precede native zero; never accept\n    # renewed motion after\
    \ native zero, lost authority, or missing coverage.\n    passed=(len(held)>=10\
    \ and 0<=latency<=100 and rows[0][\"steady_ns\"]-first_hold<=50_000_000\n    \
    \        and 0<=gap<=50 and end-rows[-1][\"steady_ns\"]<=50_000_000\n        \
    \    and all(r.get(\"session\")==session and r.get(\"armed\") and not r.get(\"\
    pending\") for r in rows)\n            and all(max(abs(r[\"applied_vx\"]),abs(r[\"\
    applied_wz\"]))<=.005 for r in rows[:first])\n            and maximum==0)\n  \
    \  return {\"passed\":bool(passed),\"reason\":\"native_zero_hold\" if passed else\
    \ \"wait_zero_contract_failed\",\n            \"native_samples\":len(held),\"\
    normalization_to_native_zero_ms\":latency,\n            \"pre_zero_samples\":first,\"\
    maximum_abs_applied_velocity\":maximum,\n            \"maximum_sample_gap_ms\"\
    :gap}\n"
