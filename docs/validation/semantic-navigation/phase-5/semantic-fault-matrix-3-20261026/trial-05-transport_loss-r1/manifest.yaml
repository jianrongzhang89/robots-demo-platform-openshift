  verify_nav_task_client.py: "\"\"\"Real ROS action protocol, controlled fake navigation\
    \ backend; NO motion.\"\"\"\nimport json\nimport os\nimport time\nimport uuid\n\
    \nimport rclpy\nfrom nav2_msgs.action import NavigateToPose\nfrom rclpy.action\
    \ import ActionServer, CancelResponse, GoalResponse\nfrom rclpy.executors import\
    \ SingleThreadedExecutor\nfrom rclpy.node import Node\nfrom rclpy.task import\
    \ Future\n\nfrom nav_task_client import NavTaskClient\n\n\nclass Backend(Node):\n\
    \    def __init__(self):\n        super().__init__(\"phase5_fake_navigation_backend\"\
    )\n        self.reject_goal = self.reject_cancel = False\n        self.goals,\
    \ self.results = {}, {}\n        self.server = ActionServer(self, NavigateToPose,\
    \ \"/phase5_fixture/navigate_to_pose\",\n            execute_callback=self.execute,\
    \ goal_callback=self.goal,\n            handle_accepted_callback=self.accepted,\
    \ cancel_callback=self.cancel)\n\n    def goal(self, request):\n        return\
    \ GoalResponse.REJECT if self.reject_goal else GoalResponse.ACCEPT\n\n    def\
    \ accepted(self, handle):\n        token = str(uuid.UUID(bytes=bytes(handle.goal_id.uuid)))\n\
    \        self.goals[token], self.results[token] = handle, Future()\n        handle.execute()\n\
    \n    async def execute(self, handle):\n        token = str(uuid.UUID(bytes=bytes(handle.goal_id.uuid)))\n\
    \        return await self.results[token]\n\n    def cancel(self, handle):\n \
    \       return CancelResponse.REJECT if self.reject_cancel else CancelResponse.ACCEPT\n\
    \n    def finish(self, token, status):\n        handle = self.goals[token]\n \
    \       {4: handle.succeed, 5: handle.canceled, 6: handle.abort}[status]()\n \
    \       self.results[token].set_result(NavigateToPose.Result())\n\n\ndef main():\n\
    \    if os.getenv(\"ROS_DOMAIN_ID\") != \"85\" or \"phase5\" not in os.getenv(\"\
    CYCLONEDDS_URI\", \"\"):\n        raise RuntimeError(\"isolated fixture only\"\
    )\n    rclpy.init()\n    revoked, checks = [], []\n    backend = Backend()\n \
    \   client = NavTaskClient(\"/phase5_fixture/navigate_to_pose\", lambda token,\
    \ reason: revoked.append((token,reason)))\n    executor = SingleThreadedExecutor();\
    \ executor.add_node(backend); executor.add_node(client)\n\n    def until(predicate,\
