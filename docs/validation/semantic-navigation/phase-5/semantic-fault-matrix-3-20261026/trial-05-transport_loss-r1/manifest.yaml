  test_tf2_polling_patch.py: "\"\"\"The private TF2 poll patch changes only the advanced\
    \ two-time lookup.\"\"\"\nfrom pathlib import Path\nimport tempfile\nimport unittest\n\
    \nfrom patch_tf2_polling import patch_file, SLEEP_1MS, SLEEP_10MS\n\n\nclass Tf2PollingPatchTests(unittest.TestCase):\n\
    \    def test_only_advanced_lookup_poll_changes(self):\n        source = \"\"\"\
    \nbool Buffer::canTransform(const std::string & target_frame, const std::string\
    \ & source_frame,\n  const tf2::TimePoint & time, const tf2::Duration timeout)\
    \ const\n{\n  std::this_thread::sleep_for(std::chrono::milliseconds(10));\n}\n\
    bool Buffer::canTransform(const std::string & target_frame, const tf2::TimePoint\
    \ & target_time,\n  const std::string & source_frame, const tf2::TimePoint & source_time,\n\
    \  const std::string & fixed_frame, const tf2::Duration timeout) const\n{\n  std::this_thread::sleep_for(std::chrono::milliseconds(10));\n\
    }\nTransformStampedFuture Buffer::waitForTransform() { return {}; }\n\"\"\"\n\
    \        with tempfile.TemporaryDirectory() as directory:\n            path =\
    \ Path(directory) / \"buffer.cpp\"\n            path.write_text(source)\n    \
    \        patch_file(path)\n            result = path.read_text()\n        self.assertEqual(result.count(SLEEP_1MS),\
    \ 1)\n        self.assertEqual(result.count(SLEEP_10MS), 1)\n        self.assertIn(\"\
    const tf2::TimePoint & time\", result)\n\n    def test_refuses_unexpected_or_already_patched_source(self):\n\
    \        for source in (\"no advanced overload\", \"\"\"\nbool Buffer::canTransform(const\
    \ std::string & target_frame, const tf2::TimePoint & target_time,\n  const std::string\
    \ & source_frame, const tf2::TimePoint & source_time,\n  const std::string & fixed_frame,\
    \ const tf2::Duration timeout) const\n{\n  std::this_thread::sleep_for(std::chrono::milliseconds(1));\n\
    }\nTransformStampedFuture Buffer::waitForTransform() { return {}; }\n\"\"\"):\n\
    \            with self.subTest(source=source[:20]), tempfile.TemporaryDirectory()\
    \ as directory:\n                path = Path(directory) / \"buffer.cpp\"\n   \
