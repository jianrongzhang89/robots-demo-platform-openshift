    ,\n           \"hotel\":\"verify_hotel_stack.py\", \"hotel-guarded\":\"verify_hotel_stack.py\"\
    }[os.getenv(\"PHASE5_SUITE\", \"native\")]\nfor command in ([sys.executable, \"\
    -m\", \"unittest\", \"discover\", \"-s\", str(root), \"-p\", \"test_*.py\", \"\
    -v\"],\n                [sys.executable, str(root / \"verify_frame_bridge.py\"\
    )],\n                [sys.executable, str(root / \"verify_hotel_adapter.py\")],\n\
    \                [\"/opt/semantic-safety/build/test_native_lease\"],\n       \
    \         [sys.executable, str(root / fixture)]):\n    result = subprocess.run(command,\
    \ timeout=280 if fixture==\"verify_hotel_stack.py\" else 100)\n    results.append({\"\
    command\": command, \"returncode\": result.returncode})\n    if result.returncode:\n\
    \        break\nPath(\"/tmp/phase5-suite.json\").write_text(json.dumps(results,\
    \ indent=2))\nprint(json.dumps({\"event\": \"native_suite_finished\", \"results\"\
