  patch_tf2_polling.py: "#!/usr/bin/env python3\n\"\"\"Reduce only TF2's blocking\
    \ advanced-lookup poll interval for a private test.\"\"\"\nimport re\nimport sys\n\
    from pathlib import Path\n\n\nSLEEP_10MS = \"std::this_thread::sleep_for(std::chrono::milliseconds(10));\"\
    \nSLEEP_1MS = \"std::this_thread::sleep_for(std::chrono::milliseconds(1));\"\n\
    ADVANCED_LOOKUP = re.compile(\n    r\"bool\\s+Buffer::canTransform\\(\\s*\"\n\
    \    r\"const std::string\\s*&\\s*target_frame,\\s*\"\n    r\"const tf2::TimePoint\\\
    s*&\\s*target_time,\\s*\"\n    r\"const std::string\\s*&\\s*source_frame,\\s*\"\
    \n    r\"const tf2::TimePoint\\s*&\\s*source_time,\\s*\"\n    r\"const std::string\\\
    s*&\\s*fixed_frame,\",\n    re.DOTALL,\n)\n\n\ndef patch_file(path: Path) -> None:\n\
    \    source = path.read_text()\n    match = ADVANCED_LOOKUP.search(source)\n \
    \   if match is None or ADVANCED_LOOKUP.search(source, match.end()) is not None:\n\
    \        raise RuntimeError(\"expected exactly one advanced two-time canTransform\
    \ overload\")\n    end = source.find(\"TransformStampedFuture\", match.end())\n\
    \    if end < 0:\n        raise RuntimeError(\"could not locate end of advanced\
    \ canTransform overload\")\n    block = source[match.start():end]\n    if block.count(SLEEP_10MS)\
    \ != 1 or SLEEP_1MS in block:\n        raise RuntimeError(\"expected one unpatched\
    \ 10 ms sleep in advanced canTransform\")\n    patched = block.replace(SLEEP_10MS,\
    \ SLEEP_1MS, 1)\n    path.write_text(source[:match.start()] + patched + source[end:])\n\
    \n\nif __name__ == \"__main__\":\n    if len(sys.argv) != 2:\n        raise SystemExit(\"\
    usage: patch_tf2_polling.py /path/to/tf2_ros/src/buffer.cpp\")\n    patch_file(Path(sys.argv[1]))\n"
  phase5_cpu_contention.py: "#!/usr/bin/env python3\n\"\"\"Apply a bounded, reproducible\
    \ two-worker CPU load to a private Phase 5 probe.\"\"\"\nimport json\nimport argparse\n\
    import multiprocessing\nimport os\nfrom pathlib import Path\nimport resource\n\
    import signal\nimport sys\nimport time\n\n\nWORKERS = 2\nshutdown_requested =\
    \ False\n\n\ndef burn(stop):\n    value = 1\n    while not stop.is_set():\n  \
    \      value = (value * 1103515245 + 12345) & 0x7FFFFFFF\n    return value\n\n\
    \ndef main():\n    parser = argparse.ArgumentParser(description=__doc__)\n   \
    \ parser.add_argument(\"--pid-file\", type=Path, required=True)\n    args = parser.parse_args()\n\
    \    context = multiprocessing.get_context(\"fork\")\n    stop = context.Event()\n\
    \n    def request_stop(_signal, _frame):\n        global shutdown_requested\n\
    \        shutdown_requested = True\n\n    signal.signal(signal.SIGTERM, request_stop)\n\
    \    signal.signal(signal.SIGINT, request_stop)\n    args.pid_file.write_text(str(os.getpid()))\n\
    \    workers = [context.Process(target=burn, args=(stop,), name=f\"phase5-cpu-{i}\"\
    )\n               for i in range(WORKERS)]\n    started = time.monotonic()\n \
    \   for worker in workers:\n        worker.start()\n    print(json.dumps({\"kind\"\
    : \"phase5_cpu_contention\", \"state\": \"started\",\n                      \"\
    workers\": WORKERS, \"requested_cpu_cores\": WORKERS}), flush=True)\n    try:\n\
    \        while not shutdown_requested:\n            if any(not worker.is_alive()\
    \ for worker in workers):\n                break\n            time.sleep(0.2)\n\
    \    finally:\n        stop.set()\n        for worker in workers:\n          \
    \  worker.join(timeout=3.0)\n        for worker in workers:\n            if worker.is_alive():\n\
    \                worker.terminate()\n                worker.join(timeout=1.0)\n\
    \    elapsed = max(time.monotonic() - started, 1e-9)\n    usage = resource.getrusage(resource.RUSAGE_CHILDREN)\n\
    \    child_cpu = usage.ru_utime + usage.ru_stime\n    result = {\"kind\": \"phase5_cpu_contention\"\
    , \"state\": \"stopped\",\n              \"workers\": WORKERS, \"wall_seconds\"\
    : round(elapsed, 3),\n              \"child_cpu_seconds\": round(child_cpu, 3),\n\
    \              \"observed_cpu_cores\": round(child_cpu / elapsed, 3),\n      \
    \        \"exit_codes\": [worker.exitcode for worker in workers]}\n    print(json.dumps(result),\
    \ flush=True)\n    args.pid_file.unlink(missing_ok=True)\n    if any(code != 0\
    \ for code in result[\"exit_codes\"]):\n        return 1\n    return 0\n\n\nif\
    \ __name__ == \"__main__\":\n    sys.exit(main())\n"
