    \               self.leases.clear()\n                self.barrier_wall = now.wall\n\
    \                return False\n        if self.armed:\n            # Check BEFORE\
    \ accepting callbacks; late refreshed inputs cannot\n            # conceal a missed\
    \ deadline if the event loop was delayed.\n            failures = []\n       \
    \     for key in self.required:\n                item = self.leases.get(key)\n\
    \                if item is None:\n                    failures.append((now.steady,\
    \ key + \"_missing\"))\n                elif self._expired(item, now):\n     \
    \               failures.append((min(now.steady, item.deadline), key + \"_stale\"\
    ))\n            if now.steady >= self.command_deadline:\n                failures.append((self.command_deadline,\
    \ \"command_expired\"))\n            if failures:\n                trigger, reason\
    \ = min(failures)\n                self.trip(reason, now)\n                self.trigger_steady\
    \ = trigger\n        return True\n\n    @staticmethod\n    def _expired(item,\
