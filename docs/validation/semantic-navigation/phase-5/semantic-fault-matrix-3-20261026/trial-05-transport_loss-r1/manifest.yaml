    \  resolution: 0.05\n      track_unknown_space: true\n      plugins:\n      -\
    \ static_layer\n      - obstacle_layer\n      - inflation_layer\n      static_layer:\n\
    \        plugin: nav2_costmap_2d::StaticLayer\n        map_subscribe_transient_local:\
    \ true\n      obstacle_layer:\n        plugin: nav2_costmap_2d::ObstacleLayer\n\
    \        enabled: true\n        observation_sources: scan\n        scan:\n   \
    \       topic: /robot_1/scan_fixed\n          data_type: LaserScan\n         \
    \ marking: true\n          clearing: true\n          obstacle_max_range: 3.5\n\
    \          raytrace_max_range: 3.5\n          expected_update_rate: 0.5\n    \
    \  inflation_layer:\n        plugin: nav2_costmap_2d::InflationLayer\n       \
    \ enabled: true\n        inflation_radius: 0.35\n        cost_scaling_factor:\
    \ 3.0\n      footprint: '[[-0.172, -0.155], [0.108, -0.155], [0.108, 0.155], [-0.172,\
    \ 0.155]]'\n      footprint_padding: 0.01\n      update_frequency: 10.0\n    \
    \  publish_frequency: 5.0\n      transform_tolerance: 0.2\n      always_send_full_costmap:\
    \ true\nbehavior_server:\n  ros__parameters:\n    use_sim_time: true\n    behavior_plugins:\n\
    \    - spin\n    - backup\n    - drive_on_heading\n    - wait\n    spin:\n   \
    \   plugin: nav2_behaviors::Spin\n    backup:\n      plugin: nav2_behaviors::BackUp\n\
    \    drive_on_heading:\n      plugin: nav2_behaviors::DriveOnHeading\n    wait:\n\
    \      plugin: nav2_behaviors::Wait\n    enable_stamped_cmd_vel: true\n    cycle_frequency:\
    \ 40.0\n    local_frame: odom\n    global_frame: map\n    robot_base_frame: base_footprint\n\
    \    max_rotational_vel: 0.5\n    min_rotational_vel: 0.1\n    rotational_acc_lim:\
    \ 1.0\nsmoother_server:\n  ros__parameters:\n    use_sim_time: true\n    smoother_plugins:\n\
    \    - simple_smoother\n    simple_smoother:\n      plugin: nav2_smoother::SimpleSmoother\n\
    waypoint_follower:\n  ros__parameters:\n    use_sim_time: true\n    stop_on_failure:\
    \ true\nvelocity_smoother:\n  ros__parameters:\n    use_sim_time: true\n    smoothing_frequency:\
    \ 100.0\n    feedback: OPEN_LOOP\n    max_velocity:\n    - 0.15\n    - 0.0\n \
    \   - 0.5\n    min_velocity:\n    - -0.1\n    - 0.0\n    - -0.5\n    max_accel:\n\
    \    - 0.5\n    - 0.0\n    - 1.0\n    max_decel:\n    - -0.8\n    - 0.0\n    -\
    \ -1.5\n    odom_topic: odom\n    velocity_timeout: 0.1\n    enable_stamped_cmd_vel:\
    \ true\n    stamp_smoothed_velocity_with_smoothing_time: false\ncollision_monitor:\n\
    \  ros__parameters:\n    base_frame_id: base_footprint\n    odom_frame_id: odom\n\
    \    cmd_vel_in_topic: cmd_vel_smoothed\n    cmd_vel_out_topic: phase5/collision_checked\n\
    \    state_topic: collision_monitor_state\n    transform_tolerance: 0.1\n    source_timeout:\
    \ 0.5\n    base_shift_correction: true\n    stop_pub_timeout: 2.0\n    polygons:\n\
    \    - StopEnvelope\n    - FootprintApproach\n    FootprintApproach:\n      type:\
    \ polygon\n      action_type: approach\n      footprint_topic: local_costmap/published_footprint\n\
    \      time_before_collision: 1.0\n      simulation_time_step: 0.02\n      min_points:\
    \ 1\n      visualize: false\n      enabled: true\n    observation_sources:\n \
    \   - scan\n    scan:\n      type: scan\n      topic: scan_fixed\n      min_height:\
    \ 0.15\n      max_height: 2.0\n      enabled: true\n    use_sim_time: true\n \
    \   enable_stamped_cmd_vel: true\n    StopEnvelope:\n      type: polygon\n   \
    \   action_type: stop\n      points: '[[-0.332, -0.315], [0.268, -0.315], [0.268,\
    \ 0.315], [-0.332, 0.315]]'\n      min_points: 1\n      visualize: true\n    \
    \  polygon_pub_topic: phase5/stop_polygon\n      enabled: true\n"
  phase5-baseline.xml: "<!-- Isolated integration subgate ONLY. No recovery actions\
    \ are enabled in this\n     tree. Recovery qualification remains a separate Phase\
    \ 5 acceptance item. -->\n<root BTCPP_format=\"4\" main_tree_to_execute=\"MainTree\"\
    >\n  <BehaviorTree ID=\"MainTree\">\n    <Sequence>\n      <ComputePathToPose\
    \ goal=\"{goal}\" path=\"{path}\" planner_id=\"GridBased\"/>\n      <FollowPath\
    \ path=\"{path}\" controller_id=\"FollowPath\"/>\n    </Sequence>\n  </BehaviorTree>\n\
    </root>\n"
  install_phase1_camera.py: "#!/usr/bin/env python3\n\"\"\"Add the isolated semantic-navigation\
    \ RGB-D sensor to a hotel world.\"\"\"\n\nfrom __future__ import annotations\n\
    \nimport argparse\nimport os\nimport xml.etree.ElementTree as ET\nfrom pathlib\
    \ import Path\n\n\ndef add_camera(world_path: Path, robot_name: str = \"robot_1\"\
    ) -> None:\n    tree = ET.parse(world_path)\n    model = tree.getroot().find(f\"\
    .//model[@name='{robot_name}']\")\n    if model is None:\n        raise ValueError(f\"\
    robot model {robot_name!r} not found in {world_path}\")\n    if model.find(\"\
    link[@name='camera_link']\") is not None:\n        raise ValueError(\"camera_link\
    \ already exists; refusing to patch twice\")\n\n    link = ET.SubElement(model,\
    \ \"link\", {\"name\": \"camera_link\"})\n    ET.SubElement(link, \"pose\", {\"\
    relative_to\": \"base_link\"}).text = \"0.11 0 0.15 0 0 0\"\n    inertial = ET.SubElement(link,\
    \ \"inertial\")\n    ET.SubElement(inertial, \"mass\").text = \"0.01\"\n    inertia\
    \ = ET.SubElement(inertial, \"inertia\")\n    for name, value in ((\"ixx\", \"\
    0.00001\"), (\"iyy\", \"0.00001\"), (\"izz\", \"0.00001\"),\n                \
    \        (\"ixy\", \"0\"), (\"ixz\", \"0\"), (\"iyz\", \"0\")):\n        ET.SubElement(inertia,\
    \ name).text = value\n\n    sensor = ET.SubElement(link, \"sensor\", {\"name\"\
    : \"rgbd_camera\", \"type\": \"rgbd_camera\"})\n    ET.SubElement(sensor, \"always_on\"\
    ).text = \"true\"\n    ET.SubElement(sensor, \"update_rate\").text = \"10\"\n\
    \    ET.SubElement(sensor, \"topic\").text = f\"/{robot_name}/camera\"\n    ET.SubElement(sensor,\
    \ \"gz_frame_id\").text = \"camera_color_optical_frame\"\n    camera = ET.SubElement(sensor,\
    \ \"camera\")\n    ET.SubElement(camera, \"horizontal_fov\").text = \"1.04719755\"\
    \n    image = ET.SubElement(camera, \"image\")\n    ET.SubElement(image, \"width\"\
    ).text = \"640\"\n    ET.SubElement(image, \"height\").text = \"480\"\n    ET.SubElement(image,\
    \ \"format\").text = \"R8G8B8\"\n    clip = ET.SubElement(camera, \"clip\")\n\
    \    ET.SubElement(clip, \"near\").text = \"0.15\"\n    ET.SubElement(clip, \"\
    far\").text = \"5.0\"\n    ET.SubElement(sensor, \"visualize\").text = \"false\"\
    \n\n    joint = ET.SubElement(model, \"joint\", {\"name\": \"camera_joint\", \"\
    type\": \"fixed\"})\n    ET.SubElement(joint, \"parent\").text = \"base_link\"\
    \n    ET.SubElement(joint, \"child\").text = \"camera_link\"\n\n    tree.write(world_path,\
    \ encoding=\"utf-8\", xml_declaration=True)\n\n\ndef add_bridge_to_entrypoint(entrypoint_path:\
    \ Path, bridge_config: str) -> None:\n    script = entrypoint_path.read_text()\n\
    \    marker = 'echo \"[hotel-sim] Canonical federated Gazebo simulation ready\"\
    '\n    if \"semantic_camera_bridge\" in script:\n        raise ValueError(\"semantic\
    \ camera bridge is already installed in entrypoint\")\n    if marker not in script:\n\
    \        raise ValueError(f\"expected startup marker not found in {entrypoint_path}\"\
    )\n    command = (\n        'echo \"[semantic-camera] Starting RGB-D Gazebo-to-ROS\
    \ bridge\"\\n'\n        f'ros2 launch ros_gz_bridge ros_gz_bridge.launch.py '\n\
    \        f'bridge_name:=semantic_camera_bridge config_file:={bridge_config} &\\\
    n'\n        'pids+=(\"$!\")\\n\\n'\n    )\n    entrypoint_path.write_text(script.replace(marker,\
    \ command + marker))\n\n\ndef add_phase2_targets(world_path: Path) -> None:\n\
    \    \"\"\"Add a recognizable mat and a visual distractor to the isolated world.\"\
    \"\"\n    tree = ET.parse(world_path)\n    world = tree.getroot().find(\"world\"\
    )\n    if world is None:\n        raise ValueError(f\"world element not found\
    \ in {world_path}\")\n    if world.find(\"model[@name='semantic_target_mat']\"\
    ) is not None:\n        raise ValueError(\"Phase 2 target already exists; refusing\
    \ to patch twice\")\n\n    def slab(name: str, x: float, y: float, sx: float,\
    \ sy: float,\n             color: tuple[float, float, float]) -> ET.Element:\n\
    \        model = ET.Element(\"model\", {\"name\": name})\n        ET.SubElement(model,\
    \ \"static\").text = \"true\"\n        ET.SubElement(model, \"pose\").text = f\"\
    {x} {y} 0.005 0 0 0\"\n        link = ET.SubElement(model, \"link\", {\"name\"\
    : \"surface\"})\n        visual = ET.SubElement(link, \"visual\", {\"name\": \"\
    visual\"})\n        visual_geometry = ET.SubElement(visual, \"geometry\")\n  \
    \      ET.SubElement(visual_geometry, \"box\")\n        ET.SubElement(visual_geometry.find(\"\
    box\"), \"size\").text = f\"{sx} {sy} 0.012\"\n        material = ET.SubElement(visual,\
    \ \"material\")\n        ET.SubElement(material, \"ambient\").text = f\"{color[0]}\
    \ {color[1]} {color[2]} 1\"\n        ET.SubElement(material, \"diffuse\").text\
    \ = f\"{color[0]} {color[1]} {color[2]} 1\"\n        return model\n\n    # The\
    \ validated hotel runtime pose is (15.4014, -31.5940, yaw\u22480).\n    # Place\
    \ the target 2 m ahead; do not use the separate TB3 template pose.\n    world.append(slab(\"\
    semantic_target_mat\", 17.4014, -31.5940, 0.9, 0.65,\n                      (0.85,\
    \ 0.08, 0.06)))\n    # Similar footprint, but a neutral tile-like distractor,\
    \ offset laterally.\n    world.append(slab(\"semantic_distractor_tile\", 17.4014,\
    \ -30.0940, 0.9, 0.65,\n                      (0.55, 0.52, 0.45)))\n    tree.write(world_path,\
    \ encoding=\"utf-8\", xml_declaration=True)\n\n\ndef add_lighting_profile(world_path:\
    \ Path, profile: str) -> None:\n    \"\"\"Apply a repeatable world lighting profile\
    \ before Gazebo starts.\"\"\"\n    if profile == \"baseline\":\n        return\n\
    \    if profile != \"dim\":\n        raise ValueError(f\"unsupported lighting\
    \ profile {profile!r}\")\n    tree = ET.parse(world_path)\n    world = tree.getroot().find(\"\
    world\")\n    if world is None:\n        raise ValueError(f\"world element not\
    \ found in {world_path}\")\n    scene = world.find(\"scene\")\n    light = world.find(\"\
    light[@name='sun']\")\n    if scene is None or light is None:\n        raise ValueError(\"\
    world must contain a scene and the directional light named 'sun'\")\n    scene.find(\"\
    ambient\").text = \"0.08 0.08 0.08\"\n    scene.find(\"background\").text = \"\
    0.12 0.12 0.12\"\n    light.find(\"diffuse\").text = \"0.25 0.25 0.25 1\"\n  \
    \  light.find(\"specular\").text = \"0.05 0.05 0.05 1\"\n    tree.write(world_path,\
    \ encoding=\"utf-8\", xml_declaration=True)\n\n\ndef main() -> None:\n    parser\
    \ = argparse.ArgumentParser()\n    parser.add_argument(\"world\", type=Path)\n\
    \    parser.add_argument(\"--robot\", default=\"robot_1\")\n    parser.add_argument(\"\
    --entrypoint\", type=Path)\n    parser.add_argument(\"--phase2-targets\", action=\"\
    store_true\")\n    parser.add_argument(\"--bridge-config\", default=\"/opt/ros2-demo/config/semantic-camera-bridge.yaml\"\
    )\n    args = parser.parse_args()\n    add_camera(args.world, args.robot)\n  \
    \  if args.phase2_targets:\n        add_phase2_targets(args.world)\n    lighting_profile\
    \ = os.environ.get(\"SEMANTIC_LIGHTING_PROFILE\", \"baseline\")\n    add_lighting_profile(args.world,\
    \ lighting_profile)\n    if args.entrypoint:\n        add_bridge_to_entrypoint(args.entrypoint,\
    \ args.bridge_config)\n    print(f\"Installed 640x480 RGB-D camera at 10 Hz on\
    \ {args.robot}: {args.world}\")\n\n\nif __name__ == \"__main__\":\n    main()\n"
  cyclonedds-phase5.xml: <CycloneDDS><Domain id="any"><General><Interfaces><NetworkInterface
    name="lo"/></Interfaces><AllowMulticast>false</AllowMulticast></General><Discovery><ParticipantIndex>auto</ParticipantIndex></Discovery></Domain></CycloneDDS>
  phase5-sam3-bridge.json5: "{\n  \"plugins\": { \"ros2dds\": { \"allow\": {\n   \
    \   \"publishers\": [\n        \"^/clock$\",\n        \"^/robot_1/camera/color/image_compressed$\"\
    ,\n        \"^/robot_1/camera/depth/image_compressed$\",\n        \"^/robot_1/camera/color/camera_info$\"\
    ,\n        \"^/robot_1/camera/capture_trace$\",\n        \"^/robot_1/camera/compression_trace$\"\
    \n      ],\n      \"subscribers\": [\n        \"^/robot_1/semantic/mask$\",\n\
    \        \"^/robot_1/semantic/points$\",\n        \"^/robot_1/semantic/timing$\"\
    ,\n        \"^/robot_1/semantic/label_info$\",\n        \"^/robot_1/semantic/status$\"\
    ,\n        \"^/robot_1/semantic/ready$\"\n      ]\n    } } },\n  \"mode\": \"\
    client\",\n  \"connect\": { \"endpoints\": [\"tcp/semantic-phase5-sam3-router:17448\"\
    ], \"exit_on_failure\": false },\n  \"scouting\": { \"multicast\": { \"enabled\"\
    : false } }\n}\n"
---
apiVersion: v1
kind: Pod
metadata:
  name: semantic-phase5-native
  namespace: semantic-navigation
spec:
  nodeSelector:
    kubernetes.io/hostname: ip-10-0-44-146.ec2.internal
  tolerations:
  - key: g5-gpu
    operator: Equal
    value: 'true'
    effect: NoSchedule
  - key: g6e-gpu
    operator: Equal
    value: 'true'
    effect: NoSchedule
  restartPolicy: Never
  activeDeadlineSeconds: 600
  automountServiceAccountToken: false
  containers:
  - name: fixture
    image: image-registry.openshift-image-registry.svc:5000/semantic-navigation/semantic-safety@sha256:f854b8385e46fed4c61a59647a40eab349affdca15746d8d60e2e42adbbd0fba
    command:
    - /bin/bash
    - -ec
    args:
    - source /opt/ros/jazzy/setup.bash; source /opt/nav2-smoother-overlay/setup.bash;
      exec python3 /phase5-native/run_native_suite.py
    env:
    - name: PHASE5_SUITE
      value: hotel-guarded
    - name: ROS_DOMAIN_ID
      value: '85'
    - name: RMW_IMPLEMENTATION
      value: rmw_cyclonedds_cpp
    - name: CYCLONEDDS_URI
      value: file:///phase5-native/cyclonedds-phase5.xml
    - name: ROS_LOG_DIR
      value: /tmp/phase5-ros-logs
    - name: PYTHONDONTWRITEBYTECODE
      value: '1'
    - name: GZ_IP
      value: 127.0.0.1
    - name: GZ_PARTITION
      value: phase5-watchdog-native-qualification
    - name: GZ_SIM_SYSTEM_PLUGIN_PATH
      value: /opt/semantic-safety/lib:/usr/lib/x86_64-linux-gnu/gz-sim-8/plugins:/opt/ros/jazzy/opt/gz_sim_vendor/lib/gz-sim-8/plugins
    - name: PHASE5_CONTACT_AUDIT
      value: '1'
    - name: PHASE5_CONSOLE_ONLY_SERVER
      value: '1'
    - name: PHASE5_SAM3_OBSERVATION
      value: '1'
    - name: PHASE5_SEMANTIC_FAULT_PROBE
      value: '1'
    - name: PHASE5_SEMANTIC_FAULT_MODE
      value: transport_loss
    - name: PHASE5_REAR_CASTERS
      value: '1'
    - name: PHASE5_PHYSICS_STEP
      value: '0.002'
    - name: PHASE5_LIDAR_RANGE
      value: '12.0'
    - name: PHASE5_ODOM_FREQUENCY
      value: '200.0'
    - name: GZ_SIM_RESOURCE_PATH
      value: /opt/ros2-demo/hotel-assets/models:/opt/ros2-demo/hotel-assets:/opt/rmf_demos_ws/install/share/rmf_demos_assets/models
    - name: PHASE5_HEADLESS_RENDERING
      value: '1'
    - name: NVIDIA_DRIVER_CAPABILITIES
      value: all
    volumeMounts:
    - name: source
      mountPath: /phase5-native
      readOnly: true
    - name: sam3-shared
      mountPath: /tmp/phase5-sam3-shared
    resources:
      requests:
        cpu: '2'
        memory: 1Gi
      limits:
        cpu: '8'
        memory: 5Gi
        nvidia.com/gpu: 1
    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      seccompProfile:
        type: RuntimeDefault
  - name: camera-compressor
    image: image-registry.openshift-image-registry.svc:5000/semantic-navigation/semantic-hotel-sim@sha256:c3ba94bbcbbe2283f1c46ea0f2baba398da313ffe83d2b59a63272ef91d95ebf
    command:
    - /bin/bash
    - -lc
    args:
    - export HOME=/tmp/phase5-camera-home ROS_LOG_DIR=/tmp/phase5-camera-logs; mkdir
      -p "$ROS_LOG_DIR"; source /opt/ros/jazzy/setup.bash; exec python3 /opt/semantic-navigation/camera_compressor.py
    env:
    - &id001
      name: ROS_DISTRO
      value: jazzy
    - &id002
      name: ROS_DOMAIN_ID
      value: '88'
    - &id003
      name: RMW_IMPLEMENTATION
      value: rmw_cyclonedds_cpp
    - &id004
      name: CYCLONEDDS_URI
      value: file:///phase5-native/cyclonedds-phase5.xml
    - name: SEMANTIC_RAW_INPUT
      value: gz
    - name: SEMANTIC_COMPRESSION_TRACE
      value: '1'
    - name: SEMANTIC_CAMERA_SUBSCRIPTION_DEPTH
      value: '20'
    - name: GZ_PARTITION
      value: phase5-watchdog-native-qualification
    - name: GZ_IP
      value: 127.0.0.1
    volumeMounts:
    - name: source
      mountPath: /phase5-native
      readOnly: true
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: '2'
        memory: 2Gi
    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      seccompProfile:
        type: RuntimeDefault
  - name: sam3-zenoh-bridge
    image: eclipse/zenoh-bridge-ros2dds@sha256:38f162ae5236412f4f02e77927e22585356f7e706db39ec1c6194b9bd0d05b18
    args:
    - -c
    - /phase5-native/phase5-sam3-bridge.json5
    env:
    - *id001
    - *id002
    - *id003
    - *id004
    volumeMounts:
    - name: source
      mountPath: /phase5-native
      readOnly: true
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      seccompProfile:
        type: RuntimeDefault
  - name: sam3-observer
    image: image-registry.openshift-image-registry.svc:5000/semantic-navigation/semantic-safety@sha256:f854b8385e46fed4c61a59647a40eab349affdca15746d8d60e2e42adbbd0fba
    command:
    - /bin/bash
    - -ec
    args:
    - export HOME=/tmp/phase5-sam3-home ROS_LOG_DIR=/tmp/phase5-sam3-logs; mkdir -p
      "$ROS_LOG_DIR"; source /opt/ros/jazzy/setup.bash; exec python3 /phase5-native/sam3_observer_worker.py
      --shared-dir /tmp/phase5-sam3-shared
    env:
    - *id001
    - *id002
    - *id003
    - *id004
    - name: GZ_PARTITION
      value: phase5-watchdog-native-qualification
    - name: GZ_IP
      value: 127.0.0.1
    volumeMounts:
    - name: source
      mountPath: /phase5-native
      readOnly: true
    - name: sam3-shared
      mountPath: /tmp/phase5-sam3-shared
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: '2'
        memory: 3Gi
    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      seccompProfile:
        type: RuntimeDefault
  volumes:
  - name: source
    configMap:
      name: semantic-phase5-native
  - name: sam3-shared
    emptyDir: {}
