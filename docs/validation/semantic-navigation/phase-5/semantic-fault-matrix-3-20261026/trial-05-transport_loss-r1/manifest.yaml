    +kind, StringMsg(data=value), StringMsg, Boolean, 2000)\n                results.put({\"\
    kind\": kind, \"token\": token, \"ok\": ok and response.data})\n\n\nclass NativeLink:\n\
    \    def __init__(self):\n        if not os.getenv(\"GZ_PARTITION\", \"\").startswith(\"\
