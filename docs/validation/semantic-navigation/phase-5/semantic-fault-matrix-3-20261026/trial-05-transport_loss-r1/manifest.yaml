    :\"exact allowlisted support contacts only; no force/depth exemption\"}\n"
  fault_obstacle_worker.py: "\"\"\"Persistent pre-warmed mover for the private fault\
    \ obstacle.\n\nGazebo transport's service-connection establishment sleeps while\
    \ holding\nthe node's shared mutex, which blocks the simulation server's publications\n\
    and stalls physics ~100 ms (the native-7 fixture lesson, reproduced by the\nOctober\
    \ 24 obstacle pilots: a fresh subprocess calling set_pose mid-trial\nstalled the\
    \ iteration 104 ms and the 100 ms command-freshness contract\ncorrectly failed\
    \ the trial). This worker therefore starts with the fixture\nwhile the robot is\
    \ disarmed, establishes and warms the blocking set_pose\nconnection with a no-op\
    \ move to the staging pose, and then serves move\nrequests through a target file\
    \ so no new transport connection is ever\ncreated during the armed trial. It moves\
    \ one pre-placed model; it publishes\nno commands and changes no deadline.\n\"\
    \"\"\nimport argparse\nimport json\nimport sys\nimport time\nfrom pathlib import\
    \ Path\n\n\ndef main():\n    parser = argparse.ArgumentParser(description=__doc__)\n\
    \    parser.add_argument(\"--world\", required=True, help=\"Gazebo world name\"\
    )\n    parser.add_argument(\"--name\", required=True, help=\"model name to move\"\
    )\n    parser.add_argument(\"--x\", type=float, required=True, help=\"staging\
    \ pose for the warm-up move\")\n    parser.add_argument(\"--y\", type=float, required=True)\n\
    \    parser.add_argument(\"--ready-file\", required=True)\n    parser.add_argument(\"\
    --target-file\", required=True)\n    parser.add_argument(\"--reply-file\", required=True)\n\
    \    args = parser.parse_args()\n    from gz.transport13 import Node\n    from\
    \ gz.msgs10.pose_pb2 import Pose\n    from gz.msgs10.boolean_pb2 import Boolean\n\
    \    node = Node()\n\n    def move(x, y):\n        request = Pose()\n        request.name\
    \ = args.name\n        request.position.x = x\n        request.position.y = y\n\
    \        request.position.z = 0.2\n        request.orientation.w = 1.0\n     \
    \   ok, reply = node.request(f\"/world/{args.world}/set_pose/blocking\",\n   \
    \                              request, Pose, Boolean, 5000)\n        return bool(ok\
    \ and reply.data)\n\n    # Warm the connection before any session is armed. The\
    \ model already\n    # sits at the staging pose, so this is a no-op move that\
    \ exercises the\n    # full service path while a physics stall is harmless.\n\
    \    deadline = time.monotonic() + 90\n    warmed = False\n    while not warmed\
    \ and time.monotonic() < deadline:\n        warmed = move(args.x, args.y)\n  \
    \      if not warmed:\n            time.sleep(.5)\n    Path(args.ready_file).write_text(json.dumps({\"\
    warmed\": warmed}))\n    if not warmed:\n        sys.exit(1)\n    target, reply\
    \ = Path(args.target_file), Path(args.reply_file)\n    while True:\n        if\
    \ target.is_file():\n            try:\n                command = json.loads(target.read_text())\n\
    \            except (ValueError, OSError):\n                time.sleep(.005)\n\
    \                continue\n            moved = move(command[\"x\"], command[\"\
    y\"])\n            reply.write_text(json.dumps({\"moved\": moved, \"x\": command[\"\
    x\"],\n                                         \"y\": command[\"y\"], \"name\"\
    : args.name}))\n            target.unlink()\n        time.sleep(.005)\n\n\nif\
    \ __name__ == \"__main__\":\n    main()\n"
  fault_stop_probe.py: "\"\"\"Moving fault-stop injection contract for the private\
    \ hotel fixture.\n\nPure routing/evidence predicates only: no clock, command,\
    \ lease or\nfreshness threshold is changed by these helpers. Each mode injects\
    \ one\nfault class after independently verified motion and requires the guarded\n\
    chain to stop fail-closed with a mode-qualified first reason. The native\nwatchdog,\
    \ leases, and every freshness deadline keep their qualified values.\n\"\"\"\n\n\
    MODES = (\"collision_state\", \"scan_loss\", \"command_stall\", \"transport_loss\"\
    ,\n         \"obstacle_spawn\")\n\n# First coordinator stop reasons that prove\
    \ the injected fault class stopped\n# the chain. Any other reason is a qualification\
    \ failure: the trial records\n# it and stops the matrix per the no-retry rule.\n\
    QUALIFIED_REASONS = {\n    \"collision_state\": (\"collision_monitor_stop\",),\n\
    \    # The supervisor's tf evidence is scan-derived: the capture-time\n    # map<-lidar\
    \ transform qualifies only on new scans, so a scan-evidence\n    # cutoff freezes\
    \ both leases at the same capture bound and they expire\n    # together ~500 ms\
    \ later. Which key is named first is an iteration\n    # artifact; stop_latency_floor_ms\
    \ proves the input-freshness deadline\n    # (not the 100 ms command deadline)\
    \ produced the stop.\n    \"scan_loss\": (\"scan_stale\", \"tf_stale\"),\n   \
    \ \"command_stall\": (\"command_expired\",),\n    # Transport loss is stopped\
    \ by the independent native watchdog lease\n    # expiry; which coordinator reason\
    \ lands first depends on whether the\n    # session-loss status or the bounded\
    \ command queue fills first.\n    \"transport_loss\": (\"native_session_lost\"\
    , \"native_queue_unavailable\"),\n    \"obstacle_spawn\": (\"collision_monitor_stop\"\
    ,),\n}\n\n\ndef stop_reason_qualified(mode, reason):\n    return reason in QUALIFIED_REASONS.get(mode,\
    \ ())\n\n\ndef stop_latency_floor_ms(mode):\n    \"\"\"Minimum injection-to-trigger\
    \ latency that proves the fault's own\n    deadline stopped the chain.\n\n   \
    \ Input freshness is 500 ms from the last qualified capture; with 10 Hz\n    scans\
    \ the last capture precedes injection by at most ~120 ms, so a\n    genuine scan-evidence\
    \ stop lands >= 300 ms after injection. Anything\n    earlier is a different deadline\
    \ (command freshness or watchdog lease)\n    and must not qualify as the scan-loss\
    \ fault class.\n    \"\"\"\n    return 300.0 if mode == \"scan_loss\" else 0.0\n\
    \n\ndef stop_wait_seconds(mode):\n    \"\"\"Bounded wait from injection to the\
    \ guarded stop.\n\n    Every chain-level fault stops within its existing deadline\
    \ (watchdog\n    lease <=80 ms, command freshness 100 ms, input freshness 500\
    \ ms). The\n    physical obstacle must first be detected on the approach, so its\
    \ wait\n    covers the remaining travel to the post.\n    \"\"\"\n    return 20.0\
    \ if mode == \"obstacle_spawn\" else 5.0\n\n\n# StopEnvelope spans y in [-0.315,\
    \ 0.315] m; the padded hull spans\n# [-0.165, 0.165] m. A 0.06 m post centred\
    \ at y=+0.24 m sits inside the\n# monitor's stop polygon but outside the footprint,\
    \ RPP's footprint\n# collision check and the approach polygon, with ~0.045 m margin\
    \ to each\n# boundary for straight-line cross-track drift.\nOBSTACLE_AHEAD_M =\
    \ 0.70\nOBSTACLE_LATERAL_M = 0.24\nOBSTACLE_NAME = \"phase5_fault_post\"\n# The\
    \ post is pre-placed in the private world at a far off-corridor staging\n# pose\
    \ (scene and physics load at startup, planner sees a clear straight\n# path) and\
    \ moved into the corridor mid-trial through the blocking set_pose\n# service,\
    \ which only sets a pose command component inside PreUpdate.\n# Mid-trial entity\
    \ CREATION is unusable here: it parses SDF and builds scene\n# geometry on the\
    \ simulation thread and stalled physics ~190 ms, which the\n# 100 ms command-freshness\
    \ contract correctly fails.\nOBSTACLE_STAGING_LATERAL_M = 2.5\nOBSTACLE_POST_MODEL\
    \ = \"\"\"<model name=\"{name}\">\n    <pose>{x:.4f} {y:.4f} 0.2 0 0 0</pose>\n\
    \    <link name=\"post\">\n      <inertial>\n        <mass>5.0</mass>\n      \
    \  <inertia><ixx>0.02</ixx><iyy>0.02</iyy><izz>0.02</izz>\n          <ixy>0</ixy><ixz>0</ixz><iyz>0</iyz></inertia>\n\
    \      </inertial>\n      <collision name=\"post_collision\">\n        <geometry><box><size>0.06\
    \ 0.06 0.4</size></box></geometry>\n      </collision>\n      <visual name=\"\
    post_visual\">\n        <geometry><box><size>0.06 0.06 0.4</size></box></geometry>\n\
    \        <material><ambient>1 0 0 1</ambient><diffuse>1 0 0 1</diffuse></material>\n\
    \      </visual>\n    </link>\n  </model>\"\"\"\n\n\ndef obstacle_spawn_pose(physical):\n\
    \    \"\"\"Corridor pose the post is moved to at injection time.\n\n    OBSTACLE_AHEAD_M\
    \ along the straight drive axis and OBSTACLE_LATERAL_M\n    to the left of the\
    \ independently captured native physical pose, so the\n    monitor's stop polygon\
    \ catches real lidar returns while no footprint\n    contact can occur.\n    \"\
    \"\"\n    return {\"x\": physical[\"x\"] + OBSTACLE_AHEAD_M,\n            \"y\"\
    : physical[\"y\"] + OBSTACLE_LATERAL_M}\n\n\ndef obstacle_staging_pose(start_pose):\n\
    \    \"\"\"World pose the post occupies from trial start until injection.\n\n\
    \    Far enough off the corridor that neither the planner, the costmap\n    inflation\
    \ nor the stop envelope can see it, and verified free in the\n    static map before\
    \ the world is written.\n    \"\"\"\n    return {\"x\": start_pose[0] + OBSTACLE_AHEAD_M,\n\
    \            \"y\": start_pose[1] + OBSTACLE_LATERAL_M + OBSTACLE_STAGING_LATERAL_M}\n\
    \n\ndef obstacle_clears_hull(lateral_m, hull_half_width_m=0.165,\n           \
    \              envelope_half_width_m=0.315, post_half_width_m=0.03):\n    \"\"\
    \"True when the post is inside the stop envelope but outside the hull.\"\"\"\n\
    \    inner = abs(lateral_m) - post_half_width_m\n    outer = abs(lateral_m) +\
    \ post_half_width_m\n    return inner > hull_half_width_m and outer < envelope_half_width_m\n"
  frame_bridge.py: "#!/usr/bin/env python3\n\"\"\"Phase 5 sensor-only bridge: preserve\
    \ stamps, one odom TF authority, no map TF.\n\nPublishes neither commands nor\
    \ synthetic fresh poses. Clock rollback latches\nuntil process restart (the coordinator\
    \ must stop and clear consumers first).\n\"\"\"\nimport copy\nimport json\nimport\
    \ math\nimport os\nimport time\n\nimport rclpy\nfrom rclpy.clock import Clock,\
    \ ClockType\nfrom rclpy.node import Node\nfrom rclpy.qos import qos_profile_sensor_data\n\
    from geometry_msgs.msg import TransformStamped\nfrom nav_msgs.msg import Odometry\n\
    from rosgraph_msgs.msg import Clock as ClockMessage\nfrom sensor_msgs.msg import\
    \ LaserScan\nfrom std_msgs.msg import String\nfrom tf2_ros import TransformBroadcaster\n\
    \n\ndef stamp_ns(stamp):\n    return stamp.sec * 1_000_000_000 + stamp.nanosec\n\
    \n\nclass FrameBridge(Node):\n    def __init__(self):\n        super().__init__(\"\
    phase5_frame_bridge\")\n        if not self.has_parameter(\"use_sim_time\"):\n\
    \            self.declare_parameter(\"use_sim_time\", True)\n        else:\n \
    \           self.set_parameters([rclpy.parameter.Parameter(\"use_sim_time\", rclpy.Parameter.Type.BOOL,\
    \ True)])\n        self.clock_ns = None\n        self.clock_progress = None\n\
    \        self.last = {\"odom\": -1, \"scan\": -1}\n        self.receipts = {\"\
    odom\": None, \"scan\": None}\n        self.deadlines = {\"odom\": None, \"scan\"\
    : None}\n        self.tf_producer_trace = os.getenv(\"PHASE5_TF_PRODUCER_TRACE\"\
    ) == \"1\"\n        self.tf_trace_count = 0\n        self.previous_odom_receive_ns\
    \ = None\n        self.previous_odom_stamp_ns = None\n        self.fault = None\n\
    \        self.tf = TransformBroadcaster(self)\n        self.scan_pub = self.create_publisher(LaserScan,\
    \ \"/robot_1/scan_fixed\", qos_profile_sensor_data)\n        self.status = self.create_publisher(String,\
    \ \"/robot_1/phase5/frames\", 10)\n        self.create_subscription(ClockMessage,\
    \ \"/clock\", self.on_clock, qos_profile_sensor_data)\n        self.create_subscription(Odometry,\
    \ \"/robot_1/odom\", self.on_odom, qos_profile_sensor_data)\n        self.create_subscription(LaserScan,\
    \ \"/robot_1/scan\", self.on_scan, qos_profile_sensor_data)\n        self.create_timer(.05,\
    \ self.report, clock=Clock(clock_type=ClockType.STEADY_TIME))\n\n    def on_clock(self,\
    \ message):\n        value = stamp_ns(message.clock)\n        if self.clock_ns\
    \ is not None and value < self.clock_ns:\n            self.fault = \"simulation_clock_rollback_restart_required\"\
    \n        if self.clock_ns is None or value > self.clock_ns:\n            self.clock_progress\
    \ = time.monotonic()\n        self.clock_ns = value\n\n    def eligible(self,\
    \ kind, header):\n        value = stamp_ns(header.stamp)\n        if (self.fault\
    \ or self.clock_ns is None or self.clock_progress is None\n                or\
    \ time.monotonic()-self.clock_progress >= .5\n                or not 0 <= self.clock_ns-value\
    \ < 500_000_000 or value <= self.last[kind]):\n            return False\n    \
    \    self.last[kind] = value\n        self.receipts[kind] = time.monotonic()\n\
    \        self.deadlines[kind] = self.receipts[kind] + .5 - (self.clock_ns-value)/1e9\n\
    \        return True\n\n    def on_odom(self, message):\n        receive_monotonic_ns\
    \ = time.monotonic_ns()\n        receive_wall_ns = time.time_ns()\n        if\
    \ message.header.frame_id != \"odom\" or message.child_frame_id != \"base_footprint\"\
    :\n            self.fault = \"unexpected_odometry_frames\"\n            return\n\
    \        p, q = message.pose.pose.position, message.pose.pose.orientation\n  \
