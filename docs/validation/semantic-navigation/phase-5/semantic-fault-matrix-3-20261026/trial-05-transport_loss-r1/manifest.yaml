  native_clock.py: "\"\"\"Conservative capture-time mapping and live readiness from\
    \ a private native peer.\n\nBind epoch only during explicit stopped setup after\
    \ auditing the single publisher.\nSource wall/steady timestamps originate in Gazebo,\
    \ not at Python reception.\nClock mapping returns an EARLIER wall bound, never\
    \ a synthetic fresh receipt.\n\"\"\"\nfrom collections import deque\nimport math\n\
    from safety_core import MS, integer\n\n\nclass NativeClock:\n    def __init__(self,\
    \ epoch):\n        if not isinstance(epoch, str) or not 1 <= len(epoch) <= 128:\n\
    \            raise ValueError(\"native epoch required\")\n        self.epoch =\
    \ epoch\n        self.samples = deque(maxlen=2048)\n        self.last = None\n\
    \        self.quiet_since = None\n        self.fault = None\n        self.status\
    \ = None\n\n    def observe(self, status, now_wall):\n        try:\n         \
    \   if self.fault:\n                return False\n            if status[\"clock_epoch\"\
    ] != self.epoch:\n                raise ValueError(\"native_epoch_changed\")\n\
    \            p = status[\"physical\"]\n            if not p or not all(integer(p[k])\
    \ for k in (\"wall_ns\", \"steady_ns\", \"sim_ns\", \"sequence\")):\n        \
    \        raise ValueError(\"native_capture_invalid\")\n            if not -2*MS\
    \ <= now_wall-p[\"wall_ns\"] < 100*MS:\n                raise ValueError(\"native_capture_stale\"\
    )\n            if not p[\"velocity_valid\"] or not all(type(p[k]) in (int,float)\
    \ and math.isfinite(p[k]) and p[k]>=0\n                                      \
    \           for k in (\"speed\", \"angular_speed\")):\n                raise ValueError(\"\
    native_velocity_invalid\")\n            old = self.last\n            if old:\n\
    \                if p[\"sequence\"] == old[\"sequence\"]:\n                  \
    \  return False  # repeated status cannot refresh capture readiness\n        \
    \        if (p[\"sequence\"] < old[\"sequence\"] or p[\"sim_ns\"] < old[\"sim_ns\"\
    ]\n                        or p[\"steady_ns\"] <= old[\"steady_ns\"] or p[\"wall_ns\"\
    ] <= old[\"wall_ns\"]):\n                    raise ValueError(\"native_clock_rollback\"\
    )\n                if abs((p[\"wall_ns\"]-old[\"wall_ns\"])-(p[\"steady_ns\"]-old[\"\
    steady_ns\"]))>20*MS:\n                    raise ValueError(\"native_wall_clock_jump\"\
    )\n                if p[\"wall_ns\"]-old[\"wall_ns\"] >= 100*MS:\n           \
    \         self.quiet_since = None\n            self.last, self.status = p.copy(),\
    \ status\n            if p[\"paused\"]:\n                raise ValueError(\"native_simulation_paused\"\
    )\n            if not self.samples or p[\"sim_ns\"] > self.samples[-1][0]:\n \
    \               self.samples.append((p[\"sim_ns\"],p[\"wall_ns\"]))\n        \
    \    quiet = (p[\"speed\"]<.005 and p[\"angular_speed\"]<.02 and\n           \
    \          status[\"applied_vx\"]==0 and status[\"applied_wz\"]==0 and\n     \
    \                not status[\"armed\"] and not status[\"pending\"])\n        \
    \    if quiet:\n                if self.quiet_since is None: self.quiet_since\
    \ = p[\"wall_ns\"]\n            else:\n                self.quiet_since = None\n\
    \            return True\n        except (KeyError, TypeError, ValueError) as\
    \ error:\n            self.fault = str(error)\n            self.quiet_since =\
    \ None\n            return False\n\n    def stationary(self, now_wall):\n    \
    \    return bool(not self.fault and self.last and self.quiet_since is not None\n\
    \                    and 0 <= now_wall-self.last[\"wall_ns\"] < 100*MS\n     \
    \               and self.last[\"wall_ns\"]-self.quiet_since >= 250*MS)\n\n   \
    \ def wall_bound(self, ros_stamp, now_wall):\n        if (self.fault or not self.last\
