    \ unchanged.\n    udp = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)\n   \
    \ # Service discovery in gz-transport can block its internal shared mutex.\n \
    \   # Warm up while no session has been armed, never relax moving leases.\n  \
    \  deadline = time.monotonic()+20\n    while not publisher.has_connections() and\
    \ time.monotonic()<deadline:\n        time.sleep(.02)\n    ok, response = node.request(\"\
    /phase5/drive/stop\",StringMsg(data=\"link_setup\"),StringMsg,Boolean,2000)\n\
