    )\n        self.assertEqual(s.reason, \"goal_accept_timeout\")\n\n    def test_late_success_preserves_fault_and_does_not_resume(self):\n\
    \        s = TaskSession(); t = s.begin(0); s.accepted(t, True, .1)\n        s.revoke(\"\
