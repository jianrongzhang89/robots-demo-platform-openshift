  resource_probe.py: "\"\"\"Read-only private-fixture resource sampling in a separate\
    \ process.\n\nNo ROS/Gazebo imports, control endpoints, or readiness decisions.\
    \ Samples retain\ntheir own steady timestamps; sampling gaps are evidence, never\
    \ interpolated.\nWrite once on shutdown so diagnostic disk traffic is outside\
    \ the moving trial.\n\"\"\"\nimport argparse\nimport json\nfrom pathlib import\
    \ Path\nimport signal\nimport time\n\n\ndef counters(text):\n    return {parts[0]:int(parts[1])\
    \ for line in text.splitlines()\n            if len(parts:=line.split())==2}\n\
    \n\ndef pressure(text):\n    return {parts[0]:{k:float(v) if k!=\"total\" else\
    \ int(v)\n                     for k,v in (item.split(\"=\",1) for item in parts[1:])}\n\
    \            for line in text.splitlines() if (parts:=line.split())}\n\n\ndef\
    \ process_stat(text):\n    # comm may include spaces or parentheses. Fields below\
    \ are kernel stat\n    # field numbers, with field 3 (state) at tail[0]. Tick\
    \ counts stay raw.\n    end=text.rfind(\")\")\n    tail=text[end+2:].split()\n\
    \    return {\"comm\":text[text.index(\"(\")+1:end],\"state\":tail[0],\n     \
    \       \"ppid\":int(tail[1]),\"minflt\":int(tail[7]),\"majflt\":int(tail[9]),\n\
    \            \"utime_ticks\":int(tail[11]),\"stime_ticks\":int(tail[12]),\n  \
    \          \"threads\":int(tail[17]),\"start_ticks\":int(tail[19]),\"rss_pages\"\
    :int(tail[21])}\n\n\ndef snapshot(cgroup=Path(\"/sys/fs/cgroup\"), proc=Path(\"\
    /proc\"), *, processes=False):\n    row={\"steady_ns\":time.monotonic_ns(),\"\
    wall_ns\":time.time_ns(),\"errors\":{}}\n    for name,parse in ((\"cpu.stat\"\
    ,counters),(\"cpu.pressure\",pressure),\n                       (\"io.pressure\"\
    ,pressure),(\"memory.events\",counters),\n                       (\"memory.pressure\"\
    ,pressure)):\n        try: row[name]=parse((cgroup/name).read_text())\n      \
    \  except (OSError,ValueError) as error: row[\"errors\"][name]=str(error)\n  \
    \  if processes:\n        row[\"processes\"]={}\n        try:\n            pids=(cgroup/\"\
    cgroup.procs\").read_text().split()\n            for pid in pids:\n          \
    \      try:\n                    details=process_stat((proc/pid/\"stat\").read_text())\n\
    \                    details[\"io\"]=counters((proc/pid/\"io\").read_text().replace(\"\
    :\", \"\"))\n                    details[\"schedstat\"]=[int(n) for n in (proc/pid/\"\
    schedstat\").read_text().split()]\n                    row[\"processes\"][pid]=details\n\
    \                except (OSError,ValueError,IndexError) as error:\n          \
    \          row[\"errors\"][\"pid:\"+pid]=str(error)\n        except OSError as\
    \ error: row[\"errors\"][\"cgroup.procs\"]=str(error)\n    row[\"end_steady_ns\"\
    ]=time.monotonic_ns()\n    return row\n\n\ndef resolve_watched_processes(cgroup,\
    \ proc, targets):\n    \"\"\"Find the first in-cgroup PID for each requested kernel\
    \ comm name.\"\"\"\n    found={}\n    try:\n        pids=(cgroup/\"cgroup.procs\"\
    ).read_text().split()\n    except OSError:\n        return found\n    for pid\
    \ in pids:\n        try:\n            comm=(proc/pid/\"comm\").read_text().strip()\n\
    \            if comm in targets and comm not in found:\n                found[comm]=pid\n\
    \        except OSError:\n            continue\n    return found\n\n\ndef read_watched_schedstat(proc,\
    \ watched):\n    rows={}\n    errors={}\n    for comm,pid in watched.items():\n\
    \        try:\n            values=[int(value) for value in (proc/pid/\"schedstat\"\
    ).read_text().split()]\n            rows[comm]={\"pid\":int(pid),\"schedstat\"\
    :values}\n        except (OSError,ValueError) as error:\n            errors[comm]=str(error)\n\
    \    return rows,errors\n\n\ndef read_watched_process_threads(proc, watched):\n\
    \    \"\"\"Sample every thread of each watched process.\n\n    schedstat splits\
    \ on-CPU time from run-queue wait; utime/stime and the\n    voluntary/involuntary\
    \ context-switch counters separate scheduler\n    starvation from in-thread blocking\
    \ (locks/IO). Read-only; thread comm\n    identifies the Gazebo physics/worker\
    \ threads during stall analysis.\n    \"\"\"\n    rows={}\n    errors={}\n   \
    \ for comm,pid in watched.items():\n        threads={}\n        try:\n       \
    \     tids=[item.name for item in (proc/str(pid)/\"task\").iterdir()\n       \
    \           if item.name.isdigit()]\n        except OSError as error:\n      \
    \      errors[comm]=str(error); continue\n        for tid in tids:\n         \
    \   try:\n                sched=[int(value) for value in\n                   \
    \    (proc/str(pid)/\"task\"/tid/\"schedstat\").read_text().split()]\n       \
    \         stat=(proc/str(pid)/\"task\"/tid/\"stat\").read_text()\n           \
    \     end=stat.rfind(\")\")\n                tail=stat[end+2:].split()\n     \
    \           switches={}\n                for line in (proc/str(pid)/\"task\"/tid/\"\
    status\").read_text().splitlines():\n                    if line.startswith((\"\
    voluntary_ctxt_switches:\",\"nonvoluntary_ctxt_switches:\")):\n              \
    \          key,value=line.split(\":\",1)\n                        switches[key.strip()]=int(value)\n\
    \                threads[tid]={\"comm\":stat[stat.index(\"(\")+1:end],\"state\"\
    :tail[0],\n                              \"utime_ticks\":int(tail[11]),\"stime_ticks\"\
    :int(tail[12]),\n                              \"schedstat\":sched,**switches}\n\
    \            except (OSError,ValueError,IndexError) as error:\n              \
    \  threads[tid]={\"error\":str(error)}\n        rows[comm]={\"pid\":int(pid),\"\
    threads\":threads}\n    return rows,errors\n\n\ndef main():\n    parser=argparse.ArgumentParser(description=__doc__)\n\
    \    parser.add_argument(\"--output\",required=True,type=Path)\n    parser.add_argument(\"\
    --watch-comm\",action=\"append\",default=[],\n                        help=\"\
    sample this process main thread's schedstat every 20 ms\")\n    parser.add_argument(\"\
    --watch-threads-of\",action=\"append\",default=[],\n                        help=\"\
    sample every thread of this process every 20 ms\")\n    args=parser.parse_args()\n\
    \    if args.output.exists(): raise RuntimeError(\"refusing to replace resource\
    \ evidence\")\n    stopping=False\n    def stop(_signum,_frame):\n        nonlocal\
    \ stopping\n        stopping=True\n    signal.signal(signal.SIGINT,stop); signal.signal(signal.SIGTERM,stop)\n\
    \    samples=[]\n    watched={}\n    thread_watched={}\n    while not stopping\
    \ and len(samples)<20_000:\n        started=time.monotonic()\n        row=snapshot(processes=len(samples)%5==0)\n\
    \        targets=set(args.watch_comm)|set(args.watch_threads_of)\n        if targets:\n\
    \            if len(watched)<len(targets) and len(samples)%5==0:\n           \
    \     watched.update(resolve_watched_processes(Path(\"/sys/fs/cgroup\"),Path(\"\
    /proc\"),\n                                                         targets))\n\
    \            if args.watch_comm:\n                row[\"watched_threads\"],row[\"\
    watch_errors\"]=read_watched_schedstat(\n                    Path(\"/proc\"),{c:watched[c]\
    \ for c in args.watch_comm if c in watched})\n            if args.watch_threads_of:\n\
    \                row[\"watched_process_threads\"],row[\"watch_thread_errors\"\
    ]=read_watched_process_threads(\n                    Path(\"/proc\"),{c:watched[c]\
    \ for c in args.watch_threads_of if c in watched})\n        samples.append(row)\n\
    \        time.sleep(max(0.,.02-(time.monotonic()-started)))\n    with args.output.open(\"\
    x\") as handle:\n        json.dump({\"interval_target_ms\":20,\"process_interval_target_ms\"\
    :100,\n                   \"watched_thread_interval_target_ms\":20 if args.watch_comm\
    \ or args.watch_threads_of else None,\n                   \"watched_process_comms\"\
    :args.watch_comm,\n                   \"watched_process_thread_comms\":args.watch_threads_of,\n\
    \                   \"capacity\":20_000,\"capacity_reached\":len(samples)==20_000,\n\
    \                   \"samples\":samples},handle)\n\n\nif __name__==\"__main__\"\
    : main()\n"
  run_native_suite.py: "\"\"\"Pod entrypoint, retaining test artifacts until the orchestrator\
    \ retrieves them.\"\"\"\nimport json\nimport os\nfrom pathlib import Path\nimport\
