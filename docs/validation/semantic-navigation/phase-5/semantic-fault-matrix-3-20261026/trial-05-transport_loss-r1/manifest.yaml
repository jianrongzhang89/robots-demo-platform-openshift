  contact_evidence.py: "\"\"\"Read-only contact instrumentation and strict offline\
    \ baseline assessment.\"\"\"\nimport xml.etree.ElementTree as ET\nfrom support_geometry\
    \ import CASTERS\n\n\nHOTEL_SUPPORT_PAIRS = frozenset(tuple(sorted((\n    \"sim_world::hotel_L1::floor_3::collision\"\
    ,\n    \"sim_world::robot_1::\"+wheel))) for wheel in (\n        \"wheel_left_link::left_wheel_collision\"\
    , \"wheel_right_link::right_wheel_collision\"))\n# Deliberately excludes chassis/lidar\
    \ and every other floor/wall/object. The\n# present four-collision robot has no\
    \ caster; chassis-floor contact is a failed\n# geometry precondition, not an implicit\
    \ exemption or a collision-free result.\nORIGINAL_COLLISIONS=frozenset(\"robot_1::\"\
    +name for name in (\n    \"base_link::base_collision\",\"base_scan::lidar_collision\"\
    ,\n    \"wheel_left_link::left_wheel_collision\",\"wheel_right_link::right_wheel_collision\"\
    ))\n\n\ndef collision_inventory(rear_casters=False):\n    return ORIGINAL_COLLISIONS\
    \ | (frozenset(\"robot_1::\"+name+\"::support\" for name,_,_ in CASTERS)\n   \
    \                               if rear_casters else frozenset())\n\n\ndef support_pairs(rear_casters=False):\n\
    \    extra=frozenset(tuple(sorted((\"sim_world::hotel_L1::floor_3::collision\"\
    ,\n            \"sim_world::robot_1::\"+name+\"::support\"))) for name,_,_ in\
    \ CASTERS)\n    return HOTEL_SUPPORT_PAIRS | (extra if rear_casters else frozenset())\n\
    \n\ndef instrument(world, *, rear_casters=False):\n    tree=ET.fromstring(world)\n\
    \    robot=tree.find(\".//model[@name='robot_1']\")\n    names=set() if robot\
    \ is None else {\"robot_1::\"+link.get(\"name\")+\"::\"+c.get(\"name\")\n    \
    \    for link in robot.findall(\"link\") for c in link.findall(\"collision\")}\n\
    \    if names!=collision_inventory(rear_casters):\n        raise ValueError(\"\
    unexpected robot collision inventory\")\n    if robot.find(\"plugin[@name='phase5::ContactAudit']\"\
    ) is not None:\n        raise ValueError(\"contact audit already installed\")\n\
    \    plugin=ET.SubElement(robot,\"plugin\",filename=\"libphase5_contact_audit.so\"\
    ,name=\"phase5::ContactAudit\")\n    ET.SubElement(plugin,\"expected_collision_count\"\
    ).text=str(len(names))\n    return ET.tostring(tree,encoding=\"unicode\")\n\n\n\
    def assess(rows, *, allowed_pairs, start_sim, end_sim, expected_names=None):\n\
    \    \"\"\"Cumulative counters prevent missed contacts between sampled messages.\n\
    \n    allowed_pairs must be explicitly reviewed exact collision names. No substring\n\
    \    'floor' exemption; no silence-is-clear or receipt-time freshness fallback.\n\
    \    \"\"\"\n    try:\n        return _assess(rows,allowed_pairs=allowed_pairs,start_sim=start_sim,end_sim=end_sim,expected_names=expected_names)\n\
    \    except (KeyError,TypeError,ValueError):\n        return {\"passed\":False,\"\
    reason\":\"malformed_contact_evidence\"}\n\n\ndef _assess(rows, *, allowed_pairs,\
    \ start_sim, end_sim, expected_names):\n    if end_sim<=start_sim: return {\"\
    passed\":False,\"reason\":\"empty_contact_window\"}\n    if not rows: return {\"\
    passed\":False,\"reason\":\"missing_contact_evidence\"}\n    ordered=[r for r\
    \ in rows if r[\"sim_ns\"]>=start_sim-100_000_000 and r[\"sim_ns\"]<=end_sim+100_000_000]\n\
    \    if not ordered or ordered[0][\"sim_ns\"]>start_sim or ordered[-1][\"sim_ns\"\
    ]<end_sim:\n        return {\"passed\":False,\"reason\":\"contact_window_not_bracketed\"\
    }\n    previous=None; unexpected=[]\n    initial={(p[\"a\"],p[\"b\"]):p[\"contact_steps\"\
    ] for p in ordered[0][\"pairs\"]}\n    previous_counts=initial\n    monitored=ordered[0][\"\
    monitored\"]\n    for row in ordered:\n        valid_inventory=({m[\"name\"] for\
    \ m in row[\"monitored\"]}==set(expected_names)\n                         if expected_names\
    \ is not None else len(row[\"monitored\"])==4)\n        if row[\"missing\"] or\
    \ not valid_inventory or row[\"monitored\"]!=monitored:\n            return {\"\
    passed\":False,\"reason\":\"contact_component_missing\"}\n        if previous\
    \ and (row[\"steps\"]<=previous[\"steps\"] or row[\"sim_ns\"]<=previous[\"sim_ns\"\
    ]\n                         or row[\"sim_ns\"]-previous[\"sim_ns\"]>200_000_000\n\
    \                         or not 0<row[\"wall_ns\"]-previous[\"wall_ns\"]<=200_000_000):\n\
    \            return {\"passed\":False,\"reason\":\"contact_coverage_gap_or_rollback\"\
    }\n        previous=row\n        current={(p[\"a\"],p[\"b\"]):p[\"contact_steps\"\
    ] for p in row[\"pairs\"]}\n        if any(current.get(pair,-1)<count for pair,count\
