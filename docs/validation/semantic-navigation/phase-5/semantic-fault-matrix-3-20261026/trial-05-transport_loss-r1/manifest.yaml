  test_sam3_observation.py: "import unittest\n\nimport numpy as np\n\nimport sam3_observation\n\
    \n\nWORLD = \"\"\"<sdf version=\"1.7\"><world name=\"sim_world\">\n  <model name=\"\
    semantic_target_mat\"><pose>17.4014 -31.594 0.005 0 0 0</pose>\n    <link name=\"\
    surface\"><visual name=\"v\"><geometry><box><size>0.9 0.65 0.012</size></box></geometry></visual></link>\n\
    \  </model>\n</world></sdf>\"\"\"\n\n\nclass Sam3ObservationTests(unittest.TestCase):\n\
    \    def setUp(self):\n        self.rect = sam3_observation.parse_mat_ground_truth(WORLD)\n\
    \        self.assertAlmostEqual(self.rect[\"xmin\"], 17.4014 - 0.45)\n       \
    \ self.assertAlmostEqual(self.rect[\"ymax\"], -31.594 + 0.325)\n\n    def test_mat_ground_truth_requires_the_model(self):\n\
    \        with self.assertRaises(ValueError):\n            sam3_observation.parse_mat_ground_truth(\"\
    <world/>\")\n\n    def test_decode_mask_rejects_mismatched_payloads(self):\n \
    \       with self.assertRaises(ValueError):\n            sam3_observation.decode_mask(b\"\
    \\x00\" * 10, 4, 4)\n\n    def test_points_in_rectangle_counts_and_fractions(self):\n\
    \        points = np.array([\n            [17.4, -31.6, 0.0],   # on the mat\n\
    \            [17.5, -31.5, 0.01],  # on the mat\n            [16.0, -31.6, 0.0],\
    \   # far outside\n            [17.45, -31.59, 2.0],  # inside x/y but implausibly\
    \ high\n            [17.4014 - 0.45 - 0.05, -31.594, 0.0],  # exactly at tolerance\
    \ edge\n        ])\n        count, fraction = sam3_observation.points_in_rectangle(points,\
    \ self.rect)\n        self.assertEqual(count, 5)\n        self.assertAlmostEqual(fraction,\
    \ 3 / 5)\n\n    def test_transform_points_applies_a_rigid_transform(self):\n \
    \       quarter = np.pi / 2\n        # z-rotation by 90 degrees, translation (1,\
    \ 2, 3)\n        q = (0.0, 0.0, np.sin(quarter / 2), np.cos(quarter / 2))\n  \
    \      points = np.array([[1.0, 0.0, 0.0]])\n        moved = sam3_observation.transform_points(points,\
    \ (1, 2, 3), q)\n        self.assertTrue(np.allclose(moved, [[1.0, 3.0, 3.0]]),\
    \ moved)\n\n    def test_registration_summary_requires_moving_results_and_fraction(self):\n\
    \        results = [{\"selected\": 100, \"inside_fraction\": 1.0, \"moving\":\
    \ True}] * 10\n        summary = sam3_observation.registration_summary(results)\n\
    \        self.assertTrue(summary[\"passed\"], summary)\n        self.assertEqual(summary[\"\
    moving_results\"], 10)\n        self.assertEqual(summary[\"pooled_selected_points\"\
    ], 1000)\n        # Stationary or tiny-mask results never count toward the contract.\n\
    \        mixed = ([{\"selected\": 100, \"inside_fraction\": 1.0, \"moving\": True}]\
    \ * 9\n                 + [{\"selected\": 100, \"inside_fraction\": 1.0, \"moving\"\
    : False}]\n                 + [{\"selected\": 10, \"inside_fraction\": 1.0, \"\
    moving\": True}] * 5)\n        self.assertFalse(sam3_observation.registration_summary(mixed)[\"\
    passed\"])\n        # Pooled below the 95% contract fails.\n        low = ([{\"\
    selected\": 100, \"inside_fraction\": 1.0, \"moving\": True}] * 9\n          \
    \     + [{\"selected\": 100, \"inside_fraction\": 0.0, \"moving\": True}])\n \
    \       self.assertFalse(sam3_observation.registration_summary(low)[\"passed\"\
    ])\n        # Unmatched payload rows are excluded from the moving population.\n\
    \        self.assertFalse(sam3_observation.registration_summary(\n           \
    \ [{\"selected\": 0, \"inside_fraction\": 0.0, \"moving\": True, \"matched\":\
    \ False}] * 20)[\"passed\"])\n\n    def test_timing_summary_enforces_age_and_rate(self):\n\
    \        ages = [100.0] * 18 + [600.0, 600.0]\n        summary = sam3_observation.timing_summary(ages,\
    \ 20, 4.0)\n        self.assertFalse(summary[\"passed\"])\n        self.assertEqual(summary[\"\
    p95_capture_age_ms\"], 600.0)\n        self.assertAlmostEqual(summary[\"results_per_second\"\
    ], 5.0)\n        self.assertTrue(sam3_observation.timing_summary([100.0] * 20,\
    \ 20, 4.0)[\"passed\"])\n        self.assertFalse(sam3_observation.timing_summary([],\
    \ 0, 4.0)[\"passed\"])\n\n\nif __name__ == \"__main__\":\n    unittest.main()\n"
  test_semantic_fault_probe.py: "import unittest\n\nfrom semantic_fault_probe import\
    \ (MODES, QUALIFIED_REASONS, late_success_key,\n                             \
    \     late_success_wait_seconds,\n                                  observation_window_end,\
    \ stop_reason_qualified,\n                                  stop_wait_seconds)\n\
    \n\nclass SemanticFaultProbeTests(unittest.TestCase):\n    def test_every_mode_has_a_qualified_reason_set(self):\n\
    \        for mode in MODES:\n            with self.subTest(mode=mode):\n     \
    \           self.assertTrue(QUALIFIED_REASONS[mode])\n                self.assertFalse(stop_reason_qualified(mode,\
    \ \"navigation_trial_timeout\"))\n                self.assertFalse(stop_reason_qualified(mode,\
    \ \"\"))\n                self.assertGreater(stop_wait_seconds(mode), 0)\n   \
    \             self.assertGreater(late_success_wait_seconds(mode), 0)\n\n    def\
    \ test_semantic_faults_qualify_through_the_semantic_leases(self):\n        for\
    \ mode in (\"camera_path_loss\", \"hung_inference\", \"process_loss\",\n     \
    \                \"transport_loss\"):\n            for reason in (\"camera_stale\"\
    , \"semantic_stale\",\n                           \"inference_heartbeat_stale\"\
    , \"inference_heartbeat_invalid_age\"):\n                self.assertTrue(stop_reason_qualified(mode,\
    \ reason), (mode, reason))\n\n    def test_tf_loss_keeps_the_geometry_only_acceptance(self):\n\
    \        self.assertTrue(stop_reason_qualified(\"tf_loss\", \"tf_stale\"))\n \
    \       self.assertTrue(stop_reason_qualified(\"tf_loss\", \"command_expired\"\
    ))\n        # The semantic leases stay fresh through TF loss: a semantic-stale\n\
    \        # stop would mean the wrong path tripped.\n        for reason in (\"\
    semantic_stale\", \"inference_heartbeat_stale\"):\n            self.assertFalse(stop_reason_qualified(\"\
    tf_loss\", reason))\n\n    def test_semantic_leases_do_not_qualify_a_navigation_timeout(self):\n\
    \        for mode in MODES:\n            self.assertFalse(stop_reason_qualified(mode,\
    \ \"native_session_lost\"))\n            self.assertFalse(stop_reason_qualified(mode,\
    \ \"command_expired\")\n                             if mode != \"tf_loss\" else\
    \ False)\n\n    def test_late_success_key_and_waits(self):\n        self.assertEqual(late_success_key(\"\
    camera_path_loss\"), \"camera\")\n        self.assertIsNone(late_success_key(\"\
    tf_loss\"))\n        self.assertEqual(late_success_key(\"process_loss\"), \"inference_heartbeat\"\
    )\n        # Process loss waits for the container restart and model reload.\n\
    \        self.assertGreater(late_success_wait_seconds(\"process_loss\"),\n   \
    \                        late_success_wait_seconds(\"hung_inference\"))\n    \
    \    # Externally injected modes wait longer for the stop (runner latency).\n\
    \        self.assertGreater(stop_wait_seconds(\"transport_loss\"),\n         \
    \                  stop_wait_seconds(\"camera_path_loss\"))\n\n    def test_observation_window_scopes_to_the_pre_fault_period(self):\n\
    \        receipts = [1000, 1100, 1200, 1300, 1400]\n        self.assertEqual(observation_window_end(1250,\
    \ receipts), [1000, 1100, 1200])\n        self.assertEqual(observation_window_end(None,\
    \ receipts), receipts)\n        self.assertEqual(observation_window_end(500, receipts),\
    \ [])\n\n\nif __name__ == \"__main__\":\n    unittest.main()\n"
