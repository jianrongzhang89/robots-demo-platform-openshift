    \ client.session.state == \"idle\")\n        assert not client.session.may_command(token)\
    \ and revoked[-1] == (token,\"goal_succeeded\")\n        checks.append({\"case\"\
    : \"success_revokes_and_requires_new_request\", \"passed\": True})\n\n       \
