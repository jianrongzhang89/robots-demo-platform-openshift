  semantic_fault_probe.py: "\"\"\"Armed semantic fault-matrix contract for the private\
    \ guarded fixture.\n\nPure routing/evidence predicates only: no clock, command,\
    \ lease or\nfreshness threshold is changed by these helpers. Each mode injects\
    \ one\nperception fault after independently verified semantic-armed motion and\n\
    requires the guarded chain to stop fail-closed with a mode-qualified first\nreason,\
    \ zero within 100 ms of the 500 ms semantic freshness trigger, and no\nautomatic\
    \ resume after the fault is restored \u2014 even though fresh successful\nperception\
    \ responses flow again (the late-success proof).\n\"\"\"\n\nMODES = (\"camera_path_loss\"\
    , \"tf_loss\", \"hung_inference\", \"process_loss\",\n         \"transport_loss\"\
    )\n\n# First coordinator stop reasons that prove the injected fault class stopped\n\
    # the armed semantic supervisor. Every perception-side fault manifests as one\n\
    # of the three semantic leases expiring (the \"stale mask\" condition of the\n\
    # plan is the semantic lease expiry itself); which key trips first depends on\n\
    # the pipeline's internal latencies, so the qualified set covers the honest\n\
    # orderings. TF loss stops through the existing TF/command path exactly as\n#\
    \ the geometry-only subgate qualified.\nSEMANTIC_REASON_SET = (\"camera_stale\"\
    , \"camera_invalid_age\", \"camera_epoch_changed\",\n                       \"\
    semantic_stale\", \"semantic_invalid_age\", \"semantic_epoch_changed\",\n    \
    \                   \"inference_heartbeat_stale\", \"inference_heartbeat_invalid_age\"\
    ,\n                       \"inference_heartbeat_epoch_changed\")\nQUALIFIED_REASONS\
    \ = {\n    \"camera_path_loss\": SEMANTIC_REASON_SET,\n    # Pausing AMCL freezes\
    \ map->odom; the supervisor's semantic leases stay\n    # fresh (the camera and\
    \ SAM3 are healthy), so the stop must come from\n    # the existing TF freshness\
    \ or command path.\n    \"tf_loss\": (\"tf_stale\", \"command_expired\"),\n  \
    \  \"hung_inference\": SEMANTIC_REASON_SET,\n    \"process_loss\": SEMANTIC_REASON_SET,\n\
    \    \"transport_loss\": SEMANTIC_REASON_SET,\n}\n\n\ndef stop_reason_qualified(mode,\
    \ reason):\n    return reason in QUALIFIED_REASONS.get(mode, ())\n\n\ndef stop_wait_seconds(mode):\n\
    \    \"\"\"Bounded wait from injection (or motion verification for externally\n\
    \    injected modes) to the guarded stop.\"\"\"\n    return 45.0 if mode in (\"\
    hung_inference\", \"process_loss\", \"transport_loss\") else 10.0\n\n\ndef late_success_wait_seconds(mode):\n\
    \    \"\"\"Bounded wait after fault restoration for a fresh successful\n    perception\
    \ response (or restored TF) to arrive, proving that the late\n    success exists\
    \ and still cannot resume motion. Process loss waits for\n    the container restart\
    \ and model reload.\"\"\"\n    return {\"camera_path_loss\": 30.0, \"tf_loss\"\
    : 20.0, \"hung_inference\": 30.0,\n            \"process_loss\": 240.0, \"transport_loss\"\
    : 60.0}.get(mode, 30.0)\n\n\ndef late_success_key(mode):\n    \"\"\"The worker\
    \ lease key whose sequence advancing again proves the late\n    successful response;\
    \ TF loss is proven by restored capture-time TF.\"\"\"\n    return {\"camera_path_loss\"\
    : \"camera\", \"tf_loss\": None,\n            \"hung_inference\": \"inference_heartbeat\"\
    , \"process_loss\": \"inference_heartbeat\",\n            \"transport_loss\":\
    \ \"inference_heartbeat\"}.get(mode)\n\n\ndef observation_window_end(stop_wall,\
    \ receipts):\n    \"\"\"Scope the observation timing window to the pre-fault period.\n\
    \n    The semantic fault stops perception results for the remainder of the\n \
    \   trial (the late-success dwell); the throughput contract is evaluated\n   \
    \ over the results that arrived before the guarded stop, which is the\n    period\
    \ the armed supervisor actually observed.\n    \"\"\"\n    if stop_wall is None:\n\
    \        return list(receipts)\n    return [wall for wall in receipts if wall\
    \ <= stop_wall]\n"
  support_geometry.py: "\"\"\"Opt-in rear ball supports for the private simplified\
    \ robot, not canonical assets.\n\nLike upstream Waffle, use two freely rotating\
    \ ball-joint casters. Locations are\nadapted to this demo's smaller box hull;\
    \ all existing collisions/inertias remain.\nURDF represents spherical centres\
    \ as fixed transforms (orientation is immaterial\nto a sphere); dynamics are defined\
    \ only by the Gazebo SDF ball joints.\n\"\"\"\nimport xml.etree.ElementTree as\
    \ ET\n\n\nCASTERS = ((\"rear_left_caster\", -.14, .064), (\"rear_right_caster\"\
    , -.14, -.064))\n\n\ndef add_rear_casters(world_text, urdf_text):\n    world,urdf=ET.fromstring(world_text),ET.fromstring(urdf_text)\n\
    \    robot=world.find(\".//model[@name='robot_1']\")\n    if robot is None or\
    \ len(robot.findall(\"link/collision\"))!=4:\n        raise ValueError(\"expected\
    \ original four-collision robot\")\n    base=robot.find(\"link[@name='base_link']/collision[@name='base_collision']\"\
    )\n    if (base is None or [float(x) for x in base.findtext(\"pose\", \"\").split()]!=[-.032,0,.07,0,0,0]\n\
    \            or [float(x) for x in base.findtext(\"geometry/box/size\", \"\").split()]!=[.28,.31,.14]):\n\
    \        raise ValueError(\"unqualified chassis geometry\")\n    for side in (\"\
    left\",\"right\"):\n        wheel=robot.find(f\"link[@name='wheel_{side}_link']\"\
    )\n        y=.144 if side==\"left\" else -.144\n        if (wheel is None or [float(x)\
    \ for x in wheel.findtext(\"pose\", \"\").split()]!=[0,y,.023,-1.57,0,0]\n   \
    \             or float(wheel.findtext(\"collision/geometry/cylinder/radius\",\
    \ \"nan\"))!=.033):\n            raise ValueError(\"unqualified wheel geometry\"\
    )\n    for name,x,y in CASTERS:\n        if robot.find(f\"link[@name='{name}']\"\
    ) is not None or urdf.find(f\"link[@name='{name}']\") is not None:\n         \
    \   raise ValueError(\"refusing duplicate caster\")\n        robot.append(ET.fromstring(f'''<link\
    \ name=\"{name}\"><pose>{x} {y} -0.005 0 0 0</pose>\n          <inertial><mass>0.001</mass><inertia><ixx>1e-8</ixx><iyy>1e-8</iyy><izz>1e-8</izz></inertia></inertial>\n\
    \          <collision name=\"support\"><geometry><sphere><radius>0.005</radius></sphere></geometry>\n\
    \            <surface><friction><ode><mu>1</mu><mu2>1</mu2></ode>\n          \
    \    <bullet><friction>1</friction><friction2>1</friction2></bullet></friction></surface></collision>\n\
    \          <visual name=\"support\"><geometry><sphere><radius>0.005</radius></sphere></geometry></visual></link>'''))\n\
    \        robot.append(ET.fromstring(f'''<joint name=\"{name}_joint\" type=\"ball\"\
    >\n          <parent>base_link</parent><child>{name}</child></joint>'''))\n  \
    \      urdf.append(ET.fromstring(f'''<link name=\"{name}\">\n          <collision><geometry><sphere\
    \ radius=\"0.005\"/></geometry></collision>\n          <visual><geometry><sphere\
    \ radius=\"0.005\"/></geometry></visual></link>'''))\n        urdf.append(ET.fromstring(f'''<joint\
    \ name=\"{name}_centre\" type=\"fixed\">\n          <parent link=\"base_link\"\
    /><child link=\"{name}\"/><origin xyz=\"{x} {y} -0.005\" rpy=\"0 0 0\"/></joint>'''))\n\
    \    return ET.tostring(world,encoding=\"unicode\"),ET.tostring(urdf,encoding=\"\
    unicode\")\n"
  task_session.py: "\"\"\"Owned-action lifecycle only; NOT evidence of global task\
    \ idleness or robot safety.\n\nThe integrating coordinator must qualify sensors,\
    \ stationary/neutral state,\nall other action servers, and the actuator handshake\
    \ before admitting a goal.\nThis component never arms a SafetyGate or grants an\
    \ actuator lease by itself.\n\"\"\"\nimport uuid\n\n\nclass TaskSession:\n   \
    \ def __init__(self):\n        self.token = None\n        self.state = \"idle\"\
    \n        self.reason = \"startup\"\n        self.revoked = True\n        self.cancel_ack\
    \ = None\n        self.deadline = None\n        self.timeout = None\n        self.terminal_status\
    \ = None\n        self.outcome = None\n\n    def begin(self, now):\n        if\
    \ self.state != \"idle\":\n            raise RuntimeError(\"previous goal is unresolved\"\
    )\n        self.token = str(uuid.uuid4())\n        self.state, self.reason = \"\
    requesting\", \"goal_request\"\n        self.revoked, self.cancel_ack = False,\
    \ None\n        self.timeout = self.terminal_status = None\n        self.outcome\
    \ = None\n        self.deadline = now + 5.0\n        return self.token\n\n   \
    \ def revoke(self, reason, now):\n        if self.state == \"idle\":\n       \
    \     return False\n        first = not self.revoked\n        if first:\n    \
    \        self.reason, self.deadline = reason, now + 2.0\n        self.revoked,\
    \ self.state = True, \"stopping\"\n        return first\n\n    def accepted(self,\
    \ token, accepted, now):\n        if token != self.token or self.state == \"idle\"\
    :\n            return \"ignore\"\n        self.tick(now)  # a late response cannot\
    \ hide a missed deadline\n        if not accepted:\n            if not self.revoked:\n\
    \                self.reason = \"goal_rejected\"\n            self.revoked, self.state,\
    \ self.deadline = True, \"idle\", None\n            self.outcome = \"rejected\"\
    \n            return \"rejected\"\n        if self.revoked:\n            return\
    \ \"cancel\"\n        self.state, self.reason, self.deadline = \"running\", \"\
    goal_active\", None\n        return \"run\"\n\n    def acknowledge_cancel(self,\
    \ token, accepted):\n        if token == self.token and self.state == \"stopping\"\
    :\n            self.cancel_ack = bool(accepted)\n            # An accepted cancellation\
    \ is NOT a terminal action result.\n\n    def finish(self, token, status, now):\n\
    \        if token != self.token or self.state == \"idle\":\n            return\
    \ False\n        if status not in (4, 5, 6):  # ROS succeeded, canceled, aborted\n\
    \            self.revoke(\"invalid_terminal_status\", now)\n            return\
    \ False\n        self.outcome = \"stopped\" if self.revoked else {4: \"succeeded\"\
    , 5: \"canceled\", 6: \"aborted\"}[status]\n        self.revoke({4: \"goal_succeeded\"\
    , 5: \"goal_canceled\", 6: \"goal_aborted\"}[status], now)\n        self.terminal_status,\
    \ self.state, self.deadline = status, \"idle\", None\n        return True\n\n\
    \    def tick(self, now):\n        if self.deadline is not None and now >= self.deadline:\n\
    \            if self.state == \"requesting\":\n                self.revoke(\"\
    goal_accept_timeout\", now)\n            elif self.state == \"stopping\":\n  \
    \              self.timeout = \"terminal_result_timeout\"\n                self.deadline\
    \ = None  # stays unresolved; no automatic reset\n\n    def may_command(self,\
    \ token):\n        return token == self.token and self.state == \"running\" and\
    \ not self.revoked\n\n"
