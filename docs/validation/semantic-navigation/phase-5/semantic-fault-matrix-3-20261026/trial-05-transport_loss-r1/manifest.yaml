  priority_pump.py: "\"\"\"Bounded single-thread callback scheduling; no timing/authority\
    \ decisions.\n\nCommand ingress has its own executor, so sensor/diagnostic wait-set\
    \ ordering\ncannot put it behind a full observer callback batch. All callbacks\
    \ and guard\nticks still run on one thread. Four ingress and four observer polls\
    \ per round\nbound both workloads without starving commands, TF or cancellation.\
    \ A zero-time\nexecutor poll need not execute a callback (including when finishing\
    \ a previous\nready-set iteration). Native queues are ingested between observer\
    \ callbacks.\n\"\"\"\nimport time\n\n\nclass StageTimings:\n    \"\"\"Bounded\
    \ diagnostics only; never supplies time or authority to the guard.\"\"\"\n   \
    \ def __init__(self, *, now=time.monotonic_ns, threshold_ns=10_000_000, capacity=2000):\n\
    \        self.now, self.threshold_ns, self.capacity = now, threshold_ns, capacity\n\
    \        self.stages, self.slow, self.dropped = {}, [], 0\n\n    def call(self,\
    \ stage, callback):\n        start = self.now()\n        try:\n            return\
    \ callback()\n        finally:\n            end = self.now()\n            duration\
    \ = end-start\n            stats = self.stages.setdefault(stage, {\"calls\":0,\
    \ \"maximum_ns\":0})\n            stats[\"calls\"] += 1\n            stats[\"\
    maximum_ns\"] = max(stats[\"maximum_ns\"], duration)\n            if duration\
    \ >= self.threshold_ns:\n                if len(self.slow) < self.capacity:\n\
    \                    self.slow.append({\"stage\":stage, \"start_steady_ns\":start,\n\
    \                                      \"end_steady_ns\":end, \"duration_ns\"\
    :duration})\n                else:\n                    self.dropped += 1\n\n\
    \    def report(self):\n        return {\"stages\":self.stages, \"slow\":self.slow,\
    \ \"dropped\":self.dropped,\n                \"threshold_ns\":self.threshold_ns}\n\
    \n\ndef audit_timing(info, callback_wall):\n    \"\"\"Installed rclpy passes MessageInfo\
    \ as a dictionary; audit hop only.\"\"\"\n    return {\"wall_received\":callback_wall,\n\
    \            \"audit_source_timestamp\":info[\"source_timestamp\"],\n        \
    \    \"audit_received_timestamp\":info[\"received_timestamp\"]}\n\n\ndef pump_round(*,\
    \ ingress, observer, task, native, guard, diagnostics):\n    native()\n    for\
    \ _ in range(4):\n        ingress()\n    for _ in range(4):\n        observer()\n\
    \        native()\n    task()\n    native()\n    guard()\n    diagnostics()\n"
  process_shutdown.py: "\"\"\"Bounded private-fixture teardown, preserving Gazebo's\
    \ display dependency.\"\"\"\nimport os\nfrom pathlib import Path\nimport re\n\
    import signal\nimport subprocess\nimport time\n\n\ndef timeout_snapshot(pid):\n\
    \    \"\"\"Post-failure evidence only; never extends the qualification deadline.\n\
    \n    Best-effort unprivileged reads / debugger attachment. No ptrace capability,\n\
    \    seccomp changes, or writes to the inferior. Debugger attachment can pause\n\
    \    threads, so it is permitted only after shutdown has already failed.\n   \
    \ \"\"\"\n    report={\"pid\":pid,\"steady_ns\":time.monotonic_ns(),\"threads\"\
    :[]}\n    try:\n        for task in sorted(Path(f\"/proc/{pid}/task\").iterdir()):\n\
    \            row={\"tid\":int(task.name)}\n            for name in (\"comm\",\"\
    wchan\",\"syscall\",\"stack\"):\n                try: row[name]=(task/name).read_text()\n\
    \                except OSError as error: row[name+\"_error\"]=str(error)\n  \
    \          report[\"threads\"].append(row)\n    except OSError as error:\n   \
    \     report[\"proc_error\"]=str(error)\n    try:\n        run=subprocess.run([\"\
    gdb\",\"--batch\",\"-nx\",\"-nh\",\"-p\",str(pid),\n                         \
    \   \"-ex\",\"set pagination off\",\"-ex\",\"thread apply all bt\",\n        \
    \                    \"-ex\",\"detach\"],capture_output=True,text=True,timeout=3)\n\
    \        report[\"debugger\"]={\"returncode\":run.returncode,\"stdout\":run.stdout,\"\
    stderr\":run.stderr}\n    except subprocess.TimeoutExpired as error:\n       \
    \ report[\"debugger_error\"]=str(error)\n        report[\"debugger_partial_stdout\"\
    ]=(error.stdout or b\"\").decode(errors=\"replace\") if isinstance(error.stdout,bytes)\
    \ else error.stdout\n        report[\"debugger_partial_stderr\"]=(error.stderr\
    \ or b\"\").decode(errors=\"replace\") if isinstance(error.stderr,bytes) else\
    \ error.stderr\n    except OSError as error:\n        report[\"debugger_error\"\
    ]=str(error)\n    return report\n\n\nCONSOLE_STOP_SERVICE=\"/phase5/console_stop\"\
    \n\n\ndef gazebo_stop(*, env=None, stop=True):\n    env=dict(os.environ) if env\
    \ is None else env\n    if env.get(\"GZ_IP\")!=\"127.0.0.1\" or not env.get(\"\
    GZ_PARTITION\",\"\").startswith(\"phase5-watchdog-\"):\n        return {\"passed\"\
    :False,\"reason\":\"not_private_transport\"}\n    try:\n        run=subprocess.run([\"\
    gz\",\"service\",\"-s\",CONSOLE_STOP_SERVICE,\"--reqtype\",\"gz.msgs.ServerControl\"\
