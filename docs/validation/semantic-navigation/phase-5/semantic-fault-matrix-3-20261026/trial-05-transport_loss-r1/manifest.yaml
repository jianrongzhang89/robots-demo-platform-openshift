    \ - max(0, age + UNCERTAINTY_NS)\n        self.leases[key] = Lease(evidence, now.steady\
    \ + remaining)\n        return True\n\n    def arm(self, now, *, stationary, tasks_idle,\
    \ neutral_command,\n            first_command_timeout_ns=COMMAND_NS):\n      \
    \  \"\"\"Trusted coordinator must independently verify all three conditions.\n\
    \n        Disallow repeated arm while moving; a fresh session is required for\n\
    \        every downstream command and independent receiver rearm.\n        \"\"\
    \"\n        if not self._advance(now) or self.armed:\n            return None\n\
    \        if not (stationary is True and tasks_idle is True and neutral_command\
    \ is True):\n            return None\n        # Optional bounded ZERO-motion setup\
    \ interval for native arming / goal\n        # planning. Once a real command arrives\
    \ its ordinary 100 ms lifetime\n        # applies; subsequent packets can never\
    \ restore this setup interval.\n        if not integer(first_command_timeout_ns)\
    \ or not COMMAND_NS <= first_command_timeout_ns <= 5000*MS:\n            return\
    \ None\n        if any(k not in self.leases or self._expired(self.leases[k], now)\
    \ for k in self.required):\n            return None\n        self.session = str(uuid.uuid4())\n\
    \        self.armed, self.reason, self.trigger_steady = True, \"armed\", None\n\
    \        self.sequence = self.command_sequence = -1\n        self.command_deadline\
    \ = now.steady + first_command_timeout_ns\n        self.command_wall = now.wall\n\
    \        self.wait_hold_active = False\n        self.velocity = ZERO\n       \
    \ return self.session\n\n    def command(self, session, sequence, issued_wall,\
    \ velocity, now):\n        self._advance(now)\n        if not self.armed:\n  \
    \          return False\n        if (session != self.session or not integer(sequence)\
    \ or sequence <= self.command_sequence\n                or not integer(issued_wall)\
    \ or issued_wall < self.command_wall\n                or not -UNCERTAINTY_NS <=\
    \ now.wall - issued_wall < COMMAND_NS - UNCERTAINTY_NS\n                or not\
    \ velocity_ok(velocity)):\n            self.trip(\"command_invalid\", now)\n \
    \           return False\n        self.command_sequence = sequence\n        self.command_wall\
    \ = issued_wall\n        if not (self.wait_hold_active and tuple(velocity)==ZERO):\n\
    \            self.command_deadline = now.steady + COMMAND_NS - max(0, now.wall\
    \ - issued_wall + UNCERTAINTY_NS)\n        if any(abs(v)>0.005 for v in velocity):\
    \ self.wait_hold_active = False\n        self.velocity = tuple(velocity)\n   \
    \     return True\n\n    def zero_wait_hold(self, session, now):\n        \"\"\
    \"Finish a near-stationary Wait handoff, then refresh its short lease.\n\n   \
    \     The task/registry adapter must prove that the configured Wait BT child\n\
    \        is active and owned. A requested/applied command within 0.005 m/s is\n\
    \        normalized to exact zero; larger motion is never modified. This never\n\
    \        changes the source-command wall stamp or command sequence, and still\n\
    \        advances/checks every sensor lease.\n        \"\"\"\n        if (not\
    \ self.armed or session!=self.session or\n                any(abs(v)>0.005 for\
    \ v in self.velocity)):\n            return False\n        if not self._advance(now)\
    \ or not self.armed:\n            return False\n        self.velocity=ZERO\n \
    \       self.command_deadline=now.steady+COMMAND_NS-UNCERTAINTY_NS\n        self.wait_hold_active=True\n\
    \        return True\n\n    def tick(self, now):\n        self._advance(now)\n\
    \        return self.velocity if self.armed else ZERO\n\n    def packet(self,\
    \ now):\n        \"\"\"None means revoke/zero, never a live lease with an old\
    \ session.\"\"\"\n        self.tick(now)\n        if not self.armed:\n       \
    \     return None\n        self.sequence += 1\n        # Do not extend a command/input's\
    \ authority by periodically republishing.\n        remaining = min(LEASE_NS, self.command_deadline\
    \ - now.steady,\n                        *(v.deadline - now.steady for v in self.leases.values()))\n\
    \        return Command(self.session, self.sequence, now.wall, now.wall + remaining,\
    \ self.velocity)\n\n\nclass FinalReceiver:\n    \"\"\"Receiver-side, independently\
    \ fail-latched short lease (no ROS/Gazebo I/O).\n\n    Must be rearmed explicitly\
    \ together with SafetyGate; never adopt a session\n    from a command packet.\
    \ Requires a local 20 ms steady timer and synchronized\n    wall clocks with <=2\
    \ ms allowance, same as the existing capture contract.\n    \"\"\"\n\n    def\
    \ __init__(self):\n        self.session = None\n        self.sequence = -1\n \
    \       self.deadline = None\n        self.expires_wall = None\n        self.reason\
    \ = \"startup_disarmed\"\n        self.velocity = ZERO\n        self.last_time\
    \ = None\n        self.used_sessions = set()\n\n    def stop(self, reason):\n\
    \        self.session = None\n        self.velocity = ZERO\n        self.reason\
    \ = reason\n        self.deadline = self.expires_wall = None\n\n    def arm(self,\
    \ session, now, *, stationary):\n        self.tick(now)\n        if (self.session\
    \ is not None or stationary is not True\n                or not isinstance(session,\
    \ str) or len(session) != 36\n                or session in self.used_sessions\
    \ or len(self.used_sessions) >= 1024):\n            return False\n        self.used_sessions.add(session)\n\
    \        self.session, self.sequence = session, -1\n        self.reason = \"armed_waiting_first_packet\"\
    \n        self.deadline = now.steady + LEASE_NS\n        self.expires_wall = now.wall\
    \ + LEASE_NS\n        return True\n\n    def tick(self, now):\n        if not\
    \ all(integer(v) for v in (now.steady, now.wall, now.ros)):\n            raise\
    \ ValueError(\"invalid local clock\")\n        prior, self.last_time = self.last_time,\
    \ now\n        if prior and (now.steady < prior.steady or now.ros < prior.ros\n\
    \                      or abs(now.wall-prior.wall-now.steady+prior.steady) > 20\
    \ * MS):\n            self.stop(\"clock_discontinuity\")\n        if self.session\
    \ is not None and (now.steady >= self.deadline\n                             \
    \            or now.wall >= self.expires_wall):\n            self.stop(\"lease_expired\"\
    )\n        return self.velocity if self.session is not None else ZERO\n\n    def\
    \ receive(self, packet, now):\n        self.tick(now)\n        if packet is None:\n\
    \            self.stop(\"supervisor_revoked\")\n            return False\n   \
    \     if self.session is None:\n            return False\n        if (packet.session\
    \ != self.session or not integer(packet.sequence)\n                or packet.sequence\
    \ <= self.sequence or not velocity_ok(packet.velocity)\n                or not\
    \ all(integer(v) for v in (packet.issued_wall, packet.expires_wall))\n       \
    \         or not 0 < packet.expires_wall-packet.issued_wall <= LEASE_NS\n    \
    \            or packet.issued_wall > now.wall + UNCERTAINTY_NS\n             \
    \   or packet.expires_wall <= now.wall + UNCERTAINTY_NS):\n            self.stop(\"\
    packet_invalid\")\n            return False\n        self.sequence = packet.sequence\n\
    \        self.expires_wall = packet.expires_wall - UNCERTAINTY_NS\n        self.deadline\
    \ = now.steady + self.expires_wall - now.wall\n        self.velocity = tuple(packet.velocity)\n\
    \        self.reason = \"armed\"\n        return True\n"
  sam3_observation.py: "\"\"\"Observation-only SAM3 checks for the private guarded\
    \ moving fixture.\n\nPure decoding/aggregation helpers only: no clock, command,\
    \ lease or\nfreshness threshold is changed. The semantic layer is NOT loaded in\
    \ any\ncostmap of this fixture; these helpers only verify that the separately\n\
    qualified SAM3 runtime registers correctly at capture time while the\nguarded\
    \ chain drives, and that its transport does not break the qualified\nobservation\
    \ timing contracts.\n\"\"\"\nimport math\n\nMAT_MODEL = \"semantic_target_mat\"\
    \n# Registration contract: capture-time projected points of the avoid_target\n\
    # mask must land on the staged mat's ground-truth rectangle. The 0.10 m\n# tolerance\
    \ matches the Phase 1 projection gate; the pooled >=95% fraction\n# matches the\
    \ Phase 1/2 checked-point criteria.\nREGISTRATION_FRACTION = 0.95\nREGISTRATION_TOLERANCE_M\
    \ = 0.10\nREGISTRATION_Z_MIN_M = -0.05\nREGISTRATION_Z_MAX_M = 0.25\nMIN_MOVING_RESULTS\
    \ = 10\nMIN_SELECTED_PIXELS = 50\n# Observation timing contract: cross-pod Zenoh\
    \ transport adds latency to\n# the qualified Phase 3 in-process path, so the admission\
    \ bound used by the\n# Phase 4 layer and the D1 smoke (500 ms capture age) is\
    \ the limit here.\nP95_CAPTURE_AGE_LIMIT_MS = 500.0\nMIN_RESULTS_PER_SECOND =\
    \ 5.0\n\n\ndef parse_mat_ground_truth(world_text):\n    \"\"\"Axis-aligned ground\
    \ truth of the staged mat parsed from the world SDF.\"\"\"\n    import re\n  \
    \  model = re.search(r\"<model name=[\\\"']\" + MAT_MODEL + r\"[\\\"']>(.*?)</model>\"\
    ,\n                      world_text, re.DOTALL)\n    if not model:\n        raise\
    \ ValueError(\"semantic target mat missing from the private world\")\n    pose\
    \ = re.search(r\"<pose>([^<]+)</pose>\", model.group(1))\n    size = re.search(r\"\
    <size>([^<]+)</size>\", model.group(1))\n    if not pose or not size:\n      \
    \  raise ValueError(\"mat pose/size missing from the private world\")\n    pose_values\
    \ = pose.group(1).split()\n    size_values = size.group(1).split()\n    x, y =\
    \ float(pose_values[0]), float(pose_values[1])\n    sx, sy = float(size_values[0]),\
    \ float(size_values[1])\n    return {\"xmin\": x - sx / 2, \"xmax\": x + sx /\
    \ 2,\n            \"ymin\": y - sy / 2, \"ymax\": y + sy / 2}\n\n\ndef decode_mask(data,\
    \ width, height):\n    \"\"\"Decode a mono8 label mask into a (height, width)\
    \ uint8 array.\"\"\"\n    import numpy as np\n    if len(data) != width * height:\n\
    \        raise ValueError(\"mask payload does not match mono8 dimensions\")\n\
    \    return np.frombuffer(bytes(data), dtype=np.uint8).reshape(height, width)\n\
    \n\ndef decode_points_xyz(data, width, height, point_step, offsets):\n    \"\"\
    \"Decode an organized XYZ cloud into an (height, width, 3) float array.\n\n  \
    \  offsets is the (x, y, z) byte offset triple taken from the PointCloud2\n  \
    \  field definitions; all fields are float32 little-endian as emitted by\n   \
    \ the qualified SAM3 runtime.\n    \"\"\"\n    import numpy as np\n    if point_step\
    \ <= 0 or len(data) != point_step * width * height:\n        raise ValueError(\"\
    point payload does not match organized dimensions\")\n    raw = np.frombuffer(bytes(data),\
    \ dtype=np.uint8).reshape(-1, point_step)\n\n    def field(offset):\n        return\
    \ raw[:, offset:offset + 4].copy().view(\"<f4\").reshape(-1)\n\n    return np.stack([field(offsets[i])\
    \ for i in range(3)], axis=-1).reshape(height, width, 3)\n\n\ndef points_in_rectangle(points_map,\
    \ rectangle, tolerance=REGISTRATION_TOLERANCE_M):\n    \"\"\"Fraction of (N,3)\
    \ map-frame points inside the mat rectangle.\"\"\"\n    import numpy as np\n \
    \   if len(points_map) == 0:\n        return 0, 0.0\n    xs, ys, zs = points_map[:,\
    \ 0], points_map[:, 1], points_map[:, 2]\n    inside = ((xs >= rectangle[\"xmin\"\
    ] - tolerance) & (xs <= rectangle[\"xmax\"] + tolerance)\n              & (ys\
    \ >= rectangle[\"ymin\"] - tolerance) & (ys <= rectangle[\"ymax\"] + tolerance)\n\
    \              & (zs >= REGISTRATION_Z_MIN_M) & (zs <= REGISTRATION_Z_MAX_M))\n\
    \    return len(points_map), float(np.count_nonzero(inside)) / len(points_map)\n\
    \n\ndef transform_points(points, translation, quaternion):\n    \"\"\"Apply a\
    \ rigid transform to an (N,3) point array.\"\"\"\n    import numpy as np\n   \
    \ x, y, z, w = quaternion\n    norm = (x * x + y * y + z * z + w * w) ** 0.5\n\
    \    x, y, z, w = x / norm, y / norm, z / norm, w / norm\n    rotation = np.array([\n\
    \        [1 - 2 * (y * y + z * z), 2 * (x * y - z * w), 2 * (x * z + y * w)],\n\
    \        [2 * (x * y + z * w), 1 - 2 * (x * x + z * z), 2 * (y * z - x * w)],\n\
    \        [2 * (x * z - y * w), 2 * (y * z + x * w), 1 - 2 * (x * x + y * y)]])\n\
    \    return points @ rotation.T + np.asarray(translation, dtype=float)\n\n\ndef\
    \ selected_points_in_rectangle(mask, xyz_map, rectangle,\n                   \
    \              tolerance=REGISTRATION_TOLERANCE_M):\n    \"\"\"Count avoid_target\
    \ pixels and their in-rectangle fraction.\"\"\"\n    selected = mask == 2\n  \
    \  count = int(selected.sum())\n    if count == 0:\n        return 0, 0.0\n  \
    \  return points_in_rectangle(xyz_map[selected], rectangle, tolerance)\n\n\ndef\
    \ registration_summary(results):\n    \"\"\"Aggregate per-result registration\
    \ measurements.\n\n    results is a list of {\"selected\": int, \"inside_fraction\"\
    : float,\n    \"moving\": bool} rows; only rows captured while the robot was\n\
    \    independently moving and with enough selected pixels count.\n    \"\"\"\n\
    \    moving = [r for r in results\n              if r.get(\"moving\") and r.get(\"\
    selected\", 0) >= MIN_SELECTED_PIXELS]\n    total = sum(r[\"selected\"] for r\
    \ in moving)\n    inside = sum(r[\"inside_fraction\"] * r[\"selected\"] for r\
    \ in moving)\n    pooled = inside / total if total else 0.0\n    passed = len(moving)\
    \ >= MIN_MOVING_RESULTS and pooled >= REGISTRATION_FRACTION\n    return {\"passed\"\
    : passed, \"moving_results\": len(moving),\n            \"pooled_selected_points\"\
    : total, \"pooled_inside_fraction\": pooled,\n            \"minimum_result_fraction\"\
    : min((r[\"inside_fraction\"] for r in moving), default=None),\n            \"\
    contract\": (f\">= {REGISTRATION_FRACTION:.0%} of capture-time projected \"\n\
    \                         f\"points inside the ground-truth mat over >= {MIN_MOVING_RESULTS}\
    \ \"\n                         f\"moving results with >= {MIN_SELECTED_PIXELS}\
    \ selected pixels\"),\n            \"scope\": \"observation-only registration\
    \ on the private guarded fixture; \"\n                     \"no semantic cost\
    \ influence on navigation\"}\n\n\ndef timing_summary(ages_ms, result_count, window_seconds):\n\
    \    \"\"\"Evaluate the observation timing contract over the task window.\"\"\"\
    \n    if not ages_ms or window_seconds <= 0:\n        return {\"passed\": False,\
    \ \"reason\": \"missing_timing_records\",\n                \"p95_capture_age_limit_ms\"\
    : P95_CAPTURE_AGE_LIMIT_MS,\n                \"rate_limit_per_s\": MIN_RESULTS_PER_SECOND}\n\
    \    ordered = sorted(ages_ms)\n    index = min(len(ordered) - 1, max(0, math.ceil(0.95\
    \ * len(ordered)) - 1))\n    p95 = ordered[index]\n    rate = result_count / window_seconds\n\
    \    passed = p95 <= P95_CAPTURE_AGE_LIMIT_MS and rate >= MIN_RESULTS_PER_SECOND\n\
    \    return {\"passed\": passed, \"p95_capture_age_ms\": p95,\n            \"\
    p95_capture_age_limit_ms\": P95_CAPTURE_AGE_LIMIT_MS,\n            \"results_per_second\"\
    : rate, \"rate_limit_per_s\": MIN_RESULTS_PER_SECOND,\n            \"records\"\
    : len(ages_ms)}\n"
  sam3_observer_worker.py: "\"\"\"Standalone observation-only SAM3 monitor for the\
    \ private guarded fixture.\n\nRuns as a separate process so the multi-megabyte\
    \ semantic point clouds are\ndeserialized and projected OUTSIDE the fixture's\
    \ single-threaded safety\npump, and on their OWN private ROS domain so they never\
    \ load the safety\ndomain's clock/TF/command traffic (series 2 trial 2: clouds\
    \ on the safety\ndomain delayed the frame bridge's TF past the controller's transform\
    \ waits\nand the chain correctly stopped command_expired). This worker reads TF\
    \ from\nthe safety domain and every camera/semantic stream from the isolated\n\
    camera/semantic domain through two rclpy contexts, hash-matches each timing\n\
    record to its mask and cloud, projects the avoid_target points through\ncapture-time\
    \ TF, and reports only small aggregated state through files. It\nmoves no robot,\
    \ commands nothing, and changes no deadline.\n\"\"\"\nimport argparse\nimport\
    \ hashlib\nimport json\nimport os\nimport time\nfrom collections import deque\n\
    from pathlib import Path\n\nimport rclpy\nfrom rclpy.node import Node\nfrom rclpy.qos\
    \ import DurabilityPolicy, QoSProfile, ReliabilityPolicy\nfrom rclpy.time import\
    \ Time\nfrom sensor_msgs.msg import Image, PointCloud2\nfrom std_msgs.msg import\
    \ Bool, String\nfrom tf2_ros import Buffer, TransformListener\n\nfrom sam3_observation\
    \ import (decode_mask, decode_points_xyz,\n                               parse_mat_ground_truth,\
    \ points_in_rectangle,\n                               transform_points)\n\nSAFETY_DOMAIN\
    \ = \"85\"\nSEMANTIC_DOMAIN = \"88\"\n\n\ndef write_json(path, payload):\n   \
    \ temporary = Path(str(path) + \".tmp\")\n    temporary.write_text(json.dumps(payload))\n\
    \    temporary.replace(path)\n\n\ndef main():\n    if not os.getenv(\"GZ_PARTITION\"\
    , \"\").startswith(\"phase5-watchdog-\"):\n        raise RuntimeError(\"private\
    \ fixture partition required\")\n    parser = argparse.ArgumentParser(description=__doc__)\n\
    \    parser.add_argument(\"--shared-dir\", required=True,\n                  \
    \      help=\"emptyDir shared with the fixture container: the fixture writes the\
    \ mat ground truth here, the worker writes its aggregated state\")\n    args =\
    \ parser.parse_args()\n    shared = Path(args.shared_dir)\n    ground_truth_file\
    \ = shared / \"ground-truth.json\"\n    deadline = time.monotonic() + 180\n  \
    \  while not ground_truth_file.is_file():\n        if time.monotonic() > deadline:\n\
    \            raise RuntimeError(\"mat ground truth never appeared in the shared\
    \ directory\")\n        time.sleep(.2)\n    rectangle = json.loads(ground_truth_file.read_text())[\"\
    mat\"]\n    state = {\"masks\": deque(maxlen=10), \"clouds\": deque(maxlen=10),\
    \ \"results\": [],\n             \"ages\": [], \"stamps\": [], \"labels\": None,\
    \ \"ready\": False,\n             \"isolation\": None, \"last_isolation\": 0.0,\
    \ \"pending\": deque(),\n             \"camera\": {\"count\": 0, \"stamp_ns\"\
    : 0, \"rollback\": False,\n                        \"input_transport\": None},\n\
    \             # Armed-semantic lease evidence for the guarded supervisor: the\n\
    \             # camera capture traces (render-time camera heartbeat), the\n  \
    \           # SAM3 timing records (semantic result freshness, measured by\n  \
    \           # capture age) and the SAM3 status heartbeat. Each entry is\n    \
    \         # {epoch, sequence, wall_ns, ros_ns} or None while absent.\n       \
    \      \"leases\": {\"camera\": None, \"semantic\": None, \"inference_heartbeat\"\
    : None},\n             \"clock_ros_ns\": 0}\n    worker_epoch = f\"semantic-worker-{time.time_ns()}\"\
    \n    heartbeat_sequence = 0\n\n    # Safety-domain context: TF only, exactly\
    \ as qualified. The domain is\n    # forced here regardless of the launch environment.\n\
    \    os.environ[\"ROS_DOMAIN_ID\"] = SAFETY_DOMAIN\n    safety_context = rclpy.Context()\n\
    \    rclpy.init(context=safety_context)\n    tf_node = Node(\"phase5_sam3_tf_observer\"\
    , context=safety_context)\n    tf = Buffer()\n    listener = TransformListener(tf,\
    \ tf_node)  # kept alive for the buffer\n\n    # Isolated camera/semantic-domain\
    \ context: every bulk stream lives here.\n    os.environ[\"ROS_DOMAIN_ID\"] =\
    \ SEMANTIC_DOMAIN\n    semantic_context = rclpy.Context()\n    rclpy.init(context=semantic_context)\n\
    \    node = Node(\"phase5_sam3_observer\", context=semantic_context)\n\n    def\
    \ resolve(record, received):\n        \"\"\"Try to resolve one timing record against\
    \ retained payloads.\n\n        The small timing record can overtake its multi-megabyte\
    \ cloud through\n        the cross-node transport, so resolution is retried from\
    \ the spin\n        loop until the payloads arrive or the record expires.\n  \
    \      \"\"\"\n        mask_row = next((m for h, m, _ in state[\"masks\"] if h\
    \ == record.get(\"mask_sha256\")), None)\n        cloud_row = next((c for h, c,\
    \ _ in state[\"clouds\"] if h == record.get(\"cloud_sha256\")), None)\n      \
    \  if mask_row is None or cloud_row is None:\n            return False\n     \
    \   capture = Time(nanoseconds=int(mask_row.header.stamp.sec) * 1_000_000_000\n\
    \                       + mask_row.header.stamp.nanosec)\n        # The capture\
    \ stamp routinely leads the newest AMCL map->odom edge by\n        # up to one\
    \ scan interval; check availability BEFORE the expensive\n        # decodes and\
    \ retry from the pending loop.\n        if not tf.can_transform(\"map\", \"camera_color_optical_frame\"\
    , capture):\n            return False\n        try:\n            mask = decode_mask(mask_row.data,\
    \ mask_row.width, mask_row.height)\n            offsets = tuple(next(f.offset\
    \ for f in cloud_row.fields if f.name == axis)\n                            for\
    \ axis in (\"x\", \"y\", \"z\"))\n            xyz = decode_points_xyz(cloud_row.data,\
    \ cloud_row.width, cloud_row.height,\n                                    cloud_row.point_step,\
    \ offsets)\n            transform = tf.lookup_transform(\"map\", \"camera_color_optical_frame\"\
    , capture).transform\n            pts_map = transform_points(xyz[mask == 2],\n\
    \                (transform.translation.x, transform.translation.y, transform.translation.z),\n\
    \                (transform.rotation.x, transform.rotation.y, transform.rotation.z,\n\
    \                 transform.rotation.w))\n            count, fraction = points_in_rectangle(pts_map,\
    \ rectangle)\n            state[\"results\"].append({\"selected\": count, \"inside_fraction\"\
    : fraction,\n                                     \"matched\": True, \"receipt_wall_ns\"\
    : received,\n                                     \"capture_stamp_ns\": record.get(\"\
    capture\", {}).get(\"stamp_ns\")})\n        except Exception as error:  # evidence\
    \ row, never a crash\n            state[\"results\"].append({\"selected\": 0,\
    \ \"inside_fraction\": 0.0, \"moving\": False,\n                             \
    \        \"matched\": False, \"reason\": \"projection_error:\" + str(error),\n\
    \                                     \"receipt_wall_ns\": received})\n      \
    \  return True\n\n    def resolve_pending():\n        remaining = deque()\n  \
    \      for record, received in state[\"pending\"]:\n            if resolve(record,\
    \ received):\n                continue\n            if time.time_ns() - received\
    \ > 2_000_000_000:\n                state[\"results\"].append({\"selected\": 0,\
    \ \"inside_fraction\": 0.0, \"moving\": False,\n                             \
    \            \"matched\": False, \"reason\": \"unmatched_payload\",\n        \
    \                                 \"receipt_wall_ns\": received})\n          \
    \      continue\n            remaining.append((record, received))\n        state[\"\
    pending\"] = remaining\n\n    def on_mask(message):\n        state[\"masks\"].append((hashlib.sha256(bytes(message.data)).hexdigest(),\n\
    \                               message, time.time_ns()))\n\n    def on_cloud(message):\n\
    \        state[\"clouds\"].append((hashlib.sha256(bytes(message.data)).hexdigest(),\n\
    \                                message, time.time_ns()))\n\n    def on_timing(message):\n\
    \        record = json.loads(message.data)\n        now = time.time_ns()\n   \
    \     state[\"ages\"].append((now - record[\"capture_wall_ns\"]) / 1e6)\n    \
    \    state[\"stamps\"].append(record.get(\"capture\", {}).get(\"stamp_ns\"))\n\
    \        # Semantic lease evidence: capture age is the freshness authority.\n\
    \        source = record.get(\"source\") or {}\n        state[\"leases\"][\"semantic\"\
    ] = {\n            \"epoch\": source.get(\"source_epoch\") or worker_epoch,\n\
    \            \"sequence\": len(state[\"stamps\"]),\n            \"wall_ns\": record.get(\"\
    capture_wall_ns\", now),\n            \"ros_ns\": record.get(\"capture\", {}).get(\"\
    stamp_ns\", 0)}\n        if not resolve(record, now):\n            state[\"pending\"\
    ].append((record, now))\n\n    def on_labels(message):\n        state[\"labels\"\
    ] = json.loads(message.data)\n\n    def on_ready(message):\n        state[\"ready\"\
    ] = bool(message.data)\n\n    def on_compression_trace(message):\n        row\
    \ = json.loads(message.data)\n        camera = state[\"camera\"]\n        camera[\"\
    rollback\"] = bool(camera[\"rollback\"]\n                                  or\
    \ (camera[\"stamp_ns\"] and row.get(\"stamp_ns\", 0) < camera[\"stamp_ns\"]))\n\
    \        camera[\"count\"] += 1\n        camera[\"stamp_ns\"] = row.get(\"stamp_ns\"\
    ) or camera[\"stamp_ns\"]\n        camera[\"input_transport\"] = row.get(\"input_transport\"\
    )\n\n    def on_capture_trace(message):\n        # Camera lease evidence from\
    \ the render-time capture trace.\n        row = json.loads(message.data)\n   \
    \     if row.get(\"schema\") != \"semantic-capture/v1\":\n            return\n\
    \        state[\"leases\"][\"camera\"] = {\n            \"epoch\": row.get(\"\
    source_epoch\") or worker_epoch,\n            \"sequence\": row.get(\"sequence\"\
    , state[\"camera\"][\"count\"]),\n            \"wall_ns\": row.get(\"capture_wall_ns\"\
    , time.time_ns()),\n            \"ros_ns\": row.get(\"stamp_ns\", 0)}\n\n    def\
    \ on_status(message):\n        # Inference heartbeat: the process's 20 Hz status;\
    \ its ros field is\n        # the worker's /clock copy on this isolated domain.\n\
    \        nonlocal heartbeat_sequence\n        heartbeat_sequence += 1\n      \
    \  state[\"leases\"][\"inference_heartbeat\"] = {\n            \"epoch\": worker_epoch,\n\
    \            \"sequence\": heartbeat_sequence,\n            \"wall_ns\": time.time_ns(),\n\
    \            \"ros_ns\": state[\"clock_ros_ns\"]}\n\n    def on_clock(message):\n\
    \        state[\"clock_ros_ns\"] = (message.clock.sec * 1_000_000_000\n      \
    \                           + message.clock.nanosec)\n\n    node.create_subscription(Image,\
    \ \"/robot_1/semantic/mask\", on_mask, 10)\n    node.create_subscription(PointCloud2,\
    \ \"/robot_1/semantic/points\", on_cloud, 10)\n    node.create_subscription(String,\
    \ \"/robot_1/semantic/timing\", on_timing, 20)\n    node.create_subscription(Bool,\
    \ \"/robot_1/semantic/ready\", on_ready, 10)\n    node.create_subscription(String,\
    \ \"/robot_1/semantic/label_info\", on_labels,\n        QoSProfile(depth=1, reliability=ReliabilityPolicy.RELIABLE,\n\
    \                   durability=DurabilityPolicy.TRANSIENT_LOCAL))\n    node.create_subscription(String,\
    \ \"/robot_1/camera/compression_trace\", on_compression_trace, 20)\n    node.create_subscription(String,\
    \ \"/robot_1/camera/capture_trace\", on_capture_trace, 20)\n    node.create_subscription(String,\
    \ \"/robot_1/semantic/status\", on_status, 20)\n    from rosgraph_msgs.msg import\
    \ Clock as ClockMessage\n    node.create_subscription(ClockMessage, \"/clock\"\
    , on_clock, 10)\n\n    # Explicit per-context executors: the global rclpy executor\
    \ is bound to\n    # the default context and cannot service either custom context.\n\
    \    from rclpy.executors import SingleThreadedExecutor\n    safety_executor =\
    \ SingleThreadedExecutor(context=safety_context)\n    safety_executor.add_node(tf_node)\n\
    \    semantic_executor = SingleThreadedExecutor(context=semantic_context)\n  \
    \  semantic_executor.add_node(node)\n\n    def isolation():\n        semantic_topics\
    \ = sorted(t for t, _ in node.get_topic_names_and_types()\n                  \
    \               if \"/semantic/\" in t)\n        subscribers = {sub.node_name\
    \ for topic in semantic_topics\n                       for sub in node.get_subscriptions_info_by_topic(topic)}\n\
    \        return {\"semantic_topics\": semantic_topics,\n                \"subscribing_nodes\"\
    : sorted(subscribers),\n                \"costmap_subscriptions\": sorted(n for\
    \ n in subscribers if \"costmap\" in n)}\n\n    status_path, observation_path\
    \ = shared / \"status.json\", shared / \"observation.json\"\n\n    def status_payload():\n\
    \        return {\"ready\": state[\"ready\"], \"labels\": state[\"labels\"],\n\
    \                \"results\": len(state[\"results\"]),\n                \"last_result_receipt_wall_ns\"\
    : (state[\"results\"][-1][\"receipt_wall_ns\"]\n                             \
    \                   if state[\"results\"] else None),\n                \"camera\"\
