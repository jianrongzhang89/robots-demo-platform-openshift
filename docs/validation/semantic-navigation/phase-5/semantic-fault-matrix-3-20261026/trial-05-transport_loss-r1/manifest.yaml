    \ self.assertFalse(s.may_command(\"old\"))\n\n    def test_cancel_ack_does_not_clear_task(self):\n\
    \        s = TaskSession(); t = s.begin(0); s.accepted(t, True, .1)\n        s.revoke(\"\
