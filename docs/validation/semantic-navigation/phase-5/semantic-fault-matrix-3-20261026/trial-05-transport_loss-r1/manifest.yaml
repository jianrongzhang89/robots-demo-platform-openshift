    \ in row[\"pairs\"]:\n            names=tuple(sorted((row[\"names\"][str(pair[\"\
    a\"])],row[\"names\"][str(pair[\"b\"])])))\n            if (names not in allowed_pairs\
    \ and pair[\"contact_steps\"]>initial.get((pair[\"a\"],pair[\"b\"]),0)\n     \
    \               and names not in unexpected):\n                unexpected.append(names)\n\
    \    return {\"passed\":not unexpected,\"reason\":\"unexpected_contact\" if unexpected\
