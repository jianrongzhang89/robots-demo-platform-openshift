  analyze_hotel_commands.py: "\"\"\"Offline analysis of DISARMED command evidence;\
    \ never grants motion authority.\"\"\"\nimport argparse\nimport json\nfrom pathlib\
    \ import Path\nfrom safety_core import COMMAND_NS, UNCERTAINTY_NS\n\n\ndef analyze(commands):\n\
    \    raw=[r for r in commands if r[\"kind\"]==\"raw\"]\n    if not raw or raw[-1][\"\
    velocity\"]!=[0,0,0]:\n        raise ValueError(\"requires terminal raw zero;\
    \ otherwise window is ambiguous\")\n    cutoff=raw[-1][\"source_timestamp\"]\n\
    \    checked=[r for r in commands if r[\"kind\"]==\"checked\" and r[\"source_timestamp\"\
    ]<cutoff]\n    eligible=sorted([r for r in checked if r[\"admitted\"] and r[\"\
    processed_wall\"]<cutoff],\n                    key=lambda r:r[\"processed_wall\"\
    ])\n    if not eligible: raise ValueError(\"no capture-eligible output\")\n  \
    \  end=None; gaps=[]\n    for row in eligible:\n        start=row[\"processed_wall\"\
    ]\n        deadline=row[\"bound\"]+COMMAND_NS-UNCERTAINTY_NS\n        if deadline<=start:\
    \ raise ValueError(\"eligible record already expired\")\n        if end is not\
    \ None and start>end:\n            gaps.append({\"from_wall\":end,\"to_wall\"\
    :start,\"duration_ms\":(start-end)/1e6})\n        end=max(end or 0,deadline)\n\
    \    return {\"qualification\":\"offline optimistic command-authority coverage;\
    \ NOT actuator or publisher qualification\",\n        \"window\":\"first eligible\
    \ checked command to last eligible checked command before terminal raw zero\"\
    ,\n        \"terminal_zero_source_wall\":cutoff,\"checked_before_terminal_zero\"\
    :len(checked),\n        \"eligible_checked_before_terminal_zero\":len(eligible),\"\
    source_lifetime_ms\":COMMAND_NS/1e6,\n        \"uncertainty_ms\":UNCERTAINTY_NS/1e6,\"\
    gaps\":gaps,\n        \"maximum_gap_ms\":max((g[\"duration_ms\"] for g in gaps),default=0),\n\
    \        \"continuous_coverage\":not gaps,\n        \"limitation\":\"uses original\
    \ wall capture bounds; omits later supervisor/lease scheduling, so coverage is\
    \ optimistic\"}\n\n\nif __name__==\"__main__\":\n    parser=argparse.ArgumentParser(description=__doc__)\n\
    \    parser.add_argument(\"commands\",type=Path)\n    parser.add_argument(\"--output\"\
    ,type=Path,required=True)\n    args=parser.parse_args()\n    result=analyze(json.loads(args.commands.read_text()))\n\
    \    with args.output.open(\"x\") as handle: json.dump(result,handle,indent=2)\n\
    \    print(json.dumps(result))\n"
  audit_geometry.py: "#!/usr/bin/env python3\n\"\"\"Audit collision XY bounds in the\
    \ installed hotel SDF, without modifying it.\"\"\"\nimport hashlib\nimport json\n\
    import math\nfrom pathlib import Path\nimport xml.etree.ElementTree as ET\n\n\n\
    def rotation(roll, pitch, yaw):\n    cr, sr, cp, sp, cy, sy = math.cos(roll),\
    \ math.sin(roll), math.cos(pitch), math.sin(pitch), math.cos(yaw), math.sin(yaw)\n\
    \    return [[cy*cp, cy*sp*sr-sy*cr, cy*sp*cr+sy*sr],\n            [sy*cp, sy*sp*sr+cy*cr,\
    \ sy*sp*cr-cy*sr], [-sp, cp*sr, cp*cr]]\n\n\ndef pose(element):\n    p = element.find(\"\
    pose\")\n    if p is not None and p.get(\"relative_to\"):\n        raise ValueError(\"\
    explicit relative_to needs frame-graph resolution\")\n    values = [float(v) for\
    \ v in (p.text if p is not None else \"0 0 0 0 0 0\").split()]\n    return values[:3],\
    \ rotation(*values[3:])\n\n\ndef audit(world_path, urdf_path):\n    raw = Path(world_path).read_bytes()\n\
    \    model = ET.fromstring(raw).find(\".//model[@name='robot_1']\")\n    if model\
    \ is None:\n        raise ValueError(\"robot_1 missing\")\n    origin, basis =\
    \ pose(model.find(\"link[@name='base_footprint']\"))\n    if origin != [0, 0,\
    \ 0] or basis != rotation(0, 0, 0):\n        raise ValueError(\"audit requires\
    \ base_footprint coincident with model frame\")\n    boxes = []\n    for link\
    \ in model.findall(\"link\"):\n        if not link.findall(\"collision\"):\n \
    \           continue\n        translation, orient = pose(link)\n        for collision\
    \ in link.findall(\"collision\"):\n            offset, rot = pose(collision)\n\
    \            center = [translation[i] + sum(orient[i][j]*offset[j] for j in range(3))\
    \ for i in range(3)]\n            combined = [[sum(orient[i][k]*rot[k][j] for\
    \ k in range(3)) for j in range(3)] for i in range(3)]\n            geometry =\
    \ collision.find(\"geometry\")\n            if geometry.find(\"box\") is not None:\n\
    \                half = [float(v)/2 for v in geometry.findtext(\"box/size\").split()]\n\
    \                extent = [sum(abs(combined[i][j])*half[j] for j in range(3))\
    \ for i in range(3)]\n            elif geometry.find(\"cylinder\") is not None:\n\
    \                radius, half_length = float(geometry.findtext(\"cylinder/radius\"\
    )), float(geometry.findtext(\"cylinder/length\"))/2\n                extent =\
    \ [radius*math.sqrt(max(0, 1-combined[i][2]**2)) + half_length*abs(combined[i][2])\
    \ for i in range(3)]\n            else:\n                raise ValueError(\"unsupported\
    \ collision geometry; manual review required\")\n            boxes.append({\"\
    link\": link.get(\"name\"), \"collision\": collision.get(\"name\"),\n        \
    \                  \"min\": [center[i]-extent[i] for i in range(3)],\n       \
    \                   \"max\": [center[i]+extent[i] for i in range(3)]})\n    bounds\
    \ = {\"min\": [min(b[\"min\"][i] for b in boxes) for i in range(3)],\n       \
    \       \"max\": [max(b[\"max\"][i] for b in boxes) for i in range(3)]}\n    corner_radius\
    \ = max(math.hypot(x, y) for x in (bounds[\"min\"][0], bounds[\"max\"][0])\n \
    \                       for y in (bounds[\"min\"][1], bounds[\"max\"][1]))\n \
    \   urdf_raw = Path(urdf_path).read_bytes()\n    urdf = ET.fromstring(urdf_raw)\n\
    \    base_joint = next(j for j in urdf.findall(\"joint\") if j.find(\"child\"\
    ).get(\"link\") == \"base_link\")\n    return {\"world_sha256\": hashlib.sha256(raw).hexdigest(),\n\
    \            \"robot_sdf\": ET.tostring(model, encoding=\"unicode\"), \"collisions\"\
    : boxes,\n            \"xy_bounds\": {k: v[:2] for k, v in bounds.items()},\n\
    \            \"bounding_rectangle_radius_m\": corner_radius, \"canonical_radius_m\"\
    : 0.22,\n            \"canonical_radius_covers_rectangle\": 0.22 >= corner_radius,\n\
    \            \"urdf_sha256\": hashlib.sha256(urdf_raw).hexdigest(),\n        \
    \    \"urdf_base_joint_xyz\": base_joint.find(\"origin\").get(\"xyz\"),\n    \
    \        \"sdf_base_link_pose\": model.find(\"link[@name='base_link']\").findtext(\"\
    pose\", \"0 0 0 0 0 0\"),\n            \"diff_drive_plugin\": ET.tostring(next(p\
    \ for p in model.findall(\"plugin\") if \"DiffDrive\" in p.get(\"name\", \"\"\
    )), encoding=\"unicode\"),\n            \"qualification\": \"static SDF audit\
    \ only; moving TF and physical stop tests still required\"}\n\n\nif __name__ ==\
    \ \"__main__\":\n    print(json.dumps(audit(\"/opt/ros2-demo/hotel-assets/hotel.world\"\
    , \"/opt/ros2-demo/robot/turtlebot3_waffle.urdf\"), sort_keys=True))\n"
  baseline_metrics.py: "\"\"\"Independent native physical stop/trajectory metrics,\
    \ not contact detection.\"\"\"\nimport math\n\n\ndef metrics(trace, events, *,\
    \ fault_injected_steady_ns=None):\n    revoke=next((e for e in reversed(events)\
    \ if e[\"event\"]==\"permission_revoked\"),None)\n    if not revoke: return {\"\
    passed\":False,\"reason\":\"missing_revocation\"}\n    coordinator_trigger=revoke[\"\
    trigger_steady_ns\"]\n    trigger=coordinator_trigger\n    session_start=next((e[\"\
    steady_ns\"] for e in reversed(events)\n        if e[\"event\"]==\"arm_requested\"\
    \ and revoke.get(\"session\")\n        and e.get(\"session\")==revoke[\"session\"\
    ] and e[\"steady_ns\"]<=coordinator_trigger),None)\n    lower=(fault_injected_steady_ns\
    \ if fault_injected_steady_ns is not None else\n           session_start if session_start\
    \ is not None else trigger)\n    zero=next((r for r in trace if r[\"stop_applied_steady_ns\"\
    ]>=lower and\n               r[\"applied_vx\"]==r[\"applied_wz\"]==0),None)\n\
    \    origin=\"coordinator\"\n    if fault_injected_steady_ns is not None or session_start\
    \ is not None:\n        if fault_injected_steady_ns is not None and coordinator_trigger<fault_injected_steady_ns:\n\
    \            return {\"passed\":False,\"reason\":\"revoked_before_injection\"\
    }\n        if not zero: return {\"passed\":False,\"reason\":\"missing_post_injection_zero\"\
    \n                            if fault_injected_steady_ns is not None else \"\
    missing_session_zero\"}\n        native_trigger=zero.get(\"stop_applied_trigger_ns\"\
    ,0)\n        if not lower<=native_trigger<=zero[\"stop_applied_steady_ns\"]:\n\
    \            return {\"passed\":False,\"reason\":\"native_stop_not_bound_to_injection\"\
    \n                    if fault_injected_steady_ns is not None else \"native_stop_not_bound_to_session\"\
    }\n        # The native lease can expire first (it has its own clock uncertainty\n\
    \        # allowance). Bind that event to the same active session, never count\n\
    \        # a pre-existing or different session's zero as a successful stop.\n\
    \        before_native=[r for r in trace if r.get(\"steady_ns\",0)<=native_trigger]\n\
    \        preceding=before_native[-1] if before_native else {}\n        if (not\
    \ revoke.get(\"session\") or preceding.get(\"session\")!=revoke[\"session\"]\n\
    \                or not preceding.get(\"armed\")\n                or not 0<=native_trigger-preceding.get(\"\
    steady_ns\",0)<=50_000_000):\n            return {\"passed\":False,\"reason\"\
    :\"native_stop_session_unproven\"}\n        if native_trigger<coordinator_trigger:\n\
    \            trigger=native_trigger; origin=\"native_watchdog\"\n        if any(r[\"\
    applied_vx\"] or r[\"applied_wz\"] or r.get(\"armed\") or r.get(\"pending\")\n\
    \               for r in trace if r.get(\"steady_ns\",0)>=zero[\"stop_applied_steady_ns\"\
    ]):\n            return {\"passed\":False,\"reason\":\"motion_or_authority_after_native_zero\"\
    }\n    points={r[\"physical\"][\"sequence\"]:r[\"physical\"] for r in trace if\
    \ r.get(\"physical\") and r[\"physical\"][\"velocity_valid\"]}\n    ordered=[points[k]\
    \ for k in sorted(points)]\n    before=[p for p in ordered if p[\"steady_ns\"\
    ]<=trigger]\n    after=[p for p in ordered if p[\"steady_ns\"]>trigger]\n    if\
    \ not zero or not before or not after: return {\"passed\":False,\"reason\":\"\
    missing_stop_samples\"}\n    start=before[-1]; trajectory=[start]+after\n    quiet_since=None;\
    \ stopped=None; distance=0.; coverage=True\n    for a,b in zip(trajectory,trajectory[1:]):\n\
    \        distance+=math.hypot(b[\"x\"]-a[\"x\"],b[\"y\"]-a[\"y\"])\n        if\
    \ not 0<b[\"steady_ns\"]-a[\"steady_ns\"]<=50_000_000: coverage=False\n      \
    \  if b[\"speed\"]<.005 and b[\"angular_speed\"]<.02:\n            if quiet_since\
    \ is None: quiet_since=b[\"steady_ns\"]\n            if b[\"steady_ns\"]-quiet_since>=250_000_000:\n\
    \                stopped=b; break\n        else: quiet_since=None\n    latency=(zero[\"\
    stop_applied_steady_ns\"]-trigger)/1e6\n    gap=(trigger-start[\"steady_ns\"])/1e6\n\
    \    bounded=all(-.1<=r[\"applied_vx\"]<=.15 and abs(r[\"applied_wz\"])<=.5 for\
    \ r in trace)\n    return {\"passed\":bool(stopped and coverage and bounded and\
    \ 0<=latency<=100 and gap<=50),\"reason\":revoke[\"reason\"],\n            \"\
    measurement_origin\":origin,\"first_trigger_to_applied_zero_ms\":latency,\n  \
    \          \"revoke_to_applied_zero_ms\":(zero[\"stop_applied_steady_ns\"]-coordinator_trigger)/1e6,\n\
    \            \"pretrigger_sample_gap_ms\":gap,\n            \"first_trigger_to_confirmed_stationary_ms\"\
    :(stopped[\"steady_ns\"]-trigger)/1e6 if stopped else None,\n            \"revoke_to_confirmed_stationary_ms\"\
    :(stopped[\"steady_ns\"]-coordinator_trigger)/1e6 if stopped else None,\n    \
    \        \"sampled_distance_to_confirmed_stationary_m\":distance,\n          \
    \  \"maximum_applied_forward_mps\":max(r[\"applied_vx\"] for r in trace),\n  \
    \          \"displacement_m\":math.hypot(ordered[-1][\"x\"]-ordered[0][\"x\"],ordered[-1][\"\
    y\"]-ordered[0][\"y\"]),\n            \"scope\":\"normal completion/revocation\
    \ only; not a fault-matrix qualification\"}\n"
  capture_joiner.py: "\"\"\"Bounded join for independently delivered native/ROS captures.\n\
    \nWaiting for a clock bracket or raw command never changes its original capture\n\
    deadline. It grants NO actuator or publisher authority; runtime callers must\n\
    validate provenance before enqueueing and pass resolved rows to the guard.\n\"\
    \"\"\nfrom safety_core import MS\n\n\nclass CaptureJoiner:\n    def __init__(self,\
    \ ledger, wall_bound, *, capacity=256, wait_ns=20*MS):\n        if type(capacity)\
    \ is not int or capacity<1 or not 0<wait_ns<=20*MS:\n            raise ValueError(\"\
    bounded join required\")\n        self.ledger,self.wall_bound=ledger,wall_bound\n\
    \        self.session=ledger.session\n        self.capacity,self.wait_ns=capacity,wait_ns\n\
    \        self.pending=[]\n\n    def receive(self,row,now):\n        row.update(admitted=False,bound=None)\n\
    \        if len(self.pending)>=self.capacity:\n            old,_=self.pending.pop(0);\
    \ old[\"join_reason\"]=\"capacity_exceeded\"\n        self.pending.append((row,now.steady))\n\
    \n    def drain(self,now):\n        admitted=[]\n        if self.ledger.session!=self.session:\n\
    \            for row,_ in self.pending: row[\"join_reason\"]=\"session_changed\"\
    \n            self.pending.clear()\n            return admitted\n        remaining=[]\n\
    \        # Raw commands first, by capture, regardless of inter-topic delivery.\n\
    \        work=sorted(self.pending,key=lambda pair:(pair[0][\"kind\"]!=\"raw\"\
    ,pair[0][\"stamp\"]))\n        for row,arrival in work:\n            age=now.steady-arrival\n\
    \            if not 0<=age<=self.wait_ns:\n                row[\"join_reason\"\
    ]=\"join_wait_expired\"\n                continue\n            stamp,kind=row[\"\
    stamp\"],row[\"kind\"]\n            bound=self.wall_bound(stamp,now.wall)\n  \
    \          if bound is None or stamp>now.ros:\n                remaining.append((row,arrival));\
    \ continue\n            row[\"bound\"]=bound\n            if kind==\"raw\":\n\
    \                accepted=self.ledger.record(self.session,stamp,bound,row[\"velocity\"\
    ],now)\n            elif kind==\"checked\":\n                if stamp not in self.ledger.entries:\n\
    \                    remaining.append((row,arrival)); continue\n             \
    \   accepted=self.ledger.resolve(self.session,stamp,row[\"velocity\"],now) is\
    \ not None\n            else:\n                row[\"join_reason\"]=\"audit_only\"\
    ; continue\n            row.update(admitted=accepted,processed_wall=now.wall,\n\
    \                       join_reason=\"capture_bound\" if accepted else \"source_rejected_or_expired\"\
    )\n            if accepted: admitted.append(row)\n        self.pending=remaining\n\
    \        return admitted\n"
  command_audit.py: "\"\"\"Offline provenance checks for the isolated, DISARMED hotel\
    \ observation test.\n\nNot a runtime admission policy: continuous endpoint/owned-action\
    \ validation is\nstill required before any command may obtain actuator authority.\n\
    \"\"\"\nfrom collections import Counter\n\nEXPECTED = {\"cmd_vel_nav\":{\"controller_server\"\
    :1,\"behavior_server\":4},\n            \"cmd_vel_smoothed\":{\"velocity_smoother\"\
    :1},\n            \"phase5/collision_checked\":{\"collision_monitor\":1}}\nTOPICS\
    \ = {\"raw\":\"cmd_vel_nav\", \"smoothed\":\"cmd_vel_smoothed\", \"checked\":\"\
    phase5/collision_checked\"}\n\n\ndef validate_graph(graph):\n    if set(graph)!=set(EXPECTED):\n\
    \        raise ValueError(\"unexpected command topics\")\n    identities=set()\n\
    \    for topic,counts in EXPECTED.items():\n        rows=graph[topic]\n      \
    \  if Counter(r[\"node\"] for r in rows)!=counts:\n            raise ValueError(\"\
    unexpected publisher multiplicity\")\n        for row in rows:\n            gid=tuple(row[\"\
    gid\"])\n            if (row[\"namespace\"]!=\"/robot_1\" or row[\"type\"]!=\"\
    geometry_msgs/msg/TwistStamped\"\n                    or len(gid)!=16 or not all(type(v)\
    \ is int and 0<=v<=255 for v in gid)\n                    or not any(gid) or gid\
    \ in identities):\n                raise ValueError(\"invalid or reused publisher\
    \ identity\")\n            identities.add(gid)\n\n\ndef validate_publisher_binding(graph,rows):\n\
    \    validate_graph(graph)\n    if not rows:\n        raise ValueError(\"missing\
    \ command evidence\")\n    for row in rows:\n        topic=TOPICS.get(row[\"kind\"\
    ])\n        if topic is None or row[\"publisher_gid\"] not in [r[\"gid\"] for\
    \ r in graph[topic]]:\n            raise ValueError(\"unbound command publisher\"\
    )\n\n\ndef validate_observations(graph,rows):\n    validate_publisher_binding(graph,rows)\n\
    \    for row in rows:\n        if row[\"frame\"]!=\"base_footprint\" or row[\"\
    unused_axes\"]!=[0,0,0]:\n            raise ValueError(\"unsupported command frame\
    \ or axes\")\n        if row[\"bound\"] is not None:\n            if row[\"source_timestamp\"\
    ]<=0 or row[\"bound\"]>row[\"source_timestamp\"]:\n                raise ValueError(\"\
    capture bound later than DDS publication\")\n"
  command_ledger.py: "\"\"\"Bind checked/smoothed commands to original source capture\
    \ deadlines.\n\nThe ROS adapter must supply a validated source wall capture (NOT\
    \ receipt time).\nFor simulator stamps that requires a qualified simulation-to-wall\
    \ mapping; this\nmodule deliberately does not invent one. No publishers or actuator\
    \ authority.\n\"\"\"\nfrom dataclasses import dataclass\nfrom safety_core import\
    \ COMMAND_NS, UNCERTAINTY_NS, integer, velocity_ok\n\n\n@dataclass(frozen=True)\n\
    class SourceCommand:\n    session: str\n    ros_stamp: int\n    wall_stamp: int\n\
    \    deadline: int\n    velocity: tuple\n\n\nclass CommandLedger:\n    def __init__(self):\n\
    \        self.session = None\n        self.barrier = 0\n        self.entries =\
    \ {}\n        self.last_stamp = -1\n\n    def reset(self, session, barrier_ros):\n\
    \        self.session, self.barrier = session, barrier_ros\n        self.entries.clear()\n\
    \        self.last_stamp = barrier_ros\n\n    def record(self, session, ros_stamp,\
    \ wall_stamp, velocity, now):\n        if (not session or session != self.session\
    \ or not integer(ros_stamp)\n                or not integer(wall_stamp) or not\
    \ velocity_ok(velocity)\n                or ros_stamp <= self.last_stamp\n   \
    \             or not 0 <= now.ros-ros_stamp < COMMAND_NS-UNCERTAINTY_NS\n    \
    \            or not -UNCERTAINTY_NS <= now.wall-wall_stamp < COMMAND_NS-UNCERTAINTY_NS):\n\
    \            return False\n        self.last_stamp = ros_stamp\n        remaining\
    \ = COMMAND_NS-max(0, now.wall-wall_stamp+UNCERTAINTY_NS)\n        self.entries[ros_stamp]\
    \ = SourceCommand(session, ros_stamp, wall_stamp,\n                          \
    \                     now.steady+remaining, tuple(velocity))\n        self.entries\
    \ = dict(list(self.entries.items())[-32:])\n        return True\n\n    def resolve(self,\
    \ session, ros_stamp, velocity, now):\n        source = self.entries.get(ros_stamp)\n\
    \        if (not source or session != self.session or source.session != session\n\
    \                or not velocity_ok(velocity) or now.steady >= source.deadline\n\
    \                or now.wall-source.wall_stamp+UNCERTAINTY_NS >= COMMAND_NS\n\
    \                or now.wall < source.wall_stamp-UNCERTAINTY_NS\n            \
    \    or not 0 <= now.ros-source.ros_stamp < COMMAND_NS-UNCERTAINTY_NS):\n    \
    \        return None\n        # Repeated smoothing outputs may change velocity\
    \ but cannot extend the\n        # original source deadline or manufacture a new\
    \ source timestamp.\n        return source\n\n"
  console_evidence.py: "\"\"\"Fail-closed evidence contract for the private console-only\
    \ Gazebo candidate.\"\"\"\nimport hashlib\nfrom pathlib import Path\nimport xml.etree.ElementTree\
    \ as ET\n\nEXECUTABLE=Path(\"/opt/semantic-safety/bin/phase5_console_server\"\
    )\n\n\ndef lifecycle_complete(log_text):\n    markers=(\"stop_begin\",\"stop_end\"\
    ,\"stop_worker_joined\",\"destructor_begin\",\"destructor_end\")\n    positions={name:log_text.find(\"\
    phase5 lifecycle: \"+name) for name in markers}\n    returned=log_text.find(\"\
    phase5 lifecycle: run_returned result=0\")\n    ordered=list(positions.values())\n\
    \    return {\"passed\":all(p>=0 for p in ordered) and ordered==sorted(ordered)\n\
    \            and 0<=returned<positions[\"stop_worker_joined\"],\n            \"\
    marker_positions\":positions,\"run_returned_position\":returned}\n\n\ndef validate_world(text):\n\
    \    root=ET.fromstring(text)\n    if root.tag!=\"sdf\" or len(root.findall(\"\
    world\"))!=1:\n        raise ValueError(\"console fixture requires exactly one\
    \ SDF world\")\n    for plugin in root.iter(\"plugin\"):\n        name=plugin.get(\"\
    name\",\"\").lower()\n        filename=plugin.get(\"filename\",\"\").lower()\n\
    \        if \"logrecord\" in name or \"logplayback\" in name or \"log-system\"\
    \ in filename:\n            raise ValueError(\"world recording/playback plugin\
    \ forbidden in console-only fixture\")\n\n\ndef recording_absent(output, maps=\"\
    \"):\n    files=sorted(str(p.relative_to(output)) for p in output.rglob(\"*\"\
    ) if \".tlog\" in p.name)\n    libraries=sorted({line.split()[-1] for line in\
    \ maps.splitlines()\n                      if \"log-system\" in line.lower()})\n\
    \    return {\"passed\":not files and not libraries,\"recording_files\":files,\n\
    \            \"recording_libraries\":libraries}\n\n\ndef identity(pid, expected_sources,\
    \ *, proc=Path(\"/proc\"), executable=EXECUTABLE,\n             source=Path(\"\
    /opt/semantic-safety/console-launcher\")):\n    actual=(proc/str(pid)/\"exe\"\
    ).resolve(strict=True)\n    maps=(proc/str(pid)/\"maps\").read_text()\n    installed={name:hashlib.sha256((source/name).read_bytes()).hexdigest()\
    \ for name in expected_sources}\n    return {\"passed\":bool(expected_sources)\
    \ and actual==executable.resolve(strict=True) and installed==expected_sources,\n\
    \            \"executable\":str(actual),\"sha256\":hashlib.sha256(actual.read_bytes()).hexdigest(),\n\
    \            \"source_hashes\":installed,\"maps\":maps}\n"
  console_server_smoke.py: "\"\"\"Exercise the actual pinned launcher before the moving\
    \ trial can start.\"\"\"\nimport json\nimport os\nimport signal\nimport subprocess\n\
    import time\nfrom console_evidence import EXECUTABLE, recording_absent, lifecycle_complete\n\
    from process_shutdown import gazebo_stop\n\n\ndef verify(output):\n    output.mkdir(exist_ok=False)\n\
    \    world=output/\"empty.world\"\n    world.write_text('<sdf version=\"1.9\"\
