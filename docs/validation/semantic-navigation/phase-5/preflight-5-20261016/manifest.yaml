  task_session.py: "\"\"\"Owned-action lifecycle only; NOT evidence of global task\
    \ idleness or robot safety.\n\nThe integrating coordinator must qualify sensors,\
    \ stationary/neutral state,\nall other action servers, and the actuator handshake\
    \ before admitting a goal.\nThis component never arms a SafetyGate or grants an\
    \ actuator lease by itself.\n\"\"\"\nimport uuid\n\n\nclass TaskSession:\n   \
    \ def __init__(self):\n        self.token = None\n        self.state = \"idle\"\
    \n        self.reason = \"startup\"\n        self.revoked = True\n        self.cancel_ack\
    \ = None\n        self.deadline = None\n        self.timeout = None\n        self.terminal_status\
    \ = None\n        self.outcome = None\n\n    def begin(self, now):\n        if\
    \ self.state != \"idle\":\n            raise RuntimeError(\"previous goal is unresolved\"\
    )\n        self.token = str(uuid.uuid4())\n        self.state, self.reason = \"\
    requesting\", \"goal_request\"\n        self.revoked, self.cancel_ack = False,\
    \ None\n        self.timeout = self.terminal_status = None\n        self.outcome\
    \ = None\n        self.deadline = now + 5.0\n        return self.token\n\n   \
    \ def revoke(self, reason, now):\n        if self.state == \"idle\":\n       \
    \     return False\n        first = not self.revoked\n        if first:\n    \
    \        self.reason, self.deadline = reason, now + 2.0\n        self.revoked,\
    \ self.state = True, \"stopping\"\n        return first\n\n    def accepted(self,\
    \ token, accepted, now):\n        if token != self.token or self.state == \"idle\"\
    :\n            return \"ignore\"\n        self.tick(now)  # a late response cannot\
    \ hide a missed deadline\n        if not accepted:\n            if not self.revoked:\n\
    \                self.reason = \"goal_rejected\"\n            self.revoked, self.state,\
    \ self.deadline = True, \"idle\", None\n            self.outcome = \"rejected\"\
    \n            return \"rejected\"\n        if self.revoked:\n            return\
    \ \"cancel\"\n        self.state, self.reason, self.deadline = \"running\", \"\
    goal_active\", None\n        return \"run\"\n\n    def acknowledge_cancel(self,\
    \ token, accepted):\n        if token == self.token and self.state == \"stopping\"\
    :\n            self.cancel_ack = bool(accepted)\n            # An accepted cancellation\
    \ is NOT a terminal action result.\n\n    def finish(self, token, status, now):\n\
