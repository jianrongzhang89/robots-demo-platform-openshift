  verify_nav_task_client.py: "\"\"\"Real ROS action protocol, controlled fake navigation\
    \ backend; NO motion.\"\"\"\nimport json\nimport os\nimport time\nimport uuid\n\
    \nimport rclpy\nfrom nav2_msgs.action import NavigateToPose\nfrom rclpy.action\
    \ import ActionServer, CancelResponse, GoalResponse\nfrom rclpy.executors import\
    \ SingleThreadedExecutor\nfrom rclpy.node import Node\nfrom rclpy.task import\
    \ Future\n\nfrom nav_task_client import NavTaskClient\n\n\nclass Backend(Node):\n\
    \    def __init__(self):\n        super().__init__(\"phase5_fake_navigation_backend\"\
    )\n        self.reject_goal = self.reject_cancel = False\n        self.goals,\
    \ self.results = {}, {}\n        self.server = ActionServer(self, NavigateToPose,\
    \ \"/phase5_fixture/navigate_to_pose\",\n            execute_callback=self.execute,\
    \ goal_callback=self.goal,\n            handle_accepted_callback=self.accepted,\
    \ cancel_callback=self.cancel)\n\n    def goal(self, request):\n        return\
    \ GoalResponse.REJECT if self.reject_goal else GoalResponse.ACCEPT\n\n    def\
    \ accepted(self, handle):\n        token = str(uuid.UUID(bytes=bytes(handle.goal_id.uuid)))\n\
    \        self.goals[token], self.results[token] = handle, Future()\n        handle.execute()\n\
    \n    async def execute(self, handle):\n        token = str(uuid.UUID(bytes=bytes(handle.goal_id.uuid)))\n\
    \        return await self.results[token]\n\n    def cancel(self, handle):\n \
    \       return CancelResponse.REJECT if self.reject_cancel else CancelResponse.ACCEPT\n\
    \n    def finish(self, token, status):\n        handle = self.goals[token]\n \
    \       {4: handle.succeed, 5: handle.canceled, 6: handle.abort}[status]()\n \
    \       self.results[token].set_result(NavigateToPose.Result())\n\n\ndef main():\n\
    \    if os.getenv(\"ROS_DOMAIN_ID\") != \"85\" or \"phase5\" not in os.getenv(\"\
    CYCLONEDDS_URI\", \"\"):\n        raise RuntimeError(\"isolated fixture only\"\
    )\n    rclpy.init()\n    revoked, checks = [], []\n    backend = Backend()\n \
    \   client = NavTaskClient(\"/phase5_fixture/navigate_to_pose\", lambda token,\
    \ reason: revoked.append((token,reason)))\n    executor = SingleThreadedExecutor();\
    \ executor.add_node(backend); executor.add_node(client)\n\n    def until(predicate,\
    \ timeout=5):\n        end = time.monotonic()+timeout\n        while time.monotonic()<end:\n\
    \            executor.spin_once(timeout_sec=.01)\n            if predicate():\
    \ return\n        raise AssertionError(\"action fixture timed out: \"+str(vars(client.session)))\n\
    \n    def goal():\n        result = NavigateToPose.Goal()\n        result.pose.header.frame_id\
    \ = \"map\"\n        result.pose.pose.orientation.w = 1.\n        return result\n\
    \n    def start():\n        token = client.start(goal())\n        until(lambda:\
    \ client.session.state == \"running\")\n        assert client.session.may_command(token)\n\
    \        return token\n\n    def blocked():\n        try: client.start(goal())\n\
    \        except RuntimeError: return\n        raise AssertionError(\"unresolved\
    \ goal admitted a successor\")\n\n    try:\n        until(client.client.server_is_ready)\n\
    \        token = start(); client.stop(\"camera_stale\")\n        assert not client.session.may_command(token)\
    \ and revoked[-1] == (token,\"camera_stale\")\n        until(lambda: client.session.cancel_ack\
    \ is True)\n        blocked()\n        until(lambda: client.session.timeout is\
    \ not None, 4)\n        blocked(); assert client.session.state == \"stopping\"\
    \n        backend.finish(token,5); until(lambda: client.session.state == \"idle\"\
    )\n        checks.append({\"case\": \"revoke_before_cancel_ack_and_wait_for_terminal\"\
    , \"passed\": True})\n\n        token = client.start(goal()); client.stop(\"cancel_before_accept\"\
    )\n        until(lambda: client.session.cancel_ack is True)\n        assert not\
    \ client.session.may_command(token)\n        backend.finish(token,5); until(lambda:\
    \ client.session.state == \"idle\")\n        checks.append({\"case\": \"late_acceptance_canceled_without_permission\"\
    , \"passed\": True})\n\n        token = start(); backend.finish(token,4); until(lambda:\
    \ client.session.state == \"idle\")\n        assert not client.session.may_command(token)\
    \ and revoked[-1] == (token,\"goal_succeeded\")\n        checks.append({\"case\"\
    : \"success_revokes_and_requires_new_request\", \"passed\": True})\n\n       \
    \ backend.reject_cancel = True\n        token = start(); client.stop(\"tf_stale\"\
    ); until(lambda: client.session.cancel_ack is False)\n        blocked(); assert\
    \ not client.session.may_command(token)\n        backend.finish(token,6); until(lambda:\
    \ client.session.state == \"idle\")\n        backend.reject_cancel = False\n \
    \       checks.append({\"case\": \"rejected_cancel_stays_inhibited_until_terminal\"\
    , \"passed\": True})\n\n        backend.reject_cancel = True\n        token =\
    \ start(); client.stop(\"backend_timeout\"); until(lambda: client.session.cancel_ack\
    \ is False)\n        backend.finish(token,4); until(lambda: client.session.state\
    \ == \"idle\")\n        assert client.session.reason == \"backend_timeout\" and\
    \ client.session.outcome == \"stopped\"\n        assert not client.session.may_command(token)\n\
    \        backend.reject_cancel = False\n        checks.append({\"case\": \"late_backend_success_not_reported_as_task_success\"\
    , \"passed\": True})\n\n        backend.reject_goal = True\n        token = client.start(goal());\
    \ until(lambda: client.session.state == \"idle\")\n        assert not client.session.may_command(token)\
    \ and client.session.reason == \"goal_rejected\"\n        checks.append({\"case\"\
    : \"backend_rejection_never_allows_command\", \"passed\": True})\n\n        graph\
    \ = dict(client.get_topic_names_and_types())\n        assert not any(\"cmd_vel\"\
    \ in name or \"/drive/\" in name or \"lease\" in name for name in graph)\n   \
    \     checks.append({\"case\": \"no_actuator_or_command_topics\", \"passed\":\
    \ True})\n        print(json.dumps({\"event\": \"phase5_owned_action_fixture\"\
    , \"passed\": True,\n                          \"checks\": checks, \"events\"\
    : client.events, \"topics\": graph}), flush=True)\n    finally:\n        executor.shutdown();\
    \ backend.server.destroy(); client.client.destroy()\n        backend.destroy_node();\
    \ client.destroy_node(); rclpy.shutdown()\n\n\nif __name__ == \"__main__\":\n\
    \    main()\n"
