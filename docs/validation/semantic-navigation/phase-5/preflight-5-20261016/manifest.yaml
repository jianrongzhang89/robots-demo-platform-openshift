---
apiVersion: v1
kind: Pod
metadata:
  name: semantic-phase5-preflight
  namespace: semantic-navigation
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 300
  automountServiceAccountToken: false
  containers:
  - name: preflight
    image: image-registry.openshift-image-registry.svc:5000/semantic-navigation/semantic-costmap@sha256:447c6ee36d2eff0707a69133881c4131e0033dab5c38099750844173d416c92f
    command:
    - /bin/bash
    - -ec
    args:
    - source /opt/ros/jazzy/setup.bash; cd /phase5; python3 -m unittest discover -s
      /phase5 -p 'test_*.py' -v; python3 /phase5/audit_geometry.py; dpkg-query -W
      ros-jazzy-nav2-collision-monitor ros-jazzy-nav2-controller ros-jazzy-nav2-velocity-smoother;
      python3 /phase5/verify_nav_task_client.py; python3 /phase5/verify_collision_monitor.py
    env:
    - name: ROS_DOMAIN_ID
      value: '85'
    - name: RMW_IMPLEMENTATION
      value: rmw_cyclonedds_cpp
    - name: CYCLONEDDS_URI
      value: file:///phase5/cyclonedds-phase5.xml
    - name: ROS_LOG_DIR
      value: /tmp/phase5-ros-logs
    - name: PYTHONDONTWRITEBYTECODE
      value: '1'
    volumeMounts:
    - name: source
      mountPath: /phase5
      readOnly: true
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: '1'
        memory: 1Gi
    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      seccompProfile:
        type: RuntimeDefault
  volumes:
  - name: source
    configMap:
      name: semantic-phase5-preflight
