    \ and never publishes velocity commands.\n    node = Node()\n    kinds = {kind.DESCRIPTOR.full_name:\
    \ kind for kind in (StringMsg, WorldControl)}\n    while True:\n        command\
    \ = connection.recv()\n        if command is None:\n            return\n     \
    \   service, kind, wire, timeout = command\n        message = kinds[kind]()\n\
    \        message.ParseFromString(wire)\n        ok, response = node.request(service,\
    \ message, type(message), Boolean, timeout)\n        connection.send((ok, response.SerializeToString()))\n\
    \n\nclass ServiceClient:\n    def __init__(self):\n        context = multiprocessing.get_context(\"\
    spawn\")\n        self.connection, child = context.Pipe()\n        self.process\
    \ = context.Process(target=service_worker, args=(child,))\n        self.process.start()\n\
    \        child.close()\n\n    def request(self, service, message, request_type,\
    \ response_type, timeout):\n        self.connection.send((service, request_type.DESCRIPTOR.full_name,\n\
    \                              message.SerializeToString(), timeout))\n      \
    \  if not self.connection.poll(timeout/1000+3):\n            raise RuntimeError(\"\
    service worker timed out\")\n        ok, wire = self.connection.recv()\n     \
    \   response = response_type()\n        response.ParseFromString(wire)\n     \
    \   return ok, response\n\n    def close(self):\n        if self.process.is_alive():\n\
