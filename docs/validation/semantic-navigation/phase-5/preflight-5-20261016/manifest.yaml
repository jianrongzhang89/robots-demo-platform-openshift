  test_safety_core.py: "import dataclasses\nimport unittest\n\nfrom safety_core import\
    \ (COMMAND_NS, LEASE_NS, MS, TICK_NS, ZERO, Command,\n                       \
    \  Evidence, FinalReceiver, Now, SafetyGate)\n\n\ndef instant(ms=0, *, ros_ms=None,\
    \ wall_ms=None):\n    return Now(10_000 * MS + round(ms * MS),\n             \
