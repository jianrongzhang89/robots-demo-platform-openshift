    \ json\nimport math\nimport multiprocessing\nimport os\nfrom pathlib import Path\n\
    import signal\nimport subprocess\nimport sys\nimport threading\nimport time\n\
    import uuid\n\nfrom gz.transport13 import Node\nfrom gz.msgs10.stringmsg_pb2 import\
    \ StringMsg\nfrom gz.msgs10.boolean_pb2 import Boolean\nfrom gz.msgs10.world_control_pb2\
    \ import WorldControl\nfrom gz.msgs10.twist_pb2 import Twist\nfrom prepare_assets\
    \ import write_assets\n\n\ndef service_worker(connection):\n    # The installed\
    \ Python binding holds the GIL during blocking RequestRaw.\n    # Do not share\
    \ that process with Python subscription callbacks: they can\n    # otherwise stall\
