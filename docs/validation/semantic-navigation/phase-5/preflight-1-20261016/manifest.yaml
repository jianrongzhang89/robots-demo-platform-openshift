      /phase5 -p 'test_*.py' -v; python3 /phase5/audit_geometry.py; dpkg-query -W
      ros-jazzy-nav2-collision-monitor ros-jazzy-nav2-controller; python3 /phase5/verify_collision_monitor.py
    env:
    - name: ROS_DOMAIN_ID
      value: '85'
    - name: RMW_IMPLEMENTATION
      value: rmw_cyclonedds_cpp
    - name: CYCLONEDDS_URI
      value: file:///phase5/cyclonedds-phase5.xml
    - name: ROS_LOG_DIR
      value: /tmp/phase5-ros-logs
    - name: PYTHONDONTWRITEBYTECODE
      value: '1'
    volumeMounts:
    - name: source
      mountPath: /phase5
      readOnly: true
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: '1'
        memory: 1Gi
    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      seccompProfile:
        type: RuntimeDefault
  volumes:
  - name: source
    configMap:
      name: semantic-phase5-preflight
