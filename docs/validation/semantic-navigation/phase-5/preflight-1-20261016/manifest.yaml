    \ with self.assertRaises(ValueError):\n            gate.observe(\"semantic\",\
    \ Evidence(\"e\", 1, 0, 0), instant(1))\n\n    def test_packet_cannot_extend_command_authority(self):\n\
    \        gate, session = armed()\n        command(gate, session, 1)\n        packet\
    \ = gate.packet(instant(90))\n        self.assertEqual(packet.expires_wall, instant(99).wall)\n\
    \n\nclass ReceiverTests(unittest.TestCase):\n    def setup_motion(self):\n   \
    \     gate, session = armed()\n        receiver = FinalReceiver()\n        self.assertTrue(receiver.arm(session,\
    \ instant(), stationary=True))\n        command(gate, session, 1)\n        packet\
    \ = gate.packet(instant(1))\n        self.assertTrue(receiver.receive(packet,\
    \ instant(2)))\n        return gate, session, receiver, packet\n\n    def test_startup_packet_does_not_arm(self):\n\
    \        gate, session = armed()\n        command(gate, session, 1)\n        receiver\
    \ = FinalReceiver()\n        self.assertFalse(receiver.receive(gate.packet(instant(1)),\
    \ instant(1)))\n        self.assertEqual(receiver.tick(instant(2)), ZERO)\n\n\
    \    def test_lost_supervisor_or_transport_expires_locally(self):\n        _,\
