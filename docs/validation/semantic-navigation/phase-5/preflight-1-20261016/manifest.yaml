  audit_geometry.py: "#!/usr/bin/env python3\n\"\"\"Audit collision XY bounds in the\
    \ installed hotel SDF, without modifying it.\"\"\"\nimport hashlib\nimport json\n\
    import math\nfrom pathlib import Path\nimport xml.etree.ElementTree as ET\n\n\n\
    def rotation(roll, pitch, yaw):\n    cr, sr, cp, sp, cy, sy = math.cos(roll),\
    \ math.sin(roll), math.cos(pitch), math.sin(pitch), math.cos(yaw), math.sin(yaw)\n\
    \    return [[cy*cp, cy*sp*sr-sy*cr, cy*sp*cr+sy*sr],\n            [sy*cp, sy*sp*sr+cy*cr,\
    \ sy*sp*cr-cy*sr], [-sp, cp*sr, cp*cr]]\n\n\ndef pose(element):\n    p = element.find(\"\
    pose\")\n    if p is not None and p.get(\"relative_to\"):\n        raise ValueError(\"\
    explicit relative_to needs frame-graph resolution\")\n    values = [float(v) for\
    \ v in (p.text if p is not None else \"0 0 0 0 0 0\").split()]\n    return values[:3],\
    \ rotation(*values[3:])\n\n\ndef audit(world_path, urdf_path):\n    raw = Path(world_path).read_bytes()\n\
    \    model = ET.fromstring(raw).find(\".//model[@name='robot_1']\")\n    if model\
    \ is None:\n        raise ValueError(\"robot_1 missing\")\n    origin, basis =\
    \ pose(model.find(\"link[@name='base_footprint']\"))\n    if origin != [0, 0,\
    \ 0] or basis != rotation(0, 0, 0):\n        raise ValueError(\"audit requires\
    \ base_footprint coincident with model frame\")\n    boxes = []\n    for link\
    \ in model.findall(\"link\"):\n        if not link.findall(\"collision\"):\n \
    \           continue\n        translation, orient = pose(link)\n        for collision\
    \ in link.findall(\"collision\"):\n            offset, rot = pose(collision)\n\
    \            center = [translation[i] + sum(orient[i][j]*offset[j] for j in range(3))\
    \ for i in range(3)]\n            combined = [[sum(orient[i][k]*rot[k][j] for\
    \ k in range(3)) for j in range(3)] for i in range(3)]\n            geometry =\
    \ collision.find(\"geometry\")\n            if geometry.find(\"box\") is not None:\n\
    \                half = [float(v)/2 for v in geometry.findtext(\"box/size\").split()]\n\
    \                extent = [sum(abs(combined[i][j])*half[j] for j in range(3))\
    \ for i in range(3)]\n            elif geometry.find(\"cylinder\") is not None:\n\
    \                radius, half_length = float(geometry.findtext(\"cylinder/radius\"\
    )), float(geometry.findtext(\"cylinder/length\"))/2\n                extent =\
    \ [radius*math.sqrt(max(0, 1-combined[i][2]**2)) + half_length*abs(combined[i][2])\
    \ for i in range(3)]\n            else:\n                raise ValueError(\"unsupported\
    \ collision geometry; manual review required\")\n            boxes.append({\"\
    link\": link.get(\"name\"), \"collision\": collision.get(\"name\"),\n        \
    \                  \"min\": [center[i]-extent[i] for i in range(3)],\n       \
    \                   \"max\": [center[i]+extent[i] for i in range(3)]})\n    bounds\
    \ = {\"min\": [min(b[\"min\"][i] for b in boxes) for i in range(3)],\n       \
    \       \"max\": [max(b[\"max\"][i] for b in boxes) for i in range(3)]}\n    corner_radius\
    \ = max(math.hypot(x, y) for x in (bounds[\"min\"][0], bounds[\"max\"][0])\n \
    \                       for y in (bounds[\"min\"][1], bounds[\"max\"][1]))\n \
    \   urdf_raw = Path(urdf_path).read_bytes()\n    urdf = ET.fromstring(urdf_raw)\n\
    \    base_joint = next(j for j in urdf.findall(\"joint\") if j.find(\"child\"\
    ).get(\"link\") == \"base_link\")\n    return {\"world_sha256\": hashlib.sha256(raw).hexdigest(),\n\
    \            \"robot_sdf\": ET.tostring(model, encoding=\"unicode\"), \"collisions\"\
    : boxes,\n            \"xy_bounds\": {k: v[:2] for k, v in bounds.items()},\n\
    \            \"bounding_rectangle_radius_m\": corner_radius, \"canonical_radius_m\"\
    : 0.22,\n            \"canonical_radius_covers_rectangle\": 0.22 >= corner_radius,\n\
    \            \"urdf_sha256\": hashlib.sha256(urdf_raw).hexdigest(),\n        \
    \    \"urdf_base_joint_xyz\": base_joint.find(\"origin\").get(\"xyz\"),\n    \
    \        \"sdf_base_link_pose\": model.find(\"link[@name='base_link']\").findtext(\"\
    pose\", \"0 0 0 0 0 0\"),\n            \"diff_drive_plugin\": ET.tostring(next(p\
    \ for p in model.findall(\"plugin\") if \"DiffDrive\" in p.get(\"name\", \"\"\
    )), encoding=\"unicode\"),\n            \"qualification\": \"static SDF audit\
    \ only; moving TF and physical stop tests still required\"}\n\n\nif __name__ ==\
    \ \"__main__\":\n    print(json.dumps(audit(\"/opt/ros2-demo/hotel-assets/hotel.world\"\
    , \"/opt/ros2-demo/robot/turtlebot3_waffle.urdf\"), sort_keys=True))\n"
  safety_core.py: "\"\"\"Phase 5 candidate: ROS-independent, fail-latched command\
    \ admission.\n\nThis is not a safety-certified controller or an actuator watchdog.\
    \ Adapters must\nvalidate/bind payloads before submitting Evidence, cancel tasks\
    \ on a trip, and\nindependently establish stationary + idle before explicit rearm.\
    \ A final receiver\nmust run next to the actuator; its own death still requires\
    \ an actuator-side\nwatchdog. No functions in this module publish commands or\
    \ automatically rearm.\nAll times are integer nanoseconds; monotonic clocks never\
    \ cross machines.\n\"\"\"\nfrom dataclasses import dataclass\nimport math\nimport\
    \ uuid\n\nMS = 1_000_000\nSTALE_NS = 500 * MS\nCOMMAND_NS = 100 * MS\nLEASE_NS\
    \ = 80 * MS\nUNCERTAINTY_NS = 2 * MS\nTICK_NS = 20 * MS\nZERO = (0.0, 0.0, 0.0)\
    \  # x, y, yaw; diff-drive only\n\n\n@dataclass(frozen=True)\nclass Now:\n   \
    \ steady: int\n    wall: int\n    ros: int\n\n\n@dataclass(frozen=True)\nclass\
    \ Evidence:\n    epoch: str\n    sequence: int\n    wall: int\n    ros: int\n\n\
    \n@dataclass(frozen=True)\nclass Lease:\n    evidence: Evidence\n    deadline:\
    \ int\n\n\n@dataclass(frozen=True)\nclass Command:\n    session: str\n    sequence:\
    \ int\n    issued_wall: int\n    expires_wall: int\n    velocity: tuple[float,\
    \ float, float]\n\n\ndef integer(value):\n    return type(value) is int and value\
    \ >= 0\n\n\ndef velocity_ok(value):\n    return (isinstance(value, (tuple, list))\
    \ and len(value) == 3\n            and all(type(v) in (int, float) and math.isfinite(v)\
    \ for v in value)\n            and -0.10 <= value[0] <= 0.15 and value[1] == 0.0\n\
    \            and abs(value[2]) <= 0.5)\n\n\nclass SafetyGate:\n    \"\"\"Pure\
    \ state machine. Call tick on a wall/steady timer, never a ROS timer.\"\"\"\n\n\
    \    def __init__(self, *, require_semantics=True):\n        self.required = (\"\
    clock\", \"scan\", \"odom\", \"tf\") + (\n            (\"camera\", \"semantic\"\
    , \"inference_heartbeat\") if require_semantics else ())\n        self.leases\
    \ = {}\n        self.last_time = None\n        self.barrier_wall = -1\n      \
    \  self.armed = False\n        self.reason = \"startup_disarmed\"\n        self.trigger_steady\
    \ = None\n        self.session = None\n        self.sequence = -1\n        self.command_sequence\
    \ = -1\n        self.command_deadline = None\n        self.command_wall = -1\n\
    \        self.velocity = ZERO\n\n    def trip(self, reason, now):\n        # Retain\
    \ the first trigger/reason; subsequent late successes or faults\n        # must\
    \ not move its stopping-latency origin or silently clear it.\n        if self.armed\
    \ or self.trigger_steady is None:\n            self.reason = reason\n        \
    \    self.trigger_steady = now.steady\n            self.barrier_wall = now.wall\n\
    \            self.leases.clear()\n        self.armed = False\n        self.velocity\
    \ = ZERO\n        self.command_deadline = None\n        self.session = None\n\n\
    \    def _advance(self, now):\n        if not all(integer(v) for v in (now.steady,\
    \ now.wall, now.ros)):\n            raise ValueError(\"invalid local clock\")\n\
    \        previous, self.last_time = self.last_time, now\n        if previous is\
    \ not None:\n            if now.steady < previous.steady or now.ros < previous.ros:\n\
    \                self.trip(\"clock_rollback\", now)\n                self.leases.clear()\n\
    \                self.barrier_wall = now.wall\n                return False\n\
    \            if abs((now.wall - previous.wall) - (now.steady - previous.steady))\
    \ > 20 * MS:\n                self.trip(\"wall_clock_discontinuity\", now)\n \
    \               self.leases.clear()\n                self.barrier_wall = now.wall\n\
    \                return False\n        if self.armed:\n            # Check BEFORE\
    \ accepting callbacks; late refreshed inputs cannot\n            # conceal a missed\
    \ deadline if the event loop was delayed.\n            failures = []\n       \
    \     for key in self.required:\n                item = self.leases.get(key)\n\
    \                if item is None:\n                    failures.append((now.steady,\
    \ key + \"_missing\"))\n                elif self._expired(item, now):\n     \
    \               failures.append((min(now.steady, item.deadline), key + \"_stale\"\
    ))\n            if now.steady >= self.command_deadline:\n                failures.append((self.command_deadline,\
    \ \"command_expired\"))\n            if failures:\n                trigger, reason\
    \ = min(failures)\n                self.trip(reason, now)\n                self.trigger_steady\
    \ = trigger\n        return True\n\n    @staticmethod\n    def _expired(item,\
    \ now):\n        return (now.steady >= item.deadline\n                or now.wall\
    \ - item.evidence.wall + UNCERTAINTY_NS >= STALE_NS\n                or not 0\
    \ <= now.ros - item.evidence.ros < STALE_NS)\n\n    def observe(self, key, evidence,\
    \ now):\n        if key not in self.required:\n            raise ValueError(\"\
    unconfigured safety input\")\n        if not self._advance(now):\n           \
    \ return False\n        if (not isinstance(evidence.epoch, str) or not 1 <= len(evidence.epoch)\
    \ <= 128\n                or not all(integer(v) for v in (evidence.sequence, evidence.wall,\
    \ evidence.ros))):\n            self.trip(key + \"_invalid\", now)\n         \
    \   return False\n        age = now.wall - evidence.wall\n        if (evidence.wall\
    \ <= self.barrier_wall or age < -UNCERTAINTY_NS\n                or age + UNCERTAINTY_NS\
    \ >= STALE_NS\n                or not 0 <= now.ros - evidence.ros < STALE_NS):\n\
    \            self.trip(key + \"_invalid_age\", now)\n            return False\n\
    \        prior = self.leases.get(key)\n        if prior:\n            if evidence.epoch\
    \ != prior.evidence.epoch:\n                self.trip(key + \"_epoch_changed\"\
    , now)\n                return False\n            if (evidence.sequence <= prior.evidence.sequence\n\
    \                    or evidence.wall <= prior.evidence.wall\n               \
    \     or evidence.ros < prior.evidence.ros):\n                # Duplicate reception\
    \ cannot renew a capture lease.\n                return False\n        remaining\
    \ = STALE_NS - max(0, age + UNCERTAINTY_NS)\n        self.leases[key] = Lease(evidence,\
    \ now.steady + remaining)\n        return True\n\n    def arm(self, now, *, stationary,\
    \ tasks_idle, neutral_command):\n        \"\"\"Trusted coordinator must independently\
    \ verify all three conditions.\n\n        Disallow repeated arm while moving;\
    \ a fresh session is required for\n        every downstream command and independent\
    \ receiver rearm.\n        \"\"\"\n        if not self._advance(now) or self.armed:\n\
    \            return None\n        if not (stationary is True and tasks_idle is\
    \ True and neutral_command is True):\n            return None\n        if any(k\
    \ not in self.leases or self._expired(self.leases[k], now) for k in self.required):\n\
    \            return None\n        self.session = str(uuid.uuid4())\n        self.armed,\
    \ self.reason, self.trigger_steady = True, \"armed\", None\n        self.sequence\
    \ = self.command_sequence = -1\n        self.command_deadline = now.steady + COMMAND_NS\n\
    \        self.command_wall = now.wall\n        self.velocity = ZERO\n        return\
    \ self.session\n\n    def command(self, session, sequence, issued_wall, velocity,\
    \ now):\n        self._advance(now)\n        if not self.armed:\n            return\
    \ False\n        if (session != self.session or not integer(sequence) or sequence\
    \ <= self.command_sequence\n                or not integer(issued_wall) or issued_wall\
    \ < self.command_wall\n                or not -UNCERTAINTY_NS <= now.wall - issued_wall\
    \ < COMMAND_NS - UNCERTAINTY_NS\n                or not velocity_ok(velocity)):\n\
    \            self.trip(\"command_invalid\", now)\n            return False\n \
    \       self.command_sequence = sequence\n        self.command_wall = issued_wall\n\
    \        self.command_deadline = now.steady + COMMAND_NS - max(0, now.wall - issued_wall\
    \ + UNCERTAINTY_NS)\n        self.velocity = tuple(velocity)\n        return True\n\
    \n    def tick(self, now):\n        self._advance(now)\n        return self.velocity\
    \ if self.armed else ZERO\n\n    def packet(self, now):\n        \"\"\"None means\
    \ revoke/zero, never a live lease with an old session.\"\"\"\n        self.tick(now)\n\
    \        if not self.armed:\n            return None\n        self.sequence +=\
    \ 1\n        # Do not extend a command/input's authority by periodically republishing.\n\
    \        remaining = min(LEASE_NS, self.command_deadline - now.steady,\n     \
    \                   *(v.deadline - now.steady for v in self.leases.values()))\n\
    \        return Command(self.session, self.sequence, now.wall, now.wall + remaining,\
    \ self.velocity)\n\n\nclass FinalReceiver:\n    \"\"\"Receiver-side, independently\
    \ fail-latched short lease (no ROS/Gazebo I/O).\n\n    Must be rearmed explicitly\
    \ together with SafetyGate; never adopt a session\n    from a command packet.\
    \ Requires a local 20 ms steady timer and synchronized\n    wall clocks with <=2\
    \ ms allowance, same as the existing capture contract.\n    \"\"\"\n\n    def\
    \ __init__(self):\n        self.session = None\n        self.sequence = -1\n \
    \       self.deadline = None\n        self.expires_wall = None\n        self.reason\
    \ = \"startup_disarmed\"\n        self.velocity = ZERO\n        self.last_time\
    \ = None\n        self.used_sessions = set()\n\n    def stop(self, reason):\n\
    \        self.session = None\n        self.velocity = ZERO\n        self.reason\
    \ = reason\n        self.deadline = self.expires_wall = None\n\n    def arm(self,\
    \ session, now, *, stationary):\n        self.tick(now)\n        if (self.session\
    \ is not None or stationary is not True\n                or not isinstance(session,\
    \ str) or len(session) != 36\n                or session in self.used_sessions\
    \ or len(self.used_sessions) >= 1024):\n            return False\n        self.used_sessions.add(session)\n\
    \        self.session, self.sequence = session, -1\n        self.reason = \"armed_waiting_first_packet\"\
    \n        self.deadline = now.steady + LEASE_NS\n        self.expires_wall = now.wall\
    \ + LEASE_NS\n        return True\n\n    def tick(self, now):\n        if not\
    \ all(integer(v) for v in (now.steady, now.wall, now.ros)):\n            raise\
    \ ValueError(\"invalid local clock\")\n        prior, self.last_time = self.last_time,\
    \ now\n        if prior and (now.steady < prior.steady or now.ros < prior.ros\n\
    \                      or abs(now.wall-prior.wall-now.steady+prior.steady) > 20\
    \ * MS):\n            self.stop(\"clock_discontinuity\")\n        if self.session\
    \ is not None and (now.steady >= self.deadline\n                             \
    \            or now.wall >= self.expires_wall):\n            self.stop(\"lease_expired\"\
    )\n        return self.velocity if self.session is not None else ZERO\n\n    def\
    \ receive(self, packet, now):\n        self.tick(now)\n        if packet is None:\n\
    \            self.stop(\"supervisor_revoked\")\n            return False\n   \
    \     if self.session is None:\n            return False\n        if (packet.session\
    \ != self.session or not integer(packet.sequence)\n                or packet.sequence\
    \ <= self.sequence or not velocity_ok(packet.velocity)\n                or not\
    \ all(integer(v) for v in (packet.issued_wall, packet.expires_wall))\n       \
    \         or not 0 < packet.expires_wall-packet.issued_wall <= LEASE_NS\n    \
    \            or packet.issued_wall > now.wall + UNCERTAINTY_NS\n             \
    \   or packet.expires_wall <= now.wall + UNCERTAINTY_NS):\n            self.stop(\"\
    packet_invalid\")\n            return False\n        self.sequence = packet.sequence\n\
    \        self.expires_wall = packet.expires_wall - UNCERTAINTY_NS\n        self.deadline\
    \ = now.steady + self.expires_wall - now.wall\n        self.velocity = tuple(packet.velocity)\n\
    \        self.reason = \"armed\"\n        return True\n"
  test_safety_core.py: "import dataclasses\nimport unittest\n\nfrom safety_core import\
    \ (COMMAND_NS, LEASE_NS, MS, TICK_NS, ZERO, Command,\n                       \
    \  Evidence, FinalReceiver, Now, SafetyGate)\n\n\ndef instant(ms=0, *, ros_ms=None,\
    \ wall_ms=None):\n    return Now(10_000 * MS + round(ms * MS),\n             \
    \  100_000 * MS + round((ms if wall_ms is None else wall_ms) * MS),\n        \
    \       20_000 * MS + round((ms if ros_ms is None else ros_ms) * MS))\n\n\ndef\
    \ refresh(gate, ms, *, exclude=(), epoch=\"stream-1\"):\n    now = instant(ms)\n\
    \    for key in gate.required:\n        if key not in exclude:\n            gate.observe(key,\
    \ Evidence(epoch, int(ms) + 1, now.wall, now.ros), now)\n\n\ndef armed(semantics=True):\n\
    \    gate = SafetyGate(require_semantics=semantics)\n    refresh(gate, 0)\n  \
    \  session = gate.arm(instant(), stationary=True, tasks_idle=True, neutral_command=True)\n\
    \    assert session\n    return gate, session\n\n\ndef command(gate, session,\
    \ ms, velocity=(0.1, 0.0, 0.0)):\n    return gate.command(session, int(ms), instant(ms).wall,\
    \ velocity, instant(ms))\n\n\nclass SafetyGateTests(unittest.TestCase):\n    def\
    \ test_startup_never_moves(self):\n        gate = SafetyGate()\n        self.assertEqual(gate.tick(instant()),\
    \ ZERO)\n        self.assertIsNone(gate.packet(instant()))\n        self.assertFalse(command(gate,\
    \ \"unarmed\", 0))\n\n    def test_arm_requires_all_inputs_and_idle_stationary_neutral(self):\n\
    \        gate = SafetyGate()\n        conditions = dict(stationary=True, tasks_idle=True,\
    \ neutral_command=True)\n        self.assertIsNone(gate.arm(instant(), **conditions))\n\
    \        refresh(gate, 0)\n        for key in conditions:\n            self.assertIsNone(gate.arm(instant(),\
    \ **{**conditions, key: False}))\n        self.assertTrue(gate.arm(instant(),\
    \ **conditions))\n        self.assertIsNone(gate.arm(instant(), **conditions))\n\
    \n    def test_normal_motion_and_bounds(self):\n        gate, session = armed()\n\
    \        self.assertTrue(command(gate, session, 1, (0.15, 0.0, 0.5)))\n      \
    \  self.assertEqual(gate.tick(instant(10)), (0.15, 0.0, 0.5))\n        self.assertTrue(command(gate,\
    \ session, 50, (-0.1, 0.0, -0.5)))\n\n    def test_invalid_velocity_latches(self):\n\
    \        for velocity in ((float(\"nan\"), 0, 0), (float(\"inf\"), 0, 0),\n  \
    \                       (0.151, 0, 0), (-0.101, 0, 0), (0, .001, 0), (0, 0, .501),\n\
    \                         (True, 0, 0), (0, 0)):\n            with self.subTest(velocity=velocity):\n\
    \                gate, session = armed()\n                self.assertFalse(command(gate,\
    \ session, 1, velocity))\n                self.assertEqual(gate.reason, \"command_invalid\"\
    )\n                self.assertEqual(gate.tick(instant(2)), ZERO)\n\n    def test_command_expiry_and_late_command_cannot_resume(self):\n\
    \        gate, session = armed()\n        command(gate, session, 1)\n        self.assertEqual(gate.tick(instant(99)),\
    \ ZERO)  # 2 ms uncertainty\n        self.assertEqual(gate.reason, \"command_expired\"\
    )\n        self.assertFalse(command(gate, session, 100))\n\n    def test_delayed_callback_cannot_conceal_command_expiry(self):\n\
    \        gate, session = armed()\n        command(gate, session, 1)\n        self.assertFalse(command(gate,\
    \ session, 101))\n        self.assertEqual(gate.trigger_steady, instant(99).steady)\n\
    \n    def test_each_missing_input_stops_by_deadline(self):\n        for missing\
    \ in SafetyGate().required:\n            with self.subTest(missing=missing):\n\
    \                gate, session = armed()\n                for ms in range(1, 498,\
    \ 20):\n                    refresh(gate, ms, exclude=(missing,))\n          \
    \          self.assertTrue(command(gate, session, ms))\n                self.assertEqual(gate.tick(instant(498)),\
    \ ZERO)\n                self.assertEqual(gate.reason, missing + \"_stale\")\n\
    \n    def test_repeated_capture_does_not_refresh_lease(self):\n        gate, session\
    \ = armed()\n        old = Evidence(\"stream-1\", 1, instant().wall, instant().ros)\n\
    \        for ms in range(1, 498, 20):\n            refresh(gate, ms, exclude=(\"\
    semantic\",))\n            command(gate, session, ms)\n            self.assertFalse(gate.observe(\"\
    semantic\", old, instant(ms)))\n        self.assertEqual(gate.tick(instant(498)),\
    \ ZERO)\n        self.assertEqual(gate.reason, \"semantic_stale\")\n\n    def\
    \ test_late_success_cannot_hide_input_deadline(self):\n        gate, session =\
    \ armed()\n        for ms in range(1, 498, 20):\n            refresh(gate, ms,\
    \ exclude=(\"semantic\",))\n            command(gate, session, ms)\n        refresh(gate,\
    \ 499)  # callbacks, without an intervening timer\n        self.assertFalse(gate.armed)\n\
    \        self.assertEqual(gate.reason, \"semantic_stale\")\n\n    def test_capture_age_not_arrival_age(self):\n\
    \        gate = SafetyGate()\n        now = instant(450)\n        gate.observe(\"\
    semantic\", Evidence(\"e\", 1, instant().wall, instant().ros), now)\n        self.assertEqual(gate.leases[\"\
    semantic\"].deadline, instant(498).steady)\n\n    def test_future_expired_and_malformed_inputs(self):\n\
    \        for ev in (Evidence(\"e\", 1, instant(3).wall, instant().ros),\n    \
    \               Evidence(\"e\", 1, instant(-500).wall, instant().ros),\n     \
    \              Evidence(\"e\", 1, instant().wall, instant(1).ros),\n         \
    \          Evidence(\"\", 1, instant().wall, instant().ros),\n               \
    \    Evidence(\"e\", True, instant().wall, instant().ros)):\n            gate,\
    \ _ = armed()\n            self.assertFalse(gate.observe(\"semantic\", ev, instant()))\n\
    \            self.assertFalse(gate.armed)\n\n    def test_paused_simulation_still_expires(self):\n\
    \        gate, session = armed()\n        command(gate, session, 1)\n        self.assertEqual(gate.tick(instant(501,\
    \ ros_ms=1)), ZERO)\n        self.assertFalse(gate.armed)\n\n    def test_clock_rollback_latches_and_clears(self):\n\
    \        gate, session = armed()\n        command(gate, session, 10)\n       \
    \ self.assertEqual(gate.tick(instant(11, ros_ms=0)), ZERO)\n        self.assertEqual(gate.reason,\
    \ \"clock_rollback\")\n        self.assertFalse(gate.leases)\n\n    def test_wall_jump_latches(self):\n\
    \        for wall_ms in (-100, 100):\n            gate, session = armed()\n  \
    \          command(gate, session, 1)\n            self.assertEqual(gate.tick(instant(2,\
    \ wall_ms=wall_ms)), ZERO)\n            self.assertEqual(gate.reason, \"wall_clock_discontinuity\"\
    )\n\n    def test_epoch_change_latches(self):\n        gate, _ = armed()\n   \
