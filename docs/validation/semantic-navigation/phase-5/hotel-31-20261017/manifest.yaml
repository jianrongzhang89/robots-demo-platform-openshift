  hotel_task_registry.py: "\"\"\"Lifecycle fence for a closed, freshly launched private\
    \ hotel fixture.\n\nNOT caller authentication: ROS status UUIDs contain no parent\
    \ lineage. The\nadapter must audit/freeze the client graph, prohibit external\
    \ dispatch, and\ncomplete an initial cancel-all sweep on every freshly launched\
    \ server. Only\nthe pinned baseline tree's planner/follower children are permitted.\
    \ Status is\nevent-driven, not a heartbeat. Unresolved cancellations never establish\
    \ idle.\n\"\"\"\nimport uuid\n\n\nclass HotelTaskRegistry:\n    PARENT = \"/robot_1/navigate_to_pose\"\
    \n    CHILDREN = {\"/robot_1/compute_path_to_pose\", \"/robot_1/follow_path\"\
    }\n\n    def __init__(self, endpoints):\n        self.endpoints = set(endpoints)\n\
    \        if not {self.PARENT, *self.CHILDREN} <= self.endpoints:\n           \
    \ raise ValueError(\"missing baseline actions\")\n        self.goals = {name:{}\
    \ for name in endpoints}\n        self.primed = False\n        self.graph_ok =\
    \ False\n        self.fault = None\n        self.events = []\n\n    def observe(self,\
    \ endpoint, rows):\n        if endpoint not in self.endpoints:\n            self.fault\
    \ = \"unexpected_action_endpoint\"; return\n        # Keep prior active entries\
    \ until an explicit terminal status arrives;\n        # an empty/missing status\
    \ array is not terminal evidence.\n        for token, status in rows:\n      \
    \      if status not in (1,2,3,4,5,6):\n                self.fault = \"invalid_action_status\"\
    ; return\n            old = self.goals[endpoint].get(token)\n            if old\
    \ in (4,5,6) and status in (1,2,3):\n                self.fault = \"terminal_action_reactivated\"\
    ; return\n            self.goals[endpoint][token] = status\n\n    def active(self):\n\
    \        return {name:{token for token,status in rows.items() if status in (1,2,3)}\n\
    \                for name,rows in self.goals.items()}\n\n    def idle(self):\n\
    \        return self.primed and self.graph_ok and not self.fault and not any(self.active().values())\n\
    \n    def owned(self, token):\n        if not self.primed or not self.graph_ok\
    \ or self.fault or not token: return False\n        active = self.active()\n \
    \       # Parent/children legitimately have DIFFERENT UUIDs. This is a closed\n\
    \        # graph lifecycle constraint, not inferred cryptographic ownership.\n\
    \        if active[self.PARENT] - {token}: return False\n        return all((len(ids)<=1\
    \ if name in self.CHILDREN else not ids)\n                   for name,ids in active.items()\
    \ if name != self.PARENT)\n\n    @staticmethod\n    def uuid(raw):\n        return\
    \ str(uuid.UUID(bytes=bytes(raw)))\n"
