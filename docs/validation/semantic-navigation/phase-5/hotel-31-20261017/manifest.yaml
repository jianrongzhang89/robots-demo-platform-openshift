  run_native_suite.py: "\"\"\"Pod entrypoint, retaining test artifacts until the orchestrator\
    \ retrieves them.\"\"\"\nimport json\nimport os\nfrom pathlib import Path\nimport\
    \ subprocess\nimport sys\nimport time\n\nroot = Path(__file__).resolve().parent\n\
    results = []\nfixture = {\"native\":\"verify_native_watchdog.py\", \"combined\"\
    :\"verify_combined_guard.py\",\n           \"hotel\":\"verify_hotel_stack.py\"\
    , \"hotel-guarded\":\"verify_hotel_stack.py\"}[os.getenv(\"PHASE5_SUITE\", \"\
    native\")]\nfor command in ([sys.executable, \"-m\", \"unittest\", \"discover\"\
    , \"-s\", str(root), \"-p\", \"test_*.py\", \"-v\"],\n                [sys.executable,\
    \ str(root / \"verify_frame_bridge.py\")],\n                [\"/opt/semantic-safety/build/test_native_lease\"\
    ],\n                [sys.executable, str(root / fixture)]):\n    result = subprocess.run(command,\
    \ timeout=280 if fixture==\"verify_hotel_stack.py\" else 100)\n    results.append({\"\
    command\": command, \"returncode\": result.returncode})\n    if result.returncode:\n\
    \        break\nPath(\"/tmp/phase5-suite.json\").write_text(json.dumps(results,\
    \ indent=2))\nprint(json.dumps({\"event\": \"native_suite_finished\", \"results\"\
    : results}), flush=True)\ntime.sleep(200)  # pod stays available for evidence\
    \ retrieval; activeDeadline=300s\n"
  safety_core.py: "\"\"\"Phase 5 candidate: ROS-independent, fail-latched command\
    \ admission.\n\nThis is not a safety-certified controller or an actuator watchdog.\
    \ Adapters must\nvalidate/bind payloads before submitting Evidence, cancel tasks\
    \ on a trip, and\nindependently establish stationary + idle before explicit rearm.\
    \ A final receiver\nmust run next to the actuator; its own death still requires\
    \ an actuator-side\nwatchdog. No functions in this module publish commands or\
    \ automatically rearm.\nAll times are integer nanoseconds; monotonic clocks never\
    \ cross machines.\n\"\"\"\nfrom dataclasses import dataclass\nimport math\nimport\
    \ uuid\n\nMS = 1_000_000\nSTALE_NS = 500 * MS\nCOMMAND_NS = 100 * MS\nLEASE_NS\
    \ = 80 * MS\nUNCERTAINTY_NS = 2 * MS\nTICK_NS = 20 * MS\nZERO = (0.0, 0.0, 0.0)\
    \  # x, y, yaw; diff-drive only\n\n\n@dataclass(frozen=True)\nclass Now:\n   \
    \ steady: int\n    wall: int\n    ros: int\n\n\n@dataclass(frozen=True)\nclass\
    \ Evidence:\n    epoch: str\n    sequence: int\n    wall: int\n    ros: int\n\n\
    \n@dataclass(frozen=True)\nclass Lease:\n    evidence: Evidence\n    deadline:\
    \ int\n\n\n@dataclass(frozen=True)\nclass Command:\n    session: str\n    sequence:\
    \ int\n    issued_wall: int\n    expires_wall: int\n    velocity: tuple[float,\
    \ float, float]\n\n\ndef integer(value):\n    return type(value) is int and value\
    \ >= 0\n\n\ndef velocity_ok(value):\n    return (isinstance(value, (tuple, list))\
    \ and len(value) == 3\n            and all(type(v) in (int, float) and math.isfinite(v)\
    \ for v in value)\n            and -0.10 <= value[0] <= 0.15 and value[1] == 0.0\n\
    \            and abs(value[2]) <= 0.5)\n\n\nclass SafetyGate:\n    \"\"\"Pure\
    \ state machine. Call tick on a wall/steady timer, never a ROS timer.\"\"\"\n\n\
    \    def __init__(self, *, require_semantics=True):\n        self.required = (\"\
    clock\", \"scan\", \"odom\", \"tf\") + (\n            (\"camera\", \"semantic\"\
    , \"inference_heartbeat\") if require_semantics else ())\n        self.leases\
    \ = {}\n        self.last_time = None\n        self.barrier_wall = -1\n      \
    \  self.armed = False\n        self.reason = \"startup_disarmed\"\n        self.trigger_steady\
    \ = None\n        self.session = None\n        self.sequence = -1\n        self.command_sequence\
    \ = -1\n        self.command_deadline = None\n        self.command_wall = -1\n\
    \        self.velocity = ZERO\n\n    def trip(self, reason, now):\n        # Retain\
