---
apiVersion: v1
kind: Pod
metadata:
  name: semantic-phase5-native
  namespace: semantic-navigation
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 420
  automountServiceAccountToken: false
  containers:
  - name: fixture
    image: image-registry.openshift-image-registry.svc:5000/semantic-navigation/semantic-safety@sha256:e697c4558af2415d4d59cbdf14d985683351668a8839e0ec399b918cfc3054cd
    command:
    - /bin/bash
    - -ec
    args:
    - source /opt/ros/jazzy/setup.bash; source /opt/nav2-smoother-overlay/setup.bash;
      exec python3 /phase5-native/run_native_suite.py
    env:
    - name: PHASE5_SUITE
      value: hotel-guarded
    - name: ROS_DOMAIN_ID
      value: '85'
    - name: RMW_IMPLEMENTATION
      value: rmw_cyclonedds_cpp
    - name: CYCLONEDDS_URI
      value: file:///phase5-native/cyclonedds-phase5.xml
    - name: ROS_LOG_DIR
      value: /tmp/phase5-ros-logs
    - name: PYTHONDONTWRITEBYTECODE
      value: '1'
    - name: GZ_IP
      value: 127.0.0.1
    - name: GZ_PARTITION
      value: phase5-watchdog-native-qualification
    - name: GZ_SIM_SYSTEM_PLUGIN_PATH
      value: /opt/semantic-safety/lib:/usr/lib/x86_64-linux-gnu/gz-sim-8/plugins:/opt/ros/jazzy/opt/gz_sim_vendor/lib/gz-sim-8/plugins
    - name: PHASE5_TEST_CONTROLLER_FREQUENCY
      value: '40.0'
    - name: PHASE5_TEST_NAV_SECONDS
      value: '20.0'
    - name: PHASE5_TEST_SCAN_UPDATE_RATE
      value: '10.0'
    - name: PHASE5_TEST_SMOOTHER_FREQUENCY
      value: '100.0'
    - name: DISPLAY
      value: :97
    - name: LIBGL_ALWAYS_SOFTWARE
      value: '1'
    - name: LP_NUM_THREADS
      value: '4'
    - name: GZ_SIM_RESOURCE_PATH
      value: /opt/ros2-demo/hotel-assets/models:/opt/ros2-demo/hotel-assets:/opt/rmf_demos_ws/install/share/rmf_demos_assets/models
    volumeMounts:
    - name: source
      mountPath: /phase5-native
      readOnly: true
    resources:
      requests:
        cpu: '2'
        memory: 1Gi
      limits:
        cpu: '8'
        memory: 5Gi
    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      seccompProfile:
        type: RuntimeDefault
  volumes:
  - name: source
    configMap:
      name: semantic-phase5-native
