  native_link.py: "\"\"\"Bounded private Gazebo transport worker: never renew or cache\
    \ a command.\n\nBlocking service calls and publisher discovery never run on the\
    \ ROS safety\nexecutor. If this worker stalls/dies, the independent native lease\
    \ expires.\n\"\"\"\nimport multiprocessing\nimport os\nimport queue\nimport time\n\
    \n\ndef worker(commands, results):\n    from gz.transport13 import Node\n    from\
    \ gz.msgs10.stringmsg_pb2 import StringMsg\n    from gz.msgs10.boolean_pb2 import\
    \ Boolean\n    import json\n    node = Node()\n    publisher = node.advertise(\"\
    /phase5/drive/lease\", StringMsg)\n    # Service discovery in gz-transport can\
    \ block its internal shared mutex.\n    # Warm up while no session has been armed,\
    \ never relax moving leases.\n    deadline = time.monotonic()+20\n    while not\
    \ publisher.has_connections() and time.monotonic()<deadline:\n        time.sleep(.02)\n\
    \    ok, response = node.request(\"/phase5/drive/stop\",StringMsg(data=\"link_setup\"\
    ),StringMsg,Boolean,2000)\n    time.sleep(3)\n    results.put({\"kind\": \"ready\"\
    , \"connected\": publisher.has_connections() and ok and response.data})\n    while\
    \ True:\n        command = commands.get()\n        if command is None: return\n\
    \        kind, token, value = command\n        if kind == \"lease\":\n       \
    \     publisher.publish(StringMsg(data=json.dumps(value)))\n        else:\n  \
    \          ok, response = node.request(\"/phase5/drive/\"+kind, StringMsg(data=value),\
    \ StringMsg, Boolean, 2000)\n            results.put({\"kind\": kind, \"token\"\
    : token, \"ok\": ok and response.data})\n\n\nclass NativeLink:\n    def __init__(self):\n\
    \        if not os.getenv(\"GZ_PARTITION\", \"\").startswith(\"phase5-watchdog-\"\
    ) or os.getenv(\"GZ_IP\") != \"127.0.0.1\":\n            raise RuntimeError(\"\
    private native partition required\")\n        context = multiprocessing.get_context(\"\
    spawn\")\n        self.commands, self.results = context.Queue(8), context.Queue(16)\n\
    \        self.process = context.Process(target=worker, args=(self.commands,self.results))\n\
    \        self.process.start()\n        self.ready = False\n\n    def send(self,\
    \ kind, token, value):\n        if not self.process.is_alive(): return False\n\
    \        try:\n            self.commands.put_nowait((kind,token,value))\n    \
    \        return True\n        except queue.Full:\n            return False  #\
    \ no blocking and no source-deadline extension\n\n    def poll(self):\n      \
    \  replies = []\n        while True:\n            try: reply = self.results.get_nowait()\n\
    \            except queue.Empty: break\n            if reply[\"kind\"] == \"ready\"\
    : self.ready = reply[\"connected\"]\n            replies.append(reply)\n     \
    \   return replies\n\n    def close(self):\n        try: self.commands.put_nowait(None)\n\
    \        except queue.Full: pass\n        self.process.join(timeout=3)\n     \
    \   if self.process.is_alive(): self.process.terminate(); self.process.join(timeout=3)\n\
    \        for channel in (self.commands,self.results):\n            channel.cancel_join_thread();\
    \ channel.close()\n\n"
  nav_task_client.py: "\"\"\"Non-actuating ROS NavigateToPose ownership/cancel adapter.\n\
    \nCall only on the node's single-threaded executor. start() is an explicit task\n\
    request, not an arm API. A future integrating coordinator must also satisfy\n\
    SafetyGate, global action-idle and native actuator prerequisites. The revoke\n\
    hook must withdraw command permission synchronously; cancellation is async.\n\"\
    \"\"\nimport json\nimport time\nimport uuid\n\nfrom nav2_msgs.action import NavigateToPose\n\
    from rclpy.action import ActionClient\nfrom rclpy.clock import Clock, ClockType\n\
    from rclpy.node import Node\nfrom std_msgs.msg import String\nfrom unique_identifier_msgs.msg\
    \ import UUID\n\nfrom task_session import TaskSession\n\n\nclass NavTaskClient(Node):\n\
    \    def __init__(self, backend, on_revoke):\n        if not callable(on_revoke):\n\
    \            raise ValueError(\"a synchronous command-permission revoke hook is\
    \ required\")\n        super().__init__(\"phase5_task_client\")\n        self.session\
    \ = TaskSession()\n        self.client = ActionClient(self, NavigateToPose, backend)\n\
    \        self.on_revoke = on_revoke\n        self.handles, self.cancel_sent, self.notified\
    \ = {}, set(), set()\n        self.events = []\n        self.status = self.create_publisher(String,\
    \ \"/phase5/task_status\", 10)\n        self.create_timer(.02, self.tick, clock=Clock(clock_type=ClockType.STEADY_TIME))\n\
    \n    def event(self, kind, **data):\n        self.events.append({\"event\": kind,\
    \ \"steady_ns\": time.monotonic_ns(), **data})\n        self.events = self.events[-1000:]\n\
    \n    def notify_revoke(self):\n        token = self.session.token\n        if\
    \ token and self.session.revoked and token not in self.notified:\n           \
    \ self.notified.add(token)\n            self.on_revoke(token, self.session.reason)\n\
    \            self.event(\"permission_revoked\", token=token, reason=self.session.reason)\n\
    \n    def start(self, goal):\n        if not self.client.server_is_ready():\n\
    \            raise RuntimeError(\"navigation backend unavailable\")\n        token\
    \ = self.session.begin(time.monotonic())\n        self.event(\"goal_requested\"\
    , token=token)\n        try:\n            future = self.client.send_goal_async(goal,\
    \ goal_uuid=UUID(uuid=list(uuid.UUID(token).bytes)))\n            future.add_done_callback(lambda\
    \ response: self.accepted(token, response))\n        except Exception:\n     \
    \       # Unknown delivery: do not claim that no backend task exists.\n      \
    \      self.stop(\"goal_request_error\")\n            raise\n        return token\n\
    \n    def stop(self, reason):\n        self.session.revoke(reason, time.monotonic())\n\
    \        self.notify_revoke()  # withdraw authority BEFORE any ROS cancel request\n\
    \        self.cancel_if_needed()\n\n    def accepted(self, token, future):\n \
    \       if token != self.session.token or self.session.state == \"idle\":\n  \
    \          return\n        try:\n            handle = future.result()\n      \
    \      disposition = self.session.accepted(token, handle.accepted, time.monotonic())\n\
    \            self.event(\"goal_response\", token=token, disposition=disposition)\n\
    \            self.notify_revoke()\n            if disposition in (\"run\", \"\
    cancel\"):\n                self.handles[token] = handle\n                handle.get_result_async().add_done_callback(lambda\
    \ result: self.finished(token, result))\n                self.cancel_if_needed()\n\
    \        except Exception as error:\n            self.event(\"goal_response_error\"\
    , detail=str(error))\n            self.stop(\"goal_response_error\")\n\n    def\
    \ cancel_if_needed(self):\n        token = self.session.token\n        if self.session.state\
    \ != \"stopping\" or token not in self.handles or token in self.cancel_sent:\n\
    \            return\n        self.cancel_sent.add(token)\n        self.event(\"\
    cancel_requested\", token=token)\n        try:\n            self.handles[token].cancel_goal_async().add_done_callback(lambda\
    \ result: self.canceled(token, result))\n        except Exception as error:\n\
    \            self.event(\"cancel_error\", token=token, detail=str(error))\n\n\
    \    def canceled(self, token, future):\n        try:\n            reply = future.result()\n\
    \            ids = [str(uuid.UUID(bytes=bytes(g.goal_id.uuid))) for g in reply.goals_canceling]\n\
    \            accepted = reply.return_code == 0 and token in ids\n            self.session.acknowledge_cancel(token,\
    \ accepted)\n            self.event(\"cancel_response\", token=token, accepted=accepted)\n\
    \        except Exception as error:\n            self.event(\"cancel_error\",\
    \ token=token, detail=str(error))\n\n    def finished(self, token, future):\n\
    \        if token != self.session.token or self.session.state == \"idle\":\n \
    \           return\n        try:\n            response = future.result()\n   \
    \         terminal = self.session.finish(token, response.status, time.monotonic())\n\
    \            self.notify_revoke()\n            if terminal:\n                self.handles.pop(token,\
    \ None)\n                self.event(\"terminal_result\", token=token, status=response.status,\
    \ outcome=self.session.outcome)\n        except Exception as error:\n        \
    \    self.event(\"result_error\", token=token, detail=str(error))\n          \
    \  self.stop(\"result_error\")\n\n    def tick(self):\n        self.session.tick(time.monotonic())\n\
    \        if self.session.state == \"running\" and not self.client.server_is_ready():\n\
    \            self.session.revoke(\"backend_disappeared\", time.monotonic())\n\
    \        self.notify_revoke()\n        self.cancel_if_needed()\n        self.status.publish(String(data=json.dumps({\"\
    schema\": \"phase5-owned-task/v1\",\n            \"state\": self.session.state,\
    \ \"token\": self.session.token, \"reason\": self.session.reason,\n          \
    \  \"revoked\": self.session.revoked, \"cancel_ack\": self.session.cancel_ack,\n\
    \            \"outcome\": self.session.outcome,\n            \"timeout\": self.session.timeout,\
    \ \"wall_ns\": time.time_ns(),\n            \"scope\": \"owned_action_only_not_global_idle_or_arm_permission\"\
    })))\n\n"
  prepare_assets.py: "\"\"\"Prepare private Phase 5 assets; never edit canonical source\
